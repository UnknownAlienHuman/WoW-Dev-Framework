[package]
name = "wow-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "wow"
path = "src/main.rs"

[dependencies]
wow-service = { path = "../../crates/wow-service" }
serde = "1.0"
serde_json = "1.0"
ctrlc = "3.5"
cap-std = "4.0"
cap-fs-ext = "4.0"

[target.'cfg(windows)'.dependencies]
winx = "0.36"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

# App-owned stdio metadata FFI has one private exception; see LSP_IO_SAFETY.md.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
