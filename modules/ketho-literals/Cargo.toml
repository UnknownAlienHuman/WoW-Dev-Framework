[package]
name = "wow-ketho-literals-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
wow-render-contract = { path = "../../crates/wow-render-contract" }
wow-ketho-literals = { path = "../../crates/wow-ketho-literals" }
