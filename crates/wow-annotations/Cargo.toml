[package]
name = "wow-annotations"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust annotation rendering port of Ketho's WoW API generator"

[dependencies]
wow-render-contract = { path = "../wow-render-contract" }
wow-ketho-literals = { path = "../wow-ketho-literals" }
wow-reference = { path = "../wow-reference" }
wow-core = { path = "../wow-core" }
wow-store = { path = "../wow-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[lints]
workspace = true

[dev-dependencies]
emmylua_parser = { git = "https://github.com/EmmyLuaLs/emmylua-analyzer-rust", branch = "main" }
