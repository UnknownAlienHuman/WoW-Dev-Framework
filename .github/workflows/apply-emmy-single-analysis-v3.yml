name: Apply single Emmy analysis refactor v3

on:
  push:
    branches:
      - fix/emmy-main-library-analysis-2026-10-19

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed refactor and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-emmy-single-analysis-v2.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "          PY\n\n          cargo +stable fmt --all"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('unable to recover reviewed refactor script')
          script = dedent(workflow.split(start, 1)[1].split(end, 1)[0])
          exec(compile(script, 'single-emmy-refactor.py', 'exec'), {})
          PY

          git rm .github/workflows/apply-emmy-single-analysis.yml
          git rm .github/workflows/apply-emmy-single-analysis-v2.yml
          git rm .github/workflows/apply-emmy-single-analysis-v3.yml
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked -p wow-emmy -p wow-project --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-emmy crates/wow-project
          git commit -m "fix: analyze Main and Library in one Emmy session"
          git push origin "HEAD:${GITHUB_REF_NAME}"
