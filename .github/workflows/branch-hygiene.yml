name: Branch hygiene

on:
  workflow_dispatch:
    inputs:
      expected_main:
        description: Exact main SHA observed before running
        required: true
        type: string
      dry_run:
        description: Report eligible branches without deleting refs
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: ${{ inputs.expected_main }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out the trusted main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Snapshot refs and require the quick gate for this exact main
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'expected_main must be a full commit SHA' >&2
            exit 1
          }
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$main_sha" == "$EXPECTED_MAIN" ]] || {
            echo "main mismatch: expected $EXPECTED_MAIN, observed $main_sha" >&2
            exit 1
          }
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quick-check.yml/runs?branch=main&event=push&head_sha=$main_sha&per_page=1" --jq '.workflow_runs[0].conclusion // "missing"')"
          [[ "$conclusion" == success ]] || {
            echo "Exact main has no successful Quick exact-head gate: $conclusion" >&2
            exit 1
          }
          printf '%s\n' "$main_sha" > "$RUNNER_TEMP/prune-main"
          git for-each-ref --format='%(objectname) %(refname:strip=3)' refs/remotes/origin > "$RUNNER_TEMP/prune-refs"
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[] | select(.protected) | .name' > "$RUNNER_TEMP/protected-branches"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | .head.ref' > "$RUNNER_TEMP/open-pr-branches"
          git bundle create "$RUNNER_TEMP/branch-history.bundle" --all
          git bundle verify "$RUNNER_TEMP/branch-history.bundle"
          sha256sum "$RUNNER_TEMP/branch-history.bundle" > "$RUNNER_TEMP/branch-history.sha256"

      - name: Preserve history before classifying or removing refs
        uses: actions/upload-artifact@v7
        with:
          name: branch-history-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/branch-history.bundle
            ${{ runner.temp }}/branch-history.sha256
            ${{ runner.temp }}/prune-main
            ${{ runner.temp }}/prune-refs
            ${{ runner.temp }}/protected-branches
            ${{ runner.temp }}/open-pr-branches
          retention-days: 7
          if-no-files-found: error

      - name: Classify branches and delete only unchanged ancestors when authorized
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(cat "$RUNNER_TEMP/prune-main")"
          deleted=0
          eligible=0
          retained=0
          while read -r tip branch; do
            case "$branch" in main|HEAD) continue ;; esac
            if grep -Fxq -- "$branch" "$RUNNER_TEMP/protected-branches" ||
               grep -Fxq -- "$branch" "$RUNNER_TEMP/open-pr-branches"; then
              printf 'retained (protected or open PR): %s\n' "$branch" >> "$GITHUB_STEP_SUMMARY"
              retained=$((retained + 1))
              continue
            fi
            if ! git merge-base --is-ancestor "$tip" "$main_sha"; then
              printf 'retained (unreconciled history): %s %s\n' "$branch" "$tip" >> "$GITHUB_STEP_SUMMARY"
              retained=$((retained + 1))
              continue
            fi
            eligible=$((eligible + 1))
            if [[ "$DRY_RUN" == true ]]; then
              printf 'eligible, dry-run retained: %s %s\n' "$branch" "$tip" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            live_main="$(git ls-remote --exit-code --refs origin refs/heads/main)"
            [[ "$live_main" == "$main_sha"$'\t'refs/heads/main ]] || {
              echo 'main changed; stopping without deleting further refs' >&2
              exit 1
            }
            git push "--force-with-lease=refs/heads/$branch:$tip" origin ":refs/heads/$branch"
            status=0
            git ls-remote --exit-code --refs origin "refs/heads/$branch" > /dev/null || status=$?
            [[ "$status" == 2 ]] || {
              echo 'Deletion read-back failed or the branch was recreated' >&2
              exit 1
            }
            printf 'deleted (bundle retained): %s %s\n' "$branch" "$tip" >> "$GITHUB_STEP_SUMMARY"
            deleted=$((deleted + 1))
          done < "$RUNNER_TEMP/prune-refs"
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          git ls-remote --heads origin > "$RUNNER_TEMP/branches-after"
          {
            printf '\nDry run: %s\nEligible ancestors: %d\nDeleted: %d\nRetained: %d\n' "$DRY_RUN" "$eligible" "$deleted" "$retained"
            printf '\nVerified remaining remote refs:\n'
            cat "$RUNNER_TEMP/branches-after"
          } >> "$GITHUB_STEP_SUMMARY"
