name: Apply Emmy documentation update

on:
  push:
    branches:
      - fix/emmy-main-library-analysis-2026-10-19

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply and validate documentation
        shell: bash
        run: |
          set -euo pipefail
          python .github/update-emmy-analysis-docs.py
          git rm .github/update-emmy-analysis-docs.py
          git rm .github/workflows/update-emmy-analysis-docs.yml
          git rm .github/workflows/update-emmy-analysis-docs-v2.yml
          cargo +stable xtask check
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add docs/IMPLEMENTATION.md docs/REFACTOR_QUEUE.md
          git commit -m "docs: record single Emmy analysis implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
