name: Apply one-shot Search registry refactor

on:
  push:
    branches:
      - refactor/remove-one-shot-search-registry-2026-10-18

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/remove-one-shot-search-registry.patch
          git apply --index .github/remove-one-shot-search-registry.patch
          git rm .github/remove-one-shot-search-registry.patch
          git rm .github/workflows/apply-one-shot-search-registry-refactor.yml
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "refactor: remove one-shot Search replay registry"
          git push origin "HEAD:${GITHUB_REF_NAME}"
