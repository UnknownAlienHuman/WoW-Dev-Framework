name: Apply native literal simplification

on:
  push:
    branches:
      - refactor/remove-wasm-literal-plugin-2026-10-18

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install current stable Rust
        if: hashFiles('.github/scripts/remove_wasm_literal_plugin.py') != ''
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply code and documentation changes
        if: hashFiles('.github/scripts/remove_wasm_literal_plugin.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/remove_wasm_literal_plugin.py
          git checkout -- .github/workflows/ci.yml .github/workflows/current-source-bundle.yml
          git rm -r \
            modules/ketho-literals \
            bridges/literal-host \
            crates/wow-render-contract \
            crates/wow-annotations/src/selected_literals.rs \
            crates/wow-annotations/tests/selected_literals.rs \
            tools/xtask/src/literal_execution.rs \
            tools/xtask/src/literal_execution \
            docs/WASM_BRIDGES.md
          cargo +stable metadata --format-version 1 >/dev/null
          cargo +stable fmt --all
          git rm .github/scripts/remove_wasm_literal_plugin.py
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: keep Ketho literals native only"
          git push origin "HEAD:${GITHUB_REF_NAME}"
