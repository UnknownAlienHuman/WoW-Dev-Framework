name: Apply native literal simplification

on:
  push:
    branches:
      - refactor/remove-wasm-literal-plugin-2026-10-18

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply native-only literal refactor
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/remove_wasm_literal_plugin.py
          git rm -r \
            modules/ketho-literals \
            bridges/literal-host \
            crates/wow-render-contract \
            crates/wow-annotations/src/selected_literals.rs \
            crates/wow-annotations/tests/selected_literals.rs \
            tools/xtask/src/literal_execution.rs \
            tools/xtask/src/literal_execution \
            docs/WASM_BRIDGES.md
          cargo +stable metadata --format-version 1 >/dev/null
          cargo +stable fmt --all
          if rg -n \
            'modules/ketho-literals|bridges/literal-host|wow-ketho-literals-wasm|wow-render-contract|wow_render_contract|LiteralBridge|SelectedModule|literal_execution|--literal-module|wasm-compact|wasm-speed|WDF_WASM_|source-wasm|wow-native-annotation-library/6|wasmi' \
            --glob '!docs/ARCHITECTURE.md' \
            --glob '!README.md'; then
            echo 'obsolete literal bridge references remain' >&2
            exit 1
          fi
          git rm \
            .github/scripts/remove_wasm_literal_plugin.py \
            .github/workflows/apply-remove-wasm-literal-plugin.yml
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: keep Ketho literals native only"
          git push origin "HEAD:${GITHUB_REF_NAME}"
