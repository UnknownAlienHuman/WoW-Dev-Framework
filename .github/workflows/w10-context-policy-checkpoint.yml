name: W10 XML context policy checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w10-context-policy-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: w10-context-policy-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_COMMIT: f1fb0788f8a4bb3a3ee88e50b58298ed8dd52c1a
      BASE_TREE: bc265d85ce3c57227ce3c5404beafb21d28294e3
      TRIGGER_PARENT: bbdb1b02c417ec4ed2cfa27d9622c14805ad637b
      PATCH_SHA256: 0219279e2e802288fd34c8b1c938bdda0323abef49b64515ae44cea9427674c7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Admit context policy patch and remove failed transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$TRIGGER_PARENT"
          cp .ci/w10-context-policy.patch "$RUNNER_TEMP/w10-context-policy.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w10-context-policy.patch" | sha256sum -c -
          git rm -- \
            .ci/w10-bindings-graph.patch.xz.b64.00 \
            .ci/w10-context-policy.patch \
            .github/workflows/w10-bindings-graph-checkpoint.yml \
            .github/workflows/w10-carrier-export.yml \
            .github/workflows/w10-context-policy-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w10-context-policy.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Minimal affected-crate Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked \
            -p wow-project \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          git diff --cached --name-only "$BASE_COMMIT" > "$RUNNER_TEMP/changed-files"
          printf '%s\n' crates/wow-project/src/xml_lua.rs > "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log changed-files expected-files; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w10-context-policy-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
      - name: Fast-forward exact checked tree to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git commit -m 'feat(wow-project): bind XML virtual semantic context [skip ci]'
          git push origin HEAD:main
