name: E0 decode guarded acceptance
on:
  push:
    branches: [main]
    paths:
      - .ci/e0-decode/**
      - .github/workflows/e0-decode-gate.yml
permissions:
  contents: read
concurrency:
  group: e0-decode-acceptance
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Admit reviewed patch on the exact base
        run: |
          set -euo pipefail
          cat .ci/e0-decode/{00,01,02,03} > "$RUNNER_TEMP/decode.patch.gz"
          echo "e5cb9aefe4ab9a3b2077788a5c1303838bfa919e5d608be6d4ad670181273db1  $RUNNER_TEMP/decode.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/decode.patch.gz" > "$RUNNER_TEMP/decode.patch"
          echo "f4e26dec247385998a3ed5d4ddecbb181700c9f3372ceb46b17a66a471c3ecd1  $RUNNER_TEMP/decode.patch" | sha256sum -c -
          git rm -r .ci/e0-decode .github/workflows/e0-decode-gate.yml
          test "$(git write-tree)" = a83774ea3710ec1dd616739ac361157d6c0cc97d
          git apply --index --check "$RUNNER_TEMP/decode.patch"
          git apply --index "$RUNNER_TEMP/decode.patch"
          test "$(git write-tree)" = 111fc8b4b003e64ee2495d64cb58103d30a15379
      - name: Install and record stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          mkdir -p "$RUNNER_TEMP/decode-results"
          git rev-parse HEAD > "$RUNNER_TEMP/decode-results/BASE_SHA"
          rustc +stable -Vv > "$RUNNER_TEMP/decode-results/RUST_VERSION"
      - name: Format reviewed Rust and retain the exact tree
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          git diff --exit-code -- . ':(exclude)crates/wow-core/src/envelope_decode.rs' ':(exclude)crates/wow-core/src/lib.rs' ':(exclude)crates/wow-core/src/contract.rs' ':(exclude)crates/wow-core/tests/e0_decode_conformance.rs' ':(exclude)crates/wow-core/tests/e0_examples.rs'
          git add crates/wow-core/src/envelope_decode.rs crates/wow-core/src/lib.rs crates/wow-core/src/contract.rs crates/wow-core/tests/e0_decode_conformance.rs crates/wow-core/tests/e0_examples.rs
          git diff --exit-code
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/decode-results/TREE_SHA"
          cp crates/wow-core/src/envelope_decode.rs crates/wow-core/tests/e0_decode_conformance.rs "$RUNNER_TEMP/decode-results/"
      - name: Build the core implementation and its test targets
        run: cargo +stable check --locked -p wow-core --all-targets
      - name: Verify raw decoding and all five existing golden consumers
        run: |
          set -euo pipefail
          cargo +stable test --locked -p wow-core --test e0_decode_conformance --test e0_examples -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/decode-results/core-tests.txt"
          grep -F '15 passed; 0 failed' "$RUNNER_TEMP/decode-results/core-tests.txt"
          grep -F '5 passed; 0 failed' "$RUNNER_TEMP/decode-results/core-tests.txt"
      - name: Verify feature-independent raw number and duplicate admission
        run: |
          set -euo pipefail
          cargo +stable test --locked -p wow-core --features serde_json/arbitrary_precision --test e0_decode_conformance --test e0_examples -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/decode-results/number-feature-tests.txt"
          grep -F '15 passed; 0 failed' "$RUNNER_TEMP/decode-results/number-feature-tests.txt"
          grep -F '5 passed; 0 failed' "$RUNNER_TEMP/decode-results/number-feature-tests.txt"
      - name: Repository policy and formatting
        run: |
          cargo +stable xtask check
          cargo +stable fmt --all --check
      - name: Locked workspace check
        run: cargo +stable check --locked --workspace --all-targets --all-features
      - name: Strict workspace Clippy
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Locked debug workspace tests
        run: cargo +stable test --locked --workspace --all-targets --all-features
      - name: Locked release workspace tests
        run: cargo +stable test --release --locked --workspace --all-targets --all-features
      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Retain the exact tested patch
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/decode-results/TREE_SHA")"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/decode-results/verified.patch"
          cd "$RUNNER_TEMP/decode-results"
          sha256sum verified.patch > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e0-decode-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/decode-results/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-decode-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/decode-linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-decode-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/decode-windows
      - name: Publish identical tested trees only while main is unchanged
        run: |
          set -euo pipefail
          linux="$RUNNER_TEMP/decode-linux"
          windows="$RUNNER_TEMP/decode-windows"
          (cd "$linux" && sha256sum -c SHA256SUMS)
          (cd "$windows" && sha256sum -c SHA256SUMS)
          cmp "$linux/TREE_SHA" "$windows/TREE_SHA"
          cmp "$linux/BASE_SHA" "$windows/BASE_SHA"
          cmp "$linux/verified.patch" "$windows/verified.patch"
          test "$(cat "$linux/BASE_SHA")" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git apply --index --check "$linux/verified.patch"
          git apply --index "$linux/verified.patch"
          test "$(git write-tree)" = "$(cat "$linux/TREE_SHA")"
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(core): admit bounded raw JSON before validating E0 envelopes' -m "Continue R0-01 with concrete check/error envelope byte entrypoints and caller-owned validated limits. Bound input bytes, container depth, token count and raw string size before typed allocation; reject escaped duplicate keys, null and noncanonical unsigned tokens before normalization. Keep serde_json as syntax/schema authority, retain semantic validation and suppress parser prose. Route the five existing golden consumers through this boundary. Fifteen conformance tests and all five golden consumers passed with core-only and arbitrary_precision profiles on Linux and Windows; full locked workspace check, strict Clippy, debug/release tests, rustdoc, policy and formatting passed on this exact tree in run $GITHUB_RUN_ID. No dependency or golden fixture changed. Temporary inputs are removed. Raw Serde callers, host acquisition limits, full E0-A and the R0 product remain separate."
          git push origin HEAD:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
