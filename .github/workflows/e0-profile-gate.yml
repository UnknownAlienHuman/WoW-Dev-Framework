name: E0 profile guarded acceptance
on:
  push:
    branches: [main]
    paths:
      - .ci/e0-profile.patch.gz
      - .github/workflows/e0-profile-gate.yml
permissions:
  contents: read
concurrency:
  group: e0-profile-acceptance
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Admit exact profile patch on the reviewed base
        run: |
          set -euo pipefail
          echo 'e6020c22b40b08342d1051fea5424f89ddb59a619e26d16edaaac18291ce3577  .ci/e0-profile.patch.gz' | sha256sum -c -
          gzip -dc .ci/e0-profile.patch.gz > "$RUNNER_TEMP/profile.patch"
          echo "2b6a7f1afcbf518543963e6a703db6233263303d89afc762c1cab664fc386a22  $RUNNER_TEMP/profile.patch" | sha256sum -c -
          git rm .ci/e0-profile.patch.gz .github/workflows/e0-profile-gate.yml
          test "$(git write-tree)" = 7910a19fcb6c93460bd12bafd6f7a4b417d7f530
          git apply --index --check "$RUNNER_TEMP/profile.patch"
          git apply --index "$RUNNER_TEMP/profile.patch"
          test "$(git write-tree)" = 19855caefc6b3cd34d81016eb6ba239739796030
      - name: Install stable Rust and record exact inputs
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          mkdir -p "$RUNNER_TEMP/profile-results"
          git rev-parse HEAD > "$RUNNER_TEMP/profile-results/BASE_SHA"
          rustc +stable -Vv > "$RUNNER_TEMP/profile-results/RUST_VERSION"
      - name: Format only reviewed Rust and retain exact tree
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          git diff --exit-code -- . ':(exclude)crates/wow-core/src/profile.rs' ':(exclude)crates/wow-core/tests/e0_profile_conformance.rs'
          git add crates/wow-core/src/profile.rs crates/wow-core/tests/e0_profile_conformance.rs
          git diff --exit-code
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/profile-results/TREE_SHA"
      - name: Build implementation and all core test targets
        run: cargo +stable check --locked -p wow-core --all-targets
      - name: Verify thirteen profile cases and five golden envelopes
        run: |
          set -euo pipefail
          cargo +stable test --locked -p wow-core --test e0_profile_conformance --test e0_examples 2>&1 | tee "$RUNNER_TEMP/profile-results/core-tests.txt"
          grep -F '13 passed; 0 failed' "$RUNNER_TEMP/profile-results/core-tests.txt"
          grep -F '5 passed; 0 failed' "$RUNNER_TEMP/profile-results/core-tests.txt"
          cargo +stable test --locked -p wow-core --features serde_json/arbitrary_precision --test e0_profile_conformance --test e0_examples 2>&1 | tee "$RUNNER_TEMP/profile-results/number-feature-tests.txt"
          grep -F '13 passed; 0 failed' "$RUNNER_TEMP/profile-results/number-feature-tests.txt"
          grep -F '5 passed; 0 failed' "$RUNNER_TEMP/profile-results/number-feature-tests.txt"
      - name: Prove four negative controls on unchanged profile code
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          trap 'git checkout-index -a -f' EXIT
          git show HEAD:crates/wow-core/src/profile.rs > crates/wow-core/src/profile.rs
          cases=(
            profile_007_008_019_021_optional_build_is_positive_when_present
            profile_022_fixture_builder_is_absent_or_an_exact_pair
            profile_023_scope_is_bounded_nonempty_text_without_controls_or_trimming
            profile_024_revision_has_the_same_byte_bound_for_both_kinds
          )
          for index in "${!cases[@]}"; do
            case="${cases[$index]}"
            log="$RUNNER_TEMP/profile-results/baseline-$index.txt"
            set +e
            cargo +stable test --locked -p wow-core --test e0_profile_conformance "$case" -- --exact > "$log" 2>&1
            status=$?
            set -e
            test "$status" -eq 101
            grep -F 'running 1 test' "$log"
            grep -F "test $case ... FAILED" "$log"
            grep -F 'test result: FAILED. 0 passed; 1 failed' "$log"
          done
      - name: Repository policy and formatting
        run: |
          cargo +stable xtask check
          cargo +stable fmt --all --check
      - name: Locked workspace check
        run: cargo +stable check --locked --workspace --all-targets --all-features
      - name: Strict workspace Clippy
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Locked debug workspace tests
        run: cargo +stable test --locked --workspace --all-targets --all-features
      - name: Locked release workspace tests
        run: cargo +stable test --release --locked --workspace --all-targets --all-features
      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Retain exact tested change
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/profile-results/TREE_SHA")"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/profile-results/verified.patch"
          cd "$RUNNER_TEMP/profile-results"
          sha256sum verified.patch > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e0-profile-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/profile-results/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-profile-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/profile-linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-profile-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/profile-windows
      - name: Publish identical tested trees only while main is unchanged
        run: |
          set -euo pipefail
          linux="$RUNNER_TEMP/profile-linux"
          windows="$RUNNER_TEMP/profile-windows"
          (cd "$linux" && sha256sum -c SHA256SUMS)
          (cd "$windows" && sha256sum -c SHA256SUMS)
          cmp "$linux/TREE_SHA" "$windows/TREE_SHA"
          cmp "$linux/BASE_SHA" "$windows/BASE_SHA"
          cmp "$linux/verified.patch" "$windows/verified.patch"
          test "$(cat "$linux/BASE_SHA")" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git apply --index --check "$linux/verified.patch"
          git apply --index "$linux/verified.patch"
          test "$(git write-tree)" = "$(cat "$linux/TREE_SHA")"
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(core): validate optional profile identity fields consistently' -m "Continue R0-01 profile admission. Present fixture builds must be positive; builder ID/version form an optional pair; correction digests require the pair; scope and revision text are bounded without trimming or echoing input. Constructors, decoded validation, checked comparisons and nested context/envelope admission share the checks. Thirteen grouped conformance tests and five unchanged golden consumers passed on both platforms with core-only and arbitrary_precision profiles. Four Linux negative controls reproduced baseline defects. Locked workspace check, strict Clippy, debug/release tests, rustdoc, fmt and policy passed on this exact tree in run $GITHUB_RUN_ID. No dependency or golden fixture changed; temporary gate inputs removed. Full E0-A/R0 and source-owner revision/build attestation remain separate."
          git push origin HEAD:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD HEAD^{tree}
