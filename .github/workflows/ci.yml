name: Production Secret policy checkpoint
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: w04-production-secret-policy-checkpoint
  cancel-in-progress: false
env:
  BASE_COMMIT: 4f59187449804ab75ac9d55b13fb9d502edf4f2b
  BASE_TREE: 07ce941fc3cb7006c6b745293df1b82875e39be1
  PATCH_SHA256: e902c4944f76622baca7f5f01000e4b2ef38aa6704e629eebc89d9c50ec02d17
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact patch and restore manual CI before checking
        id: admit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$BASE_COMMIT"
          xz -dc .ci/w04-secret-policy.patch.xz > "$RUNNER_TEMP/w04-secret-policy.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w04-secret-policy.patch" | sha256sum -c -
          git restore --source="$BASE_COMMIT" --staged --worktree .github/workflows/ci.yml
          git rm -- .ci/w04-secret-policy.patch.xz
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w04-secret-policy.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format changed Rust modules only
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +stable --edition 2024 --config skip_children=true \
            crates/wow-emmy/src/flow.rs \
            crates/wow-reference/src/native_view.rs \
            crates/wow-rules/src/context.rs \
            crates/wow-rules/src/engine.rs \
            crates/wow-rules/src/output.rs \
            crates/wow-service/src/local/mod.rs \
            crates/wow-service/src/local/native_artifact/wire.rs \
            crates/wow-service/src/local/native_input.rs \
            crates/wow-service/src/local/projection.rs
      - name: Minimal selected-package Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked \
            -p wow-emmy -p wow-reference -p wow-rules -p wow-service -p wow-cli \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and whitespace
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git diff --check
          git diff --cached --check
      - name: Retain exact source and check outcomes
        if: always() && steps.admit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always() && steps.admit.outcome == 'success'
        with:
          name: w04-production-secret-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
