name: Publish checked native API authority
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: w04-native-api-authority-publish
  cancel-in-progress: false
env:
  BASE_COMMIT: 4d1d733dd0c24c79753277a82da4e7ff40888212
  BASE_TREE: 83338af024157506de0a077c11dcabbd5ab659e9
  CHECKED_TREE: 07ce941fc3cb7006c6b745293df1b82875e39be1
  PATCH_SHA256: 2b41fa0e097ee9245f488314dca4ad0ada3e5651d5e0214fb65c53170cfa7a15
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct and publish the checked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          xz -dc .ci/w04-api-authority.patch.xz > "$RUNNER_TEMP/w04-api-authority.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w04-api-authority.patch" | sha256sum -c -
          git restore --source="$BASE_COMMIT" --staged --worktree .github/workflows/ci.yml
          git rm -- .ci/w04-api-authority.patch.xz
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w04-api-authority.patch"
          test "$(git write-tree)" = "$CHECKED_TREE"
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "feat(rules): admit complete manifested API absence authority [skip ci]" -m "W04 source-backed authority slice. A generated-API partition becomes Complete only when exact manifest and TOC sets close, every selected document is admitted, and no in-domain projection loss occurs. Explicit inputs and prebuilt artifact v1 remain Partial; production Secret/restriction evaluation remains unavailable. Focused Clippy and repository policy passed on Linux with Rust 1.98.1; no tests executed."
          commit="$(git rev-parse HEAD)"
          git push origin HEAD:main
          test "$(git ls-remote --exit-code --refs origin refs/heads/main)" = "$commit"$'\trefs/heads/main'
