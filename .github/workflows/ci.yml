name: Production rule policy checkpoint
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: w04-production-policy-checkpoint
  cancel-in-progress: false
env:
  BASE_COMMIT: acdefdc6fe2c6b27bae1b2ecd95fb47ff006e6ac
  STAGING_PARENT: 4fbe89ee977eecbadaa9b2815238fbb188ce60d6
  BASE_TREE: cf501e1c74d2e3bde5a797cec9b1dee3444bafe9
  PATCH_SHA256: 57b5de5e361eaaa4736a40544e97c7ffcdc498d7250a29699a33b675faf5b02d
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact patch and restore manual CI before checking
        id: admit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          xz -dc .ci/w04-production.patch.xz > "$RUNNER_TEMP/w04-production.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w04-production.patch" | sha256sum -c -
          git restore --source="$BASE_COMMIT" --staged --worktree .github/workflows/ci.yml
          git rm -- .ci/w04-production.patch.xz
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w04-production.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format changed Rust modules only
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +stable --edition 2024 --config skip_children=true \
            crates/wow-rules/src/context.rs \
            crates/wow-rules/src/descriptor.rs \
            crates/wow-rules/src/engine.rs \
            crates/wow-rules/src/lib.rs \
            crates/wow-service/src/local/backend.rs \
            crates/wow-service/src/local/projection.rs
      - name: Minimal selected-package Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked -p wow-rules -p wow-service -p wow-cli --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and whitespace
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git diff --check
          git diff --cached --check
      - name: Retain exact source and check outcomes
        if: always() && steps.admit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar > SHA256SUMS)
      - name: Upload checked blobs without moving any branch
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const allowed = new Set([
              'apps/wow/NATIVE_ARTIFACT.md',
              'apps/wow/NATIVE_INPUT.md',
              'crates/wow-rules/src/context.rs',
              'crates/wow-rules/src/descriptor.rs',
              'crates/wow-rules/src/engine.rs',
              'crates/wow-rules/src/lib.rs',
              'crates/wow-service/src/local/backend.rs',
              'crates/wow-service/src/local/projection.rs',
              '.ci/w04-production.patch.xz',
              '.github/workflows/ci.yml'
            ]);
            const parent = process.env.GITHUB_SHA;
            const parts = execFileSync('git', ['diff', '--cached', '--no-renames', '--name-status', '-z', parent], { encoding: 'utf8' }).split('\0');
            if (parts.pop() !== '' || parts.length % 2 !== 0) throw new Error('invalid diff record');
            const entries = [];
            for (let index = 0; index < parts.length; index += 2) {
              const status = parts[index], file = parts[index + 1];
              if (!allowed.has(file) || !['A', 'M', 'D'].includes(status)) {
                throw new Error(`unexpected checked change: ${status} ${file}`);
              }
              if (status === 'D') {
                if (file !== '.ci/w04-production.patch.xz') throw new Error('unexpected deletion');
                entries.push({ path: file, mode: '100644', type: 'blob', sha: null });
              } else {
                const mode = git('ls-files', '--stage', '--', file).split(' ')[0];
                if (mode !== '100644') throw new Error('unexpected source mode');
                const bytes = fs.readFileSync(file);
                if (bytes.length > 1024 * 1024) throw new Error('unexpected source size');
                const blob = await github.rest.git.createBlob({ ...context.repo, encoding: 'base64', content: bytes.toString('base64') });
                if (blob.data.sha !== git('hash-object', '--', file)) throw new Error('uploaded blob mismatch');
                entries.push({ path: file, mode, type: 'blob', sha: blob.data.sha });
              }
            }
            if (fs.existsSync('.ci/w04-production.patch.xz')) throw new Error('temporary patch remains');
            const manifest = {
              parent,
              checked_tree: git('write-tree'),
              entries,
            };
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, 'checkpoint', 'BLOB_MANIFEST.json'),
              JSON.stringify(manifest, null, 2) + '\n'
            );
            core.info(`Uploaded ${entries.filter(entry => entry.sha).length} checked blobs; no tree, commit or branch was changed.`);
      - uses: actions/upload-artifact@v7
        if: always() && steps.admit.outcome == 'success'
        with:
          name: w04-production-policy-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
