name: Native annotation inputs code checkpoint
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: w03-resources-checkpoint
  cancel-in-progress: false
env:
  BASE_COMMIT: 389a669418b558962645d55c27af1e7bdf48a598
  BASE_TREE: 03ed60f55d51118b276644cae91ba8f71225c88a
  PATCH_SHA256: bf58d140f4cd517c36db5fd93dc85b208b56a109112f84d7e9d7dedb2b3ba45d
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact patch and restore ordinary CI before checking
        id: admit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          xz -dc .ci/w03-resources.patch.xz > "$RUNNER_TEMP/w03-resources.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w03-resources.patch" | sha256sum -c -
          git restore --source="$BASE_COMMIT" --staged --worktree .github/workflows/ci.yml
          git rm -- .ci/w03-resources.patch.xz
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w03-resources.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format changed Rust modules only
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +stable --edition 2024 --config skip_children=true \
            crates/wow-project/src/disk.rs \
            crates/wow-project/src/disk/pinned.rs \
            crates/wow-reference/src/native_aliases.rs \
            crates/wow-reference/src/native_corrections.rs \
            crates/wow-service/src/local/mod.rs \
            crates/wow-service/src/local/native_input.rs \
            crates/wow-service/src/local/native_resources.rs
      - name: Selected-package Clippy without executing tests
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked -p wow-reference -p wow-annotations -p wow-project -p wow-service -p wow-cli --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and whitespace
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git diff --check
          git diff --cached --check
      - name: Retain exact source and check outcomes
        if: always() && steps.admit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar > SHA256SUMS)
      - name: Upload verified Git objects without moving any branch
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const allowed = new Set([
              'apps/wow/NATIVE_INPUT.md',
              'crates/wow-project/src/disk.rs',
              'crates/wow-project/src/disk/pinned.rs',
              'crates/wow-reference/src/native_aliases.rs',
              'crates/wow-reference/src/native_corrections.rs',
              'crates/wow-service/src/local/mod.rs',
              'crates/wow-service/src/local/native_input.rs',
              'crates/wow-service/src/local/native_resources.rs',
              '.ci/w03-resources.patch.xz',
              '.github/workflows/ci.yml'
            ]);
            const parent = process.env.GITHUB_SHA;
            if (git('rev-parse', 'HEAD') !== parent) throw new Error('checkout moved');
            const parts = execFileSync('git', ['diff', '--cached', '--no-renames', '--name-status', '-z', parent], { encoding: 'utf8' }).split('\0');
            if (parts.pop() !== '' || parts.length % 2 !== 0) throw new Error('invalid diff record');
            const entries = [];
            for (let index = 0; index < parts.length; index += 2) {
              const status = parts[index], file = parts[index + 1];
              if (!allowed.has(file) || !['A', 'M', 'D'].includes(status)) throw new Error('unexpected source change');
              if (status === 'D') {
                if (file !== '.ci/w03-resources.patch.xz') throw new Error('unexpected deletion');
                entries.push({ path: file, mode: '100644', type: 'blob', sha: null });
              } else {
                const mode = git('ls-files', '--stage', '--', file).split(' ')[0];
                if (mode !== '100644') throw new Error('unexpected source mode');
                const bytes = fs.readFileSync(file);
                if (bytes.length > 1024 * 1024) throw new Error('unexpected source size');
                const blob = await github.rest.git.createBlob({ ...context.repo, encoding: 'base64', content: bytes.toString('base64') });
                if (blob.data.sha !== git('hash-object', '--', file)) throw new Error('uploaded blob mismatch');
                entries.push({ path: file, mode, type: 'blob', sha: blob.data.sha });
              }
            }
            if (fs.existsSync('.ci/w03-resources.patch.xz')) throw new Error('temporary patch remains');
            if (git('hash-object', '.github/workflows/ci.yml') !== '5c9656de337157ac9c4bf6b65fa13896a129f326') throw new Error('ordinary CI not restored');
            const base = await github.rest.git.getCommit({ ...context.repo, commit_sha: parent });
            const tree = await github.rest.git.createTree({ ...context.repo, base_tree: base.data.tree.sha, tree: entries });
            if (tree.data.sha !== git('write-tree')) throw new Error('uploaded tree mismatch');
            const commit = await github.rest.git.createCommit({ ...context.repo, tree: tree.data.sha, parents: [parent], message: 'feat(service): bind explicit corrections and annotation catalogs to native input [skip ci]\n\nW03 resource-selection slice. Reuse existing guarded correction and multi-catalog owners with narrower pre-allocation input budgets. Bind actual correction/catalog provenance and output to analyzer identity; preserve raw ReferenceView authority and exact application outcomes. Selected-package Clippy and repository policy only; tests and Windows/runtime acceptance not run. Ordinary CI restored; temporary patch removed. Publication requires separate verified main fast-forward.' });
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'checkpoint', 'PROPOSED_COMMIT'), commit.data.sha + '\n');
            core.info('Uploaded checked tree ' + tree.data.sha + ' and commit ' + commit.data.sha + '; no branch was moved.');
      - uses: actions/upload-artifact@v7
        if: always() && steps.admit.outcome == 'success'
        with:
          name: w03-resources-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
