name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Record tested inputs
        run: |
          git rev-parse HEAD
          rustc +stable -Vv
      - name: Native repository policy and skill checks
        run: cargo +stable xtask check
      - run: cargo +stable fmt --all --check
      - run: cargo +stable check --locked --workspace --all-targets --all-features
      - run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo +stable test --locked --workspace --all-targets --all-features
      - run: cargo +stable test --release --locked --workspace --all-targets --all-features
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Verify tests did not rewrite tracked files
        run: git diff --exit-code
      - name: Archive exact tested source
        if: runner.os == 'Linux'
        run: |
          git archive --format=tar --output="$RUNNER_TEMP/tested-source.tar" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/COMMIT_SHA"
          sha256sum "$RUNNER_TEMP/tested-source.tar" > "$RUNNER_TEMP/SHA256SUMS"
      - name: Retain tested source
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: tested-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tested-source.tar
            ${{ runner.temp }}/COMMIT_SHA
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 3
          if-no-files-found: error
  updated-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable update
      - run: cargo +stable test --workspace --all-targets --all-features
      - run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
  parser-compatibility:
    name: Rolling Emmy parser compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Resolve current parser in isolated CI checkout
        run: |
          cargo +stable update
          cargo +stable metadata --format-version 1 > "$RUNNER_TEMP/rolling-dependencies.json"
      - name: Test reference consumer against current parser
        run: cargo +stable test --package wow-reference --package wow-annotations --all-targets --all-features
      - name: Retain exact offline dependency inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parser-inputs"
          cargo +stable vendor --locked "$RUNNER_TEMP/parser-inputs/vendor" > "$RUNNER_TEMP/parser-inputs/vendor-config.toml"
          cp Cargo.lock "$RUNNER_TEMP/parser-inputs/Cargo.lock"
          cp crates/wow-reference/Cargo.toml "$RUNNER_TEMP/parser-inputs/reference-Cargo.toml"
          git rev-parse HEAD > "$RUNNER_TEMP/parser-inputs/COMMIT_SHA"
          rustc +stable -Vv > "$RUNNER_TEMP/parser-inputs/rust-version.txt"
          tar -czf "$RUNNER_TEMP/parser-inputs.tar.gz" -C "$RUNNER_TEMP/parser-inputs" .
          sha256sum "$RUNNER_TEMP/parser-inputs.tar.gz" > "$RUNNER_TEMP/parser-inputs.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: parser-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/parser-inputs.tar.gz
            ${{ runner.temp }}/parser-inputs.sha256
          retention-days: 3
          if-no-files-found: error
  wasm-bridge:
    name: Wasm swap and rollback (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install current Rust and the guest target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown --toolchain stable
      - name: Build two real guest artifacts without rebuilding the host
        run: |
          cargo +stable build --locked -p wow-ketho-literals-wasm --target wasm32-unknown-unknown --profile wasm-compact
          cargo +stable build --locked -p wow-ketho-literals-wasm --target wasm32-unknown-unknown --profile wasm-speed
      - name: Resolve independently updateable bridge dependencies
        run: cargo +stable generate-lockfile --manifest-path bridges/literal-host/Cargo.toml
      - name: Retain reproducible bridge dependency inputs
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge-inputs"
          cargo +stable vendor --locked --manifest-path bridges/literal-host/Cargo.toml "$RUNNER_TEMP/bridge-inputs/vendor" > "$RUNNER_TEMP/bridge-inputs/vendor-config.toml"
          cp bridges/literal-host/Cargo.lock "$RUNNER_TEMP/bridge-inputs/Cargo.lock"
          rustc +stable -Vv > "$RUNNER_TEMP/bridge-inputs/rust-version.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/bridge-inputs/COMMIT_SHA"
          tar -czf "$RUNNER_TEMP/bridge-inputs.tar.gz" -C "$RUNNER_TEMP/bridge-inputs" .
          sha256sum "$RUNNER_TEMP/bridge-inputs.tar.gz" > "$RUNNER_TEMP/bridge-inputs.sha256"
      - name: Upload bridge dependency inputs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: bridge-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bridge-inputs.tar.gz
            ${{ runner.temp }}/bridge-inputs.sha256
          retention-days: 3
          if-no-files-found: error
      - name: Check the isolated host
        run: |
          cargo +stable fmt --manifest-path bridges/literal-host/Cargo.toml --all --check
          cargo +stable clippy --locked --manifest-path bridges/literal-host/Cargo.toml --all-targets -- -D warnings
          cargo +stable test --locked --manifest-path bridges/literal-host/Cargo.toml --test runtime
      - name: Run mandatory compiled-guest parity, swap, retained operation and rollback
        env:
          WDF_WASM_A: ${{ github.workspace }}/target/wasm32-unknown-unknown/wasm-compact/wow_ketho_literals_wasm.wasm
          WDF_WASM_B: ${{ github.workspace }}/target/wasm32-unknown-unknown/wasm-speed/wow_ketho_literals_wasm.wasm
        run: |
          set -euo pipefail
          cargo +stable test --locked --manifest-path bridges/literal-host/Cargo.toml --test real_guest -- --ignored --nocapture | tee "$RUNNER_TEMP/wasm-probe.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/WASM_COMMIT_SHA"
          sha256sum "$WDF_WASM_A" "$WDF_WASM_B" > "$RUNNER_TEMP/WASM_SHA256SUMS"
      - name: Check host documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --manifest-path bridges/literal-host/Cargo.toml --no-deps
      - name: Retain compiled guest evidence and dependency selection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-bridge-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ github.workspace }}/target/wasm32-unknown-unknown/wasm-compact/wow_ketho_literals_wasm.wasm
            ${{ github.workspace }}/target/wasm32-unknown-unknown/wasm-speed/wow_ketho_literals_wasm.wasm
            ${{ github.workspace }}/bridges/literal-host/Cargo.lock
            ${{ runner.temp }}/wasm-probe.txt
            ${{ runner.temp }}/WASM_COMMIT_SHA
            ${{ runner.temp }}/WASM_SHA256SUMS
          retention-days: 3
          if-no-files-found: error
