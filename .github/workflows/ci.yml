name: Verify generated documentation groups
on:
  push:
    branches: [main]
    paths: [.github/workflows/ci.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Materialize reviewed source delta
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          encoded = ''''''
          data = json.loads(lzma.decompress(base64.b64decode(encoded, validate=True)))
          def git(*args): return subprocess.check_output(['git', *args])
          assert git('diff', '--name-only', data['base'], 'HEAD').decode().splitlines() == ['.github/workflows/ci.yml']
          for entry in data['entries']:
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              before = git('show', data['base'] + ':' + entry['path'])
              assert hashlib.sha256(before).hexdigest() == entry['base_sha256']
              lines = before.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(entry['edits']):
                  lines[start:end] = [replacement]
              after = ''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest() == entry['sha256']
              path.write_bytes(after)
          git('add', '-A')
          assert git('write-tree').decode().strip() == data['tree'] == 'af58179390794c4047e5eb7b3c9fd0c6460b858e'
          pathlib.Path('/tmp/reviewed-delta.json').write_text(json.dumps(data))
          print('Reviewed candidate:', data['tree'])
          PY
      - name: Test reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          python -m unittest discover -s tests -v
          cargo +stable fmt --all --check
          cargo +stable test --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          git diff --exit-code
          git diff --cached --check
      - name: Upload verified blobs only, without commit or ref mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          data = json.loads(pathlib.Path('/tmp/reviewed-delta.json').read_text())
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          for entry in data['entries']:
              content = pathlib.Path(entry['path']).read_bytes()
              assert hashlib.sha256(content).hexdigest() == entry['sha256']
              body = json.dumps({'encoding':'base64', 'content':base64.b64encode(content).decode()}).encode()
              request = urllib.request.Request(api + '/git/blobs', data=body, method='POST', headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type':'application/json', 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == entry['blob']
              print(entry['path'], result['sha'])
          print('Verified blobs staged. No tree, commit, push, or ref update was performed.')
          PY
