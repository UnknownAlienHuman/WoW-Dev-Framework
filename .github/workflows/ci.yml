name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Record tested inputs
        run: |
          git rev-parse HEAD
          rustc +stable -Vv
          python --version
      - run: python scripts/sync-wow-dev-skill.py --check
      - run: python -m unittest discover -s tests -v
      - run: cargo +stable fmt --all --check
      - run: cargo +stable check --locked --workspace --all-targets --all-features
      - run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo +stable test --locked --workspace --all-targets --all-features
      - run: cargo +stable test --release --locked --workspace --all-targets --all-features
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Verify tests did not rewrite tracked files
        run: git diff --exit-code
  updated-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable update
      - run: cargo +stable test --workspace --all-targets --all-features
      - run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
