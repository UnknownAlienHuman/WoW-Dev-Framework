name: Native artifact validation checkpoint
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: w03-native-artifact-validation
  cancel-in-progress: false
env:
  BASE_COMMIT: 92bf33aa08283ea79a1ae19b95c1e90a43a0b0f6
  BASE_TREE: 312e29368aca67540951951592e34f6ce6d9ab23
  ORIGINAL_CI_BLOB: c32f5910287dbe2ffe62b97582d523cf2c91b0e5
  ORIGINAL_HYGIENE_BLOB: 92db869d288c49d29356176dc5ce48421c161533
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Restore manual CI and repair hygiene YAML
        id: admit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$BASE_COMMIT"
          test "$(git hash-object .github/workflows/branch-hygiene.yml)" = "$ORIGINAL_HYGIENE_BLOB"
          git restore --source="$BASE_COMMIT" --staged --worktree .github/workflows/ci.yml
          test "$(git hash-object .github/workflows/ci.yml)" = "$ORIGINAL_CI_BLOB"
          test "$(git write-tree)" = "$BASE_TREE"
          sed -i '/^X$/d' .github/workflows/branch-hygiene.yml
          ! grep -qx 'X' .github/workflows/branch-hygiene.yml
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format changed Rust modules only
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +stable --edition 2024 --config skip_children=true \
            apps/wow/src/args.rs \
            apps/wow/src/main.rs \
            apps/wow/src/native.rs \
            crates/wow-project/src/disk.rs \
            crates/wow-service/src/local/backend.rs \
            crates/wow-service/src/local/disk_input.rs \
            crates/wow-service/src/local/input.rs \
            crates/wow-service/src/local/mod.rs \
            crates/wow-service/src/local/native_artifact/export.rs \
            crates/wow-service/src/local/native_artifact/mod.rs \
            crates/wow-service/src/local/native_artifact/wire.rs \
            crates/wow-service/src/local/native_input.rs \
            crates/wow-service/src/local/projection.rs
      - name: Selected-package Clippy without executing tests
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked -p wow-project -p wow-reference -p wow-service -p wow-cli --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and whitespace
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git diff --check
          git diff --cached --check
      - name: Retain exact source and check outcomes
        if: always() && steps.admit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar > SHA256SUMS)
      - name: Upload verified Git objects without moving any branch
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const allowed = new Set([
              '.github/workflows/branch-hygiene.yml',
              '.github/workflows/ci.yml',
              'apps/wow/src/args.rs',
              'apps/wow/src/main.rs',
              'apps/wow/src/native.rs',
              'crates/wow-project/src/disk.rs',
              'crates/wow-service/src/local/backend.rs',
              'crates/wow-service/src/local/disk_input.rs',
              'crates/wow-service/src/local/input.rs',
              'crates/wow-service/src/local/mod.rs',
              'crates/wow-service/src/local/native_artifact/export.rs',
              'crates/wow-service/src/local/native_artifact/mod.rs',
              'crates/wow-service/src/local/native_artifact/wire.rs',
              'crates/wow-service/src/local/native_input.rs',
              'crates/wow-service/src/local/projection.rs'
            ]);
            const parent = process.env.GITHUB_SHA;
            if (git('rev-parse', 'HEAD') !== parent) throw new Error('checkout moved');
            const parts = execFileSync('git', ['diff', '--cached', '--no-renames', '--name-status', '-z', parent], { encoding: 'utf8' }).split('\0');
            if (parts.pop() !== '' || parts.length % 2 !== 0) throw new Error('invalid diff record');
            const entries = [];
            for (let index = 0; index < parts.length; index += 2) {
              const status = parts[index], file = parts[index + 1];
              if (!allowed.has(file) || status !== 'M') throw new Error(`unexpected checked change: ${status} ${file}`);
              const mode = git('ls-files', '--stage', '--', file).split(' ')[0];
              if (mode !== '100644') throw new Error('unexpected source mode');
              const bytes = fs.readFileSync(file);
              if (bytes.length > 1024 * 1024) throw new Error('unexpected source size');
              const blob = await github.rest.git.createBlob({ ...context.repo, encoding: 'base64', content: bytes.toString('base64') });
              if (blob.data.sha !== git('hash-object', '--', file)) throw new Error('uploaded blob mismatch');
              entries.push({ path: file, mode, type: 'blob', sha: blob.data.sha });
            }
            if (git('hash-object', '.github/workflows/ci.yml') !== process.env.ORIGINAL_CI_BLOB) throw new Error('manual CI not restored');
            if (fs.readFileSync('.github/workflows/branch-hygiene.yml', 'utf8').split(/\r?\n/).includes('X')) throw new Error('invalid hygiene marker remains');
            const base = await github.rest.git.getCommit({ ...context.repo, commit_sha: parent });
            const tree = await github.rest.git.createTree({ ...context.repo, base_tree: base.data.tree.sha, tree: entries });
            if (tree.data.sha !== git('write-tree')) throw new Error('uploaded tree mismatch');
            const commit = await github.rest.git.createCommit({
              ...context.repo,
              tree: tree.data.sha,
              parents: [parent],
              message: 'chore(w03): validate native artifact transport and repair manual hygiene workflow [skip ci]\n\nFormat and Clippy the current native report/artifact implementation without tests. Preserve operator-selected manual CI triggers and remove the stray invalid YAML marker from branch hygiene. Publication remains a separately verified non-force fast-forward.'
            });
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'checkpoint', 'PROPOSED_COMMIT'), commit.data.sha + '\n');
            core.info(`Uploaded checked tree ${tree.data.sha} and commit ${commit.data.sha}; no branch was moved.`);
      - uses: actions/upload-artifact@v7
        if: always() && steps.admit.outcome == 'success'
        with:
          name: w03-native-artifact-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
