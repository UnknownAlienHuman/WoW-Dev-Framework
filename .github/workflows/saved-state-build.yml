name: SavedVariables pipeline check
on:
  push:
    branches: [main]
    paths: ['.ci/saved-state/**', '.github/workflows/saved-state-build.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit exact source pipeline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/saved-state"
          git rev-parse HEAD > "$RUNNER_TEMP/saved-state/BASE_SHA"
          test "$(git hash-object .ci/saved-state/00)" = ad9b3fb382073c0f695b7986fa3eb24f2ed6d877
          test "$(git hash-object .ci/saved-state/01)" = 4100e84c309b54f01453ae488d2780380d39e9ec
          test "$(git hash-object .ci/saved-state/02)" = ff1aa5684ccaba11ae4218712978695a2db152d8
          cat .ci/saved-state/00 .ci/saved-state/01 .ci/saved-state/02 | base64 --decode | gzip -d > "$RUNNER_TEMP/saved-state/input.patch"
          echo 'a6aa1baaf09f020c3a3de052e35150e5f711bf18b9729f81312e292b7a85b59e  input.patch' > "$RUNNER_TEMP/saved-state/INPUT_SHA256"
          (cd "$RUNNER_TEMP/saved-state" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/saved-state .github/workflows/saved-state-build.yml
          test "$(git write-tree)" = 0eff75c333f0f580babe2edb7b3b70f47763a947
          git apply --index "$RUNNER_TEMP/saved-state/input.patch"
          test "$(git write-tree)" = 889af7cb8403a31ae8577c72b389ad3dd18f6a61
      - name: Format implemented source
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/saved-state/RUST_VERSION"
          cargo +stable fmt -p wow-emmy -p wow-project -p wow-recognizers -p wow-service -p wow-cli
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/saved-state/TREE_SHA"
      - name: Clippy implemented pipeline
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-emmy -p wow-project -p wow-recognizers -p wow-service -p wow-cli -- -D warnings 2>&1 | tee "$RUNNER_TEMP/saved-state/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/saved-state/policy.log"
      - name: Retain exact checked source
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/saved-state/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/saved-state/checked.patch"
          git archive "$(git write-tree)" > "$RUNNER_TEMP/saved-state/checked-source.tar"
          (cd "$RUNNER_TEMP/saved-state" && sha256sum checked.patch checked-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: saved-state-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/saved-state/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: saved-state-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: saved-state-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows
      - name: Publish identical checked pipeline to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for platform in linux windows; do
            test "$(cat "$RUNNER_TEMP/$platform/BASE_SHA")" = "$GITHUB_SHA"
            (cd "$RUNNER_TEMP/$platform" && sha256sum -c SHA256SUMS)
          done
          cmp "$RUNNER_TEMP/linux/TREE_SHA" "$RUNNER_TEMP/windows/TREE_SHA"
          cmp "$RUNNER_TEMP/linux/checked.patch" "$RUNNER_TEMP/windows/checked.patch"
          git apply --index "$RUNNER_TEMP/linux/checked.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(graph): connect SavedVariables declarations to Lua state accesses' -m "Retain selected TOC account/character declarations, collect exact unshadowed global-slot accesses in the existing optional Emmy session, and join source roots and symbolic literal paths to existing state-read/state-write recognizers in a separate producer partition. Export final state nodes/edges and source/recognition receipts through graph-build v6; rebind all prior maps after every producer. Preserve explicit ambiguity and unsupported outcomes, source evidence and partial non-authority. Fix optional report hash material to avoid prohibited nulls. Selected-package Clippy and repository policy passed on identical Linux/Windows trees in run $GITHUB_RUN_ID. No tests, dependencies or lockfile changes. Aliases, dynamic keys, runtime state and full acceptance remain separate. Temporary check inputs removed."
          git push origin HEAD:main
