name: Materialize wow-reference E1-B

on:
  push:
    branches:
      - work/reference-store-e1-b
    paths:
      - crates/wow-reference/src/persistent.rs
      - .github/workflows/materialize-reference-store-e1-b.yml

permissions:
  contents: write

concurrency:
  group: materialize-reference-store-e1-b
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Activate exact owner edge and resolve lockfile
        run: |
          set -euo pipefail
          if ! grep -Fq 'wow-store = { path = "../wow-store" }' crates/wow-reference/Cargo.toml; then
            printf '\nwow-store = { path = "../wow-store" }\n' >> crates/wow-reference/Cargo.toml
          fi
          if ! grep -Fq 'pub mod persistent;' crates/wow-reference/src/lib.rs; then
            printf '\npub mod persistent;\n' >> crates/wow-reference/src/lib.rs
          fi
          cargo +stable generate-lockfile
          rm .github/workflows/materialize-reference-store-e1-b.yml
          git add -A
      - name: Verify E1-B owner and full workspace
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable test --package wow-reference --all-targets --all-features -- --nocapture
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +stable test --locked --workspace --all-targets --all-features
          cargo +stable test --release --locked --workspace --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(reference): persist exact ReferenceView publications'
          git push origin HEAD:work/reference-store-e1-b
