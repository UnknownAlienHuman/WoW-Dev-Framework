name: Apply dead Service admin removal

on:
  push:
    branches:
      - refactor/remove-dead-service-admin-2026-10-19

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Delete uncalled administration layers
        shell: bash
        run: |
          set -euo pipefail
          python .github/remove-dead-service-admin.py
          git rm .github/remove-dead-service-admin.py
          git rm .github/workflows/apply-remove-dead-service-admin.yml
          git rm crates/wow-service/src/annotation_admin.rs
          git rm crates/wow-service/src/reference_admin.rs
          git rm crates/wow-service/src/reference_pack_admin.rs
          git rm crates/wow-service/tests/reference_admin.rs
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked -p wow-service -p wow-reference-builder -p wow-cli --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-service docs
          git commit -m "refactor: remove uncalled Service administration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
