name: Lua call pipeline check
on:
  push:
    branches: [main]
    paths: ['.ci/call-pipeline/**', '.github/workflows/call-pipeline-build.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit reviewed function and call pipeline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/call-pipeline"
          git rev-parse HEAD > "$RUNNER_TEMP/call-pipeline/BASE_SHA"
          test "$(git hash-object .ci/call-pipeline/00)" = 8cfa3c1bd9f722e0b5a3d07a0cbe067afb83f129
          test "$(git hash-object .ci/call-pipeline/01)" = f95b908e875844d32f7326e74d09272e87be7c01
          test "$(git hash-object .ci/call-pipeline/02)" = ff7784eb75db7abf3120216e02b19f58891da9b9
          test "$(git hash-object .ci/call-pipeline/03)" = 07f72318135c9d045993fe69ba61657ab985a123
          test "$(git hash-object .ci/call-pipeline/04)" = dc11f90747a026b40d27ea57f3ac8c038006fb92
          cat .ci/call-pipeline/00 .ci/call-pipeline/01 .ci/call-pipeline/02 .ci/call-pipeline/03 .ci/call-pipeline/04 | base64 --decode | gzip -d > "$RUNNER_TEMP/call-pipeline/input.patch"
          echo 'cd9bae3bda80195ae108c177f0c69907e9df07aab1e03102bb611175b6c9e77a  input.patch' > "$RUNNER_TEMP/call-pipeline/INPUT_SHA256"
          (cd "$RUNNER_TEMP/call-pipeline" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/call-pipeline .github/workflows/call-pipeline-build.yml
          test "$(git write-tree)" = f473a8781810d85aecf7217b460c7016bc40158b
          git apply --index "$RUNNER_TEMP/call-pipeline/input.patch"
          test "$(git write-tree)" = 93fc6979df1a2226819cb3e7df439b95a6f81778
      - name: Format changed packages
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/call-pipeline/RUST_VERSION"
          cargo +stable fmt -p wow-emmy -p wow-graph -p wow-project -p wow-recognizers -p wow-service -p wow-cli
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/call-pipeline/TREE_SHA"
      - name: Clippy implemented pipeline
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-emmy -p wow-graph -p wow-project -p wow-recognizers -p wow-service -p wow-cli -- -D warnings 2>&1 | tee "$RUNNER_TEMP/call-pipeline/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/call-pipeline/policy.log"
      - name: Retain checked source
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/call-pipeline/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/call-pipeline/checked.patch"
          git archive "$(git write-tree)" > "$RUNNER_TEMP/call-pipeline/checked-source.tar"
          (cd "$RUNNER_TEMP/call-pipeline" && sha256sum checked.patch checked-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: call-pipeline-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/call-pipeline/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: call-pipeline-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: call-pipeline-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows
      - name: Publish identical checked pipeline to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for platform in linux windows; do
            test "$(cat "$RUNNER_TEMP/$platform/BASE_SHA")" = "$GITHUB_SHA"
            (cd "$RUNNER_TEMP/$platform" && sha256sum -c SHA256SUMS)
          done
          cmp "$RUNNER_TEMP/linux/TREE_SHA" "$RUNNER_TEMP/windows/TREE_SHA"
          cmp "$RUNNER_TEMP/linux/checked.patch" "$RUNNER_TEMP/windows/checked.patch"
          git apply --index "$RUNNER_TEMP/linux/checked.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(graph): build Lua function and call graphs through native recognizers' -m "Capture concrete Main function scopes and callee signatures in the existing optional Emmy session; project functions and exact call-site evidence; run the existing direct-call recognizer into an independent producer partition; export final function/node and call/edge mappings through wow graph build. Preserve ambiguous, Library, uncaptured and self-recursive outcomes without invented edges or runtime authority. Ordinary check/status do not run the extra collection. Selected pipeline Clippy and repository policy passed on identical Linux/Windows source trees in run $GITHUB_RUN_ID. No tests or external dependency versions changed; activate only the existing service-to-recognizers dependency. Full recognizer coverage, runtime verification and coherent ProjectStore remain separate. Temporary check inputs removed."
          git push origin HEAD:main
