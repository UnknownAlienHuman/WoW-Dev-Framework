name: I0 foundation

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/wow-core/**
      - .github/workflows/i0-foundation.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/wow-core/**
      - .github/workflows/i0-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i0-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.98.0 fmt --all --check

      - name: Verify dependency lock
        run: |
          cargo +1.98.0 generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Check lints
        run: cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run debug tests
        run: cargo +1.98.0 test --locked --workspace --all-features

      - name: Run release tests
        run: cargo +1.98.0 test --locked --workspace --all-features --release

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.98.0 doc --locked --workspace --all-features --no-deps

      - name: Export exact compiler and resolved registry
        shell: bash
        run: |
          set -euo pipefail
          sysroot="$(rustc +1.98.0 --print sysroot)"
          mkdir -p /tmp/rust-dev/toolchain /tmp/rust-dev/cargo-home
          cp -a "$sysroot/." /tmp/rust-dev/toolchain/
          cp -a "$HOME/.cargo/registry" /tmp/rust-dev/cargo-home/
          printf '%s\n' "$sysroot" > /tmp/rust-dev/RUNNER_SYSROOT
          tar --directory=/tmp/rust-dev --use-compress-program='zstd -10 -T0' --create --file=/tmp/rust-1.98.0-dev.tar.zst .
          sha256sum /tmp/rust-1.98.0-dev.tar.zst > /tmp/rust-1.98.0-dev.tar.zst.sha256

      - name: Upload one-day development toolchain
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-1.98.0-dev
          path: |
            /tmp/rust-1.98.0-dev.tar.zst
            /tmp/rust-1.98.0-dev.tar.zst.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
