name: Format PR 249 Emmy workspace

on:
  push:
    branches:
      - feat/compiled-emmy-identity-2026-10-24

permissions:
  contents: write

concurrency:
  group: format-pr249-emmy-workspace
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'UnknownAlienHuman/WoW-Dev-Framework'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/compiled-emmy-identity-2026-10-24
          fetch-depth: 1
          persist-credentials: true

      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Apply and publish rustfmt
        env:
          TARGET_BRANCH: feat/compiled-emmy-identity-2026-10-24
        run: |
          set -euo pipefail

          cargo +stable fmt --all
          rm -- .github/workflows/format-pr249-workspace.yml

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/format-pr249-workspace.yml
            crates/wow-emmy/src/workspace.rs
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected rustfmt paths:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply rustfmt to Emmy workspace'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
