name: Apply project migration removal

on:
  push:
    branches:
      - refactor/remove-project-migration-platform-2026-10-18

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Remove physical migration platform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new))

          replace_once("crates/wow-store/src/project/mod.rs", "mod migration;\n", "")
          replace_once(
              "crates/wow-store/src/project/mod.rs",
              "pub use migration::{\n"
              "    MappedMigrationRoot, MigrationCandidate, MigrationCurrentMapping, MigrationMapping,\n"
              "    MigrationPreparation, MigrationReadyReceipt, MigrationReceipt, MigrationSelectionCandidate,\n"
              "    MigrationSelectionReceipt, ReadyMigration, ValidatedMigration,\n"
              "};\n",
              "",
          )
          replace_once(
              "crates/wow-service/src/live_project.rs",
              "mod migration;\n"
              "pub use migration::{\n"
              "    export_live_project_migration, migrate_live_project_to_new, prepare_live_project_migration,\n"
              "    resume_live_project_migration, resume_live_project_migration_preparation,\n"
              "};\n",
              "",
          )
          replace_once(
              "crates/wow-service/src/live_project/tests.rs",
              "#[path = \"migration_tests.rs\"]\nmod migration;\n",
              "",
          )

          registry = Path("crates/wow-store/src/project/registry.rs")
          text = registry.read_text()
          for old, new in [
              ("    migration::selection,\n", ""),
              ("    pub migration: Option<selection::model::SelectionRecord>,\n", ""),
              (
                  "previous.record.is_none()\n"
                  "                && previous.migration.is_none()\n"
                  "                && !previous.source_authorities.is_empty()",
                  "previous.record.is_none() && !previous.source_authorities.is_empty()",
              ),
              (
                  "admitted.record.is_none()\n"
                  "            && admitted.migration.is_none()\n"
                  "            && !admitted.source_authorities.is_empty()",
                  "admitted.record.is_none() && !admitted.source_authorities.is_empty()",
              ),
              (
                  "        if let Some(migration) = &previous.migration {\n"
                  "            require_migration_record(root, migration, &authorities)?;\n"
                  "        }\n",
                  "",
              ),
              (
                  "    if let Some(migration) = &admitted.migration {\n"
                  "        require_migration_record(root, migration, &authorities)?;\n"
                  "    }\n",
                  "",
              ),
              ("            migration: previous.migration,\n", ""),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"registry replacement expected once, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          none_count = text.count("            migration: None,\n")
          if none_count < 3:
              raise SystemExit(f"expected migration None initializers, found {none_count}")
          text = text.replace("            migration: None,\n", "")

          text, count = re.subn(
              r"fn require_migration_record\(.*?\n\}\n(?=pub\(super\) fn read_normal_shallow)",
              "",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("failed to remove require_migration_record")

          text, count = re.subn(
              r"    // Each branch reconstructs canonical bytes; legacy manifests are unchanged\.\n"
              r"    #\[derive\(Deserialize\)\]\n"
              r"    struct SchemaTag \{.*?\n"
              r"    \}\n"
              r"    if serde_json::from_slice::<SchemaTag>\(bytes\).*?\n"
              r"    \}\n"
              r"(?=    if let Ok\(epoch\))",
              "    // Current readers accept only the current registry forms.\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("failed to remove project-registry/6 compatibility reader")
          if "selection::" in text or "project-registry/6" in text or ".migration" in text:
              raise SystemExit("migration selection compatibility remains in registry")
          registry.write_text(text)

          replace_once(
              "crates/wow-store/README.md",
              "The older backup/quarantine/epoch-migration and generic retention machinery\n"
              "still exists. [#111](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/111)\n"
              "tracks its removal after the current index path in [#131](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/131).\n",
              "The physical epoch-migration/selection platform has been removed. Older\n"
              "backup, quarantine, recovery and generic retention machinery remains for the\n"
              "bounded reductions in [#111](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/111)\n"
              "after the current index path in [#131](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/131).\n",
          )

          queue = Path("docs/REFACTOR_QUEUE.md")
          text = queue.read_text()
          text = text.replace(
              "[ADR-058](DECISIONS.md) retires the broader platform\n"
              "plan. Preparation is [PR #192](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/pull/192);\n"
              "use its branch until integration. [#191](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/191)\n"
              "is the reduction tracker; [#125](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/125)\n"
              "tracks completion of this narrowed product.\n",
              "[ADR-058](DECISIONS.md) retires the broader platform plan. `main` is the\n"
              "source of truth; [#191](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/191)\n"
              "tracks reduction and [#125](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/125)\n"
              "tracks completion of the narrowed product.\n",
          )
          text = text.replace(
              "| 2 | [#194 — result envelopes](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/194) | Plain typed results, one output serialization; remove self-hashes/size loops/read journals. |",
              "| 2 | [#194 — result envelopes](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/194) | Core E0 envelopes and one-shot registries are removed; finish plain typed output and delete remaining self-hash/size/read journals. |",
          )
          text = text.replace(
              "| 5 | [#111 — storage lifecycle](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/111) | After #131, remove backup/quarantine/epoch migration, generic retention/GC/journals. |",
              "| 5 | [#111 — storage lifecycle](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/111) | Physical epoch migration is removed; after #131 delete remaining backup/quarantine/recovery and generic retention/GC/journals. |",
          )
          text = text.replace(
              "| Coordinate #107 | [#118 — removed product routes](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/118) | Delete lineage/promotion/migration-impact/fingerprint routes and exclusive internals. |",
              "| Coordinate #107 | [#118 — removed product routes](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/118) | Source comparison and Graph lineage are removed; delete only remaining promotion/fingerprint machinery proven exclusive. |",
          )
          queue.write_text(text)
          PY

          git rm -r \
            crates/wow-store/src/project/migration.rs \
            crates/wow-store/src/project/migration \
            crates/wow-service/src/live_project/migration.rs \
            crates/wow-service/src/live_project/migration_tests.rs \
            crates/wow-store/PROJECT_MIGRATION.md \
            crates/wow-store/PROJECT_MIGRATION_READY.md \
            crates/wow-store/e2 \
            docs/PROJECT_MIGRATION_SELECTION.md \
            docs/PROJECT_SOURCE_AUTHORITY.md \
            .github/workflows/apply-project-migration-removal.yml

          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings

          if rg -n "MigrationCandidate|ValidatedMigration|MigrationPreparation|ReadyMigration|MigrationSelection(Candidate|Receipt)|prepare_live_project_migration|migrate_live_project_to_new|resume_live_project_migration|export_live_project_migration|project-registry/6" --glob '!target/**' .; then
            echo "stale physical migration reference remains" >&2
            exit 1
          fi
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove project migration platform"
          git push origin "HEAD:${GITHUB_REF_NAME}"
