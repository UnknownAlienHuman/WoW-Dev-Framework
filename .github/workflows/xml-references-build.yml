name: XML references build
on:
  push:
    branches: [main]
    paths:
      - '.ci/xml-references/**'
      - '.github/workflows/xml-references-build.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit exact functional source on its reviewed base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/xml-references" "$RUNNER_TEMP/xml-references-input"
          git rev-parse HEAD > "$RUNNER_TEMP/xml-references/BASE_SHA"
          test "$(git hash-object .ci/xml-references/mod.rs)" = 6dacd5011e0cffe8dfa8eb497a74b77325b88ef6
          test "$(git hash-object .ci/xml-references/cycles.rs)" = 4550b892686b289cc6fd94303256adbf8b4de21c
          test "$(git hash-object .ci/xml-references/service.rs)" = 52f78a2437fbab61aee1013935cbec68cd02805b
          test "$(git hash-object .ci/xml-references/integration.patch)" = ad97122ad43f7c3382b49ab2f7fe97bbc6f2f8c6
          cp .ci/xml-references/* "$RUNNER_TEMP/xml-references-input/"
          git rm -r -- .ci/xml-references .github/workflows/xml-references-build.yml
          test "$(git write-tree)" = cfb7952f13c2ac242f1ba3b7c15848f56ab77511
          git apply --index "$RUNNER_TEMP/xml-references-input/integration.patch"
          mkdir -p crates/wow-project/src/load/xml_references
          cp "$RUNNER_TEMP/xml-references-input/mod.rs" crates/wow-project/src/load/xml_references/mod.rs
          cp "$RUNNER_TEMP/xml-references-input/cycles.rs" crates/wow-project/src/load/xml_references/cycles.rs
          cp "$RUNNER_TEMP/xml-references-input/service.rs" crates/wow-service/src/local/xml_references.rs
          git add crates/wow-project/src/load/xml_references crates/wow-service/src/local/xml_references.rs
          test "$(git write-tree)" = 5945583e1549bc25088a2c214334822d530137f2
      - name: Format the reviewed implementation
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/xml-references/RUST_VERSION"
          cargo +stable fmt --all
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/xml-references/TREE_SHA"
      - name: Build the application with the unchanged lockfile
        run: |
          set -euo pipefail
          cargo +stable build --locked -p wow-cli --bin wow 2>&1 | tee "$RUNNER_TEMP/xml-references/build.log"
      - name: Check the implemented owners
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-project -p wow-service -p wow-cli --lib --bins -- -D warnings 2>&1 | tee "$RUNNER_TEMP/xml-references/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/xml-references/policy.log"
          cargo +stable fmt --all --check
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/xml-references/TREE_SHA")"
      - name: Retain the exact compiled tree
        run: |
          set -euo pipefail
          git diff --cached --binary --full-index HEAD > "$RUNNER_TEMP/xml-references/compiled.patch"
          (cd "$RUNNER_TEMP/xml-references" && sha256sum compiled.patch > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xml-references-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/xml-references/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: xml-references-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/xml-linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: xml-references-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/xml-windows
      - name: Publish identical compiled source to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/xml-linux/BASE_SHA")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/xml-windows/BASE_SHA")" = "$GITHUB_SHA"
          cmp "$RUNNER_TEMP/xml-linux/TREE_SHA" "$RUNNER_TEMP/xml-windows/TREE_SHA"
          (cd "$RUNNER_TEMP/xml-linux" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/xml-windows" && sha256sum -c SHA256SUMS)
          git apply --index "$RUNNER_TEMP/xml-linux/compiled.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/xml-linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(project): link XML parent and inheritance declarations' -m "Link exact local XML names without merging duplicate declarations or inventing dependency/runtime facts. Preserve source anchors, ordered inheritance and actual load occurrences; detect parent and inheritance SCCs separately with bounded iterative traversal. Integrate receipts, partial capabilities, XML-scoped ordinary findings and CLI summaries. Bind the report into load-plan v5. Linux/Windows application builds, selected-owner Clippy, formatting and repository policy passed on this exact tree in run $GITHUB_RUN_ID. No dependency, lockfile, test or fixture changes. XSD validation, Lua binding, inheritance materialization and real-addon runtime acceptance remain separate. Temporary build inputs removed."
          git push origin HEAD:main
