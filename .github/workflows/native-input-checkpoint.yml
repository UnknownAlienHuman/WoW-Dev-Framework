name: Native input code checkpoint
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-input-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: startsWith(github.event.head_commit.message, 'code-first(native-input):')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      BASE_COMMIT: 02d893cd3b9c9dd116a3330824b9764c3d5ab919
      BASE_TREE: d8caed62c911410a1ce41cef8ab8de351f421479
      FIXES_SHA256: 57d7c7551893a5fdf052241ad0b814e3bab2321c102b2b834c2fee6e0596c732
      PATCH_SHA256: efc36c149ca6de6408e3c852bebf458da34e83f87f7475e56d9048bc62aa8939
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit the fixed main-only source change
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gzip -dc .ci/native-input.patch.gz > "$RUNNER_TEMP/native-input.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/native-input.patch" | sha256sum -c -
          cp .ci/native-input-fixes.patch "$RUNNER_TEMP/native-input-fixes.patch"
          printf '%s  %s\n' "$FIXES_SHA256" "$RUNNER_TEMP/native-input-fixes.patch" | sha256sum -c -
          git restore --source="$BASE_COMMIT" --staged --worktree .github/workflows/ci.yml
          git rm -- .ci/native-input-fixes.patch .ci/native-input.patch.gz .github/workflows/native-input-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/native-input.patch"
          git apply --index "$RUNNER_TEMP/native-input-fixes.patch"
      - name: Install compiler and minimal lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format only changed Rust modules
        run: |
          set -euo pipefail
          rustfmt +stable --edition 2024 --config skip_children=true \
            crates/wow-annotations/src/persistent.rs \
            crates/wow-project/src/disk.rs \
            crates/wow-project/src/disk/pinned.rs \
            crates/wow-reference/src/lib.rs \
            crates/wow-reference/src/native_view.rs \
            crates/wow-service/src/local/backend.rs \
            crates/wow-service/src/local/disk_input.rs \
            crates/wow-service/src/local/input.rs \
            crates/wow-service/src/local/mod.rs \
            crates/wow-service/src/local/native_input.rs \
            crates/wow-service/src/local/projection.rs
      - name: Minimal selected-package Clippy; no tests executed
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked -p wow-annotations -p wow-reference -p wow-project -p wow-service -p wow-cli --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Native repository policy
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git diff --check "$BASE_COMMIT"
      - name: Retain exact checked source even on a failed lint
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          sha256sum "$RUNNER_TEMP/checkpoint/checked-source.tar" > "$RUNNER_TEMP/checkpoint/SHA256SUMS"
      - name: Upload checked Git objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh
          command -v jq
          entries="$RUNNER_TEMP/tree-entries.jsonl"
          : > "$entries"
          while IFS= read -r file; do
            if test -f "$file"; then
              base64 -w0 "$file" | jq -Rs '{content:.,encoding:"base64"}' > "$RUNNER_TEMP/blob-request.json"
              sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob-request.json" --jq .sha)"
              test "$sha" = "$(git hash-object "$file")"
              jq -nc --arg path "$file" --arg sha "$sha" '{path:$path,mode:"100644",type:"blob",sha:$sha}' >> "$entries"
            else
              jq -nc --arg path "$file" '{path:$path,mode:"100644",type:"blob",sha:null}' >> "$entries"
            fi
          done < <(git diff --name-only "$GITHUB_SHA")
          jq -s --arg base "$(git rev-parse "$GITHUB_SHA^{tree}")" '{base_tree:$base,tree:.}' "$entries" > "$RUNNER_TEMP/tree-request.json"
          tree="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/tree-request.json" --jq .sha)"
          test "$tree" = "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          jq -n --arg tree "$tree" --arg parent "$GITHUB_SHA" --arg message 'feat(service): bind pinned native API documents to local status/check [skip ci]

          W03 selected-source slice. Native reference and Ketho annotation owners, confined pinned acquisition, Partial callable view, generated Library and output-bound analyzer identity. Selected-package Clippy and repository policy only. Tests, Windows/runtime and full W03 acceptance remain unexecuted. Temporary checkpoint workflow removed; ordinary CI restored.' '{tree:$tree,parents:[$parent],message:$message}' > "$RUNNER_TEMP/commit-request.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input "$RUNNER_TEMP/commit-request.json" --jq .sha > "$RUNNER_TEMP/checkpoint/PROPOSED_COMMIT"
          cat "$RUNNER_TEMP/checkpoint/PROPOSED_COMMIT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-input-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
