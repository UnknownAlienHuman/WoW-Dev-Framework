name: W08 hardening and status checkpoint
run-name: W08 hardening checkpoint ${{ github.sha }}
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: w08-managed-source-hardening
  cancel-in-progress: false
env:
  BASE_COMMIT: a69c685315e32d8afde28d758ecf2b495f02a80b
  BASE_TREE: 188c6fe15034a5af03561600034350fe13c3d02d
  PATCH_SHA256: e8e12ea2586a864770cbfa4408fb489b9f205aa1c376dbfed2b6912f2c3e4a6b
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact hardening patch and remove checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$BASE_COMMIT"
          cat .ci/w08-hardening.patch.xz.b64.* > "$RUNNER_TEMP/w08-hardening.patch.xz.b64"
          base64 -d "$RUNNER_TEMP/w08-hardening.patch.xz.b64" > "$RUNNER_TEMP/w08-hardening.patch.xz"
          xz -dc "$RUNNER_TEMP/w08-hardening.patch.xz" > "$RUNNER_TEMP/w08-hardening.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w08-hardening.patch" | sha256sum -c -
          git rm -- .ci/w08-hardening.patch.xz.b64.* .github/workflows/w08-hardening-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w08-hardening.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Minimal xtask Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked -p xtask --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          expected="$(cat <<'FILES'
          AGENTS.md
          crates/MANIFEST.json
          docs/IMPLEMENTATION_STATUS.md
          docs/PROJECT_COMPLETION_MATRIX.md
          docs/SOURCE_CHECKOUT_UPDATES.md
          tools/xtask/src/source_update/materialize.rs
          FILES
          )"
          test "$actual" = "$expected"
          grep -Fq 'fn paths_overlap' tools/xtask/src/source_update/materialize.rs
          grep -Fq 'managed-source-materialization' crates/MANIFEST.json
          grep -Fq '36821527175' docs/IMPLEMENTATION_STATUS.md
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w08-managed-source-hardening-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
