name: W08 publish checked hardening
run-name: W08 publish hardening ${{ github.sha }}
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: w08-managed-source-hardening
  cancel-in-progress: false
env:
  BASE_COMMIT: a69c685315e32d8afde28d758ecf2b495f02a80b
  STAGING_PARENT: d0c88c7ad5d86ee25ca720b89bcd091727b8a89e
  ARTIFACT_ID: '11143399477'
  ARTIFACT_ZIP_SHA256: 2f5550a154cbf404484abc92694e3197030c7e515e99f573cd623fda20fd16b5
  SOURCE_TAR_SHA256: a0204db98b3da49744c9d01e97a99f814f4cd742399fec3c586c530155ac5ef0
  CHECKED_TREE: db1773a96931bad20d286e5dbf68624970d88565
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Recover exact checked source and fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          mkdir -p "$RUNNER_TEMP/checked"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/checked.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/checked.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/checked.zip" -d "$RUNNER_TEMP/checked"
          test "$(cat "$RUNNER_TEMP/checked/CHECKED_TREE")" = "$CHECKED_TREE"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$RUNNER_TEMP/checked/checked-source.tar" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/checked/checked-source.tar" -C .
          git rm -- .ci/w08-hardening.patch.xz.b64.* .github/workflows/w08-hardening-checkpoint.yml
          git add --all
          git diff --cached --check
          test "$(git write-tree)" = "$CHECKED_TREE"
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          expected="$(cat <<'FILES'
          AGENTS.md
          crates/MANIFEST.json
          docs/IMPLEMENTATION_STATUS.md
          docs/PROJECT_COMPLETION_MATRIX.md
          docs/SOURCE_CHECKOUT_UPDATES.md
          tools/xtask/src/source_update/materialize.rs
          FILES
          )"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(xtask): harden managed source path isolation [skip ci]' \
            -m 'Reject every ancestor/descendant overlap among managed root, manifest output, operation directory and staging. Synchronize the execution ledgers with active W07/W08 code and retain explicit remaining nonclaims. Strict xtask Clippy and repository policy passed; no tests executed.'
          git push origin HEAD:main
