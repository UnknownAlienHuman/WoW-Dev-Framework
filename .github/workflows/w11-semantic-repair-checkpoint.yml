name: W11 semantic repair checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w11-semantic-repair-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: w11-semantic-repair-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STAGING_PARENT: e83890be51e161827ecb4d6a0fc4a7f7cfdf82c8
      BASE_COMMIT: a2bf0af3675203c07078c03f5641cef649b6c0ed
      BASE_TREE: 1bf20ba91719786dd589a66c9bb6e1a5c1d98b1d
      B64_SHA256: 1d6ec1ace3e49bee7223b775da179be7400b7f61a29aeac8a799fda30794193a
      XZ_SHA256: 276c93c80de8335b71a2fcbd29e7fe3f7f0ec2a61f9e859bca1370b96c12dc17
      PATCH_SHA256: c0107b92dbad6dc6aa53a8544969c3be5c4b6cc46c467981ec21e22447969773
      FIX1_SHA256: 2024898b5e82d1658c59155177d23525b3e35b4c7515686e1854a1f93402bf3d
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Admit exact repair patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$STAGING_PARENT"
          cat .ci/w11-semantic-repair.patch.b64.* > "$RUNNER_TEMP/w11-semantic-repair.b64"
          printf '%s  %s\n' "$B64_SHA256" "$RUNNER_TEMP/w11-semantic-repair.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/w11-semantic-repair.b64" > "$RUNNER_TEMP/w11-semantic-repair.patch.xz"
          printf '%s  %s\n' "$XZ_SHA256" "$RUNNER_TEMP/w11-semantic-repair.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/w11-semantic-repair.patch.xz" > "$RUNNER_TEMP/w11-semantic-repair.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w11-semantic-repair.patch" | sha256sum -c -
          cp .ci/w11-semantic-repair-fix1.patch "$RUNNER_TEMP/w11-semantic-repair-fix1.patch"
          printf '%s  %s\n' "$FIX1_SHA256" "$RUNNER_TEMP/w11-semantic-repair-fix1.patch" | sha256sum -c -
          git rm -- \
            .ci/w11-semantic-repair.patch.xz \
            .ci/w11-semantic-repair.patch.b64.* \
            .ci/w11-semantic-repair-fix1.patch \
            .github/workflows/w11-semantic-repair-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w11-semantic-repair.patch"
          git apply --index "$RUNNER_TEMP/w11-semantic-repair-fix1.patch"
      - name: Install compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Check affected chain
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable check --locked \
            -p wow-emmy -p wow-project -p wow-recognizers -p wow-service -p wow-cli \
            --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Strict affected-chain Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable clippy --locked \
            -p wow-emmy -p wow-project -p wow-recognizers -p wow-service -p wow-cli \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          git diff --cached --name-only "$BASE_COMMIT" | sort > "$RUNNER_TEMP/changed-files"
          cat > "$RUNNER_TEMP/expected-files" <<'FILES'
          crates/wow-emmy/src/function_calls.rs
          crates/wow-project/src/analyzer.rs
          crates/wow-project/src/graph.rs
          crates/wow-recognizers/src/source_bridge.rs
          crates/wow-recognizers/src/source_scripts.rs
          crates/wow-recognizers/src/source_signals.rs
          crates/wow-recognizers/src/source_state.rs
          docs/IMPLEMENTATION_STATUS.md
          docs/W11_SEMANTIC_REPAIR_MAP_2026-10-09.md
          FILES
          sed -i 's/^          //' "$RUNNER_TEMP/expected-files"
          sort -o "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          cp "$RUNNER_TEMP/w11-semantic-repair.patch" "$RUNNER_TEMP/checkpoint/input.patch" || true
          cp "$RUNNER_TEMP/w11-semantic-repair-fix1.patch" "$RUNNER_TEMP/checkpoint/fix1.patch" || true
          for file in RUST_VERSION check.log clippy.log policy.log changed-files expected-files; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch input.patch fix1.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w11-semantic-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
      - name: Fast-forward exact checked product to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(w11): repair callable semantics and graph support [skip ci]'
          git push origin HEAD:main
