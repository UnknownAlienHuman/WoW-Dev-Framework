name: Apply function/table single-emission refactor

on:
  push:
    branches:
      - refactor/emit-functions-tables-once-2026-10-19

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply and validate refactor
        shell: bash
        run: |
          set -euo pipefail
          python .github/emit-functions-tables-once.py
          git rm .github/emit-functions-tables-once.py
          git rm .github/workflows/apply-functions-tables-once.yml
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked -p wow-annotations -p wow-reference-builder -p wow-service --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-annotations docs
          git commit -m "refactor: validate native declarations without trial renders"
          git push origin "HEAD:${GITHUB_REF_NAME}"
