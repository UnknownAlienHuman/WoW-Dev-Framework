name: E0 diagnostic guarded acceptance
on:
  push:
    branches: [main]
    paths:
      - .ci/e0-finding/**
      - .github/workflows/e0-finding-gate.yml
permissions:
  contents: read
concurrency:
  group: e0-finding-acceptance
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Admit exact reviewed patch and base tree
        run: |
          set -euo pipefail
          cat .ci/e0-finding/{00,01,02,03,04,05,06,07,08,09,10,11} > "$RUNNER_TEMP/finding.patch"
          echo "61e52cf2e2ca788ebad3d3d7f4a675b6b69ae3b4886441021c0b44500a5e1a53  $RUNNER_TEMP/finding.patch" | sha256sum -c -
          cp .ci/e0-finding/review-fix.patch "$RUNNER_TEMP/review-fix.patch"
          echo "9eb226aa0c1e7db0357f733458edd9dc722c1d4dd011abaa7e6c07e0a9698c25  $RUNNER_TEMP/review-fix.patch" | sha256sum -c -
          git rm -r .ci/e0-finding .github/workflows/e0-finding-gate.yml
          test "$(git write-tree)" = 3730dc8e9824d700d0665b71ba7de9c74625e118
          git apply --index --check "$RUNNER_TEMP/finding.patch"
          git apply --index "$RUNNER_TEMP/finding.patch"
          test "$(git write-tree)" = 4cf1bc71de3599a59403519a3f13c9c6874ebf42
          git apply --index --check "$RUNNER_TEMP/review-fix.patch"
          git apply --index "$RUNNER_TEMP/review-fix.patch"
          test "$(git write-tree)" = 1d5d6a8baa0a57f6794a214e2c373d84d1da61b2
      - name: Install and record stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          mkdir -p "$RUNNER_TEMP/finding-results"
          git rev-parse HEAD > "$RUNNER_TEMP/finding-results/BASE_SHA"
          rustc +stable -Vv > "$RUNNER_TEMP/finding-results/RUST_VERSION"
      - name: Format reviewed Rust and retain tested tree
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          git diff --exit-code -- . ':(exclude)crates/wow-core/src/finding.rs' ':(exclude)crates/wow-core/src/envelope.rs' ':(exclude)crates/wow-core/src/finding/admission.rs' ':(exclude)crates/wow-core/tests/e0_finding_conformance.rs' ':(exclude)crates/wow-core/tests/finding/*.rs'
          git add crates/wow-core/src/finding.rs crates/wow-core/src/envelope.rs crates/wow-core/src/finding/admission.rs crates/wow-core/tests/e0_finding_conformance.rs crates/wow-core/tests/finding/
          git diff --exit-code
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/finding-results/TREE_SHA"
      - name: Run all 26 diagnostic regressions
        run: |
          set -euo pipefail
          cargo +stable test --locked -p wow-core --test e0_finding_conformance -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/finding-results/finding-tests.txt"
          grep -F '26 passed; 0 failed' "$RUNNER_TEMP/finding-results/finding-tests.txt"
      - name: Prove eight negative controls against unchanged baseline
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          trap 'git checkout-index -a -f' EXIT
          for source in finding.rs envelope.rs; do
            git show "HEAD:crates/wow-core/src/$source" > "crates/wow-core/src/$source"
          done
          cases=(
            finding::arguments::message_arg_007_rejects_noncanonical_decimal_even_after_decoding
            finding::arguments::message_arg_008_paths_use_the_canonical_source_path_boundary
            finding::records::finding_bind_008_rejects_foreign_evidence_before_accepting_a_matching_id
            finding::records::finding_bind_009_validates_handle_content_before_registry_membership
            finding::records::finding_bind_010_validates_evidence_before_reading_confidence
            finding::records::finding_bind_013_retained_reference_sets_are_not_silently_repaired
            finding::records::finding_bind_014_decoded_remediation_requires_recipe_and_plan_reference
            finding::records::warning_007_resealed_subject_requires_pair_grammar_and_bounded_text
          )
          for index in "${!cases[@]}"; do
            case="${cases[$index]}"
            log="$RUNNER_TEMP/finding-results/baseline-$index.txt"
            set +e
            cargo +stable test --locked -p wow-core --test e0_finding_conformance "$case" -- --exact --test-threads=1 > "$log" 2>&1
            status=$?
            set -e
            test "$status" -eq 101
            grep -F 'running 1 test' "$log"
            grep -F "test $case ... FAILED" "$log"
            grep -F 'test result: FAILED. 0 passed; 1 failed' "$log"
          done
      - name: Repository policy and formatting
        run: |
          cargo +stable xtask check
          cargo +stable fmt --all --check
      - name: Locked workspace check
        run: cargo +stable check --locked --workspace --all-targets --all-features
      - name: Strict workspace Clippy
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Locked debug workspace tests
        run: cargo +stable test --locked --workspace --all-targets --all-features
      - name: Locked release workspace tests
        run: cargo +stable test --release --locked --workspace --all-targets --all-features
      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Verify retained bytes and export tested change
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/finding-results/TREE_SHA")"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/finding-results/verified.patch"
          cd "$RUNNER_TEMP/finding-results"
          sha256sum verified.patch > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e0-finding-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/finding-results/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-finding-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/finding-linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-finding-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/finding-windows
      - name: Publish identical tested trees only while main is unchanged
        run: |
          set -euo pipefail
          linux="$RUNNER_TEMP/finding-linux"
          windows="$RUNNER_TEMP/finding-windows"
          (cd "$linux" && sha256sum -c SHA256SUMS)
          (cd "$windows" && sha256sum -c SHA256SUMS)
          cmp "$linux/TREE_SHA" "$windows/TREE_SHA"
          cmp "$linux/BASE_SHA" "$windows/BASE_SHA"
          cmp "$linux/verified.patch" "$windows/verified.patch"
          test "$(cat "$linux/BASE_SHA")" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git apply --index --check "$linux/verified.patch"
          git apply --index "$linux/verified.patch"
          test "$(git write-tree)" = "$(cat "$linux/TREE_SHA")"
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(core): admit retained diagnostic registries before binding findings' -m "Continue R0-01 in wow-core. Share typed retained source/evidence admission across FindingDraft, Finding and WarningRecord, and reuse one registry in envelope validation. Enforce decoded reference sets, warning subjects, recipe/plan metadata and nonempty non-Candidate exact-edit evidence. Typed integers and paths require canonical spelling. Twenty-six conformance tests preserve golden bytes, exercise independently resealed mutations and 64 input permutations; eight baseline controls reproduce the defects. Linux and Windows locked workspace check, strict Clippy, debug/release tests, rustdoc, policy and formatting passed on this exact tree in acceptance run $GITHUB_RUN_ID. No dependency or fixture baseline changed. Temporary inputs are removed. Full E0-A/R0, source/coverage owner joins, actual producer provenance and recipe safety remain separate gates."
          git push origin HEAD:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
