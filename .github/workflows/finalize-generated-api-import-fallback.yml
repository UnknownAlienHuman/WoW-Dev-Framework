name: Finalize generated API import fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-generated-api-import-fallback.yml"

permissions:
  contents: write

concurrency:
  group: generated-api-main-writer
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat(wow-reference): publish generated API import') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Ensure import module is routed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lib = Path("crates/wow-reference/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          if "pub mod generated_api;" not in text:
              lib.write_text(text.rstrip() + "\n\npub mod generated_api;\n", encoding="utf-8")

          module = Path("crates/wow-reference/src/generated_api.rs")
          source = module.read_text(encoding="utf-8")
          marker = "#[cfg(test)]\nmod tests {"
          if "pub fn manifest_declared_digest(&self)" not in source:
              getters = '''
          impl GeneratedApiProvenance {
              #[must_use]
              pub fn manifest_declared_digest(&self) -> Option<&str> { self.manifest_declared_digest.as_deref() }
              #[must_use]
              pub fn source_id(&self) -> Option<&str> { self.source_id.as_deref() }
              #[must_use]
              pub const fn configuration(&self) -> &BTreeMap<String, Value> { &self.configuration }
          }
          impl GeneratedApiFact {
              #[must_use]
              pub fn literal_name(&self) -> Option<&str> { self.literal_name.as_deref() }
              #[must_use]
              pub fn documentation(&self) -> &[Box<str>] { &self.documentation }
              #[must_use]
              pub const fn attributes(&self) -> &BTreeMap<String, Value> { &self.attributes }
              #[must_use]
              pub fn arguments(&self) -> &[Value] { &self.arguments }
              #[must_use]
              pub fn returns(&self) -> &[Value] { &self.returns }
              #[must_use]
              pub fn payload(&self) -> &[Value] { &self.payload }
              #[must_use]
              pub fn fields(&self) -> &[Value] { &self.fields }
              #[must_use]
              pub fn values(&self) -> &[Value] { &self.values }
          }
          impl GeneratedApiConflict {
              #[must_use]
              pub fn collection(&self) -> &str { &self.collection }
              #[must_use]
              pub fn sources(&self) -> &[GeneratedApiConflictSource] { &self.sources }
          }
          impl GeneratedApiConflictSource {
              #[must_use]
              pub fn path(&self) -> &str { &self.path }
              #[must_use]
              pub const fn line_start(&self) -> u64 { self.line_start }
          }
          impl GeneratedApiCoverage {
              #[must_use]
              pub fn parsed_paths(&self) -> &[Box<str>] { &self.parsed_paths }
              #[must_use]
              pub fn failures(&self) -> &[GeneratedApiFailure] { &self.failures }
              #[must_use]
              pub const fn entity_counts(&self) -> &BTreeMap<Box<str>, u64> { &self.entity_counts }
              #[must_use]
              pub fn limitations(&self) -> &[Box<str>] { &self.limitations }
          }
          impl GeneratedApiFailure {
              #[must_use]
              pub fn code(&self) -> &str { &self.code }
              #[must_use]
              pub fn message(&self) -> &str { &self.message }
              #[must_use]
              pub fn path(&self) -> Option<&str> { self.path.as_deref() }
          }

          '''
              getters = "\n".join(line[10:] if line.startswith("          ") else line for line in getters.splitlines()) + "\n"
              if marker not in source:
                  raise SystemExit("generated_api test marker not found")
              module.write_text(source.replace(marker, getters + marker, 1), encoding="utf-8")

          for obsolete in (
              ".github/workflows/finalize-current-source-skill.yml",
              ".github/workflows/finalize-generated-api-import.yml",
              ".github/workflows/export-current-main.yml",
              ".github/workflows/i0-a-export-current-tree.yml",
          ):
              Path(obsolete).unlink(missing_ok=True)
          PY
      - name: Apply compiler-supported fixes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fix --workspace --all-targets --allow-dirty --allow-staged || true
          cargo clippy --fix --workspace --all-targets --all-features --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
      - name: Validate complete package
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/wow_api_reference.py scripts/build-blizzard-api-reference.py scripts/verify-blizzard-api-reference.py tests/test_blizzard_api_reference.py
          python -m unittest -v tests/test_blizzard_api_reference.py
          python scripts/sync-wow-dev-skill.py --check
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
          if grep -RIlE 'wow-addon-engineering-kb|UnknownAlienHuman/wow-addon-engineering-kb|WoW Addon Engineering KB' --exclude-dir=.git --exclude-dir=target .; then
            echo 'operator-only provider identity leaked into public tree' >&2
            exit 1
          fi
      - name: Publish validated package
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-generated-api-import-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(wow-reference): publish generated API import"
          git pull --rebase origin main
          git push origin HEAD:main
