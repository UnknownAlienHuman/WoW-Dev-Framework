name: W11 semantic evidence closure checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w11-semantic-evidence-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: w11-semantic-evidence-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STAGING_PARENT: afe40b6158a4ca8cb870294abf15df73f1430a05
      BASE_COMMIT: e491f2201f4955d80bc71a84773c2a8c46f2c6c0
      BASE_TREE: e167b05210d513a0f9155cbf25193fdbdd2d7ca5
      XZ_SHA256: 6bdb79762f769556e9c1c5605351c9eb49cca1650824039eb3c13db1e0ce636d
      PATCH_SHA256: 495c18cd710cf25549f885aa3f51ec9c05b9367292984a6873475d0817d59ef0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Admit exact semantic-evidence patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$STAGING_PARENT"
          cp .ci/w11-semantic-evidence.patch.xz.b64 "$RUNNER_TEMP/w11-semantic-evidence.patch.xz"
          printf '%s  %s\n' "$XZ_SHA256" "$RUNNER_TEMP/w11-semantic-evidence.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/w11-semantic-evidence.patch.xz" > "$RUNNER_TEMP/w11-semantic-evidence.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w11-semantic-evidence.patch" | sha256sum -c -
          git rm -- \
            .ci/w11-semantic-evidence.patch.xz.b64 \
            .github/workflows/w11-semantic-evidence-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w11-semantic-evidence.patch"
      - name: Install compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Check affected chain
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable check --locked \
            -p wow-emmy -p wow-project -p wow-recognizers -p wow-service -p wow-cli \
            --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Strict affected-chain Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable clippy --locked \
            -p wow-emmy -p wow-project -p wow-recognizers -p wow-service -p wow-cli \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          git diff --cached --name-only "$BASE_COMMIT" | sort > "$RUNNER_TEMP/changed-files"
          cat > "$RUNNER_TEMP/expected-files" <<'FILES'
          crates/wow-recognizers/src/source_bridge.rs
          crates/wow-recognizers/src/source_scripts.rs
          crates/wow-recognizers/src/source_signals.rs
          docs/IMPLEMENTATION_STATUS.md
          docs/PROJECT_COMPLETION_MATRIX.md
          FILES
          sed -i 's/^          //' "$RUNNER_TEMP/expected-files"
          sort -o "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          if test -f "$RUNNER_TEMP/w11-semantic-evidence.patch"; then
            cp "$RUNNER_TEMP/w11-semantic-evidence.patch" "$RUNNER_TEMP/checkpoint/input.patch"
          fi
          for file in RUST_VERSION check.log clippy.log policy.log changed-files expected-files; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w11-semantic-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
      - name: Fast-forward exact checked product to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(w11): close receiver and evidence gaps [skip ci]'
          git push origin HEAD:main
