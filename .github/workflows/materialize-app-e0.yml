name: Materialize one-shot wow CLI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-app-e0.yml

permissions:
  contents: write

concurrency:
  group: materialize-app-e0
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Materialize staged application
        run: |
          set -euo pipefail
          test "$(find .ci/materialize/app-e0 -type f | wc -l)" -eq 6
          mkdir -p apps/wow/src apps/wow/tests
          cp .ci/materialize/app-e0/Cargo.toml apps/wow/Cargo.toml
          cp .ci/materialize/app-e0/README.md apps/wow/README.md
          cp .ci/materialize/app-e0/IMPLEMENTATION_STATUS.md apps/wow/IMPLEMENTATION_STATUS.md
          cp .ci/materialize/app-e0/src/*.rs apps/wow/src/
          cp .ci/materialize/app-e0/tests/*.rs apps/wow/tests/
          python3 - <<'PY'
          from pathlib import Path
          import re

          cargo = Path('Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          if '"apps/wow"' not in text:
              marker = '    "crates/wow-service",\n'
              if marker not in text:
                  raise SystemExit('wow-service workspace marker missing')
              text = text.replace(marker, marker + '    "apps/wow",\n')
              cargo.write_text(text, encoding='utf-8')

          model = Path('crates/wow-rules/src/model.rs')
          text = model.read_text(encoding='utf-8')
          text = text.replace('use serde::Serialize;', 'use serde::{Deserialize, Serialize};')
          targets = {
              'CoverageState', 'AnalyzerResolution', 'ApiPresence', 'ValueRestriction',
              'OperationKind', 'ByteSpan', 'SourceLocation', 'ApiCallObservation',
              'BindingObservation', 'OperationObservation', 'AccessGuardObservation',
              'DominanceObservation', 'ReferenceApiEvidence', 'RuleEvaluationInput',
          }
          lines = text.splitlines()
          for index, line in enumerate(lines):
              match = re.match(r'pub (?:enum|struct) ([A-Za-z0-9_]+)', line)
              if match is None or match.group(1) not in targets:
                  continue
              for derive_index in range(index - 1, max(-1, index - 5), -1):
                  if lines[derive_index].startswith('#[derive('):
                      if 'Deserialize' not in lines[derive_index]:
                          lines[derive_index] = lines[derive_index].replace(
                              'Serialize', 'Deserialize, Serialize', 1
                          )
                      break
              else:
                  raise SystemExit(f'missing derive for {match.group(1)}')
          model.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Resolve lockfile and apply machine-safe formatting
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable clippy --fix --package wow-cli --all-targets --all-features --allow-dirty --allow-staged -- -D warnings
          cargo +stable fmt --all
      - name: Run release-grade workspace and binary gate
        run: |
          set -euo pipefail
          cargo +stable xtask check
          cargo +stable fmt --all --check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable test --locked --workspace --all-targets --all-features
          cargo +stable test --release --locked --package wow-cli --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          cargo +stable build --release --locked --bin wow
          ./target/release/wow operations > "$RUNNER_TEMP/wow-operations.json"
          python3 - "$RUNNER_TEMP/wow-operations.json" <<'PY'
          import json
          import sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          assert value['schema'] == 'wow-cli/operations/1'
          assert value['operations'][0]['operation_id'] == 'rules.evaluate'
          assert value['operations'][0]['version'] == 1
          PY
          git diff --check
      - name: Commit verified application and remove staging machinery
        run: |
          set -euo pipefail
          rm -rf .ci/materialize/app-e0
          rm .github/workflows/materialize-app-e0.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A Cargo.toml Cargo.lock crates/wow-rules/src/model.rs apps/wow .ci/materialize/app-e0 .github/workflows/materialize-app-e0.yml
          git diff --cached --check
          git commit -m 'feat(app): activate bounded one-shot wow CLI'
          git push origin HEAD:main
