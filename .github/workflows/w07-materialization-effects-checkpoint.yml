name: W07 publish checked durable filesystem effects
run-name: W07 publish materialization effects ${{ github.sha }}
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: w07-durable-reference-pack-filesystem-effects
  cancel-in-progress: false
env:
  STAGING_PARENT: 342cf3a59a87d256fb22f7c9bce7a934a206e23d
  ARTIFACT_ID: 11142430818
  ARTIFACT_ZIP_SHA256: 7cdb818acc53b27b2915db4c4749ebf3ff0c5a2a0db9e931345010cee2765c9e
  SOURCE_TAR_SHA256: 99ddd1ea530fcb20d6106bbefff6973b93cb50e816d7b253f560132982fdd872
  CHECKED_TREE: f8daa018f0aa85a45e2333074d1744bba3e8b728
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Recover checked product files and fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          mkdir -p "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/source"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/artifact.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/artifact.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/artifact"
          test "$(cat "$RUNNER_TEMP/artifact/CHECKED_TREE")" = "$CHECKED_TREE"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$RUNNER_TEMP/artifact/checked-source.tar" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/artifact/checked-source.tar" -C "$RUNNER_TEMP/source"

          files=(
            apps/wow-reference-builder/CONTRACT.json
            apps/wow-reference-builder/README.md
            apps/wow-reference-builder/src/lib.rs
            crates/wow-service/src/lib.rs
            crates/wow-service/src/reference_pack_materialization.rs
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            cp "$RUNNER_TEMP/source/$path" "$path"
          done
          git add -- "${files[@]}"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(app): journal Reference Pack filesystem effects [skip ci]' \
            -m 'W07 durable-effect slice. Materialization now records exact staging, backup, install, validation, cleanup and rollback checkpoints; restart reconciliation observes output/staging/backup before any retry and preserves ambiguous states for operator review. Selected wow-service/wow-reference-builder Clippy and repository policy passed on Linux with Rust 1.98.1; no tests executed.'
          git push origin HEAD:main
