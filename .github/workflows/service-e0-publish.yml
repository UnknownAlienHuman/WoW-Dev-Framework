name: Gate and publish wow-service E0-F

on:
  push:
    branches:
      - work/service-e0
    paths:
      - .github/workflows/service-e0-publish.yml

permissions:
  contents: write

concurrency:
  group: publish-service-e0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Converge source and documentation state
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('Cargo.toml')
          text = root.read_text()
          member = '    "crates/wow-service",\n'
          if member not in text:
              anchor = '    "crates/wow-rules",\n'
              if anchor not in text:
                  raise SystemExit('workspace member anchor not found')
              root.write_text(text.replace(anchor, anchor + member, 1))

          lib = Path('crates/wow-service/src/lib.rs')
          text = lib.read_text()
          text = text.replace(
              'pub use backend::{OwnedServiceBackend, ServiceBackend};',
              'pub use backend::{OwnedServiceBackend, ServiceBackend, ServiceBackendStatus};',
          )
          if 'RuleBlocker,' not in text:
              text = text.replace(
                  '    RuleEvaluation, RuleEvaluationState, RuleFinding, ServiceSemanticStatus, StatusRequest,',
                  '    RuleBlocker, RuleEvaluation, RuleEvaluationState, RuleFinding, ServiceSemanticStatus,\n    StatusRequest,',
              )
          lib.write_text(text)

          service = Path('crates/wow-service/src/service.rs')
          text = service.read_text().replace('let mut context = self', 'let context = self')
          private_sort = re.compile(
              r'\n        context\n            \.components\n            \.sort_by\(\|left, right\| left\.component_id\(\)\.cmp\(right\.component_id\(\)\)\);\n'
              r'        context\n            \.rule_evaluations\n            \.sort_by\(\|left, right\| left\.evaluation_id\(\)\.cmp\(right\.evaluation_id\(\)\)\);\n'
          )
          if private_sort.search(text):
              text = private_sort.sub(
                  '\n        let mut components = context.components().to_vec();\n'
                  '        components.sort_by(|left, right| left.component_id().cmp(right.component_id()));\n'
                  '        let mut rule_evaluations = context.rule_evaluations().to_vec();\n'
                  '        rule_evaluations.sort_by(|left, right| left.evaluation_id().cmp(right.evaluation_id()));\n',
                  text,
                  count=1,
              )
          text = text.replace('components: context.components(),', 'components: &components,')
          text = text.replace('rule_evaluations: context.rule_evaluations(),', 'rule_evaluations: &rule_evaluations,')
          text = text.replace('components: context.components().to_vec(),', 'components,')
          text = text.replace('rule_evaluations: context.rule_evaluations().to_vec(),', 'rule_evaluations,')
          service.write_text(text)

          agents = Path('crates/wow-service/AGENTS.md')
          text = agents.read_text()
          text = text.replace(
              'planned service documentation: complete through E7-B\nservice implementation: not started\nfirst service implementation package: I0-F / E0-F\nrepository next package: I0-A / wow-core E0-A',
              'planned service documentation: complete through E7-B\nservice implementation: E0-F active\nactive operations: status and check\nnext service package: E1-D after prerequisite owner packages',
          )
          agents.write_text(text)

          overview = Path('crates/wow-service/E0_F_OVERVIEW.md')
          text = overview.read_text()
          text = text.replace(
              '**Status:** E0-F implementation-ready contract; no Rust code yet. Only `status` and `check` activate in E0.',
              '**Status:** E0-F implemented and active. Only `status` and `check` are available in E0.',
          )
          text = text.replace('- No `Cargo.toml` or Rust source in this documentation phase.\n', '')
          text = text.replace('- No CI.\n', '')
          overview.write_text(text)

          contract = Path('crates/wow-service/CONTRACT.json')
          text = contract.read_text()
          text = text.replace(
              '"state": "implementation-ready-documentation-no-rust-code"',
              '"state": "implemented-e0-f-active"',
          )
          contract.write_text(text)
          PY
          if git apply --check .ci/service-e0/fix-01.patch; then
            git apply .ci/service-e0/fix-01.patch
          elif git apply --reverse --check .ci/service-e0/fix-01.patch; then
            echo 'reviewed service patch already applied'
          else
            echo 'reviewed service patch cannot be applied or recognized' >&2
            exit 1
          fi
          rm -rf .ci/service-e0
          rm -f .github/workflows/export-service-fragments.yml
          rm -f .github/workflows/materialize-service-e0.yml
          rm -f .github/workflows/service-e0-converge.yml
          rm -f .github/workflows/service-e0-finalize.yml
          rm -f .github/workflows/service-e0-finalize2.yml
          rm -f .github/workflows/service-e0-publish.yml
      - name: Run native policy and full workspace gate
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable test --workspace --all-targets --all-features
          cargo +stable test --release --workspace --all-targets --all-features
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Publish one verified commit to branch and main
        run: |
          set -euo pipefail
          git fetch origin main
          expected_main=d64ef927aca2322ce591391d29f099251be7983a
          actual_main="$(git rev-parse origin/main)"
          test "$actual_main" = "$expected_main" || {
            echo "main advanced from $expected_main to $actual_main; refusing unverified rebase" >&2
            exit 1
          }
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git add -A
          git diff --cached --check
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'feat(service): implement exact E0-F status and check operations' \
            'Activate the transport-neutral status/check service boundary with exact context acquisition, idempotent operation replay, conservative semantic status, raw-finding preservation, structured presentation, explicit deferred operations, canonical envelopes, and the closed E0 acceptance matrix.' \
            | git commit-tree "$tree" -p "$actual_main")"
          git push --force-with-lease=refs/heads/work/service-e0:$(git rev-parse origin/work/service-e0) origin "$commit":refs/heads/work/service-e0
          git push origin "$commit":refs/heads/main
