name: W11 Mixin assignment checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w11-mixin-assignment-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: w11-mixin-assignment-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_COMMIT: 3c325dede57cb2318ad33caa044ad00025beffbf
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Assemble and apply verified product patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          cat .github/w11-mixin-assignment/payload.0* | tr -d '\n' > "$RUNNER_TEMP/w11-patch.zlib.b64"
          test "$(wc -c < "$RUNNER_TEMP/w11-patch.zlib.b64")" = "17124"
          echo "4a4a4f76acec44e43fe5e632e107a86c1d2c1b1fc02017d28a96a40d25f3459e  $RUNNER_TEMP/w11-patch.zlib.b64" | sha256sum -c -
          python3 -c 'import base64,sys,zlib; sys.stdout.buffer.write(zlib.decompress(base64.b64decode(sys.stdin.buffer.read())))' \
            < "$RUNNER_TEMP/w11-patch.zlib.b64" > "$RUNNER_TEMP/w11-patch.py"
          echo "518ecd7d033d4d20267edfff4fb658b3fe3a8fc60423f1c7824a8132c35ee7ca  $RUNNER_TEMP/w11-patch.py" | sha256sum -c -
          git rm -r -- .github/w11-mixin-assignment .github/workflows/w11-mixin-assignment-checkpoint.yml
          python3 "$RUNNER_TEMP/w11-patch.py"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/wow-service/src/graph/build/lua_mixins.rs")
          text = path.read_text()
          publish = "\npub(super) fn publish("
          alias = """
type MixinMaps = (
    Vec<MixinInstanceNode>,
    Vec<InstantiationEdge>,
    Vec<ConstructionMixinEdge>,
    Vec<AssignmentMixinEdge>,
);

pub(super) fn publish("""
          if text.count(publish) != 1:
              raise SystemExit("unexpected lua_mixins publish marker")
          text = text.replace(publish, alias, 1)
          pattern = re.compile(
              r"\) -> ServiceResult<\(\s*"
              r"Vec<MixinInstanceNode>,\s*"
              r"Vec<InstantiationEdge>,\s*"
              r"Vec<ConstructionMixinEdge>,\s*"
              r"Vec<AssignmentMixinEdge>,\s*"
              r"\)> \{"
          )
          text, count = pattern.subn(") -> ServiceResult<MixinMaps> {", text, count=1)
          if count != 1:
              raise SystemExit("unexpected lua_mixins maps return shape")
          path.write_text(text)
          PY
      - name: Install compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Strict affected-chain Clippy
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked \
            -p wow-graph -p wow-project -p wow-recognizers -p wow-service -p wow-cli \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact product boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          git diff --cached --name-only "$BASE_COMMIT" | sort > "$RUNNER_TEMP/changed-files"
          cat > "$RUNNER_TEMP/expected-files" <<'FILES'
          crates/wow-project/src/graph.rs
          crates/wow-recognizers/src/source_mixins.rs
          crates/wow-service/src/graph/build.rs
          crates/wow-service/src/graph/build/lua_mixins.rs
          crates/wow-service/src/graph/bundle.rs
          FILES
          sed -i 's/^          //' "$RUNNER_TEMP/expected-files"
          sort -o "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log changed-files expected-files; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w11-mixin-assignment-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
      - name: Publish exact checked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(wow-recognizers): publish Mixin assignment slice [skip ci]'
          git push origin HEAD:main
