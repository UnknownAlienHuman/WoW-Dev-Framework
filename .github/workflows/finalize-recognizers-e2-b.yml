name: Finalize recognizers E2-B

on:
  push:
    branches:
      - work/recognizers-e2-b-v2

permissions:
  contents: write

concurrency:
  group: finalize-recognizers-e2-b
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Prepare final tree
        run: |
          set -euo pipefail
          python3 .ci/recognizers-e2-b/fix.py
          python3 .ci/recognizers-e2-b/fix-tests.py
          rm -rf .ci/recognizers-e2-b
          rm .github/workflows/finalize-recognizers-e2-b.yml
          cargo +stable fmt --all
          cargo +stable generate-lockfile
          git add -A
          git diff --cached --check
      - name: Verify E2-B and workspace
        run: |
          set -euo pipefail
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable test --locked --package wow-recognizers --all-targets --all-features -- --nocapture
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+UnknownAlienHuman@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(recognizers): implement bounded E2-B matcher core'
          git push origin HEAD:work/recognizers-e2-b-v2
