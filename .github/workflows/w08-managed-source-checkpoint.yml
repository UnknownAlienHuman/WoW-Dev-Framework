name: W08 publish checked managed source materialization
run-name: W08 publish managed source ${{ github.sha }}
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: w08-managed-source-materialization
  cancel-in-progress: false
env:
  BASE_COMMIT: 5eff9208a64381a36e42c7cd5e4ce0cb4546cfce
  STAGING_PARENT: 0ef7991762521fbf3018e80925940e612074eb94
  ARTIFACT_ID: '11143687389'
  ARTIFACT_ZIP_SHA256: 62e7673f3446857f5d7bf5424de540a4d4067ae769af9adb2156debf7247afc1
  SOURCE_TAR_SHA256: ca2e113695ba8495483a588b7b7566d9f5e3bc5f42bee6635bc58676c27d0e49
  CHECKED_TREE: 188c6fe15034a5af03561600034350fe13c3d02d
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Recover exact checked source and fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          mkdir -p "$RUNNER_TEMP/checked"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/checked.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/checked.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/checked.zip" -d "$RUNNER_TEMP/checked"
          test "$(cat "$RUNNER_TEMP/checked/CHECKED_TREE")" = "$CHECKED_TREE"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$RUNNER_TEMP/checked/checked-source.tar" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/checked/checked-source.tar" -C .
          git rm -- .ci/w08-managed-source.patch.xz.b64.* .github/workflows/w08-managed-source-checkpoint.yml
          git add --all
          git diff --cached --check
          test "$(git write-tree)" = "$CHECKED_TREE"
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          expected="$(cat <<'FILES'
          docs/SOURCE_MATERIALIZATION.md
          tools/xtask/README.md
          tools/xtask/src/main.rs
          tools/xtask/src/manifest.rs
          tools/xtask/src/repository.rs
          tools/xtask/src/source_update/lock.rs
          tools/xtask/src/source_update/materialize.rs
          tools/xtask/src/source_update/mod.rs
          FILES
          )"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(xtask): materialize managed source snapshots [skip ci]' \
            -m 'Add exact auto/prompt/never plans, managed clone and guarded update reuse, immutable manifest publication, durable receipts and restart reconciliation. Strict xtask Clippy and repository policy passed; no tests executed.'
          git push origin HEAD:main
