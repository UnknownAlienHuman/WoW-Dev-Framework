name: W08 managed source materialization checkpoint
run-name: W08 managed source checkpoint v2 ${{ github.sha }}
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: w08-managed-source-materialization
  cancel-in-progress: false
env:
  BASE_COMMIT: 5eff9208a64381a36e42c7cd5e4ce0cb4546cfce
  BASE_TREE: f8daa018f0aa85a45e2333074d1744bba3e8b728
  STAGING_PARENT: 6547b32cfdaa13f72f8245598bb0ceed8e8263bb
  PATCH_SHA256: d3d0f4089806d37fcf3b6894020a5f348b4faeaeeafc6507dc367db0a6705994
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit corrected product patch and remove checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          cat .ci/w08-managed-source.patch.xz.b64.* > "$RUNNER_TEMP/w08.patch.xz.b64"
          base64 -d "$RUNNER_TEMP/w08.patch.xz.b64" > "$RUNNER_TEMP/w08.patch.xz"
          xz -dc "$RUNNER_TEMP/w08.patch.xz" > "$RUNNER_TEMP/w08.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w08.patch" | sha256sum -c -
          git rm -- .ci/w08-managed-source.patch.xz.b64.* .github/workflows/w08-managed-source-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w08.patch"
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/xtask/src/source_update/mod.rs')
          source = path.read_text()
          old = 'pub(super) fn update_selected('
          if source.count(old) != 1:
              raise SystemExit('update_selected visibility source changed')
          path.write_text(source.replace(old, 'fn update_selected(', 1))
          PY
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Minimal xtask Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked -p xtask --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          expected="$(cat <<'FILES'
          docs/SOURCE_MATERIALIZATION.md
          tools/xtask/README.md
          tools/xtask/src/main.rs
          tools/xtask/src/manifest.rs
          tools/xtask/src/repository.rs
          tools/xtask/src/source_update/lock.rs
          tools/xtask/src/source_update/materialize.rs
          tools/xtask/src/source_update/mod.rs
          FILES
          )"
          test "$actual" = "$expected"
          ! grep -R "todo!()\|unimplemented!()" tools/xtask/src/source_update/materialize.rs
          grep -Fq 'wow-source-materialization-request/1' tools/xtask/src/source_update/materialize.rs
          grep -Fq 'operator_review_before_any_retry' tools/xtask/src/source_update/materialize.rs
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w08-managed-source-materialization-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
