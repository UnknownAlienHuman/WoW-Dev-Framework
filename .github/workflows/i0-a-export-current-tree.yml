name: I0-A export recovered branch

on:
  push:
    branches:
      - impl/i0-a-wow-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Package exact tracked tree
        shell: bash
        run: |
          git ls-files -z | tar --null -T - -czf i0-a-recovered-tree.tar.gz
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: i0-a-recovered-tree
          path: i0-a-recovered-tree.tar.gz
          retention-days: 1
          if-no-files-found: error
