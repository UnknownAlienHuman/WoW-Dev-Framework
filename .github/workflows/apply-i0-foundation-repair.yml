name: Apply I0 foundation repair

on:
  push:
    branches:
      - repair/i0-foundation-integrity
    paths:
      - .github/repair-payload/**
      - .github/repair-i0.py
      - .github/fix-generated-backslash.py
      - .github/fix-message-fingerprint.py
      - .github/fix-canonical-order.py
      - .github/fix-repository-policy.py
      - .github/workflows/apply-i0-foundation-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-i0-foundation-repair
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6.0.2
        with:
          ref: repair/i0-foundation-integrity
          fetch-depth: 0
          persist-credentials: true

      - name: Integrate current main tip
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-edit origin/main

      - name: Reconstruct verified repair tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/repair-payload/part-*.b64 | base64 --decode > /tmp/i0-foundation-repair.tar.zst
          echo "70b97ea22f138f629464c46855687bb0f1187546c1c19d1057cf2a038e1961b8  /tmp/i0-foundation-repair.tar.zst" | sha256sum --check --strict
          zstd --decompress --stdout /tmp/i0-foundation-repair.tar.zst | tar --extract --file=- --directory="$GITHUB_WORKSPACE"

      - name: Apply deterministic source repair
        run: |
          python3 .github/repair-i0.py
          python3 .github/fix-generated-backslash.py
          python3 .github/fix-message-fingerprint.py
          python3 .github/fix-canonical-order.py
          python3 .github/fix-repository-policy.py

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Format repaired tree
        run: cargo +1.98.0 fmt --all

      - name: Verify dependency lock
        run: |
          cargo +1.98.0 generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Check lints
        run: cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run debug tests
        run: cargo +1.98.0 test --locked --workspace --all-features

      - name: Run release tests
        run: cargo +1.98.0 test --locked --workspace --all-features --release

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.98.0 doc --locked --workspace --all-features --no-deps

      - name: Package failed candidate for exact audit
        if: failure()
        shell: bash
        run: tar --exclude=.git --exclude=target -czf /tmp/i0-foundation-failed-tree.tar.gz .

      - name: Upload failed candidate for exact audit
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: i0-foundation-failed-tree
          path: /tmp/i0-foundation-failed-tree.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Commit validated repair to main and remove repair branches
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/repair-payload
          rm -f .github/repair-i0.py
          rm -f .github/fix-generated-backslash.py
          rm -f .github/fix-message-fingerprint.py
          rm -f .github/fix-canonical-order.py
          rm -f .github/fix-repository-policy.py
          rm -f .github/workflows/apply-i0-foundation-repair.yml
          rm -f .github/workflows/export-i0-c-dev-inputs.yml
          rm -f .github/workflows/i0-b-export.yml
          rm -f .github/workflows/i0-foundation.yml
          git add -A
          git commit -m "fix(wow-core): restore executable E0 foundation"
          git push origin HEAD:main
          git push origin --delete repair/i0-foundation-integrity
          git push origin --delete impl/i0-c-wow-emmy-adapter || true
