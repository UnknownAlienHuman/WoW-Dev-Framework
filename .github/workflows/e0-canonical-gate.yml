name: E0 canonical guarded acceptance
on:
  push:
    branches: [main]
    paths:
      - .ci/e0-canonical/**
      - .github/workflows/e0-canonical-gate.yml
permissions:
  contents: read
concurrency:
  group: e0-canonical-acceptance
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Admit exact reviewed bytes and base tree
        run: |
          set -euo pipefail
          cat .ci/e0-canonical/00 .ci/e0-canonical/01 .ci/e0-canonical/02 > "$RUNNER_TEMP/canonical.patch.gz"
          echo "080432dec277db092234d82242475ff24a84a38d2010b15fd9fe7e0e2c8dbf70  $RUNNER_TEMP/canonical.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/canonical.patch.gz" > "$RUNNER_TEMP/canonical.patch"
          echo "d71a95a20c5255757e2a217529bca5879d7967d589e44278f9a725b280f4815d  $RUNNER_TEMP/canonical.patch" | sha256sum -c -
          cp .ci/e0-canonical/correction.patch "$RUNNER_TEMP/canonical-correction.patch"
          echo "763796ca08f56ff335de74682bad1fd03ac3022244516a3e3379c6a595850418  $RUNNER_TEMP/canonical-correction.patch" | sha256sum -c -
          cp .ci/e0-canonical/number-correction.patch "$RUNNER_TEMP/number-correction.patch"
          echo "fba3f3bcaf27921b86dd8dbc251eaa15c43d894ae567279da0c19b760cc3f004  $RUNNER_TEMP/number-correction.patch" | sha256sum -c -
          git rm -r .ci/e0-canonical .github/workflows/e0-canonical-gate.yml
          test "$(git write-tree)" = f219bf119468e974f4ec4fd59f5d73f2be565cf9
          git apply --index --check "$RUNNER_TEMP/canonical.patch"
          git apply --index "$RUNNER_TEMP/canonical.patch"
          test "$(git write-tree)" = 163612e04f9f429d584e6955b2ddd2228b34eefa
          git apply --index --check "$RUNNER_TEMP/canonical-correction.patch"
          git apply --index "$RUNNER_TEMP/canonical-correction.patch"
          test "$(git write-tree)" = c394273255c711fe0ee570036d40d1729f68b0a2
          git apply --index --check "$RUNNER_TEMP/number-correction.patch"
          git apply --index "$RUNNER_TEMP/number-correction.patch"
          test "$(git write-tree)" = 4fae22401a512b62354be0db8a6a5007b9296405
      - name: Install and record current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          mkdir -p "$RUNNER_TEMP/canonical-results"
          git rev-parse HEAD > "$RUNNER_TEMP/canonical-results/BASE_SHA"
          rustc +stable -Vv > "$RUNNER_TEMP/canonical-results/RUST_VERSION"
      - name: Format reviewed Rust and retain tested tree
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          git diff --exit-code -- . ':(exclude)crates/wow-core/src/canonical.rs' ':(exclude)crates/wow-core/src/canonical/admission.rs' ':(exclude)crates/wow-core/tests/e0_canonical_conformance.rs' ':(exclude)crates/wow-core/tests/canonical/admission.rs'
          git add crates/wow-core/src/canonical.rs crates/wow-core/src/canonical/admission.rs crates/wow-core/tests/e0_canonical_conformance.rs crates/wow-core/tests/canonical/admission.rs
          git diff --exit-code
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/canonical-results/TREE_SHA"
      - name: Run all 19 canonical regressions with core features
        run: |
          set -euo pipefail
          cargo +stable test --locked -p wow-core --test e0_canonical_conformance -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/canonical-results/core-tests.txt"
          grep -F '19 passed; 0 failed' "$RUNNER_TEMP/canonical-results/core-tests.txt"
      - name: Verify the feature-unified exact-number protocol
        run: |
          set -euo pipefail
          cargo +stable test --locked -p wow-core --features serde_json/arbitrary_precision --test e0_canonical_conformance -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/canonical-results/number-feature-tests.txt"
          grep -F '19 passed; 0 failed' "$RUNNER_TEMP/canonical-results/number-feature-tests.txt"
      - name: Prove five negative controls against unchanged owner code
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          trap 'git checkout-index -f -- crates/wow-core/src/canonical.rs' EXIT
          git show HEAD:crates/wow-core/src/canonical.rs > crates/wow-core/src/canonical.rs
          cases=(
            admission::canonical_001_duplicate_map_keys_never_collapse_even_when_values_match
            admission::canonical_003_flattened_fields_cannot_overwrite_declared_fields
            admission::canonical_004_json_key_spelling_collisions_reject_before_hashing
            admission::canonical_005_duplicate_struct_fields_reject_without_last_value_wins
            admission::canonical_006_custom_serializer_errors_do_not_echo_source_payloads
          )
          for index in "${!cases[@]}"; do
            case="${cases[$index]}"
            log="$RUNNER_TEMP/canonical-results/baseline-$index.txt"
            set +e
            cargo +stable test --locked -p wow-core --test e0_canonical_conformance "$case" -- --exact --test-threads=1 > "$log" 2>&1
            status=$?
            set -e
            test "$status" -eq 101
            grep -F 'running 1 test' "$log"
            grep -F "test $case ... FAILED" "$log"
            grep -F 'test result: FAILED. 0 passed; 1 failed' "$log"
          done
      - name: Repository policy and formatting
        run: |
          cargo +stable xtask check
          cargo +stable fmt --all --check
      - name: Locked workspace check
        run: cargo +stable check --locked --workspace --all-targets --all-features
      - name: Strict workspace Clippy
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Locked debug workspace tests
        run: cargo +stable test --locked --workspace --all-targets --all-features
      - name: Locked release workspace tests
        run: cargo +stable test --release --locked --workspace --all-targets --all-features
      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Verify retained bytes and export tested change
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/canonical-results/TREE_SHA")"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/canonical-results/verified.patch"
          cd "$RUNNER_TEMP/canonical-results"
          sha256sum verified.patch > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e0-canonical-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/canonical-results/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-canonical-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/canonical-linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-canonical-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/canonical-windows
      - name: Publish identical tested trees only while main is unchanged
        run: |
          set -euo pipefail
          linux="$RUNNER_TEMP/canonical-linux"
          windows="$RUNNER_TEMP/canonical-windows"
          (cd "$linux" && sha256sum -c SHA256SUMS)
          (cd "$windows" && sha256sum -c SHA256SUMS)
          cmp "$linux/TREE_SHA" "$windows/TREE_SHA"
          cmp "$linux/BASE_SHA" "$windows/BASE_SHA"
          cmp "$linux/verified.patch" "$windows/verified.patch"
          test "$(cat "$linux/BASE_SHA")" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git apply --index --check "$linux/verified.patch"
          git apply --index "$linux/verified.patch"
          test "$(git write-tree)" = "$(cat "$linux/TREE_SHA")"
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(core): reject lossy canonical serialization before hashing' -m "Continue R0-01 in wow-core. Admit serialized object entries before projection or hashing, reject duplicate map/struct/flatten keys and JSON-key collisions, and keep caller-controlled serializer error prose out of public errors. Preserve exact unsigned numbers, enum/container representations and canonical golden identities, including the workspace-unified arbitrary_precision Number protocol. Nineteen conformance tests run with both feature profiles; five negative controls reproduce baseline defects. Linux and Windows locked workspace check, strict Clippy, debug/release tests, rustdoc, policy and formatting passed on this exact tree in acceptance run $GITHUB_RUN_ID. No dependency or fixture baseline changed. Temporary inputs are removed. Full E0-A/R0, raw JSON decoding bounds/duplicate admission and source provenance remain separate gates."
          git push origin HEAD:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
