name: Apply direct core coverage test fix

on:
  push:
    branches:
      - refactor/remove-core-e0-envelopes-2026-10-18

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply direct coverage test fix
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_core_coverage_tests.py
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          git rm tools/fix_core_coverage_tests.py
          git rm .github/workflows/apply-core-coverage-test-fix.yml
          git rm .github/workflows/fix-core-coverage-tests.yml
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-core
          git commit -m "test: keep direct coverage validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
