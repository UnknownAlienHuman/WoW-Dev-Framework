name: Complete rolling source transition

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-rolling-source-transition.yml"

permissions:
  contents: write

concurrency:
  group: complete-rolling-source-transition
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove transport artifacts and update agent routing
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch \
            .github/i0a-payload \
            .github/i0a-payload-xz \
            .github/repair-payload \
            .github/live-update-payload \
            rust-toolchain.toml
          find .github/workflows -maxdepth 1 -type f \( \
              -name 'export-*' -o \
              -name 'finalize-*' -o \
              -name 'implement-*' -o \
              -name 'publish-*' -o \
              -name 'stabilize-*' -o \
              -name 'i0-a-export-*' \
            \) -print0 | xargs -0r git rm --ignore-unmatch
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          agents = '''# AGENTS.md — WoW Dev Framework

These rules apply to every contributor and agent.

## Current state

```text
implemented: wow-core, deterministic wow-reference view/store, rolling source acquisition, source manifests
current package: generated Blizzard API documentation -> normalized ReferenceDraft
next package: wow-emmy adapter, then project/rules/service composition
source policy: resolve current moving selectors per operation; no permanent WoW build, branch commit or Rust toolchain pin
```

Before every World of Warcraft task, load `.agents/skills/wow-dev/SKILL.md`, open the actual target project, run the version/source check, resolve the selected Blizzard UI branch once, and use that exact revision for all reads in the operation. A later operation resolves again.

## Source rules

Prefer a local Git clone. A clean managed clone may be cloned or fast-forwarded according to `auto`, `prompt` or `never`. Never reset, clean, switch or overwrite a dirty, ahead, diverged, wrong-origin or wrong-branch checkout.

When the exact revision is unavailable locally, a configured GitHub transport may read the same files at that revision. Never mix revisions or repeatedly read a moving branch inside one result.

Generated docs define declared signatures and restriction metadata. Blizzard Lua/XML/TOC define implementation and lifecycle. Runtime-dependent behavior requires a named-client probe. Exact result provenance is not a permanent dependency pin; it records what a completed result actually used.

## Optional advisory context

A generic local advisory provider may be used only when the owner explicitly configures and enables it outside the checkout. It is absent and undiscoverable by default; public builds and tests must not require it. Never guess its identity or location, expose origin/path/remote/revision, store credentials, or treat its text as authority. Consume only sanitized task routes and verify technical claims against current source or runtime evidence.

## Authority

1. Accepted framework contracts and exact operation inputs.
2. Exact Blizzard UI revision selected for the operation.
3. Generated docs and Blizzard implementation/XML/TOC at that revision.
4. Target project code and fixtures.
5. Exact runtime evidence.
6. Explicitly enabled sanitized advisory context.
7. Selected third-party implementation evidence.
8. Community, search or model candidates.

Preserve conflicts. Partial, stale, conflicted, truncated, unsupported or failed coverage never becomes a clean negative.

## Engineering invariants

- Do not execute arbitrary Lua, XML, hooks, installers, package managers, repository scripts or generated code during ingestion.
- Keep source, project, runtime, advisory, external and historical universes distinct.
- No hidden cwd, Git, editor, WoW installation, addon, profile, provider or current-state discovery.
- Owner crates do not depend on service/app/transport crates.
- Add abstractions only after real repeated owner call sites exist.
- Tests verify committed fixtures and must exercise positive and failure paths.
- `Cargo.lock` records one tested resolution; CI also checks a current dependency resolution.
- Report pass, fail, skipped and `NotEvaluated` accurately.
- Push to `main`, or merge and delete the task branch immediately. Do not leave completed branches/worktrees.

## GitHub connector

Before claiming GitHub is read-only, load the full GitHub catalog, call `get_repo`, verify `permissions.push == true`, and use GitHub API write actions. Local Git/network failure does not prove connector write failure.
'''
          Path('AGENTS.md').write_text(agents, encoding='utf-8', newline='\n')

          loader = '''# Agent entry point

Before any World of Warcraft research, review, migration or implementation, load `.agents/skills/wow-dev/SKILL.md` and follow it as the canonical workflow. Read the target project first. Resolve current Blizzard UI source for the operation; do not use a hard-coded build or commit as permanent truth. Optional advisory context is used only when explicitly configured outside the repository and remains non-authoritative.
'''
          for name in ('CLAUDE.md', 'GEMINI.md'):
              Path(name).write_text(loader, encoding='utf-8', newline='\n')

          skill = '''---
name: wow-dev
description: Mandatory current-source workflow for World of Warcraft addon engineering.
---

# WoW development workflow

Load this skill before every WoW research, review, migration, debugging or implementation task.

1. Read the actual target project instructions, TOC, bootstrap, load order and relevant code.
2. Select the intended moving branch (`live`, `ptr`, `beta`, a Classic branch or explicit equivalent).
3. Run `scripts/check-wow-versions.sh auto` or `scripts/check-wow-versions.ps1 -Update auto`; use `prompt` or `never` when mutation is not allowed.
4. Resolve the moving selector once. Use one exact revision for generated docs, Lua, XML, TOC and version reads. Resolve again on the next operation.
5. Prefer the local Git object database. Use the configured exact-revision GitHub fallback only when the local object is unavailable. Do not mix revisions.
6. Build and verify `.wow-dev/source-manifest.json` with `build-blizzard-source-manifest.py` and `verify-blizzard-source-manifest.py`.
7. For generated API work, build and verify the normalized draft with `build-blizzard-api-reference.py` and `verify-blizzard-api-reference.py --require-complete`.
8. Generated docs prove declarations; implementation/XML/TOC prove source behavior; state-, secret-, hotfix- and protection-dependent claims require runtime evidence.
9. A search miss is ambiguous unless the inspected universe has complete coverage. Unsupported generated syntax is an explicit failure; diagnostic partial output has no negative authority.
10. Query optional advisory context only when already explicitly configured and enabled outside the repository. Do not discover or name a provider. Consume a sanitized narrow route, expose no origin metadata, and revalidate every claim.
11. Label claims `current-source-confirmed`, `project-confirmed`, `runtime-confirmed`, `advisory`, `historical` or `unverified`.
12. Run actual project checks and report exact inputs and pass/fail/skipped/NotEvaluated status. Never fabricate client evidence.
'''
          destinations = (
              '.agents/skills/wow-dev/SKILL.md',
              '.claude/skills/wow-dev/SKILL.md',
              '.opencode/skills/wow-dev/SKILL.md',
              '.agent/skills/wow-dev/SKILL.md',
          )
          for destination in destinations:
              path = Path(destination)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(skill, encoding='utf-8', newline='\n')

          for manifest in root.rglob('Cargo.toml'):
              text = manifest.read_text(encoding='utf-8')
              text = re.sub(r'^\s*rust-version\s*=.*\n', '', text, flags=re.MULTILINE)
              manifest.write_text(text, encoding='utf-8', newline='\n')

          forbidden = (
              'wow-addon-engineering-kb',
              'UnknownAlienHuman/wow-addon-engineering-kb',
          )
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for marker in forbidden:
                  updated = updated.replace(marker, 'optional local advisory provider')
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')
          PY
          git rm --ignore-unmatch .github/workflows/cleanup-rolling-source-transition.yml
      - name: Validate final tree
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build-blizzard-api-reference.py \
            scripts/verify-blizzard-api-reference.py \
            tests/test_blizzard_api_reference.py
          python -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
          ! grep -RIl --exclude-dir=.git -E 'wow-addon-engineering-kb|UnknownAlienHuman/wow-addon-engineering-kb' .
          test ! -e rust-toolchain.toml
          test ! -d .github/i0a-payload
          test ! -d .github/i0a-payload-xz
          test ! -e .github/workflows/cleanup-rolling-source-transition.yml
          cmp .agents/skills/wow-dev/SKILL.md .claude/skills/wow-dev/SKILL.md
          cmp .agents/skills/wow-dev/SKILL.md .opencode/skills/wow-dev/SKILL.md
          cmp .agents/skills/wow-dev/SKILL.md .agent/skills/wow-dev/SKILL.md
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: complete rolling source transition"
          git push origin HEAD:main
