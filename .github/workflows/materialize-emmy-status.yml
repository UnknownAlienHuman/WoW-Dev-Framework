name: Materialize Emmy status ledger

on:
  push:
    branches:
      - status/emmy-frontier

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Apply exact status patch
        run: |
          set -euo pipefail
          git apply --check .github/emmy-status.patch
          git apply .github/emmy-status.patch
          git diff --check
      - name: Validate repository policy
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable xtask check
      - name: Commit materialized documentation and remove staging files
        run: |
          set -euo pipefail
          rm .github/emmy-status.patch .github/workflows/materialize-emmy-status.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: record active wow-emmy syntax frontier"
          git push origin HEAD:status/emmy-frontier
