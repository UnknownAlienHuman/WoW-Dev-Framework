name: Graph explanation build
on:
  push:
    branches: [main]
    paths:
      - '.ci/graph-explanation/**'
      - '.github/workflows/graph-explanation-build.yml'
permissions:
  contents: read
concurrency:
  group: graph-explanation-build
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit the exact reviewed implementation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/graph-explanation"
          git rev-parse HEAD > "$RUNNER_TEMP/graph-explanation/BASE_SHA"
          test "$(git hash-object .ci/graph-explanation/input.b64)" = 2172db82548f63af8502968a209b12be6b08d8d0
          base64 --decode .ci/graph-explanation/input.b64 | gzip -d > "$RUNNER_TEMP/graph-explanation/input.patch"
          echo 'dc69f74d4ef5c9dea686dd61f3560f814aeff0d8a224d7a74ce491a17eb75c1e  input.patch' > "$RUNNER_TEMP/graph-explanation/INPUT_SHA256"
          (cd "$RUNNER_TEMP/graph-explanation" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/graph-explanation .github/workflows/graph-explanation-build.yml
          test "$(git write-tree)" = 267d26fdac7922ea234198967febccd4e9e127c8
          git apply --index "$RUNNER_TEMP/graph-explanation/input.patch"
          test "$(git write-tree)" = b155d03ae410179a8ac1412d4afedf222e8cdb32
      - name: Format the reviewed Rust source
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/graph-explanation/RUST_VERSION"
          cargo +stable fmt --all
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/graph-explanation/TREE_SHA"
      - name: Build graph owner
        run: |
          set -euo pipefail
          cargo +stable build --locked -p wow-graph --lib 2>&1 | tee "$RUNNER_TEMP/graph-explanation/build.log"
      - name: Lint changed owner
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-graph --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/graph-explanation/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/graph-explanation/policy.log"
          cargo +stable fmt --all --check
          git diff --exit-code
      - name: Retain compiled source
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/graph-explanation/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/graph-explanation/compiled.patch"
          git archive --format=tar --output="$RUNNER_TEMP/graph-explanation/compiled-source.tar" "$(git write-tree)"
          (cd "$RUNNER_TEMP/graph-explanation" && sha256sum compiled.patch compiled-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: graph-explanation-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/graph-explanation/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: graph-explanation-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: graph-explanation-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows
      - name: Publish identical compiled sources to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/linux/BASE_SHA")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/windows/BASE_SHA")" = "$GITHUB_SHA"
          (cd "$RUNNER_TEMP/linux" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/windows" && sha256sum -c SHA256SUMS)
          cmp "$RUNNER_TEMP/linux/TREE_SHA" "$RUNNER_TEMP/windows/TREE_SHA"
          cmp "$RUNNER_TEMP/linux/compiled.patch" "$RUNNER_TEMP/windows/compiled.patch"
          git apply --index "$RUNNER_TEMP/linux/compiled.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(graph): explain exact retained entity and relation support' -m "Reverse publication identity rebinding and retain every contributing foundation/producer assertion, raw proposal, accepted record, registry definition and evidence/source/coverage handles. Preserve all partition coverage and explicit unresolved evidence, derivation and conflict boundaries. Add bounded canonical-prefix output with exact omission counts and cooperative cancellation. Linux/Windows graph builds, selected-owner Clippy, formatting and repository policy passed on this exact tree in run $GITHUB_RUN_ID. No tests, fixtures, dependencies or existing identities changed. Full evidence/conflict resolution, axes and service/CLI routing remain separate. Temporary build inputs removed."
          git push origin HEAD:main
