name: Source mixin graph build
on:
  push:
    branches: [main]
    paths: ['.ci/source-mixins/**', '.github/workflows/source-mixins-build.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit exact reviewed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/source-mixins"
          git rev-parse HEAD > "$RUNNER_TEMP/source-mixins/BASE_SHA"
          test "$(git hash-object .ci/source-mixins/payload)" = 61876ba1eadf9d52bd2af93cfafe2c196b6cc0b7
          base64 --decode .ci/source-mixins/payload | gzip -d > "$RUNNER_TEMP/source-mixins/input.patch"
          echo '2fed8954d5a105009103fc319d8f8aa871d2e43e442c4884c418e48dad763727  input.patch' > "$RUNNER_TEMP/source-mixins/INPUT_SHA256"
          (cd "$RUNNER_TEMP/source-mixins" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/source-mixins .github/workflows/source-mixins-build.yml
          test "$(git write-tree)" = fb829580b1613ed29d52cba50019067bb2de7c60
          git apply --index "$RUNNER_TEMP/source-mixins/input.patch"
          test "$(git write-tree)" = 7e26a8c2d1bda9551195b7212fb12f367e4c374e
      - name: Format reviewed Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/source-mixins/RUST_VERSION"
          cargo +stable fmt --all
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/source-mixins/TREE_SHA"
      - name: Clippy changed owners and CLI
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-project -p wow-service -p wow-cli -- -D warnings 2>&1 | tee "$RUNNER_TEMP/source-mixins/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/source-mixins/policy.log"
      - name: Retain checked source
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/source-mixins/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/source-mixins/checked.patch"
          git archive "$(git write-tree)" > "$RUNNER_TEMP/source-mixins/checked-source.tar"
          (cd "$RUNNER_TEMP/source-mixins" && sha256sum checked.patch checked-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-mixins-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/source-mixins/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: source-mixins-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: source-mixins-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows
      - name: Publish identical checked source to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for platform in linux windows; do
            test "$(cat "$RUNNER_TEMP/$platform/BASE_SHA")" = "$GITHUB_SHA"
            (cd "$RUNNER_TEMP/$platform" && sha256sum -c SHA256SUMS)
          done
          cmp "$RUNNER_TEMP/linux/TREE_SHA" "$RUNNER_TEMP/windows/TREE_SHA"
          cmp "$RUNNER_TEMP/linux/checked.patch" "$RUNNER_TEMP/windows/checked.patch"
          git apply --index "$RUNNER_TEMP/linux/checked.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(project): export exact XML to Main Lua mixin source links' -m "Reuse captured XML binding and Emmy lookup reports to project explicit MixesIn associations and exact Lua declaration/document ownership nodes. Keep ambiguous, invalid, Library and unresolved-order outcomes with the original report; do not infer runtime tables or method dispatch. Export materialized Lua node IDs, retain both source evidence anchors and enable the existing source Inheritance axis. Version only source projection/registry and build receipts. Clippy for changed project/service/CLI packages, formatting and repository policy passed on identical Linux/Windows source trees in run $GITHUB_RUN_ID. No new tests, dependency or lockfile changes. Runtime, recognizers and coherent ProjectStore remain separate. Temporary check inputs removed."
          git push origin HEAD:main
