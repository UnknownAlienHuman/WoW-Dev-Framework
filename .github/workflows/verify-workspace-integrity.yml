name: Verify workspace integration

on:
  push:
    branches:
      - work/workspace-integrity

permissions:
  contents: write

concurrency:
  group: workspace-integrity
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown --toolchain stable
      - name: Prepare final tree
        run: |
          set -euo pipefail
          git apply --check .ci/workspace-integrity/fix-01.patch
          git apply .ci/workspace-integrity/fix-01.patch
          git apply --check .ci/workspace-integrity/fix-02.patch
          git apply .ci/workspace-integrity/fix-02.patch
          git apply --check .ci/workspace-integrity/fix-03.patch
          git apply .ci/workspace-integrity/fix-03.patch
          rm -rf .ci/workspace-integrity
          rm .github/workflows/verify-workspace-integrity.yml
          cargo +stable generate-lockfile
          cargo +stable fmt --all
          git add -A
      - name: Verify repository and workspace
        run: |
          set -euo pipefail
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +stable test --locked --workspace --all-targets --all-features
          cargo +stable test --release --locked --workspace --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          cargo +stable build --locked -p wow-ketho-literals-wasm --target wasm32-unknown-unknown --profile wasm-compact
          cargo +stable generate-lockfile --manifest-path bridges/literal-host/Cargo.toml
          cargo +stable fmt --manifest-path bridges/literal-host/Cargo.toml --all --check
          cargo +stable clippy --locked --manifest-path bridges/literal-host/Cargo.toml --all-targets -- -D warnings
          cargo +stable test --locked --manifest-path bridges/literal-host/Cargo.toml --all-targets
          git diff --cached --check
      - name: Commit verified integration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+UnknownAlienHuman@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(workspace): compile and test all published E1 and E2 owners'
          git push origin HEAD:work/workspace-integrity
