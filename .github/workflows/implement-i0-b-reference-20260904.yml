                - rust-toolchain.toml
                - crates/wow-reference/**
                - .github/workflows/i0-reference.yml
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: i0-reference-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            validate:
              runs-on: ubuntu-24.04
              timeout-minutes: 30
              steps:
                - name: Check out repository
                  uses: actions/checkout@v6.0.2

                - name: Install frozen Rust toolchain
                  run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

                - name: Verify formatting
                  run: cargo +1.98.0 fmt --all -- --check

                - name: Verify frozen fixture vectors
                  run: cargo +1.98.0 run --locked -p wow-reference --example generate_fixture -- --check

                - name: Check strict lints
                  run: cargo +1.98.0 clippy --locked -p wow-reference --all-targets --all-features -- -D warnings

                - name: Run debug tests
                  run: cargo +1.98.0 test --locked -p wow-reference --all-features

                - name: Run release tests
                  run: cargo +1.98.0 test --locked -p wow-reference --all-features --release

                - name: Build documentation
                  env:
                    RUSTDOCFLAGS: -D warnings
                  run: cargo +1.98.0 doc --locked -p wow-reference --all-features --no-deps
          ''',
          )

          readme_path = ROOT / "crates/wow-reference/README.md"
          readme = readme_path.read_text(encoding="utf-8") if readme_path.exists() else "# wow-reference\n"
          start = "<!-- i0b-deterministic-view:start -->"
          end = "<!-- i0b-deterministic-view:end -->"
          section = '''<!-- i0b-deterministic-view:start -->
          ## Executable deterministic view

          `deterministic` provides the first executable I0-B boundary:

          - immutable client-scoped `ReferenceView` generations;
          - payload and envelope SHA-256 identities;
          - exact case-sensitive lookup;
          - authoritative absence only for complete, unconflicted coverage scopes;
          - explicit partial/not-evaluated/conflict outcomes;
          - normalized restriction facets and committed fixture hash vectors.

          Source ingestion, persistent pack publication, and upstream-specific producers remain separate later slices.
          <!-- i0b-deterministic-view:end -->'''
          if start in readme and end in readme:
              prefix = readme.split(start, 1)[0].rstrip()
              suffix = readme.split(end, 1)[1].lstrip()
              readme = prefix + "\n\n" + section + ("\n\n" + suffix if suffix else "")
          else:
              readme = readme.rstrip() + "\n\n" + section + "\n"
          readme_path.parent.mkdir(parents=True, exist_ok=True)
          readme_path.write_text(readme, encoding="utf-8")

          replace_workspace_policy_test()
          PY

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Format source tree
        run: cargo +1.98.0 fmt --all

