          #[test]
          fn unordered_draft_rebuilds_the_same_generation() -> Result<(), Box<dyn Error>> {
              let view = fixture()?;
              let mut draft = view.to_draft();
              draft.sources.reverse();
              draft.symbols.reverse();
              draft.coverage.reverse();
              draft.conflicts.reverse();
              for symbol in &mut draft.symbols {
                  symbol.source_ids.reverse();
                  symbol.restrictions.reverse();
              }
              let rebuilt = ReferenceView::build(draft)?;
              assert_eq!(view, rebuilt);
              Ok(())
          }

          #[test]
          fn exact_lookup_distinguishes_presence_absence_and_unknown() -> Result<(), Box<dyn Error>> {
              let view = fixture()?;
              let present = ReferenceKey::new(
                  SymbolKind::Function,
                  Some("C_ChatInfo"),
                  "SendAddonMessage",
              )?;
              let absent = ReferenceKey::new(
                  SymbolKind::Function,
                  Some("C_ChatInfo"),
                  "SendAddonMessageLogged",
              )?;
              let unknown = ReferenceKey::new(
                  SymbolKind::Function,
                  Some("C_Timer"),
                  "NonexistentFixtureFunction",
              )?;

              assert!(matches!(
                  view.exact_lookup(&present),
                  ExactLookup::Present { .. }
              ));
              assert!(matches!(
                  view.exact_lookup(&absent),
                  ExactLookup::Absent { .. }
              ));
              assert!(matches!(
                  view.exact_lookup(&unknown),
                  ExactLookup::NotAuthoritative {
                      reason: NegativeAuthorityReason::PartialCoverage,
                      ..
                  }
              ));
              Ok(())
          }

