              ));
          }
  '''
          marker = '''        if deferred_operations.iter().copied().collect::<BTreeSet<_>>().len()
              != deferred_operations.len()
          {
              return Err(ServiceError::new(
                  ServiceErrorCode::InvalidConfiguration,
                  "duplicate deferred operation",
              ));
          }
