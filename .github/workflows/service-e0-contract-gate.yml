          )
          if 'let mut components = context.components().to_vec();' not in text:
              marker = '        check_cancelled(cancelled, request.operation_id())?;\n\n        #[derive(Serialize)]'
              replacement = (
                  '        check_cancelled(cancelled, request.operation_id())?;\n\n'
                  '        let mut components = context.components().to_vec();\n'
                  '        components.sort_by(|left, right| left.component_id().cmp(right.component_id()));\n'
                  '        let mut rule_evaluations = context.rule_evaluations().to_vec();\n'
                  '        rule_evaluations.sort_by(|left, right| left.evaluation_id().cmp(right.evaluation_id()));\n\n'
                  '        #[derive(Serialize)]'
              )
              if marker not in text:
                  raise SystemExit('service identity marker not found')
              text = text.replace(marker, replacement, 1)
          text = text.replace('components: context.components(),', 'components: &components,')
          text = text.replace('rule_evaluations: context.rule_evaluations(),', 'rule_evaluations: &rule_evaluations,')
          text = text.replace('components: context.components().to_vec(),', 'components,')
          text = text.replace('rule_evaluations: context.rule_evaluations().to_vec(),', 'rule_evaluations,')
          text = text.replace(
              '.any(|state| *state == CapabilityState::Partial)',
              '.any(|state| *state != CapabilityState::Available)',
          )
          text = text.replace(
              'count > usize::try_from(self.configuration.budgets().max_scope_files).unwrap_or(0)',
              'count > limit(self.configuration.budgets().max_scope_files)',
          )
          for field in ('max_components', 'max_generic_findings', 'max_rule_evaluations', 'max_raw_findings'):
              text = text.replace(f'limit(self.configuration.budgets().{field})?', f'limit(self.configuration.budgets().{field})')
          text = re.sub(
              r'fn limit\(value: u32\) -> ServiceResult<usize> \{.*?\n\}',
              'const fn limit(value: u32) -> usize {\n    value as usize\n}',
              text,
              flags=re.S,
          )
          text = text.replace(
              'if names.len() != components.len()\n        || REQUIRED_COMPONENTS',
              'if names.len() != components.len()\n        || names.len() != REQUIRED_COMPONENTS.len()\n        || components.iter().any(|component| component.capabilities().is_empty())\n        || REQUIRED_COMPONENTS',
          )
          mandatory = '''        if context.components().iter().any(|component| {
              matches!(
                  component.health(),
                  ComponentHealth::Failed | ComponentHealth::Unavailable
              )
          }) {
              return Err(ServiceError::new(
                  ServiceErrorCode::ComponentUnavailable,
                  "mandatory E0 component is failed or unavailable",
              ));
          }
  '''
          marker = '        ensure_required_components(context.components())?;\n'
          if 'mandatory E0 component is failed or unavailable' not in text:
              if marker not in text:
                  raise SystemExit('component validation marker not found')
              text = text.replace(marker, marker + mandatory, 1)
          rule_guard = '''        let observed_rules = context
              .rule_evaluations()
              .iter()
              .map(RuleEvaluation::rule_id)
              .collect::<BTreeSet<_>>();
          if REQUIRED_RULES
              .iter()
              .any(|rule_id| !observed_rules.contains(rule_id))
              || observed_rules
                  .iter()
                  .any(|rule_id| !REQUIRED_RULES.contains(rule_id))
          {
              return Err(ServiceError::new(
                  ServiceErrorCode::InvalidContext,
                  "rule evaluations do not cover the exact E0 registry",
              ));
          }
  '''
          marker = '''        ensure_unique(
              context
                  .rule_evaluations()
                  .iter()
                  .map(RuleEvaluation::evaluation_id),
              "rule evaluation identity",
          )?;
  '''
          if 'exact E0 registry' not in text:
              if marker not in text:
                  raise SystemExit('rule identity marker not found')
              text = text.replace(marker, marker + rule_guard, 1)
          service.write_text(text)

          Path('crates/wow-service/src/presentation.rs').write_text(r'''use std::collections::{BTreeMap, BTreeSet};

use crate::{
    CausalRelation, PresentationGraph, PresentationNode, PresentationNodeKind,
    PresentationRelation, RawFinding, RuleEvaluation, ServiceError, ServiceErrorCode, ServiceResult,
};

pub(crate) fn build(
    raw_findings: &[RawFinding],
    evaluations: &[RuleEvaluation],
    relations: &[CausalRelation],
    relation_budget: u32,
) -> ServiceResult<PresentationGraph> {
    if relations.len() > relation_budget as usize {
        return Err(ServiceError::new(
            ServiceErrorCode::BudgetExceeded,
            "presentation relation budget exceeded",
        ));
    }
    let mut nodes = BTreeMap::<Box<str>, PresentationNodeKind>::new();
    for finding in raw_findings {
        if nodes
            .insert(finding.finding_id().into(), PresentationNodeKind::Finding)
            .is_some()
        {
            return Err(ServiceError::new(
                ServiceErrorCode::InvalidContext,
                "duplicate raw finding identity",
            ));
        }
    }
    for evaluation in evaluations {
        if let Some(blocker) = evaluation.blocker()
            && nodes
                .insert(blocker.blocker_id().into(), PresentationNodeKind::Blocker)
                .is_some()
        {
            return Err(ServiceError::new(
                ServiceErrorCode::InvalidContext,
                "blocker identity collides with another presentation node",
            ));
        }
    }
    let mut observed = BTreeSet::new();
    let mut children = BTreeSet::<Box<str>>::new();
    let mut edges = BTreeMap::<Box<str>, Vec<Box<str>>>::new();
    let mut output_relations = Vec::with_capacity(relations.len());
    for relation in relations {
        if !nodes.contains_key(relation.parent_id()) || !nodes.contains_key(relation.child_id()) {
            return Err(ServiceError::new(
                ServiceErrorCode::InvalidContext,
                "presentation relation references an unknown node",
            ));
        }
        if !observed.insert((relation.parent_id(), relation.child_id(), relation.kind())) {
            return Err(ServiceError::new(
                ServiceErrorCode::InvalidContext,
                "duplicate presentation relation",
            ));
        }
        children.insert(relation.child_id().into());
        edges
            .entry(relation.parent_id().into())
            .or_default()
            .push(relation.child_id().into());
        output_relations.push(PresentationRelation::from_relation(relation));
    }
    ensure_acyclic(&nodes, &edges)?;
    let output_nodes = nodes
        .iter()
        .map(|(node_id, kind)| PresentationNode::new(node_id.clone(), *kind))
        .collect::<Vec<_>>();
    let display_root_ids = nodes
        .keys()
        .filter(|node_id| !children.contains(*node_id))
        .cloned()
        .collect::<Vec<_>>();
    output_relations.sort();
    Ok(PresentationGraph::new(output_nodes, display_root_ids, output_relations))
}

fn ensure_acyclic(
    nodes: &BTreeMap<Box<str>, PresentationNodeKind>,
    edges: &BTreeMap<Box<str>, Vec<Box<str>>>,
) -> ServiceResult<()> {
    let mut indegrees = nodes
        .keys()
        .map(|node| (node.clone(), 0usize))
        .collect::<BTreeMap<_, _>>();
    for children in edges.values() {
        for child in children {
            let indegree = indegrees.get_mut(child.as_ref()).ok_or_else(|| {
                ServiceError::new(
                    ServiceErrorCode::InvalidContext,
                    "presentation edge references an unknown child",
                )
            })?;
            *indegree = indegree.checked_add(1).ok_or_else(|| {
                ServiceError::new(
                    ServiceErrorCode::BudgetExceeded,
                    "presentation indegree overflow",
                )
            })?;
        }
    }
    let mut ready = indegrees
        .iter()
        .filter_map(|(node, indegree)| (*indegree == 0).then_some(node.clone()))
        .collect::<BTreeSet<_>>();
    let mut visited = 0usize;
    while let Some(node) = ready.pop_first() {
        visited += 1;
        if let Some(children) = edges.get(node.as_ref()) {
            for child in children {
                let indegree = indegrees.get_mut(child.as_ref()).ok_or_else(|| {
                    ServiceError::new(
                        ServiceErrorCode::InvalidContext,
                        "presentation edge references an unknown child",
                    )
                })?;
                *indegree -= 1;
                if *indegree == 0 {
                    ready.insert(child.clone());
                }
            }
        }
    }
    if visited != indegrees.len() {
        return Err(ServiceError::new(
            ServiceErrorCode::InvalidContext,
            "presentation graph contains a cycle",
        ));
    }
    Ok(())
}
''')

          tests = Path('crates/wow-service/tests/e0_service.rs')
          text = tests.read_text()
          if 'clean:secret:partial-companion' not in text:
              old = '''        vec![RuleEvaluation::not_evaluated(
              "evaluation:api:blocked",
              "wow.api.exists",
              "scope:whole-project",
              blocker,
          )?],
  '''
              new = '''        vec![
              RuleEvaluation::not_evaluated(
                  "evaluation:api:blocked",
