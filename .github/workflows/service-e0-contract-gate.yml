name: Canonical wow-service E0-F contract gate

on:
  push:
    branches:
      - repair/service-e0-hardening
    paths:
      - .github/workflows/service-e0-contract-gate.yml

permissions:
  contents: write

concurrency:
  group: cleanroom-service-e0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Bind candidate to latest exact main
        run: |
          set -euo pipefail
          git fetch origin main work/service-e0 repair/service-e0-hardening
          base="$(git rev-parse origin/main)"
          printf '%s\n' "$base" > "$RUNNER_TEMP/base-sha"
          for source_ref in origin/main origin/work/service-e0 HEAD; do
            if git cat-file -e "$source_ref":crates/wow-service/src/service.rs 2>/dev/null; then
              git archive "$source_ref" crates/wow-service | tar -x -C "$RUNNER_TEMP"
              break
            fi
          done
          test -f "$RUNNER_TEMP/crates/wow-service/src/service.rs"
          git checkout -B repair/service-e0-hardening origin/main
          rm -rf crates/wow-service
          cp -a "$RUNNER_TEMP/crates/wow-service" crates/wow-service
      - name: Apply canonical contract hardening
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('Cargo.toml')
          text = root.read_text()
          member = '    "crates/wow-service",\n'
          if member not in text:
              anchor = '    "crates/wow-rules",\n'
              if anchor not in text:
                  raise SystemExit('workspace member anchor not found')
              root.write_text(text.replace(anchor, anchor + member, 1))

          lib = Path('crates/wow-service/src/lib.rs')
          text = lib.read_text()
          text = text.replace(
              'pub use backend::{OwnedServiceBackend, ServiceBackend};',
