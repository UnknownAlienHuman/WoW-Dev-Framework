          )
          if 'RuleBlocker,' not in text:
              text = text.replace('    RuleEvaluation,', '    RuleBlocker, RuleEvaluation,', 1)
          lib.write_text(text)

          identity = Path('crates/wow-service/src/identity.rs')
          text = identity.read_text()
          if 'use wow_core::canonical_json_bytes;' not in text:
              text = text.replace(
                  'use sha2::{Digest, Sha256};',
                  'use sha2::{Digest, Sha256};\nuse wow_core::canonical_json_bytes;',
              )
          text = text.replace('let bytes = serde_json::to_vec(value).map_err(|error| {', 'let bytes = canonical_json_bytes(value).map_err(|error| {')
          identity.write_text(text)

          configuration = Path('crates/wow-service/src/configuration.rs')
          text = configuration.read_text()
          exact_guard = '''        if deferred_operations.as_slice() != DeferredOperation::ALL {
              return Err(ServiceError::new(
