          ))
          PY
          rm -rf .ci/service-e0 .ci/materialize/service-e0
          find .github/workflows -maxdepth 1 -type f -name '*service-e0*.yml' -delete
          rm -f .github/workflows/export-service-fragments.yml
      - name: Compiler-assisted normalization
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable fix --workspace --all-targets --all-features --allow-dirty --allow-staged
          cargo +stable clippy --fix --workspace --all-targets --all-features --allow-dirty --allow-staged -- -D warnings
          cargo +stable fmt --all
      - name: Strict repository verification
        run: |
          set -euo pipefail
          cargo +stable xtask check
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable test --workspace --all-targets --all-features
          cargo +stable test --release --workspace --all-targets --all-features
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Publish canonical exact tree
        run: |
          set -euo pipefail
          base="$(cat "$RUNNER_TEMP/base-sha")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$base" || {
            echo 'main changed during canonical verification; refusing stale publication' >&2
            exit 1
          }
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            commit="$base"
          else
            git commit -m 'feat(service): implement canonical E0-F status and check operations'
            commit="$(git rev-parse HEAD)"
            git push origin "$commit":refs/heads/main
          fi
          git push --force origin "$commit":refs/heads/work/service-e0
          git push --force origin "$commit":refs/heads/repair/service-e0-hardening
          git push --force origin "$commit":refs/heads/attest/service-e0
