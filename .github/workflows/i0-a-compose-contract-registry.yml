name: I0-A compose contract registry

on:
  pull_request:
    paths:
      - .github/workflows/i0-a-compose-contract-registry.yml
      - crates/wow-core/src/contract.rs
      - crates/wow-core/tests/contract_registry.rs

permissions:
  contents: write

jobs:
  compose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Expose contract registry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/wow-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          if 'pub mod contract;\n' not in text:
              marker = 'pub mod canonical;\n'
              if marker not in text:
                  raise SystemExit('canonical module marker missing')
              text = text.replace(marker, marker + 'pub mod contract;\n', 1)
          if 'pub use contract::E0_OPERATION_IDS;' not in text:
              text = text.rstrip() + '\n\npub use contract::E0_OPERATION_IDS;\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify frozen lock
        run: |
          cargo +1.98.0 generate-lockfile
          git diff --exit-code -- Cargo.lock

      - run: cargo +1.98.0 fmt --all
      - run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo +1.98.0 test --workspace --all-features

      - name: Commit registry and remove composer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/i0-a-compose-contract-registry.yml
          git add crates/wow-core/src/lib.rs crates/wow-core/src/contract.rs crates/wow-core/tests/contract_registry.rs
          git commit -m 'feat(wow-core): expose exact E0-A operation registry'
          git push origin HEAD:${GITHUB_HEAD_REF}
