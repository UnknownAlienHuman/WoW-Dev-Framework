name: Apply historical generation-pair removal

on:
  push:
    branches:
      - refactor/remove-historical-generation-pair-2026-10-19

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Remove the historical pair product
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/remove_historical_generation_pair.py
          git rm \
            apps/wow/src/project/pair.rs \
            crates/wow-service/src/live_project/generation_pair.rs \
            crates/wow-service/src/live_project/tests/generation_pair.rs \
            crates/wow-project/src/replay/publication/generation_pair.rs \
            crates/wow-project/src/replay/publication/source_generation_pair.rs \
            crates/wow-project/RETAINED_GENERATION_PAIR.md
          cargo +stable fmt --all
          if rg -n \
            'RetainedGenerationPair|RetainedSourceGenerationPair|SourceGenerationSide|RETAINED_GENERATION_PAIR|RETAINED_SOURCE_GENERATION_PAIR|ProjectGenerationPair|PROJECT_GENERATION_PAIR|read_live_project_generation_pair|IncompatibleGenerationPair|retained-generation-pair|retained-blizzard-ui-source-pair|wow project pair --store-root|Exact retained generation pair|ReadSnapshotCustody|ReadSnapshotOrigin|read_origin' \
            --glob '!target/**'; then
            echo 'historical generation-pair residue remains' >&2
            exit 1
          fi
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove historical generation-pair product"
          git push origin "HEAD:${GITHUB_REF_NAME}"
