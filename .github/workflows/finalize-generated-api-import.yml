name: Finalize generated API import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-generated-api-import.yml"

permissions:
  contents: write

concurrency:
  group: finalize-generated-api-import
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat(wow-reference): finalize generated API import') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Complete public import API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module = Path("crates/wow-reference/src/generated_api.rs")
          text = module.read_text(encoding="utf-8")
          marker = "#[cfg(test)]\nmod tests {"
          getters = r'''
          impl GeneratedApiProvenance {
              /// Producer-declared source-manifest digest, when present.
              #[must_use]
              pub fn manifest_declared_digest(&self) -> Option<&str> {
                  self.manifest_declared_digest.as_deref()
              }

              /// Opaque public source identifier, when supplied.
              #[must_use]
              pub fn source_id(&self) -> Option<&str> {
                  self.source_id.as_deref()
              }

              /// Producer configuration participating in generation identity.
              #[must_use]
              pub const fn configuration(&self) -> &BTreeMap<String, Value> {
                  &self.configuration
              }
          }

          impl GeneratedApiFact {
              /// Event literal name or other producer literal, when declared.
              #[must_use]
              pub fn literal_name(&self) -> Option<&str> {
                  self.literal_name.as_deref()
              }

              /// Generated documentation paragraphs.
              #[must_use]
              pub fn documentation(&self) -> &[Box<str>] {
                  &self.documentation
              }

              /// Non-restriction generated attributes.
              #[must_use]
              pub const fn attributes(&self) -> &BTreeMap<String, Value> {
                  &self.attributes
              }

              /// Generated function arguments.
              #[must_use]
              pub fn arguments(&self) -> &[Value] {
                  &self.arguments
              }

              /// Generated function returns.
              #[must_use]
              pub fn returns(&self) -> &[Value] {
                  &self.returns
              }

              /// Generated event payload.
              #[must_use]
              pub fn payload(&self) -> &[Value] {
                  &self.payload
              }

              /// Generated structure fields.
              #[must_use]
              pub fn fields(&self) -> &[Value] {
                  &self.fields
              }

              /// Generated enumeration or constant values.
              #[must_use]
              pub fn values(&self) -> &[Value] {
                  &self.values
              }
          }

          impl GeneratedApiConflict {
              /// Generated collection affected by the conflict.
              #[must_use]
              pub fn collection(&self) -> &str {
                  &self.collection
              }

              /// Canonically ordered conflict source locators.
              #[must_use]
              pub fn sources(&self) -> &[GeneratedApiConflictSource] {
                  &self.sources
              }
          }

          impl GeneratedApiConflictSource {
              /// Canonical generated-document path.
              #[must_use]
              pub fn path(&self) -> &str {
                  &self.path
              }

              /// One-based source line.
              #[must_use]
              pub const fn line_start(&self) -> u64 {
                  self.line_start
              }
          }

          impl GeneratedApiCoverage {
              /// Canonically ordered parsed generated-document paths.
              #[must_use]
              pub fn parsed_paths(&self) -> &[Box<str>] {
                  &self.parsed_paths
              }

              /// Failures retained by a partial draft.
              #[must_use]
              pub fn failures(&self) -> &[GeneratedApiFailure] {
                  &self.failures
              }

              /// Counts by generated entity collection.
              #[must_use]
              pub const fn entity_counts(&self) -> &BTreeMap<Box<str>, u64> {
                  &self.entity_counts
              }

              /// Explicit authority limitations.
              #[must_use]
              pub fn limitations(&self) -> &[Box<str>] {
                  &self.limitations
              }
          }

          impl GeneratedApiFailure {
              /// Stable producer failure code.
              #[must_use]
              pub fn code(&self) -> &str {
                  &self.code
              }

              /// Safe producer explanation.
              #[must_use]
              pub fn message(&self) -> &str {
                  &self.message
              }

              /// Affected source path, when known.
              #[must_use]
              pub fn path(&self) -> Option<&str> {
                  self.path.as_deref()
              }
          }

          '''
          getters = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in getters.splitlines()
          ) + "\n"
          if "pub fn manifest_declared_digest(&self)" not in text:
              if marker not in text:
                  raise SystemExit("generated_api test marker not found")
              text = text.replace(marker, getters + marker, 1)
              module.write_text(text, encoding="utf-8")

          lib = Path("crates/wow-reference/src/lib.rs")
          lib_text = lib.read_text(encoding="utf-8")
          if "pub mod generated_api;" not in lib_text:
              lib_text = lib_text.rstrip() + "\n\npub mod generated_api;\n"
              lib.write_text(lib_text, encoding="utf-8")

          for obsolete in (
              ".github/workflows/finalize-current-source-skill.yml",
              ".github/workflows/export-current-main.yml",
              ".github/workflows/i0-a-export-current-tree.yml",
          ):
              Path(obsolete).unlink(missing_ok=True)
          PY
      - name: Validate Python producer
        run: |
          python -m py_compile scripts/wow_api_reference.py scripts/build-blizzard-api-reference.py scripts/verify-blizzard-api-reference.py tests/test_blizzard_api_reference.py
          python -m unittest -v tests/test_blizzard_api_reference.py
          python scripts/sync-wow-dev-skill.py --check
      - name: Validate Rust owner
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      - name: Enforce public privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIlE 'wow-addon-engineering-kb|UnknownAlienHuman/wow-addon-engineering-kb|WoW Addon Engineering KB' --exclude-dir=.git --exclude-dir=target .; then
            echo 'operator-only provider identity leaked into public tree' >&2
            exit 1
          fi
      - name: Commit validated owner package
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-generated-api-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(wow-reference): finalize generated API import"
          git push origin HEAD:main
