name: Record PR 264 exact-head evidence

on:
  push:
    branches: [fix/map-project-limitations-2026-10-26]

permissions:
  contents: write

concurrency:
  group: pr264-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Apply exact evidence patch and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/pr264-run510.patch
          git apply .github/pr264-run510.patch
          rm .github/pr264-run510.patch .github/workflows/pr264-run510.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATUS.md docs/IMPLEMENTATION_TRACE_REGISTER.md docs/REFACTOR_QUEUE.md .github/pr264-run510.patch .github/workflows/pr264-run510.yml
          git commit -m "docs: record PR 264 exact-head evidence"
          git push origin "HEAD:${BRANCH_NAME}"
