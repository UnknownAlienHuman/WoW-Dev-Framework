name: Native current-source annotations
on:
  push:
    branches: [main]
    paths:
      - 'crates/wow-reference/**'
      - 'crates/wow-annotations/**'
      - 'tools/xtask/**'
      - 'Cargo.*'
      - '.cargo/config.toml'
      - '.github/workflows/current-source-bundle.yml'
  pull_request:
    paths:
      - 'crates/wow-reference/**'
      - 'crates/wow-annotations/**'
      - 'tools/xtask/**'
      - 'Cargo.*'
      - '.cargo/config.toml'
      - '.github/workflows/current-source-bundle.yml'
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Moving Gethe branch to inspect
        default: live
        required: true
      environment:
        description: Explicit source environment
        default: Mainline
        required: true
      toc:
        description: Generated API TOC relative to the selected source
        default: Interface/AddOns/Blizzard_APIDocumentationGenerated/Blizzard_APIDocumentationGenerated.toc
        required: true
permissions:
  contents: read
concurrency:
  group: current-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'live' }}
      SOURCE_ENVIRONMENT: ${{ inputs.environment || 'Mainline' }}
      SOURCE_TOC: ${{ inputs.toc || 'Interface/AddOns/Blizzard_APIDocumentationGenerated/Blizzard_APIDocumentationGenerated.toc' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Clone current Blizzard source
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$SOURCE_REF"
          git -c core.hooksPath=/dev/null clone --depth=1 --no-tags --single-branch --branch "$SOURCE_REF" \
            https://github.com/Gethe/wow-ui-source.git "$RUNNER_TEMP/wow-ui-source"
          git -C "$RUNNER_TEMP/wow-ui-source" rev-parse HEAD > "$RUNNER_TEMP/source-revision"
      - name: Build and independently verify exact source inventory in Rust
        run: |
          set -euo pipefail
          revision="$(cat "$RUNNER_TEMP/source-revision")"
          cargo +stable xtask manifest "$RUNNER_TEMP/wow-ui-source" "$revision" "$SOURCE_REF" "$RUNNER_TEMP/source-manifest.json"
          cargo +stable xtask verify-manifest "$RUNNER_TEMP/source-manifest.json" "$RUNNER_TEMP/wow-ui-source" HEAD
      - name: Generate annotations through the native Ketho path
        run: |
          set -euo pipefail
          result=0
          cargo +stable run --locked -p wow-annotations --example native_library -- \
            "$RUNNER_TEMP/wow-ui-source" "$(cat "$RUNNER_TEMP/source-revision")" \
            "$SOURCE_TOC" "$SOURCE_ENVIRONMENT" "$RUNNER_TEMP/native-annotations" || result=$?
          case "$result" in
            0) ;;
            3) echo '::warning::Native projection is partial; inspect the source report' ;;
            *) exit "$result" ;;
          esac
      - name: Verify final annotation bytes and source admission in Rust
        run: |
          set -euo pipefail
          result=0
          cargo +stable xtask verify-library "$RUNNER_TEMP/native-annotations" --require-input-complete || result=$?
          case "$result" in
            0) ;;
            3) echo '::warning::Verified artifact remains semantically partial; not consumer certification' ;;
            *) exit "$result" ;;
          esac
      - name: Retain source and projection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-source-report-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-annotations/source-report.json
            ${{ runner.temp }}/source-manifest.json
            ${{ runner.temp }}/source-revision
          retention-days: 3
          if-no-files-found: error
