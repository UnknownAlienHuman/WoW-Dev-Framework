name: W09 package closure checkpoint v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w09-package-closure-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: w09-package-closure-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_COMMIT: 686dde0b0ec2cd1f52e9d9a942acf5b82219f92e
      BASE_TREE: 9d67403801a92992105ba5f92e8b9580bcab973c
      STAGING_PARENT: f8964dae1b0301a0411cbcef6f730fbd9729ea7e
      PATCH_SHA256: 5acc3735ce640cfb5e5ec2f654df19d7f56a2abd2eada7e519ecf7b7065cb6cc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Admit corrected W09 patch and remove checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          cat .ci/w09-package-closure.patch.xz.b64.* > "$RUNNER_TEMP/w09.patch.xz.b64"
          base64 -d "$RUNNER_TEMP/w09.patch.xz.b64" > "$RUNNER_TEMP/w09.patch.xz"
          xz -dc "$RUNNER_TEMP/w09.patch.xz" > "$RUNNER_TEMP/w09.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w09.patch" | sha256sum -c -
          git rm -- .ci/w09-package-closure.patch.xz.b64.* .github/workflows/w09-package-closure-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w09.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Minimal wow-project Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked -p wow-project --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$BASE_COMMIT")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "crates/wow-project/src/load/mod.rs"
          test "${changed[1]}" = "crates/wow-project/src/load/package_closure.rs"
      - name: Retain exact checked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          cp "$RUNNER_TEMP/RUST_VERSION" "$RUNNER_TEMP/clippy.log" "$RUNNER_TEMP/policy.log" "$RUNNER_TEMP/checkpoint/"
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        uses: actions/upload-artifact@v7
        with:
          name: w09-package-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
      - name: Fast-forward exact checked tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git commit -m 'feat(wow-project): resolve explicit package load closure [skip ci]'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
