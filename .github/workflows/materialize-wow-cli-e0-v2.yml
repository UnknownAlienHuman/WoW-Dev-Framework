name: Materialize apps/wow E0 CLI v2

on:
  push:
    branches:
      - work/wow-cli-e0
    paths:
      - .ci/materialize/wow-cli-e0-v2/**
      - .github/workflows/materialize-wow-cli-e0-v2.yml

permissions:
  contents: write

concurrency:
  group: materialize-wow-cli-e0-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Verify and materialize reviewed production tree
        run: |
          set -euo pipefail
          test "$(find .ci/materialize/wow-cli-e0-v2 -maxdepth 1 -type f | wc -l)" -eq 13
          cat .ci/materialize/wow-cli-e0-v2/0[0-9] .ci/materialize/wow-cli-e0-v2/1[0-2] > "$RUNNER_TEMP/wow-cli-e0.b64"
          echo '27eea047d0b07017f72188a78cdb976a4697799643070230ab082925d457e402  '"$RUNNER_TEMP/wow-cli-e0.b64" | sha256sum --check --status
          base64 --decode "$RUNNER_TEMP/wow-cli-e0.b64" > "$RUNNER_TEMP/wow-cli-e0.tar.gz"
          echo '0c912dbd675612807408197982736fa8026bc5ab29ad1eebcc21d9fb968d3275  '"$RUNNER_TEMP/wow-cli-e0.tar.gz" | sha256sum --check --status
          tar -tzf "$RUNNER_TEMP/wow-cli-e0.tar.gz" | LC_ALL=C sort > "$RUNNER_TEMP/actual-files"
          cat > "$RUNNER_TEMP/expected-files" <<'EOF'
          .github/workflows/ci.yml
          Cargo.lock
          Cargo.toml
          apps/wow/Cargo.toml
          apps/wow/src/cli.rs
          apps/wow/src/lib.rs
          apps/wow/src/main.rs
          apps/wow/src/output.rs
          apps/wow/tests/e0_cli.rs
          crates/wow-service/src/fixture.rs
          crates/wow-service/src/lib.rs
          crates/wow-service/src/model.rs
          crates/wow-service/src/service.rs
          crates/wow-service/tests/e0_fixture.rs
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          tar -xzf "$RUNNER_TEMP/wow-cli-e0.tar.gz" -C .
          rm -rf .ci/materialize/wow-cli-e0 .ci/materialize/wow-cli-e0-v2
          rm -f .github/workflows/materialize-wow-cli-e0.yml
          rm .github/workflows/materialize-wow-cli-e0-v2.yml
          git add -A
      - name: Format and verify runnable E0 slice
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +stable test --locked --workspace --all-targets --all-features
          cargo +stable test --release --locked --workspace --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Commit and push only verified production files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(cli): activate deterministic E0 status and check'
          git push origin HEAD:work/wow-cli-e0
