name: W11 CreateFrame compile gate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w11-create-frame-compile.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked -p wow-emmy -p wow-project -p wow-recognizers --all-targets --all-features -- -D warnings
