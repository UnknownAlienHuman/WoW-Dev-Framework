name: W08 publish exact API snapshot tree
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w08-api-snapshot-checkpoint.yml
permissions:
  actions: read
  contents: write
concurrency:
  group: w08-api-snapshot-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_PARENT: 75ac76ef324d3e14d5a16dadbe281fdf4870e729
      ARTIFACT_ID: 11145625846
      ARTIFACT_ZIP_SHA256: 22f1c969aa569e5e92ac7406cd18b1ce1f13329301947b1f9739510fe8f1705d
      SOURCE_TAR_SHA256: 1678cd83e56731a1cc422fd358984a09c4acdb9885dbdb43b782d429e60d2cc9
      CHECKED_TREE: 312caed69e65a5b907dfa219e2fb3aa739837ece
      CHECKED_STAGING_SHA: 75ac76ef324d3e14d5a16dadbe281fdf4870e729
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Recover exact checked source and fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"

          mkdir -p "$RUNNER_TEMP/checked"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/checked.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/checked.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/checked.zip" -d "$RUNNER_TEMP/checked"
          test "$(cat "$RUNNER_TEMP/checked/CHECKED_TREE")" = "$CHECKED_TREE"
          test "$(cat "$RUNNER_TEMP/checked/STAGING_SHA")" = "$CHECKED_STAGING_SHA"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$RUNNER_TEMP/checked/checked-source.tar" | sha256sum -c -
          (cd "$RUNNER_TEMP/checked" && sha256sum -c SHA256SUMS)

          git rm -r --ignore-unmatch .
          git clean -fdx
          tar -xf "$RUNNER_TEMP/checked/checked-source.tar" -C .
          git add --all
          test "$(git write-tree)" = "$CHECKED_TREE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(xtask): materialize exact GitHub API source snapshots [skip ci]' \
            -m 'Add an explicit exact-revision GitHub API fallback that resolves one commit/tree, reads each selected blob independently under finite response budgets, publishes an immutable verified snapshot and source manifest, and supports durable prompt/auto/never replay. Strict xtask Clippy and repository policy passed on Linux with Rust 1.98.1; no tests executed.'
          git push origin HEAD:main
