name: Apply legacy report9 replay removal

on:
  push:
    branches:
      - refactor/remove-legacy-global-access-replay-2026-10-20

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Remove frozen report9 replay route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/remove-legacy-global-access-replay-v2.py")
          text = path.read_text()
          old = '''text = many(
              text,
              '    "wow-project.live-replay.v13",\\n',
              "",
              5,
              "schema13 catalog memberships",
          )
          path.write_text(text)
          '''
          new = '''text = many(
              text,
              '    "wow-project.live-replay.v13",\\n',
              "",
              5,
              "schema13 catalog memberships",
          )
          text = once(
              text,
              '                | "wow-project.live-replay.v13"\\n',
              "",
              "schema13 read admission",
          )
          path.write_text(text)
          '''
          if text.count(old) != 1:
              raise SystemExit("schema13 read-admission patch input mismatch")
          path.write_text(text.replace(old, new, 1))
          PY
          python .github/remove-legacy-global-access-replay-v2.py
          git rm .github/remove-legacy-global-access-replay.py
          git rm -f .github/remove-legacy-global-access-replay-v2.py
          git rm .github/workflows/apply-remove-legacy-global-access-replay.yml
          git add -u
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove legacy global-access replay"
          git push origin "HEAD:${GITHUB_REF_NAME}"
