name: Apply legacy report9 replay removal

on:
  push:
    branches:
      - refactor/remove-legacy-global-access-replay-2026-10-20

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Remove frozen report9 replay route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/remove-legacy-global-access-replay.py")
          text = path.read_text()
          for old, new, label in [
              (
                  '    2,\n    "component collector legacy arguments",\n',
                  '    4,\n    "component collector legacy arguments",\n',
                  "component collector cardinality",
              ),
              (
                  '    2,\n    "ordinary collector legacy arguments",\n',
                  '    0,\n    "ordinary collector legacy arguments",\n',
                  "ordinary collector cardinality",
              ),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: patch input mismatch")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python .github/remove-legacy-global-access-replay.py
          git rm .github/remove-legacy-global-access-replay.py
          git rm .github/workflows/apply-remove-legacy-global-access-replay.yml
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove legacy global-access replay"
          git push origin "HEAD:${GITHUB_REF_NAME}"
