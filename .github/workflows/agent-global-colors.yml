name: Agent GlobalColors implementation
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_global_colors.py'
      - '.github/workflows/agent-global-colors.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agent-global-colors-main
  cancel-in-progress: false
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Apply production implementation
        run: python .github/scripts/apply_global_colors.py .
      - name: Format and validate the complete workspace
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +stable test --locked --workspace --all-targets --all-features
          cargo +stable test --release --locked --workspace --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Verify the moving Ketho GlobalColors resource on current Blizzard source
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null clone --depth=1 --no-tags --single-branch --branch live \
            https://github.com/Gethe/wow-ui-source.git "$RUNNER_TEMP/wow-ui-source"
          source_revision="$(git -C "$RUNNER_TEMP/wow-ui-source" rev-parse HEAD)"
          cargo +stable xtask update-source "$RUNNER_TEMP/wow-ui-source" live --expected-head "$source_revision" > "$RUNNER_TEMP/source-update.json"
          git -c core.hooksPath=/dev/null clone --depth=1 --no-tags --single-branch \
            https://github.com/Ketho/vscode-wow-api.git "$RUNNER_TEMP/ketho-source"
          alias_revision="$(git -C "$RUNNER_TEMP/ketho-source" rev-parse HEAD)"
          alias_branch="$(git -C "$RUNNER_TEMP/ketho-source" symbolic-ref --quiet --short HEAD)"
          cargo +stable xtask update-source "$RUNNER_TEMP/ketho-source" "$alias_branch" --expected-head "$alias_revision" > "$RUNNER_TEMP/alias-update.json"
          result=0
          cargo +stable run --locked -p wow-annotations --example native_library -- \
            "$RUNNER_TEMP/wow-ui-source" "$source_revision" \
            Interface/AddOns/Blizzard_APIDocumentationGenerated/Blizzard_APIDocumentationGenerated.toc \
            Mainline "$RUNNER_TEMP/native-global-colors" \
            --alias-catalog "$RUNNER_TEMP/ketho-source" "$alias_revision" \
            Annotations/Core/Type/BlizzardType.lua \
            --alias-catalog "$RUNNER_TEMP/ketho-source" "$alias_revision" \
            Annotations/Core/Type/GlobalColors.lua || result=$?
          case "$result" in 0|3) ;; *) exit "$result" ;; esac
          result=0
          cargo +stable xtask verify-library "$RUNNER_TEMP/native-global-colors" --require-input-complete || result=$?
          case "$result" in 0|3) ;; *) exit "$result" ;; esac
      - name: Publish directly to main and remove staging machinery
        run: |
          set -euo pipefail
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git rm .github/scripts/apply_global_colors.py .github/workflows/agent-global-colors.yml
          if test -f .github/scripts/write-route-probe.txt; then git rm .github/scripts/write-route-probe.txt; fi
          git add -A
          git commit -m 'feat(annotations): project inert Ketho GlobalColors'
          git push origin HEAD:main
