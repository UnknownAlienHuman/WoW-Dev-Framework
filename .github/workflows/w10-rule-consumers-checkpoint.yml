name: W10 XML rule consumer checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w10-rule-consumers-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: w10-rule-consumers-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_COMMIT: e518570e70d40d6e33da7308f37c81783972ee3f
      BASE_TREE: a46e3bc806bd8901e525c8a12cc3b9ebd15f0865
      TRIGGER_PARENT: a3e765d23eaa2be5500addf16b3d367b6e5b2488
      PATCH_SHA256: e300862d476584a9252e6f525662e0f8fdf967283e016da101afca9514fec00c
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Admit exact patch and remove transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$TRIGGER_PARENT"
          xz -t .ci/w10-rule-consumers.patch.xz
          xz -dc .ci/w10-rule-consumers.patch.xz > "$RUNNER_TEMP/w10.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w10.patch" | sha256sum -c -
          git rm --             .ci/w10-rule-consumers.patch.xz             .github/workflows/w10-rule-consumers-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w10.patch"
      - name: Install compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Strict affected-crate Clippy
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked             -p wow-project -p wow-rules -p wow-service -p wow-cli             --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Existing affected-crate tests
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable test --locked             -p wow-project -p wow-rules -p wow-service             --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          git diff --cached --name-only "$BASE_COMMIT" | sort > "$RUNNER_TEMP/changed-files"
          cat > "$RUNNER_TEMP/expected-files" <<'FILES'
          crates/wow-project/src/lib.rs
          crates/wow-project/src/snapshot.rs
          crates/wow-rules/src/context.rs
          crates/wow-rules/src/engine.rs
          crates/wow-service/src/local/projection.rs
          FILES
          sed -i 's/^          //' "$RUNNER_TEMP/expected-files"
          sort -o "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log tests.log policy.log changed-files expected-files; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w10-rule-consumers-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
      - name: Fast-forward exact checked tree to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(wow-rules): evaluate exact XML inline API facts [skip ci]'
          git push origin HEAD:main
