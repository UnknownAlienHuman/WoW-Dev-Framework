name: W11 native-event callable checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w11-event-callables-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: w11-event-callables-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_COMMIT: 4d0ea4702ca252318bf5fe838029a1a2ee0ecd49
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Assemble and apply verified callable seam
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          tr -d '\n' < .github/w11-event-callables/payload.b64 > "$RUNNER_TEMP/w11-patch.zlib.b64"
          test "$(wc -c < "$RUNNER_TEMP/w11-patch.zlib.b64")" = "2576"
          echo "2cee54256842df51ba6359d6289899736c98f6496966f5c3d5ddbdcde196c0fa  $RUNNER_TEMP/w11-patch.zlib.b64" | sha256sum -c -
          python3 -c 'import base64,sys,zlib; sys.stdout.buffer.write(zlib.decompress(base64.b64decode(sys.stdin.buffer.read())))' \
            < "$RUNNER_TEMP/w11-patch.zlib.b64" > "$RUNNER_TEMP/w11-patch.py"
          echo "3ccba8623cd02f6a26549a03353807409819a6c8d0f3eaa553a3fb77149c8807  $RUNNER_TEMP/w11-patch.py" | sha256sum -c -
          git rm -r -- .github/w11-event-callables .github/workflows/w11-event-callables-checkpoint.yml
          python3 "$RUNNER_TEMP/w11-patch.py"
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              item = Path(path)
              text = item.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"patch marker count for {path}: expected 1, found {count}")
              item.write_text(text.replace(old, new, 1))

          path = "crates/wow-emmy/src/references.rs"
          replace(
              path,
              '''/// Resolve an additional reviewed callable-query profile in the same exact
          /// semantic session. The returned symbol lookup remains scoped to `queries`;
          /// callable-only lookup identity is retained by the function-call sidecar.
          pub fn analyze_member_call_session_with_callable_queries(
              main: &LuaWorkspaceSnapshot,
              libraries: &[&LuaWorkspaceSnapshot],
              queries: &[String],
              callable_queries: &[String],
              include_function_calls: bool,
              stop: &std::sync::atomic::AtomicBool,
          ) -> EmmyMemberCallResult<MemberCallSession> {
              analyze_member_call_session_impl(
                  main,
                  libraries,
                  None,
                  None,
                  queries,
                  callable_queries,
                  include_function_calls,
                  stop,
              )
          }
          ''',
              '''/// Exact query lanes for one already-populated member-call session.
          #[derive(Debug, Clone, Copy)]
          pub struct MemberCallSessionQueryProfile<'a> {
              symbol_queries: &'a [String],
              callable_queries: &'a [String],
          }

          impl<'a> MemberCallSessionQueryProfile<'a> {
              #[must_use]
              pub const fn new(
                  symbol_queries: &'a [String],
                  callable_queries: &'a [String],
              ) -> Self {
                  Self {
                      symbol_queries,
                      callable_queries,
                  }
              }
          }

          /// Resolve an additional reviewed callable-query profile in the same exact
          /// semantic session. The returned symbol lookup remains scoped to the symbol
          /// lane; callable-only lookup identity is retained by the function-call sidecar.
          pub fn analyze_member_call_session_with_callable_queries(
              main: &LuaWorkspaceSnapshot,
              libraries: &[&LuaWorkspaceSnapshot],
              query_profile: MemberCallSessionQueryProfile<'_>,
              include_function_calls: bool,
              stop: &std::sync::atomic::AtomicBool,
          ) -> EmmyMemberCallResult<MemberCallSession> {
              analyze_member_call_session_impl(
                  main,
                  libraries,
                  None,
                  None,
                  query_profile.symbol_queries,
                  query_profile.callable_queries,
                  include_function_calls,
                  stop,
              )
          }
          ''',
          )
          replace(
              path,
              '''pub fn analyze_member_call_session_with_virtual_and_callable_queries(
              main: &LuaWorkspaceSnapshot,
              libraries: &[&LuaWorkspaceSnapshot],
              virtual_units: &LuaWorkspaceSnapshot,
              project_generation: ProjectGenerationId,
              queries: &[String],
              callable_queries: &[String],
              include_function_calls: bool,
              stop: &std::sync::atomic::AtomicBool,
          ) -> EmmyMemberCallResult<MemberCallSession> {
              analyze_member_call_session_impl(
                  main,
                  libraries,
                  Some(virtual_units),
                  Some(project_generation),
                  queries,
                  callable_queries,
                  include_function_calls,
                  stop,
              )
          }
          ''',
              '''pub fn analyze_member_call_session_with_virtual_and_callable_queries(
              main: &LuaWorkspaceSnapshot,
              libraries: &[&LuaWorkspaceSnapshot],
              virtual_units: &LuaWorkspaceSnapshot,
              project_generation: ProjectGenerationId,
              query_profile: MemberCallSessionQueryProfile<'_>,
              include_function_calls: bool,
              stop: &std::sync::atomic::AtomicBool,
          ) -> EmmyMemberCallResult<MemberCallSession> {
              analyze_member_call_session_impl(
                  main,
                  libraries,
                  Some(virtual_units),
                  Some(project_generation),
                  query_profile.symbol_queries,
                  query_profile.callable_queries,
                  include_function_calls,
                  stop,
              )
          }
          ''',
          )

          path = "crates/wow-emmy/src/lib.rs"
          replace(
              path,
              '''    EmmyReferenceResolution, analyze_member_call_session_with_callable_queries,
              analyze_member_call_session_with_virtual_and_callable_queries, analyze_member_calls,
          ''',
              '''    EmmyReferenceResolution, MemberCallSessionQueryProfile,
              analyze_member_call_session_with_callable_queries,
              analyze_member_call_session_with_virtual_and_callable_queries, analyze_member_calls,
          ''',
          )

          path = "crates/wow-project/src/analyzer.rs"
          replace(
              path,
              '''    let session = match pending_xml_lua
              .as_ref()
              .and_then(crate::xml_lua::PreparedProjectXmlLuaAnalysis::virtual_workspace)
          {
          ''',
              '''    let query_profile =
              wow_emmy::MemberCallSessionQueryProfile::new(queries, &callable_queries);
              let session = match pending_xml_lua
                  .as_ref()
                  .and_then(crate::xml_lua::PreparedProjectXmlLuaAnalysis::virtual_workspace)
              {
          ''',
          )
          replace(
              path,
              '''                generation.project_generation(),
                          queries,
                          &callable_queries,
                          function_calls,
          ''',
              '''                generation.project_generation(),
                          query_profile,
                          function_calls,
          ''',
          )
          replace(
              path,
              '''            queries,
                      &callable_queries,
                      function_calls,
          ''',
              '''            query_profile,
                      function_calls,
          ''',
          )
          PY
      - name: Install compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Strict affected-chain Clippy
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked \
            -p wow-emmy -p wow-project -p wow-recognizers -p wow-service -p wow-cli \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact product boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          git diff --cached --name-only "$BASE_COMMIT" | sort > "$RUNNER_TEMP/changed-files"
          cat > "$RUNNER_TEMP/expected-files" <<'FILES'
          crates/wow-emmy/src/lib.rs
          crates/wow-emmy/src/references.rs
          crates/wow-project/src/analyzer.rs
          FILES
          sed -i 's/^          //' "$RUNNER_TEMP/expected-files"
          sort -o "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log changed-files expected-files; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w11-event-callables-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
      - name: Publish exact checked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(wow-emmy): retain native-event callable keys [skip ci]'
          git push origin HEAD:main
