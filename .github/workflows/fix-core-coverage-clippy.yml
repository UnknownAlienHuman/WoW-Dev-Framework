name: Fix core coverage Clippy

on:
  push:
    branches:
      - refactor/remove-core-e0-envelopes-2026-10-18

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove helpers orphaned with the envelope
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("crates/wow-core/tests/coverage_join/evaluations.rs"); t=p.read_text(); old="    let mut value = fixture(0)?;"; assert t.count(old)==2; p.write_text(t.replace(old,"    let value = fixture(0)?;",1))'
          python -c 'from pathlib import Path; p=Path("crates/wow-core/tests/coverage_join/support.rs"); t=p.read_text(); start=t.index("pub fn refresh_summaries"); end=t.index("pub fn reseal_evaluation"); t=t[:start]+t[end:]; old="    CapabilitySummary, CoreErrorCode, CoreResult, CoverageId, CoverageRecord, CoverageStatus,\n    GenerationContext, NegativeAuthorityDecision, NotEvaluatedId, NotEvaluatedRecord,\n    TruncationState, combine_coverage, evaluate_negative_authority,\n"; new="    CapabilitySummary, CoreErrorCode, CoreResult, CoverageRecord, CoverageStatus,\n    GenerationContext, NegativeAuthorityDecision, NotEvaluatedId, NotEvaluatedRecord,\n    TruncationState, evaluate_negative_authority,\n"; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          git rm .github/workflows/fix-core-coverage-clippy.yml
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-core
          git commit -m "test: remove orphaned coverage helpers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
