name: Materialize recognizers matcher core

on:
  push:
    branches:
      - work/recognizers-matcher-core
    paths:
      - .ci/materialize/recognizers-matcher/**
      - .github/workflows/materialize-recognizers-matcher.yml

permissions:
  contents: write

concurrency:
  group: materialize-recognizers-matcher
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Materialize reviewed matcher payload
        run: |
          set -euo pipefail
          echo '44c9db3d3779bfef9af3dc6be0ebcd943b0e430b59e87a3a6033c29675a5d617  .ci/materialize/recognizers-matcher/payload.b64' | sha256sum --check --status
          base64 --decode .ci/materialize/recognizers-matcher/payload.b64 > "$RUNNER_TEMP/recognizers-matcher.tar.gz"
          echo '9131cf38c161634794bd28f89162b4fad96655685a447408a7a4e37bf7bd0151  '"$RUNNER_TEMP/recognizers-matcher.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/recognizers-matcher.tar.gz" -C .
          rm -rf .ci/materialize/recognizers-matcher
          rm .github/workflows/materialize-recognizers-matcher.yml
          cargo +stable fmt --all
          git add -A
          git diff --cached --check
      - name: Verify matcher and workspace
        run: |
          set -euo pipefail
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable test --locked --package wow-recognizers --all-targets --all-features -- --nocapture
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+UnknownAlienHuman@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(recognizers): execute bounded E2-B semantic plans'
          git push origin HEAD:work/recognizers-matcher-core
