name: Blizzard API reference draft

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-blizzard-api-reference.py"
      - "scripts/verify-blizzard-api-reference.py"
      - "scripts/build-blizzard-source-manifest.py"
      - "scripts/verify-blizzard-source-manifest.py"
      - "tests/test_blizzard_api_reference.py"
      - "docs/BLIZZARD_API_REFERENCE_DRAFT.md"
      - ".github/workflows/blizzard-api-reference.yml"
  pull_request:
    paths:
      - "scripts/build-blizzard-api-reference.py"
      - "scripts/verify-blizzard-api-reference.py"
      - "scripts/build-blizzard-source-manifest.py"
      - "scripts/verify-blizzard-source-manifest.py"
      - "tests/test_blizzard_api_reference.py"
      - "docs/BLIZZARD_API_REFERENCE_DRAFT.md"
      - ".github/workflows/blizzard-api-reference.yml"
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blizzard-api-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Compile scripts
        run: >-
          python -m py_compile
          scripts/build-blizzard-api-reference.py
          scripts/verify-blizzard-api-reference.py
          tests/test_blizzard_api_reference.py
      - name: Run producer tests
        run: python -m unittest tests.test_blizzard_api_reference

  current-source-smoke:
    name: Current source smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Resolve current source into a local clone
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --single-branch --branch live \
            https://github.com/Gethe/wow-ui-source.git "$RUNNER_TEMP/wow-ui-source"
          git -C "$RUNNER_TEMP/wow-ui-source" rev-parse HEAD > "$RUNNER_TEMP/source-revision"
      - name: Build exact source manifest
        shell: bash
        run: |
          set -euo pipefail
          revision="$(cat "$RUNNER_TEMP/source-revision")"
          python scripts/build-blizzard-source-manifest.py \
            --source "$RUNNER_TEMP/wow-ui-source" \
            --revision "$revision" \
            --selector live \
            --output "$RUNNER_TEMP/source-manifest.json"
          python scripts/verify-blizzard-source-manifest.py \
            "$RUNNER_TEMP/source-manifest.json" \
            --source "$RUNNER_TEMP/wow-ui-source"
      - name: Build and verify current generated API draft
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-blizzard-api-reference.py \
            --manifest "$RUNNER_TEMP/source-manifest.json" \
            --source "$RUNNER_TEMP/wow-ui-source" \
            --output "$RUNNER_TEMP/blizzard-api-reference.json" \
            --json
          python scripts/verify-blizzard-api-reference.py \
            "$RUNNER_TEMP/blizzard-api-reference.json" \
            --require-complete \
            --json
