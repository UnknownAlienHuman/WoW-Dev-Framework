name: E0 error guarded acceptance
on:
  push:
    branches: [main]
    paths: ['.ci/e0-error/**', '.github/workflows/e0-error-gate.yml']
permissions:
  contents: read
concurrency:
  group: e0-error-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Admit exact error patch and reviewed base
        run: |
          set -euo pipefail
          cat .ci/e0-error/{00,01,02,03,04} | base64 -d > "$RUNNER_TEMP/error.patch.gz"
          echo "17ebffad49b278dc7bedbd9ba22be5adc4b5e29d90cea4339fc0e87d67e464d9  $RUNNER_TEMP/error.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/error.patch.gz" > "$RUNNER_TEMP/error.patch"
          echo "bd8c52bfa008adc440af924390be77e2f82483279ab45ff08e44047863778a42  $RUNNER_TEMP/error.patch" | sha256sum -c -
          cp .ci/e0-error/correction.patch "$RUNNER_TEMP/error-correction.patch"
          echo "bd4b57412d9bc535bca1452082984e8edb12a718869fbf78f9ed07ee652fd2b4  $RUNNER_TEMP/error-correction.patch" | sha256sum -c -
          git rm -r .ci/e0-error .github/workflows/e0-error-gate.yml
          test "$(git write-tree)" = 3b7ea79b55ad54121e010ff25a2da2203c4ed3bb
          git apply --index --check "$RUNNER_TEMP/error.patch"
          git apply --index "$RUNNER_TEMP/error.patch"
          test "$(git write-tree)" = 5d75a3a716bd0801df2a30f4a13b65c23cbbf3a5
          git apply --index --check "$RUNNER_TEMP/error-correction.patch"
          git apply --index "$RUNNER_TEMP/error-correction.patch"
          test "$(git write-tree)" = 9c44befe64ef94574f16e091ee9a385738c1d511
      - name: Install stable Rust and retain exact inputs
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          mkdir -p "$RUNNER_TEMP/error-results"
          git rev-parse HEAD > "$RUNNER_TEMP/error-results/BASE_SHA"
          rustc +stable -Vv > "$RUNNER_TEMP/error-results/RUST_VERSION"
      - name: Format reviewed source and retain exact tree
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          git diff --exit-code -- . ':(exclude)crates/wow-core/src/digest.rs' ':(exclude)crates/wow-core/src/envelope.rs' ':(exclude)crates/wow-core/src/error.rs' ':(exclude)crates/wow-core/src/error/admission.rs' ':(exclude)crates/wow-core/src/ids.rs' ':(exclude)crates/wow-core/src/integrity.rs' ':(exclude)crates/wow-core/tests/e0_error_conformance.rs'
          git add crates/wow-core/src/digest.rs crates/wow-core/src/envelope.rs crates/wow-core/src/error.rs crates/wow-core/src/error/admission.rs crates/wow-core/src/ids.rs crates/wow-core/src/integrity.rs crates/wow-core/tests/e0_error_conformance.rs
          git diff --exit-code
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/error-results/TREE_SHA"
          sha256sum crates/wow-core/src/digest.rs crates/wow-core/src/envelope.rs crates/wow-core/src/error.rs crates/wow-core/src/error/admission.rs crates/wow-core/src/ids.rs crates/wow-core/src/integrity.rs crates/wow-core/tests/e0_error_conformance.rs > "$RUNNER_TEMP/error-results/SOURCE_SHA256SUMS"
      - name: Build core implementation and test targets
        run: cargo +stable build --locked -p wow-core --all-targets
      - name: Verify error admission, strict versions and golden consumers
        run: |
          set -euo pipefail
          cargo +stable test --locked -p wow-core --test e0_error_conformance --test e0_examples --test hash_vectors 2>&1 | tee "$RUNNER_TEMP/error-results/core-tests.txt"
          cargo +stable test --locked -p wow-core --features serde_json/arbitrary_precision --test e0_error_conformance --test e0_examples --test hash_vectors 2>&1 | tee "$RUNNER_TEMP/error-results/number-feature-tests.txt"
      - name: Prove four defects on unchanged owner code
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          trap 'git checkout-index -a -f' EXIT
          for path in error.rs digest.rs ids.rs; do
            git show HEAD:crates/wow-core/src/$path > crates/wow-core/src/$path
          done
          cases=(
            error_002_operations_are_metadata_not_paths_or_prose
            error_005_subject_ids_match_their_declared_family
            error_008_path_arguments_reject_normalization_and_drive_bypasses
            error_018_tool_versions_reuse_strict_parse_on_wire_input
          )
          for index in "${!cases[@]}"; do
            case="${cases[$index]}"
            log="$RUNNER_TEMP/error-results/baseline-$index.txt"
            set +e
            cargo +stable test --locked -p wow-core --test e0_error_conformance "$case" -- --exact > "$log" 2>&1
            status=$?
            set -e
            test "$status" -eq 101
            grep -F 'running 1 test' "$log"
            grep -F "test $case ... FAILED" "$log"
            grep -F 'test result: FAILED. 0 passed; 1 failed' "$log"
          done
      - name: Repository policy and formatting
        run: |
          cargo +stable xtask check
          cargo +stable fmt --all --check
      - name: Locked workspace check
        run: cargo +stable check --locked --workspace --all-targets --all-features
      - name: Strict workspace Clippy
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Locked debug workspace tests
        run: cargo +stable test --locked --workspace --all-targets --all-features
      - name: Locked release workspace tests
        run: cargo +stable test --release --locked --workspace --all-targets --all-features
      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Retain exact tested change
        run: |
          set -euo pipefail
          git diff --exit-code
          sha256sum -c "$RUNNER_TEMP/error-results/SOURCE_SHA256SUMS"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/error-results/TREE_SHA")"
          git diff --cached --binary HEAD > "$RUNNER_TEMP/error-results/verified.patch"
          cd "$RUNNER_TEMP/error-results"
          sha256sum verified.patch > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e0-error-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/error-results/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-error-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-error-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows
      - name: Publish only identical verified trees on unchanged main
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          ACCEPTANCE_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for platform in linux windows; do
            test "$(cat "$RUNNER_TEMP/$platform/BASE_SHA")" = "$EXPECTED_HEAD"
            (cd "$RUNNER_TEMP/$platform" && sha256sum -c SHA256SUMS)
          done
          cmp "$RUNNER_TEMP/linux/TREE_SHA" "$RUNNER_TEMP/windows/TREE_SHA"
          cmp "$RUNNER_TEMP/linux/verified.patch" "$RUNNER_TEMP/windows/verified.patch"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git apply --index --check "$RUNNER_TEMP/linux/verified.patch"
          git apply --index "$RUNNER_TEMP/linux/verified.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux/TREE_SHA")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(core): admit structured error metadata and strict wire versions' -m "Continue R0-01. Validate canonical error operation/field/subject metadata and typed path/identifier arguments; preserve kind-only errors. Replace raw digest algorithm and dependency error prose with safe fixed metadata. ToolVersion decoding now reuses the strict parser and cannot admit forbidden build metadata. Nineteen focused cases and unchanged golden consumers passed in core-only/arbitrary_precision profiles; four baseline controls reproduced defects. Locked workspace check, strict Clippy, debug/release tests, rustdoc, fmt and policy passed on Linux/Windows in run $ACCEPTANCE_RUN. Identical tested trees only; no dependency or golden fixture changed. Temporary inputs removed. Caller Text secrecy, complete error-category policy, source provenance and full E0-A/R0 remain separate."
          git push origin HEAD:refs/heads/main
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git log -1 --format='%H %T'
