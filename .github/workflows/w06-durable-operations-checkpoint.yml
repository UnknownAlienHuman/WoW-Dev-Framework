name: W06 durable Reference Pack operations checkpoint
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: w06-durable-reference-pack-operations-checkpoint
  cancel-in-progress: false
env:
  BASE_COMMIT: 241c2aa2d687da2bfbaa8566077e83689d5f3bdb
  BASE_TREE: da9e402dd0d1b5002b07e682006a953d663c53fc
  STAGING_PARENT: 063ca9a2bdc202e243b5eef30e3cab8f334a80dd
  PATCH_SHA256: c556851b0bcf90c3f7880be9a08432b3da0d3df777e4696e9aadc67d7ccaf665
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact product patch and remove checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          cat .ci/w06-durable-operations.patch.xz.b64.* > "$RUNNER_TEMP/w06-durable-operations.patch.xz.b64"
          base64 -d "$RUNNER_TEMP/w06-durable-operations.patch.xz.b64" > "$RUNNER_TEMP/w06-durable-operations.patch.xz"
          xz -dc "$RUNNER_TEMP/w06-durable-operations.patch.xz" > "$RUNNER_TEMP/w06-durable-operations.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w06-durable-operations.patch" | sha256sum -c -
          git rm -- .ci/w06-durable-operations.patch.xz.b64.* .github/workflows/w06-durable-operations-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w06-durable-operations.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Minimal store and service Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked \
            -p wow-store -p wow-service \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          expected="$(cat <<'FILES'
          crates/wow-service/src/lib.rs
          crates/wow-service/src/reference_pack_admin.rs
          crates/wow-store/src/store.rs
          FILES
          )"
          test "$actual" = "$expected"
          ! grep -R "todo!()\|unimplemented!()" \
            crates/wow-service/src/reference_pack_admin.rs \
            crates/wow-store/src/store.rs
          grep -Fq 'wow-service/reference-pack-admin/e1-d/1' crates/wow-service/src/reference_pack_admin.rs
          grep -Fq 'reference-pack-operation-results' crates/wow-service/src/reference_pack_admin.rs
          grep -Fq 'return_observed_receipt_without_reexecution' crates/wow-service/src/reference_pack_admin.rs
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w06-durable-reference-pack-operations-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
