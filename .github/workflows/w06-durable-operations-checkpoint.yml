name: W06 publish checked durable Reference Pack operations
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: w06-durable-reference-pack-operations-publisher
  cancel-in-progress: false
env:
  BASE_COMMIT: 241c2aa2d687da2bfbaa8566077e83689d5f3bdb
  BASE_TREE: da9e402dd0d1b5002b07e682006a953d663c53fc
  STAGING_PARENT: 623596216d65bfe9f7fbd1d960f31167ce7a22af
  ARTIFACT_ID: '11125428142'
  ARTIFACT_ZIP_SHA256: 2d407b52559f4fd04554c2fc93f04dbd4a149fde41833ab71545121bb0797908
  SOURCE_TAR_SHA256: 2ee166083d8a3b019c522968c9a6a8882a8f1b70ab28b2c93322342c872276e7
  FORMATTED_PATCH_SHA256: d1233df1fdf8d99d3c38b3c6b61644a49aa7486b7d4ff84df140a71c5841a002
  CHECKED_TREE: 9e80b2ee28f340776d108224fa30bf0f35d6a996
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Recover and verify the exact checked source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          mkdir -p "$RUNNER_TEMP/w06-artifact"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/w06-artifact.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/w06-artifact.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/w06-artifact.zip" -d "$RUNNER_TEMP/w06-artifact"
          test "$(cat "$RUNNER_TEMP/w06-artifact/CHECKED_TREE")" = "$CHECKED_TREE"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$RUNNER_TEMP/w06-artifact/checked-source.tar" | sha256sum -c -
          printf '%s  %s\n' "$FORMATTED_PATCH_SHA256" "$RUNNER_TEMP/w06-artifact/formatted.patch" | sha256sum -c -

          git reset --hard "$BASE_COMMIT"
          git clean -fdx
          tar -xf "$RUNNER_TEMP/w06-artifact/checked-source.tar" -C .
          git add --all
          test "$(git write-tree)" = "$CHECKED_TREE"
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          expected="$(cat <<'FILES'
          crates/wow-service/src/lib.rs
          crates/wow-service/src/reference_pack_admin.rs
          crates/wow-store/src/store.rs
          FILES
          )"
          test "$actual" = "$expected"
      - name: Publish the exact checked tree to main
        id: publish
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (current.data.object.sha !== process.env.GITHUB_SHA) {
              core.setFailed(`main moved from ${process.env.GITHUB_SHA} to ${current.data.object.sha}`);
              return;
            }
            const paths = [
              'crates/wow-service/src/lib.rs',
              'crates/wow-service/src/reference_pack_admin.rs',
              'crates/wow-store/src/store.rs',
            ];
            const tree = [];
            const blobs = {};
            for (const filePath of paths) {
              const blob = await github.rest.git.createBlob({
                owner,
                repo,
                content: fs.readFileSync(filePath).toString('base64'),
                encoding: 'base64',
              });
              blobs[filePath] = blob.data.sha;
              tree.push({ path: filePath, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            const createdTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: process.env.BASE_TREE,
              tree,
            });
            if (createdTree.data.sha !== process.env.CHECKED_TREE) {
              core.setFailed(`created tree ${createdTree.data.sha} differs from checked tree ${process.env.CHECKED_TREE}`);
              return;
            }
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'feat(service): add durable Reference Pack operation administration [skip ci]\n\nW06 durable-operation slice. Build, validate and rebuild-compare now register exact request digests in the store operation journal, persist and read back canonical result receipts, replay completed operations without reexecution, reconcile prepared/unknown outcomes, and publish bounded recovery records. Selected wow-store/wow-service Clippy and repository policy passed on Linux with Rust 1.98.1; no tests executed.',
              tree: createdTree.data.sha,
              parents: [process.env.GITHUB_SHA],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/main',
              sha: commit.data.sha,
              force: false,
            });
            const receiptDir = path.join(process.env.RUNNER_TEMP, 'publication');
            fs.mkdirSync(receiptDir, { recursive: true });
            fs.writeFileSync(path.join(receiptDir, 'FINAL_COMMIT'), `${commit.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'FINAL_TREE'), `${createdTree.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'BLOBS.json'), `${JSON.stringify(blobs, null, 2)}\n`);
            core.setOutput('commit', commit.data.sha);
            core.setOutput('tree', createdTree.data.sha);
      - name: Retain publication receipt
        uses: actions/upload-artifact@v7
        with:
          name: w06-durable-reference-pack-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/publication
          retention-days: 3
          if-no-files-found: error
