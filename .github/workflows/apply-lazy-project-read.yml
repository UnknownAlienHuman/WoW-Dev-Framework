name: Apply lazy Project partition read

on:
  push:
    branches:
      - refactor/lazy-project-partition-read-2026-10-19

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply and validate lazy read
        shell: bash
        run: |
          set -euo pipefail
          python .github/lazy-project-read.py
          git rm .github/lazy-project-read.py
          git rm .github/workflows/apply-lazy-project-read.yml
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked -p wow-store -p wow-project -p wow-service --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-store docs
          git commit -m "refactor: validate Project partitions on demand"
          git push origin "HEAD:${GITHUB_REF_NAME}"
