name: I0-B reference

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/wow-core/**
      - crates/wow-reference/**
      - .github/workflows/i0-reference.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/wow-core/**
      - crates/wow-reference/**
      - .github/workflows/i0-reference.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i0-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Require the I0-B package
        shell: bash
        run: |
          set -euo pipefail
          test -f crates/wow-reference/Cargo.toml
          test -f crates/wow-reference/src/lib.rs
          cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; packages=json.load(sys.stdin)["packages"]; assert any(package["name"] == "wow-reference" for package in packages)'

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.98.0 fmt --all --check

      - name: Verify dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Check lints
        run: cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run debug tests
        run: cargo +1.98.0 test --locked --workspace --all-features

      - name: Run release tests
        run: cargo +1.98.0 test --locked --workspace --all-features --release

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.98.0 doc --locked --workspace --all-features --no-deps
