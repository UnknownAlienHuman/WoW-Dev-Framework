name: Apply core E0 cleanup

on:
  push:
    branches:
      - refactor/remove-core-e0-envelopes-2026-10-18

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed cleanup
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_core_e0_cleanup.py
          git rm tools/apply_core_e0_cleanup.py
          git rm .github/workflows/apply-core-e0-cleanup.yml
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-core
          git commit -m "refactor: remove dead core E0 envelope platform"
          git push origin "HEAD:${GITHUB_REF_NAME}"
