name: W10 XML semantic checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w10-xml-semantics-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: w10-xml-semantics-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_COMMIT: 00146db7404fd8755d3251574b156963919ac251
      BASE_TREE: d8b01df5ad4ebf5b0391b747a4bf254b97d99784
      PATCH_SHA256: 7925e69f3cba12a8afcc40d4413d6e400dfc1d9e6f19e97fbac349d6b81d8f15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Admit exact W10 patch and remove checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$BASE_COMMIT"
          cat .ci/w10-xml-semantics.patch.xz.b64.* > "$RUNNER_TEMP/w10.patch.xz.b64"
          base64 -d "$RUNNER_TEMP/w10.patch.xz.b64" > "$RUNNER_TEMP/w10.patch.xz"
          xz -dc "$RUNNER_TEMP/w10.patch.xz" > "$RUNNER_TEMP/w10.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w10.patch" | sha256sum -c -
          git rm -- .ci/w10-xml-semantics.patch.xz.b64.* .github/workflows/w10-xml-semantics-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w10.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Minimal affected-crate Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked \
            -p wow-emmy -p wow-project -p wow-service -p wow-cli \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          git diff --cached --name-only "$BASE_COMMIT" | sort > "$RUNNER_TEMP/changed-files"
          cat > "$RUNNER_TEMP/expected-files" <<'FILES'
          crates/wow-emmy/src/lib.rs
          crates/wow-emmy/src/references.rs
          crates/wow-emmy/src/syntax.rs
          crates/wow-emmy/src/syntax/analyzer.rs
          crates/wow-emmy/src/virtual_semantics.rs
          crates/wow-project/src/analyzer.rs
          crates/wow-project/src/load/package_closure.rs
          crates/wow-project/src/xml_lua.rs
          crates/wow-service/src/local/xml_lua.rs
          crates/wow-service/src/model.rs
          FILES
          sort -o "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/expected-files"
          cat "$RUNNER_TEMP/changed-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w10-xml-semantics-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
      - name: Fast-forward exact checked tree to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(wow-project): analyze XML virtual units semantically [skip ci]'
          git push origin HEAD:main
