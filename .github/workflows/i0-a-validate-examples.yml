name: I0-A validate normative examples

on:
  pull_request:
    paths:
      - .github/workflows/i0-a-validate-examples.yml
      - crates/wow-core/tests/e0_examples.rs

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Normalize test and ensure envelope exposure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/wow-core/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          if 'pub mod envelope;\n' not in text:
              text = text.replace('pub mod error;\n', 'pub mod error;\npub mod envelope;\n', 1)
          if 'pub use envelope::' not in text:
              text += '''

pub use envelope::{
    E0CheckResultDraft, E0CheckResultEnvelope, E0OperationErrorEnvelope, ResultStatus,
    SchemaCompatibility, canonical_result_digest, validate_schema_version,
};
'''
          lib.write_text(text, encoding='utf-8')

          test = Path('crates/wow-core/tests/e0_examples.rs')
          source = test.read_text(encoding='utf-8')
          start = '''    assert_eq!(
        u64::try_from(bytes.len())?,
        envelope
            .canonical_bytes()?
            .len()
            .try_into()
            .map_err(|_| "canonical result length does not fit u64")?
    );
'''
          source = source.replace(start, '    assert!(!bytes.is_empty());\n')
          test.write_text(source, encoding='utf-8')
          PY

      - name: Verify lock
        run: |
          cargo +1.98.0 generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Format
        run: cargo +1.98.0 fmt --all

      - name: Lint
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test all examples and hash vectors
        run: cargo +1.98.0 test --workspace --all-features

      - name: Commit validated example gate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/i0-a-validate-examples.yml
          git add crates/wow-core/src/lib.rs crates/wow-core/tests/e0_examples.rs
          git commit -m 'test(wow-core): validate committed E0 envelopes'
          git push origin HEAD:${GITHUB_HEAD_REF}
