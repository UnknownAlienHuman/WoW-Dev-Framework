name: Publish rolling EmmyLua manager

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emmylua-manager-publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run manager regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/wow_emmy_source.py \
            scripts/check-emmylua-version.py \
            tests/test_wow_emmy_source.py
          python -m unittest -v tests/test_wow_emmy_source.py

      - name: Probe current upstream through local clone
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-emmylua-version.py probe \
            --source "$RUNNER_TEMP/emmylua-analyzer" \
            --update auto \
            --output "$RUNNER_TEMP/emmylua-compatibility.json" \
            --json
          python scripts/check-emmylua-version.py verify \
            --report "$RUNNER_TEMP/emmylua-compatibility.json" \
            --json
          python - "$RUNNER_TEMP/emmylua-compatibility.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["source"]["revision"] == report["source"]["remote_head"]
          assert report["compatibility"]["status"] == "compatible"
          assert report["analysis_crate"]["name"] == "emmylua_code_analysis"
          assert report["surface"]["symbols"]
          print(json.dumps({
              "revision": report["source"]["revision"],
              "tree": report["source"]["tree"],
              "surface_sha256": report["surface"]["surface_sha256"],
              "report_sha256": report["report_sha256"],
          }, sort_keys=True))
          PY

      - name: Update normative routes without embedding a revision
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          crate = Path("crates/wow-emmy")
          notice = (
              "> **Normative upstream policy:** [`ROLLING_UPSTREAM.md`](ROLLING_UPSTREAM.md). "
              "Any permanent-revision wording below is superseded: exact revisions identify one "
              "operation or reproducible build only; freshness is rechecked before the next operation.\n\n"
          )
          for name in ("COMPATIBILITY_AND_PROBE.md", "IMPLEMENTATION_PLAN.md"):
              path = crate / name
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              if "Normative upstream policy" not in text:
                  if text.startswith("# ") and "\n" in text:
                      heading, remainder = text.split("\n", 1)
                      text = heading + "\n\n" + notice + remainder.lstrip("\n")
                  else:
                      text = notice + text
                  path.write_text(text, encoding="utf-8")

          status = Path("docs/CURRENT_IMPLEMENTATION.md")
          if status.exists():
              text = status.read_text(encoding="utf-8")
              bullet = (
                  "- rolling EmmyLua upstream manager with safe local clone/update policy, exact "
                  "operation identity, deterministic public-surface report, and scheduled compatibility probe;\n"
              )
              if bullet not in text:
                  text = text.rstrip() + "\n" + bullet
                  status.write_text(text, encoding="utf-8")

          skill = Path(".agents/skills/wow-dev/SKILL.md")
          text = skill.read_text(encoding="utf-8")
          section = '''

          ## Lua semantic backend

          Before Lua semantic analysis, adapter implementation, or analyzer debugging, run the rolling EmmyLua compatibility probe. Prefer the configured local checkout; use safe auto-update only when it can fast-forward a clean matching branch. Record the exact revision and surface digest for the operation. Compilation and analyzer fixtures, not a textual surface scan alone, decide adapter compatibility.
          '''
          section = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in section.splitlines()
          )
          if "## Lua semantic backend" not in text:
              skill.write_text(text.rstrip() + section + "\n", encoding="utf-8")
          PY
          python scripts/sync-wow-dev-skill.py --write
          python scripts/sync-wow-dev-skill.py --check

      - name: Enforce privacy and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          needles = [
              "wow-addon-" + "engineering-kb",
              "UnknownAlienHuman/" + "wow-addon-" + "engineering-kb",
              "WoW Addon " + "Engineering KB",
          ]
          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.split(b"\0")
          leaks = []
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if any(needle in text for needle in needles):
                  leaks.append(str(path))
          if leaks:
              raise SystemExit("operator-only provider identity leaked: " + ", ".join(leaks))
          PY
          rm -f .github/workflows/emmylua-manager-publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(wow-emmy): publish rolling upstream manager"
          git pull --rebase origin main
          git push origin HEAD:main
