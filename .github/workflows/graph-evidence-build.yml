name: Graph evidence pipeline check
on:
  push:
    branches: [main]
    paths: ['.ci/graph-evidence/**', '.github/workflows/graph-evidence-build.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit reviewed retained-evidence pipeline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/graph-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/graph-evidence/BASE_SHA"
          test "$(git hash-object .ci/graph-evidence/00)" = 2d6c0ee7c08b3304eaa03db3970432f20e0a991b
          test "$(git hash-object .ci/graph-evidence/01)" = e68bf28bcc8737366e9ac999bb6b2a18b3ba402c
          test "$(git hash-object .ci/graph-evidence/02)" = 252e660462f2701c1965176a8d86bc8f3c486edc
          cat .ci/graph-evidence/00 .ci/graph-evidence/01 .ci/graph-evidence/02 | base64 --decode | gzip -d > "$RUNNER_TEMP/graph-evidence/input.patch"
          echo '5db6ac1f58686cb29026f75fd95bd5e6596ce4d612776f0ed65afed6232d20e3  input.patch' > "$RUNNER_TEMP/graph-evidence/INPUT_SHA256"
          (cd "$RUNNER_TEMP/graph-evidence" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/graph-evidence .github/workflows/graph-evidence-build.yml
          test "$(git write-tree)" = abb33ff3d56a63a8bd39314f1ee9e7912de9197a
          git apply --index "$RUNNER_TEMP/graph-evidence/input.patch"
          test "$(git write-tree)" = 0330c9c7f10ad60f2e91f35094f94b302ae0a8d8
      - name: Format implemented source
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/graph-evidence/RUST_VERSION"
          cargo +stable fmt -p wow-graph -p wow-project -p wow-service -p wow-cli
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/graph-evidence/TREE_SHA"
      - name: Clippy changed owners and CLI
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-graph -p wow-project -p wow-service -p wow-cli -- -D warnings 2>&1 | tee "$RUNNER_TEMP/graph-evidence/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/graph-evidence/policy.log"
      - name: Retain exact checked source
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/graph-evidence/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/graph-evidence/checked.patch"
          git archive "$(git write-tree)" > "$RUNNER_TEMP/graph-evidence/checked-source.tar"
          (cd "$RUNNER_TEMP/graph-evidence" && sha256sum checked.patch checked-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: graph-evidence-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/graph-evidence/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: graph-evidence-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: graph-evidence-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows
      - name: Publish identical checked sources to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for platform in linux windows; do
            test "$(cat "$RUNNER_TEMP/$platform/BASE_SHA")" = "$GITHUB_SHA"
            (cd "$RUNNER_TEMP/$platform" && sha256sum -c SHA256SUMS)
          done
          cmp "$RUNNER_TEMP/linux/TREE_SHA" "$RUNNER_TEMP/windows/TREE_SHA"
          cmp "$RUNNER_TEMP/linux/checked.patch" "$RUNNER_TEMP/windows/checked.patch"
          git apply --index "$RUNNER_TEMP/linux/checked.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(graph): resolve retained evidence and read graph-build bundles end to end' -m "Admit complete graph-build v7 receipts through service seals, project source-manifest validation and graph/core evidence catalog validation. Resolve bounded shared derivation ancestry and exact source handles for explanations; retain whole records, known frontiers, missing references and explicit authority limits. All graph read commands accept --bundle without reconstructing sources or running analysis. Preserve existing snapshot command encodings and graph-build identities. Selected graph/project/service/CLI Clippy and repository policy passed on identical Linux/Windows trees in run $GITHUB_RUN_ID. No tests, dependency or lockfile changes. Source-byte verification, authenticated provenance, full conflict/derivation records and coherent ProjectStore remain separate. Temporary check inputs removed."
          git push origin HEAD:main
