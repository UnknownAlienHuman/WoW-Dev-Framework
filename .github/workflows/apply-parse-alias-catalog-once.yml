name: Apply single alias-catalog parse

on:
  push:
    branches:
      - refactor/parse-alias-catalog-once-2026-10-19

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply and validate shared parse
        shell: bash
        run: |
          set -euo pipefail
          python .github/parse-alias-catalog-once.py
          git rm .github/parse-alias-catalog-once.py
          git rm .github/workflows/apply-parse-alias-catalog-once.yml
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked -p wow-reference -p wow-annotations --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-reference docs
          git commit -m "refactor: parse statement catalogs once"
          git push origin "HEAD:${GITHUB_REF_NAME}"
