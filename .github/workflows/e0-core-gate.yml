name: E0 core guarded acceptance
on:
  push:
    branches: [main]
    paths:
      - .ci/e0-core.patch
      - .github/workflows/e0-core-gate.yml
permissions:
  contents: read
concurrency:
  group: e0-core-acceptance-main
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit the exact reviewed core patch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(sha256sum .ci/e0-core.patch | cut -d ' ' -f 1)" = af0f3f15bc760f1f2e1cddc9e84cdb3b84fd008e718614530191915df144926f
          git apply --check --index .ci/e0-core.patch
          git apply --index .ci/e0-core.patch
          git rm .ci/e0-core.patch .github/workflows/e0-core-gate.yml
          test "$(git write-tree)" = 030a9b5163ee330ce656d91e86654059801739b3
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format reviewed Rust in the disposable checkout
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          git add crates/wow-core
          mkdir -p "$RUNNER_TEMP/e0-core-evidence"
          git write-tree > "$RUNNER_TEMP/e0-core-evidence/TREE_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/e0-core-evidence/BASE_SHA"
          rustc +stable -Vv > "$RUNNER_TEMP/e0-core-evidence/RUST_VERSION"
      - name: Repository policy
        run: cargo +stable xtask check
      - name: Formatting
        run: cargo +stable fmt --all --check
      - name: Locked workspace check
        run: cargo +stable check --locked --workspace --all-targets --all-features
      - name: Strict workspace Clippy
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Locked debug workspace tests
        run: cargo +stable test --locked --workspace --all-targets --all-features
      - name: Locked release workspace tests
        run: cargo +stable test --release --locked --workspace --all-targets --all-features
      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Prove both regressions detect the unchanged baseline defects
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          git show HEAD:crates/wow-core/src/source.rs > crates/wow-core/src/source.rs
          git show HEAD:crates/wow-core/src/envelope.rs > crates/wow-core/src/envelope.rs
          set +e
          cargo +stable test --locked -p wow-core --test e0_source_conformance path_024_normalization_cannot_expose_a_drive_prefix -- --exact > "$RUNNER_TEMP/e0-core-evidence/path-negative-control.txt" 2>&1
          path_status=$?
          cargo +stable test --locked -p wow-core --test e0_schema_conformance envelope_016 > "$RUNNER_TEMP/e0-core-evidence/schema-negative-control.txt" 2>&1
          schema_status=$?
          set -e
          git checkout-index --force -- crates/wow-core/src/source.rs crates/wow-core/src/envelope.rs
          test "$path_status" -ne 0
          test "$schema_status" -ne 0
          grep -F 'test path_024_normalization_cannot_expose_a_drive_prefix ... FAILED' "$RUNNER_TEMP/e0-core-evidence/path-negative-control.txt"
          grep -F 'test envelope_016_check_rejects_wrong_family_and_future_versions_even_when_resealed ... FAILED' "$RUNNER_TEMP/e0-core-evidence/schema-negative-control.txt"
          grep -F 'test envelope_016_error_rejects_wrong_family_and_future_versions_even_when_resealed ... FAILED' "$RUNNER_TEMP/e0-core-evidence/schema-negative-control.txt"
          git diff --exit-code
      - name: Verify retained bytes and export the tested change
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/e0-core-evidence/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/e0-core-evidence/verified.patch"
          sha256sum "$RUNNER_TEMP/e0-core-evidence/verified.patch" > "$RUNNER_TEMP/e0-core-evidence/SHA256SUMS"
      - uses: actions/upload-artifact@v7
        with:
          name: e0-core-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/e0-core-evidence/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-core-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/e0-core-linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: e0-core-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/e0-core-windows
      - name: Publish only the identical Linux and Windows tested tree
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          ACCEPTANCE_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(cat "$RUNNER_TEMP/e0-core-linux/BASE_SHA")" = "$EXPECTED_HEAD"
          test "$(cat "$RUNNER_TEMP/e0-core-windows/BASE_SHA")" = "$EXPECTED_HEAD"
          cmp "$RUNNER_TEMP/e0-core-linux/TREE_SHA" "$RUNNER_TEMP/e0-core-windows/TREE_SHA"
          cmp "$RUNNER_TEMP/e0-core-linux/verified.patch" "$RUNNER_TEMP/e0-core-windows/verified.patch"
          git apply --check --index "$RUNNER_TEMP/e0-core-linux/verified.patch"
          git apply --index "$RUNNER_TEMP/e0-core-linux/verified.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/e0-core-linux/TREE_SHA")"
          git diff --exit-code
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(core): enforce normalized path and envelope schema admission' -m "Continue R0-01 in wow-core. Reject drive prefixes exposed by normalization, bind both envelope decoders to supported schemas, and add path/span/schema conformance plus exact fixture/digest tests. No fixture baselines or dependencies changed. Linux and Windows locked check, strict Clippy, debug/release tests, rustdoc, policy and formatting passed on this exact tree in acceptance run $ACCEPTANCE_RUN. Temporary gate and patch are removed; full E0-A and R0 acceptance remain incomplete."
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
