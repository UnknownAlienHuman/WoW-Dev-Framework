name: W06 publish checked deterministic rebuild tree
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: w06-deterministic-rebuild-publisher
  cancel-in-progress: false
env:
  BASE_COMMIT: 5cb31da4bccd48586619e5d873a1b8d536895bfc
  BASE_TREE: c471d930cf613c15f429febde69d340df357b959
  STAGING_PARENT: 99f408a4291d8b1b26d56985eda3e6e966e5d640
  ARTIFACT_ID: '11122844619'
  ARTIFACT_ZIP_SHA256: 8a55c080275cc451a4428e8a29c0a5b2027de6df528aef224b0f84bbaee1a4b2
  SOURCE_TAR_SHA256: 08f961ac6e0f9832a66fb2495bfab350005a5786fb7157816075ff6052ccbdfb
  FORMATTED_PATCH_SHA256: b68fe9bfc1f8fa67d2f729ad9c8de2e793ff11ff09745da0b38ff90cae6ba69a
  CHECKED_TREE: 41c542cb5676d2a984f47fc3f6272e413df57a1f
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Recover and verify the exact checked source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          mkdir -p "$RUNNER_TEMP/w06-artifact"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/w06-artifact.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/w06-artifact.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/w06-artifact.zip" -d "$RUNNER_TEMP/w06-artifact"
          test "$(cat "$RUNNER_TEMP/w06-artifact/CHECKED_TREE")" = "$CHECKED_TREE"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$RUNNER_TEMP/w06-artifact/checked-source.tar" | sha256sum -c -
          printf '%s  %s\n' "$FORMATTED_PATCH_SHA256" "$RUNNER_TEMP/w06-artifact/formatted.patch" | sha256sum -c -

          git reset --hard "$BASE_COMMIT"
          git clean -fdx
          tar -xf "$RUNNER_TEMP/w06-artifact/checked-source.tar" -C .
          git add --all
          test "$(git write-tree)" = "$CHECKED_TREE"
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          test "$actual" = 'crates/wow-service/src/reference_pack.rs'
      - name: Publish the exact checked tree to main
        id: publish
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (current.data.object.sha !== process.env.GITHUB_SHA) {
              core.setFailed(`main moved from ${process.env.GITHUB_SHA} to ${current.data.object.sha}`);
              return;
            }
            const filePath = 'crates/wow-service/src/reference_pack.rs';
            const blob = await github.rest.git.createBlob({
              owner,
              repo,
              content: fs.readFileSync(filePath).toString('base64'),
              encoding: 'base64',
            });
            const createdTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: process.env.BASE_TREE,
              tree: [{ path: filePath, mode: '100644', type: 'blob', sha: blob.data.sha }],
            });
            if (createdTree.data.sha !== process.env.CHECKED_TREE) {
              core.setFailed(`created tree ${createdTree.data.sha} differs from checked tree ${process.env.CHECKED_TREE}`);
              return;
            }
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'feat(service): bind deterministic rebuild reports into Reference Packs [skip ci]\n\nW06 deterministic-rebuild slice. Two exact execution profiles now produce a canonical comparison report bound to the selected unbound pack, plan, validation, semantic subject and materialized payload. Reference Pack v6 materializes and independently revalidates the report; missing or failed evidence remains NotEvaluated/Failed. Selected all-target/all-feature Clippy and repository policy passed on Linux with Rust 1.98.1; no tests executed.',
              tree: createdTree.data.sha,
              parents: [process.env.GITHUB_SHA],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/main',
              sha: commit.data.sha,
              force: false,
            });
            const receiptDir = path.join(process.env.RUNNER_TEMP, 'publication');
            fs.mkdirSync(receiptDir, { recursive: true });
            fs.writeFileSync(path.join(receiptDir, 'FINAL_COMMIT'), `${commit.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'FINAL_TREE'), `${createdTree.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'BLOBS.json'), `${JSON.stringify({ [filePath]: blob.data.sha }, null, 2)}\n`);
            core.setOutput('commit', commit.data.sha);
            core.setOutput('tree', createdTree.data.sha);
      - name: Retain publication receipt
        uses: actions/upload-artifact@v7
        with:
          name: w06-deterministic-rebuild-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/publication
          retention-days: 3
          if-no-files-found: error
