name: Compact native builder report

on:
  push:
    branches:
      - refactor/native-reference-builder-2026-10-19

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove duplicated report payload and validate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/compact-native-builder-report.py "$RUNNER_TEMP/compact-native-builder-report.py"
          git rm .github/compact-native-builder-report.py
          python "$RUNNER_TEMP/compact-native-builder-report.py"
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked -p wow-reference-builder -p wow-annotations -p wow-reference --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add apps/wow-reference-builder/src/lib.rs apps/wow-reference-builder/README.md
          git commit -m "refactor: keep native source report concise"
          git push origin "HEAD:${GITHUB_REF_NAME}"
