name: Inspect current development state

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-current-development-20260904.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Capture exact repository and validation state
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/current-development-inspection.txt"
          exec 3>"$report"
          section() { printf '\n===== %s =====\n' "$1" >&3; }
          run_check() {
            local name="$1"; shift
            section "$name"
            printf '$' >&3
            printf ' %q' "$@" >&3
            printf '\n' >&3
            set +e
            "$@" >"$RUNNER_TEMP/check.out" 2>&1
            status=$?
            set -e
            printf 'exit=%s\n' "$status" >&3
            cat "$RUNNER_TEMP/check.out" >&3
          }

          set -e
          section "MAIN"
          git rev-parse HEAD >&3
          git log -1 --format='%H%n%aI%n%s' >&3
          git status --short >&3

          section "WORKFLOWS"
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort >&3

          section "WORKSPACE"
          cat Cargo.toml >&3
          printf '\npackages:\n' >&3
          set +e
          cargo metadata --format-version 1 --no-deps >"$RUNNER_TEMP/metadata.json" 2>"$RUNNER_TEMP/metadata.err"
          metadata_status=$?
          set -e
          printf 'cargo_metadata_exit=%s\n' "$metadata_status" >&3
          cat "$RUNNER_TEMP/metadata.err" >&3
          if [[ "$metadata_status" -eq 0 ]]; then
            python - "$RUNNER_TEMP/metadata.json" <<'PY' >&3
          import json, sys
          value=json.load(open(sys.argv[1], encoding='utf-8'))
          for package in sorted(value['packages'], key=lambda item:item['name']):
              print(package['name'], package['version'], package['manifest_path'])
          PY
          fi

          section "ROUTES"
          grep -nE '^pub mod (generated_api|ui_topology|compatibility|workspace);' \
            crates/wow-reference/src/lib.rs crates/wow-emmy/src/lib.rs 2>/dev/null >&3 || true
          find crates/wow-reference/src/bin crates/wow-emmy/src/bin -maxdepth 1 -type f -printf '%p\n' 2>/dev/null | sort >&3 || true

          run_check "PYTHON_COMPILE" python -m py_compile \
            scripts/wow_api_reference.py \
            scripts/build-blizzard-api-reference.py \
            scripts/verify-blizzard-api-reference.py \
            scripts/wow_ui_topology.py \
            scripts/build-blizzard-ui-topology.py \
            scripts/verify-blizzard-ui-topology.py \
            scripts/wow_emmy_source.py \
            scripts/check-emmylua-version.py \
            tests/test_blizzard_api_reference.py \
            tests/test_blizzard_ui_topology.py \
            tests/test_wow_emmy_source.py
          run_check "PYTHON_TESTS" python -m unittest -v \
            tests/test_blizzard_api_reference.py \
            tests/test_blizzard_ui_topology.py \
            tests/test_wow_emmy_source.py
          run_check "CARGO_FMT" cargo fmt --all --check
          run_check "CARGO_CHECK" cargo check --workspace --all-targets --all-features
          run_check "CARGO_CLIPPY" cargo clippy --workspace --all-targets --all-features -- -D warnings
          run_check "CARGO_TEST" cargo test --workspace --all-targets --all-features
          run_check "CARGO_DOC" env RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --all-features --no-deps

          section "EMMYLUA_CURRENT"
          set +e
          git clone --filter=blob:none --depth=1 --no-tags --single-branch --branch main \
            https://github.com/EmmyLuaLs/emmylua-analyzer-rust.git "$RUNNER_TEMP/emmylua" \
            >"$RUNNER_TEMP/emmy-clone.out" 2>&1
          clone_status=$?
          set -e
          printf 'clone_exit=%s\n' "$clone_status" >&3
          cat "$RUNNER_TEMP/emmy-clone.out" >&3
          if [[ "$clone_status" -eq 0 ]]; then
            git -C "$RUNNER_TEMP/emmylua" log -1 --format='%H%n%aI%n%s' >&3
            section "EMMYLUA_ROOT_CARGO"
            sed -n '1,220p' "$RUNNER_TEMP/emmylua/Cargo.toml" >&3
            section "EMMYLUA_ANALYSIS_CARGO"
            sed -n '1,240p' "$RUNNER_TEMP/emmylua/crates/emmylua_code_analysis/Cargo.toml" >&3
            section "EMMYLUA_ANALYSIS_LIB"
            sed -n '1,260p' "$RUNNER_TEMP/emmylua/crates/emmylua_code_analysis/src/lib.rs" >&3
            section "EMMYLUA_PUBLIC_DECLARATIONS"
            grep -RhnE '^pub (struct|enum|trait|type|fn|mod) ' \
              "$RUNNER_TEMP/emmylua/crates/emmylua_code_analysis/src" \
              | head -n 400 >&3 || true
            section "EMMYLUA_ANALYSIS_DATABASE_SEARCH"
            grep -RhnE 'struct EmmyLuaAnalysis|impl EmmyLuaAnalysis|pub fn (new|init|update|add|diagnostic|semantic|compilation|file|workspace)' \
              "$RUNNER_TEMP/emmylua/crates/emmylua_code_analysis/src" \
              | head -n 500 >&3 || true
            run_check "EMMYLUA_PACKAGE_CHECK" cargo check --locked \
              --manifest-path "$RUNNER_TEMP/emmylua/Cargo.toml" \
              -p emmylua_code_analysis --lib
          fi

          exec 3>&-
      - name: Upload inspection report
        uses: actions/upload-artifact@v7
        with:
          name: current-development-inspection
          path: ${{ runner.temp }}/current-development-inspection.txt
          retention-days: 2
          if-no-files-found: error
      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f .github/workflows/inspect-current-development-20260904.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove current development inspector"
          git push origin HEAD:main
