name: Finalize graph partition publication
on:
  push:
    branches: [work/graph-partition-publication]
permissions:
  contents: write
concurrency:
  group: finalize-graph-partitions
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Prepare final source tree
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-graph-partitions.yml
          cargo +stable fmt --all
          git add -A -- crates/wow-graph .github/workflows/finalize-graph-partitions.yml
          git diff --cached --check
      - name: Check production code and partition behavior
        run: |
          set -euo pipefail
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable test --locked -p wow-graph --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked -p wow-graph --no-deps
          git diff --exit-code
      - name: Commit checked formatting and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(graph): finalize checked partition publication sources'
          git push origin HEAD:work/graph-partition-publication
