name: Apply source comparison removal

on:
  push:
    branches:
      - refactor/remove-source-compare-2026-10-18

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-source-compare-2026-10-18
          fetch-depth: 0
          persist-credentials: true
      - name: Remove source comparison product and E4 plans
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str = "") -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once("apps/wow/src/main.rs", "mod source_compare;\n")
          replace_once(
              "apps/wow/src/source.rs",
              "wow source reference --config <source-reference.json> [--format json|text]\\n"
              "wow source reference-compare --before-config <before.json> --after-config <after.json> --request <compare.json> [--format json|text]\\n\\n",
              "wow source reference --config <source-reference.json> [--format json|text]\\n\\n",
          )
          replace_once(
              "apps/wow/src/source.rs",
              "    if values\n"
              "        .get(1)\n"
              "        .is_some_and(|value| value == \"reference-compare\")\n"
              "    {\n"
              "        return crate::source_compare::run(values);\n"
              "    }\n",
          )
          replace_once(
              "apps/wow/src/args.rs",
              "wow source reference-compare --before-config <before.json> --after-config <after.json> --request <compare.json> [--format json|text]\\n",
          )
          replace_once("crates/wow-service/src/lib.rs", "pub mod source_reference_compare;\n")
          replace_once(
              "crates/wow-service/src/local/mod.rs",
              "pub use native_reference::{\n"
              "    SOURCE_REFERENCE_INPUT_SCHEMA, SourceReferenceComparisonResult, SourceReferenceResult,\n"
              "    compare_local_source_references, read_local_source_reference,\n"
              "};\n",
              "pub use native_reference::{SOURCE_REFERENCE_INPUT_SCHEMA, SourceReferenceResult, read_local_source_reference};\n",
          )
          replace_once(
              "crates/wow-service/src/local/native_reference.rs",
              "mod comparison;\n"
              "pub use comparison::{SourceReferenceComparisonResult, compare_local_source_references};\n",
          )
          replace_once("crates/wow-reference/src/native_view.rs", "pub mod comparison;\n")
          PY

          rm -f \
            apps/wow/src/source_compare.rs \
            apps/wow/SOURCE_REFERENCE_COMPARISON.md \
            apps/wow/LINEAGE_CANDIDATES.md \
            apps/wow/SOURCE_LINEAGE.md \
            apps/wow/REFERENCE_LINEAGE.md \
            crates/wow-service/src/source_reference_compare.rs \
            crates/wow-service/src/local/native_reference/comparison.rs \
            crates/wow-reference/src/native_view/comparison.rs \
            crates/wow-project/E4_B_LINEAGE_INPUTS.md \
            crates/wow-reference/E4_B_TRANSITION_EVIDENCE.md
          rm -rf \
            apps/wow/e4 \
            crates/wow-service/e4 \
            crates/wow-search/e4 \
            crates/wow-graph/e4 \
            crates/wow-service/src/local/native_reference/comparison \
            crates/wow-reference/src/native_view/comparison

          cargo fmt --all
          rm .github/workflows/apply-source-compare-removal.yml
          cargo xtask check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove source comparison and E4 lineage plans"
          git push origin HEAD:refactor/remove-source-compare-2026-10-18
