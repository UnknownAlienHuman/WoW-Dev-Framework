name: I0-A wow-core

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/wow-core/**
      - .github/workflows/i0-a-wow-core.yml
      - .github/i0a-evidence-coverage.b64

permissions:
  contents: write

concurrency:
  group: i0-a-wow-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Apply locally validated payload when present
        shell: bash
        run: |
          if [[ -f .github/i0a-evidence-coverage.b64 ]]; then
            base64 -d .github/i0a-evidence-coverage.b64 > /tmp/i0a-evidence-coverage.tar.gz
            actual="$(sha256sum /tmp/i0a-evidence-coverage.tar.gz | cut -d' ' -f1)"
            expected='ac77bc7584291a0aef7c5e66cf1fcfd606e6c4cf4a776712dffc7a093956f312'
            test "$actual" = "$expected"
            tar -xzf /tmp/i0a-evidence-coverage.tar.gz -C .
            rm .github/i0a-evidence-coverage.b64
          fi

      - name: Verify exact dependency lock
        run: |
          cargo +1.98.0 generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check

      - name: Check lints
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo +1.98.0 test --workspace --all-features

      - name: Commit validated evidence and coverage slice
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/i0a-evidence-coverage.b64 \
            crates/wow-core/src \
            crates/wow-core/tests
          if ! git diff --cached --quiet; then
            git commit -m 'feat(wow-core): implement evidence and coverage authority'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
