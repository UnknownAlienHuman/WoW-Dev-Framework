name: I0-A wow-core

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/wow-core/**
      - .github/workflows/i0-a-wow-core.yml

permissions:
  contents: write

concurrency:
  group: i0-a-wow-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Apply exact compiler and lint corrections discovered by bootstrap runs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ids = Path('crates/wow-core/src/ids.rs')
          text = ids.read_text(encoding='utf-8')
          needle = "**byte == b'_'"
          if text.count(needle) != 1:
              raise SystemExit('expected exactly one byte-iterator correction site')
          ids.write_text(text.replace(needle, "*byte == b'_'"), encoding='utf-8')

          canonical = Path('crates/wow-core/src/canonical.rs')
          text = canonical.read_text(encoding='utf-8')
          needle = "input.as_bytes().chunks_exact(2).enumerate()"
          replacement = "input.as_bytes().as_chunks::<2>().0.iter().enumerate()"
          if text.count(needle) != 1:
              raise SystemExit('expected exactly one hash-test chunk site')
          canonical.write_text(text.replace(needle, replacement), encoding='utf-8')

          generation = Path('crates/wow-core/src/generation.rs')
          text = generation.read_text(encoding='utf-8')
          needle = '''        if let Some(previous) = result.last() {
            if previous.provider_id == entry.provider_id && previous.scope_id == entry.scope_id {
                if previous == &entry {
                    continue;
                }
                return Err(validation_error(
                    "merge_generation_context",
                    CoreErrorCode::DuplicateExternalGenerationScope,
                    "external_generations",
                ));
            }
        }
'''
          replacement = '''        if let Some(previous) = result.last()
            && previous.provider_id == entry.provider_id
            && previous.scope_id == entry.scope_id
        {
            if previous == &entry {
                continue;
            }
            return Err(validation_error(
                "merge_generation_context",
                CoreErrorCode::DuplicateExternalGenerationScope,
                "external_generations",
            ));
        }
'''
          if text.count(needle) != 1:
              raise SystemExit('expected exactly one external-generation merge site')
          generation.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY

      - name: Generate exact dependency lock
        run: cargo +1.98.0 generate-lockfile

      - name: Format working tree
        run: cargo +1.98.0 fmt --all

      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check

      - name: Check lints
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo +1.98.0 test --workspace --all-features

      - name: Commit exact lock and formatter output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/wow-core/src crates/wow-core/tests
          if ! git diff --cached --quiet; then
            git commit -m 'style(wow-core): apply rustfmt and lock dependencies'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Package exact validated tree
        if: always()
        shell: bash
        run: |
          tar -czf i0-a-working-tree.tar.gz \
            Cargo.toml \
            Cargo.lock \
            rust-toolchain.toml \
            crates/wow-core/Cargo.toml \
            crates/wow-core/src \
            crates/wow-core/tests

      - name: Upload exact validated tree
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          path: i0-a-working-tree.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1
