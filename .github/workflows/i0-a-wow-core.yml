name: I0-A wow-core

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/wow-core/**
      - .github/workflows/i0-a-wow-core.yml

permissions:
  contents: read

concurrency:
  group: i0-a-wow-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Verify exact dependency lock
        run: |
          cargo +1.98.0 generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check

      - name: Check lints
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo +1.98.0 test --workspace --all-features

      - name: Fetch locked registry for offline reproduction
        run: cargo +1.98.0 fetch --locked

      - name: Package exact reviewed input tree
        shell: bash
        run: |
          tar -czf i0-a-reviewed-tree.tar.gz \
            Cargo.toml \
            Cargo.lock \
            rust-toolchain.toml \
            crates/wow-core

      - name: Package frozen Rust toolchain and locked registry
        shell: bash
        run: |
          sysroot="$(rustc +1.98.0 --print sysroot)"
          tar --use-compress-program='xz -1 -T0' \
            -C "$(dirname "$sysroot")" \
            -cf rust-1.98.0-toolchain.tar.xz \
            "$(basename "$sysroot")"
          tar --use-compress-program='xz -1 -T0' \
            -C "$HOME/.cargo" \
            -cf cargo-registry.tar.xz \
            registry
          tar -cf i0-a-rust-offline-kit.tar \
            rust-1.98.0-toolchain.tar.xz \
            cargo-registry.tar.xz

      - name: Upload exact reviewed input tree
        uses: actions/upload-artifact@v7.0.1
        with:
          name: i0-a-reviewed-tree
          path: i0-a-reviewed-tree.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload frozen offline validation kit
        uses: actions/upload-artifact@v7.0.1
        with:
          name: i0-a-rust-offline-kit
          path: i0-a-rust-offline-kit.tar
          archive: false
          if-no-files-found: error
          retention-days: 1
