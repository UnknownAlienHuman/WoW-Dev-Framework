name: Apply Project legacy test cleanup

on:
  push:
    branches:
      - refactor/remove-project-legacy-catalogs-2026-10-19

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove historical compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          python .github/remove-project-legacy-catalog-tests.py
          git rm .github/remove-project-legacy-catalog-tests.py
          git rm .github/workflows/apply-project-legacy-test-cleanup.yml
          cargo +stable fmt --all
          git diff --check
          cargo +stable check --locked --workspace --all-targets --all-features
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-project/tests crates/wow-service/src
          git commit -m "test: remove historical Project catalog compatibility"
          git push origin "HEAD:${GITHUB_REF_NAME}"
