name: Format core E0 cleanup

on:
  push:
    branches:
      - refactor/remove-core-e0-envelopes-2026-10-18

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Format Rust and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          git rm .github/workflows/format-core-e0-cleanup.yml
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-core
          git commit -m "style: format core E0 cleanup"
          git push origin "HEAD:${GITHUB_REF_NAME}"
