name: Update single Emmy analysis docs

on:
  push:
    branches:
      - fix/emmy-main-library-analysis-2026-10-19

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Distill implementation and queue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected documentation block in {path}')
              file.write_text(text.replace(old, new))

          implementation = 'docs/IMPLEMENTATION.md'
          replace(
              implementation,
              '''**#200 supplies normal configuration; #193 fixes the analysis/diagnostic path.**
''',
              '''**#200 supplies normal configuration; one shared Emmy analysis now owns diagnostics and facts.**
''',
          )
          replace(
              implementation,
              '''`wow-emmy/src/session.rs::AnalyzerSession` owns `syntax` (Main only, diagnostics
enabled) and `semantic` (Main + Library, diagnostics disabled for physical input).
`reports().syntax` supplies Project diagnostics. Moreover,
`syntax/analyzer.rs::accepted_code` passes only syntax/doc-syntax and assignment
type errors; it drops upstream `param-type-mismatch`. #193 must register the
selected inputs once, collect Main diagnostics and semantic facts from the same
`EmmyLuaAnalysis`, and pass the useful upstream diagnostic codes through. Reuse
upstream checking, not a new type checker or diagnostic approval registry.

Trace `wow-project/src/{analyzer,snapshot}.rs`, including its separate TOC/XML
cold branch. Preserve Main/Library roles, virtual spans, cancellation and
add/change/remove behavior. Follow the [engine setup](EMMYLUA_UPSTREAM.md#engine-setup)
for Lua 5.1 and standard declarations. An annotation-defined bad argument must reach the
ordinary addon check at its Main location; a valid call stays clean. Reuse a
small existing fixture shape, not the external-consumer campaign. Queries read
the produced facts or index without creating an analyzer.

`session.rs::apply_delta` keeps unchanged syntax trees but clears and rebuilds
all retained semantic indexes, currently in both engines. `reused_files` counts
unchanged Main inputs, not saved semantic work. #193 removes the duplicate engine;
#109 preserves final results through the [current update route](../crates/wow-project/UPDATE_MODEL.md).
Do not replace this rebuild with changed-only upstream calls on assumption:
the pinned bulk updater does not schedule unchanged global/type consumers.
''',
              '''`wow-emmy/src/session.rs::AnalyzerSession` owns one
`RegisteredMemberAnalysis`: Main and Library are registered once, then the same
`EmmyLuaAnalysis` supplies Main diagnostics, member/call facts and local flow.
The TOC/XML cold branch uses the same composition without constructing separate
syntax, member and flow engines. `syntax/analyzer.rs::accepted_code` keeps the
useful current slice, including upstream `param-type-mismatch`; diagnostics are
reported only for Main files while Library declarations participate in checking.
Reuse upstream checking, not a new type checker or diagnostic approval registry.

Preserve Main/Library roles, virtual spans, cancellation and add/change/remove
behavior. Follow the [engine setup](EMMYLUA_UPSTREAM.md#engine-setup) for Lua 5.1
and standard declarations. Normal Project checks now receive annotation-defined
parameter errors at the Main location. Queries consume produced facts or the
index without creating another analyzer.

`session.rs::apply_delta` keeps unchanged syntax trees in the shared VFS, then
clears and rebuilds retained semantic indexes. `reused_files` counts unchanged
Main inputs, not saved semantic work. #109 preserves final results through the
[current update route](../crates/wow-project/UPDATE_MODEL.md). Do not replace this
rebuild with changed-only upstream calls on assumption: the pinned bulk updater
does not schedule unchanged global/type consumers.
''',
          )

          queue = 'docs/REFACTOR_QUEUE.md'
          replace(
              queue,
              '''**Default next code task: [#193](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/193).**
''',
              '''**Default next code task: [#194](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/194).**
''',
          )
          replace(
              queue,
              '''| 1 | [#193 — Emmy analysis](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/193) | One analysis; Main diagnostics see Library types and retain useful upstream errors. Current engines/config/filter split that behavior. |
''',
              '''| Completed | [#193 — Emmy analysis](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/193) | One Main + Library analysis now supplies diagnostics, facts and flow; useful parameter-type errors reach Main locations. |
''',
          )
          PY

          git rm .github/workflows/update-emmy-analysis-docs.yml
          cargo +stable xtask check
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add docs/IMPLEMENTATION.md docs/REFACTOR_QUEUE.md
          git commit -m "docs: record single Emmy analysis implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
