name: Apply final lineage cleanup

on:
  push:
    branches:
      - refactor/remove-service-lineage-2026-10-18

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-service-lineage-2026-10-18
          fetch-depth: 0
          persist-credentials: true
      - name: Remove final unused import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/wow-service/src/local/native_library_input.rs")
          text = path.read_text()
          old = "    InputFailure, NativeProfile, NativeReferenceBuild, NativeReferenceTarget,\n"
          new = "    InputFailure, NativeProfile, NativeReferenceBuild,\n"
          if text.count(old) != 1:
              raise SystemExit("expected one NativeReferenceTarget import")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          rm .github/workflows/apply-final-lineage-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(service): drop final lineage import"
          git push origin HEAD:refactor/remove-service-lineage-2026-10-18
