name: Finalize recognizers Emmy adapter

on:
  push:
    branches:
      - work/recognizers-emmy-adapter

permissions:
  contents: write

concurrency:
  group: finalize-recognizers-emmy-adapter
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Prepare final tree
        run: |
          set -euo pipefail
          python3 .ci/recognizers-emmy-adapter/fix.py
          rm -rf .ci/recognizers-emmy-adapter
          rm .github/workflows/finalize-recognizers-emmy-adapter.yml
          cargo +stable fmt --all
          cargo +stable generate-lockfile
          git add -A
          git diff --cached --check
      - name: Verify typed adapter and workspace
        run: |
          set -euo pipefail
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable test --locked --package wow-recognizers --all-targets --all-features -- --nocapture
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+UnknownAlienHuman@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(recognizers): adapt exact Emmy direct-call facts'
          git push origin HEAD:work/recognizers-emmy-adapter
