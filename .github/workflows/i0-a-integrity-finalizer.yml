name: I0-A finalize record integrity

on:
  pull_request:
    paths:
      - .github/workflows/i0-a-integrity-finalizer.yml
      - crates/wow-core/src/integrity.rs
      - crates/wow-core/tests/e0_tamper_integrity.rs

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Absorb earlier composer commits
        shell: bash
        run: |
          sleep 120
          git fetch origin "${GITHUB_HEAD_REF}"
          git reset --hard "origin/${GITHUB_HEAD_REF}"

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Integrate exact post-deserialization identity validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          integrity = Path('crates/wow-core/src/integrity.rs')
          text = integrity.read_text(encoding='utf-8')
          text = text.replace('use std::collections::BTreeSet;\n\n', '')
          text = text.replace('use crate::canonical::canonical_json_bytes;\n', '')
          text = text.replace(
          '''    if evidence.len() < 2 {
              return Err(validation_error(
                  "validate_conflict_record",
                  CoreErrorCode::ConflictScopeEmpty,
                  "evidence_ids",
              ));
          }
          ''',
          '''    if evidence.len() < 2 {
              return Err(validation_error(
                  "validate_conflict_record",
                  CoreErrorCode::ContractViolation,
                  "evidence_ids",
              ));
          }
          ''')
          text = text.replace(
          '''        "complete" => missing.is_empty() && conflicts.is_empty() && truncation.is_empty() && failure.is_none(),
                  "partial" => !missing.is_empty() || !truncation.is_empty() || !conflicts.is_empty(),
          ''',
          '''        "complete" => missing.is_empty() && truncation.is_empty() && failure.is_none(),
                  "partial" => !missing.is_empty() || !truncation.is_empty(),
          ''')
          text = text.replace('.unwrap_or(false)', '.is_some_and(|value| value)')
          marker = '\n#[allow(dead_code)]\nfn canonical_bytes'
          if marker in text:
              text = text[:text.index(marker)] + '\n'
          integrity.write_text(text, encoding='utf-8')

          lib = Path('crates/wow-core/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          if 'mod integrity;\n' not in text:
              marker = 'pub mod ids;\n'
              if marker not in text:
                  raise SystemExit('ids module marker missing')
              text = text.replace(marker, marker + 'mod integrity;\n', 1)
          lib.write_text(text, encoding='utf-8')

          envelope = Path('crates/wow-core/src/envelope.rs')
          text = envelope.read_text(encoding='utf-8')
          vacuous_schema = '''        validate_schema_version(
              self.schema.schema_id(),
              self.schema.version(),
              self.schema.schema_id(),
              self.schema.version(),
          )?;
          '''
          exact_schema = '''        let supported_schema: SchemaId = "schema:wow:check-result".parse()?;
          let supported_version: ToolVersion = "0.1.0".parse()?;
          validate_schema_version(
              self.schema.schema_id(),
              self.schema.version(),
              &supported_schema,
              &supported_version,
          )?;
          '''
          if vacuous_schema in text:
              text = text.replace(vacuous_schema, exact_schema, 1)

          context_marker = '''        self.context.validate()?;
          let context_id = self.context.context_id();
          '''
          integrity_block = '''        self.context.validate()?;
          for record in &self.source_handles {
              crate::integrity::validate_source_handle(record)?;
          }
          for record in &self.evidence_records {
              crate::integrity::validate_evidence(record)?;
          }
          for record in &self.conflicts {
              crate::integrity::validate_conflict(record)?;
          }
          for record in &self.coverage_records {
              crate::integrity::validate_coverage(record)?;
          }
          for record in &self.not_evaluated {
              crate::integrity::validate_not_evaluated(record)?;
          }
          for record in &self.findings {
              crate::integrity::validate_finding(record)?;
          }
          for record in &self.warnings {
              crate::integrity::validate_warning(record)?;
          }
          let context_id = self.context.context_id();
          '''
          if 'crate::integrity::validate_source_handle' not in text:
              if context_marker not in text:
                  raise SystemExit('context validation marker missing')
              text = text.replace(context_marker, integrity_block, 1)
          text = text.replace('        self.budget.validate_limits()?;\n', '        self.budget.validate()?;\n', 1)

          error_impl = text.find('impl E0OperationErrorEnvelope')
          if error_impl < 0:
              raise SystemExit('operation error implementation missing')
          tail = text[error_impl:]
          validate_marker = '''    pub fn validate(&self) -> CoreResult<()> {
              if self.canonicalization_version != CANONICALIZATION_VERSION {
          '''
          validate_exact = '''    pub fn validate(&self) -> CoreResult<()> {
              let supported_schema: SchemaId = "schema:wow:operation-error".parse()?;
              let supported_version: ToolVersion = "0.1.0".parse()?;
              validate_schema_version(
                  self.schema.schema_id(),
                  self.schema.version(),
                  &supported_schema,
                  &supported_version,
              )?;
              if self.canonicalization_version != CANONICALIZATION_VERSION {
          '''
          if 'schema:wow:operation-error' not in tail:
              if validate_marker not in tail:
                  raise SystemExit('operation-error validation marker missing')
              tail = tail.replace(validate_marker, validate_exact, 1)
              text = text[:error_impl] + tail
          envelope.write_text(text, encoding='utf-8')

          budget = Path('crates/wow-core/src/budget.rs')
          text = budget.read_text(encoding='utf-8')
          if 'pub fn validate(&self) -> CoreResult<()> {' not in text[text.find('impl Budget {'):]:
              marker = '''    /// Validates observed usage against explicit limits.
              pub fn validate_limits(&self) -> CoreResult<()> {
          '''
              block = '''    /// Revalidates limits, usage, and the complete deserialized truncation shape.
              pub fn validate(&self) -> CoreResult<()> {
                  self.limits.validate()?;
                  match &self.truncation {
                      TruncationState::NotTruncated => {}
                      TruncationState::Truncated { entries } => {
                          if entries.is_empty() {
                              return Err(validation_error(
                                  "validate_budget",
                                  CoreErrorCode::ContractViolation,
                                  "truncation.entries",
                              ));
                          }
                          for entry in entries {
                              validate_lower_segment(
                                  &entry.collection_id,
                                  "validate_budget",
                                  "truncation.entries.collection_id",
                              )?;
                              if entry.omitted_count.is_some() == entry.count_unknown {
                                  return Err(validation_error(
                                      "validate_budget",
                                      CoreErrorCode::ContractViolation,
                                      "truncation.entries.omitted_count",
                                  ));
                              }
                              for pair in entry.capability_ids.windows(2) {
                                  if pair[0] >= pair[1] {
                                      return Err(validation_error(
                                          "validate_budget",
                                          CoreErrorCode::ContractViolation,
                                          "truncation.entries.capability_ids",
                                      ));
                                  }
                              }
                          }
                          for pair in entries.windows(2) {
                              if pair[0] >= pair[1] {
                                  return Err(validation_error(
                                      "validate_budget",
                                      CoreErrorCode::ContractViolation,
                                      "truncation.entries",
                                  ));
                              }
                          }
                      }
                  }
                  self.validate_limits()
              }

              /// Validates observed usage against explicit limits.
              pub fn validate_limits(&self) -> CoreResult<()> {
          '''
              if marker not in text:
                  raise SystemExit('budget validation marker missing')
              text = text.replace(marker, block, 1)
          budget.write_text(text, encoding='utf-8')
          PY

      - name: Remove superseded composition inputs
        shell: bash
        run: |
          rm -f \
            .github/i0a-evidence-coverage.b64 \
            .github/workflows/i0-a-compose-findings.yml \
            .github/workflows/i0-a-compose-envelope.yml \
            .github/workflows/i0-a-validate-examples.yml \
            .github/workflows/i0-a-contract-wrappers.yml \
            .github/workflows/i0-a-finalize-current-slice.yml \
            .github/workflows/i0-a-fix-result-tests.yml \
            .github/workflows/i0-a-compose-contract-registry.yml

      - name: Verify exact dependency lock
        run: |
          cargo +1.98.0 generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check

      - name: Check lints
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run all tests
        run: cargo +1.98.0 test --workspace --all-features

      - name: Commit exact validated integrity slice
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/i0-a-integrity-finalizer.yml
          git add -A
          git commit -m 'feat(wow-core): verify canonical record identities'
          git push origin HEAD:${GITHUB_HEAD_REF}
