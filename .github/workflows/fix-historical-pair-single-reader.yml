name: Restore single-generation native validation

on:
  push:
    branches:
      - refactor/remove-historical-generation-pair-2026-10-19

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Restore the single-generation helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/wow-project/src/replay/publication.rs')
          text = path.read_text()
          anchor = '''fn validate_native_binding(
    project: &ProjectView,
'''
          helper = '''fn validate_read_native_parts(
    project: &ProjectView,
    graph: &ValidatedGraphPartitionSnapshot,
    native: &crate::graph::PlatformIndexSourceParts,
    stop: &AtomicBool,
) -> ProjectResult<()> {
    crate::analyzer::checkpoint(stop)?;
    project.snapshot().validate()?;
    validate_native_binding(project, graph.as_snapshot(), native, stop)
}

'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one insertion anchor, found {text.count(anchor)}')
          if 'fn validate_read_native_parts(' in text:
              raise SystemExit('helper already exists')
          path.write_text(text.replace(anchor, helper + anchor))
          PY
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-project/src/replay/publication.rs
          git commit -m "fix: retain single-generation native validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
