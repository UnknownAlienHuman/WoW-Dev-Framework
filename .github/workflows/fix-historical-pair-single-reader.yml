name: Restore single-generation native validation

on:
  push:
    branches:
      - refactor/remove-historical-generation-pair-2026-10-19

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Restore the single-generation helper
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/restore_single_generation_validation.py
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-project/src/replay/publication.rs
          git commit -m "fix: retain single-generation native validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
