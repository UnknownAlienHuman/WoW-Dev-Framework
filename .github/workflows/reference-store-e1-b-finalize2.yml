name: Finalize wow-reference E1-B v2

on:
  push:
    branches:
      - work/reference-store-e1-b
    paths:
      - .github/workflows/reference-store-e1-b-finalize2.yml

permissions:
  contents: write

concurrency:
  group: finalize-reference-store-e1-b-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Correct and activate exact dependency edge
        run: |
          set -euo pipefail
          sed -i '/^wow-store = { path = "\.\.\/wow-store" }$/d' crates/wow-reference/Cargo.toml
          sed -i '/^\[lints\]$/i wow-store = { path = "../wow-store" }\n' crates/wow-reference/Cargo.toml
          if ! grep -Fq 'pub mod persistent;' crates/wow-reference/src/lib.rs; then
            printf '\npub mod persistent;\n' >> crates/wow-reference/src/lib.rs
          fi
          sed -i 's/use serde::{Deserialize, Serialize, de::DeserializeOwned};/use serde::Serialize;/' crates/wow-reference/src/persistent.rs
          sed -i 's/#\[derive(Debug, Clone, PartialEq, Eq, Serialize)\]/#[derive(Serialize)]/' crates/wow-reference/src/persistent.rs
          if ! grep -Fq 'use serde::de::DeserializeOwned;' crates/wow-reference/src/persistent.rs; then
            sed -i '/use serde_json::json;/a\    use serde::de::DeserializeOwned;' crates/wow-reference/src/persistent.rs
          fi
          cargo +stable generate-lockfile
          rm -f .github/workflows/materialize-reference-store-e1-b.yml
          rm -f .github/workflows/reference-store-e1-b-finalize.yml
          rm .github/workflows/reference-store-e1-b-finalize2.yml
          git add -A
      - name: Mechanical compiler cleanup
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable fix --package wow-reference --all-targets --all-features --allow-dirty --allow-staged
          cargo +stable clippy --fix --package wow-reference --all-targets --all-features --allow-dirty --allow-staged -- -D warnings
          cargo +stable fmt --all
      - name: Strict E1-B and repository gate
        run: |
          set -euo pipefail
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable test --package wow-reference --all-targets --all-features -- --nocapture
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +stable test --locked --workspace --all-targets --all-features
          cargo +stable test --release --locked --workspace --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Commit verified production tree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(reference): persist exact ReferenceView publications'
          git push origin HEAD:work/reference-store-e1-b
