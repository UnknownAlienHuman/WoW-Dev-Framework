name: Finalize generated API end to end v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-generated-api-e2e-v2.yml"

permissions:
  contents: write

concurrency:
  group: generated-api-main-writer
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat(wow-reference): publish current-source API bridge') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Materialize the complete owner package
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          root = Path.cwd()
          lib = root / "crates/wow-reference/src/lib.rs"
          lib_text = lib.read_text(encoding="utf-8")
          if "pub mod generated_api;" not in lib_text:
              lib.write_text(lib_text.rstrip() + "\n\npub mod generated_api;\n", encoding="utf-8")

          module = root / "crates/wow-reference/src/generated_api.rs"
          text = module.read_text(encoding="utf-8")
          getters = textwrap.dedent(r'''
              impl GeneratedApiProvenance {
                  #[must_use]
                  pub fn manifest_declared_digest(&self) -> Option<&str> { self.manifest_declared_digest.as_deref() }
                  #[must_use]
                  pub fn source_id(&self) -> Option<&str> { self.source_id.as_deref() }
                  #[must_use]
                  pub const fn configuration(&self) -> &BTreeMap<String, Value> { &self.configuration }
              }
              impl GeneratedApiFact {
                  #[must_use]
                  pub fn literal_name(&self) -> Option<&str> { self.literal_name.as_deref() }
                  #[must_use]
                  pub fn documentation(&self) -> &[Box<str>] { &self.documentation }
                  #[must_use]
                  pub const fn attributes(&self) -> &BTreeMap<String, Value> { &self.attributes }
                  #[must_use]
                  pub fn arguments(&self) -> &[Value] { &self.arguments }
                  #[must_use]
                  pub fn returns(&self) -> &[Value] { &self.returns }
                  #[must_use]
                  pub fn payload(&self) -> &[Value] { &self.payload }
                  #[must_use]
                  pub fn fields(&self) -> &[Value] { &self.fields }
                  #[must_use]
                  pub fn values(&self) -> &[Value] { &self.values }
              }
              impl GeneratedApiConflict {
                  #[must_use]
                  pub fn collection(&self) -> &str { &self.collection }
                  #[must_use]
                  pub fn sources(&self) -> &[GeneratedApiConflictSource] { &self.sources }
              }
              impl GeneratedApiConflictSource {
                  #[must_use]
                  pub fn path(&self) -> &str { &self.path }
                  #[must_use]
                  pub const fn line_start(&self) -> u64 { self.line_start }
              }
              impl GeneratedApiCoverage {
                  #[must_use]
                  pub fn parsed_paths(&self) -> &[Box<str>] { &self.parsed_paths }
                  #[must_use]
                  pub fn failures(&self) -> &[GeneratedApiFailure] { &self.failures }
                  #[must_use]
                  pub const fn entity_counts(&self) -> &BTreeMap<Box<str>, u64> { &self.entity_counts }
                  #[must_use]
                  pub fn limitations(&self) -> &[Box<str>] { &self.limitations }
              }
              impl GeneratedApiFailure {
                  #[must_use]
                  pub fn code(&self) -> &str { &self.code }
                  #[must_use]
                  pub fn message(&self) -> &str { &self.message }
                  #[must_use]
                  pub fn path(&self) -> Option<&str> { self.path.as_deref() }
              }

          ''')
          if "pub fn manifest_declared_digest(&self)" not in text:
              marker = "#[cfg(test)]\nmod tests {"
              if marker not in text:
                  raise SystemExit("generated_api test marker not found")
              text = text.replace(marker, getters + marker, 1)

          text = text.replace(
              "facts.push(import_member(kind, member)?);",
              "facts.push(import_member(\n                    kind,\n                    member,\n                    &parsed_paths,\n                    &draft.source.revision,\n                )?);",
          )
          text = text.replace(
              "fn import_member(\n    kind: GeneratedApiFactKind,\n    member: &DraftMember,\n) -> GeneratedApiImportResult<GeneratedApiFact> {",
              "fn import_member(\n    kind: GeneratedApiFactKind,\n    member: &DraftMember,\n    parsed_paths: &BTreeSet<&str>,\n    revision: &str,\n) -> GeneratedApiImportResult<GeneratedApiFact> {",
          )
          member_marker = '    reject_nonempty_extensions(&member.extra, "member")?;\n'
          validation = textwrap.dedent('''
              validate_source_span(&member.source, parsed_paths, revision)?;
              for (label, records) in [
                  ("arguments", member.arguments.as_slice()),
                  ("returns", member.returns.as_slice()),
                  ("payload", member.payload.as_slice()),
                  ("fields", member.fields.as_slice()),
                  ("values", member.values.as_slice()),
              ] {
                  validate_nested_source_records(records, parsed_paths, revision, label)?;
              }
          ''')
          if "validate_nested_source_records(records" not in text:
              if member_marker not in text:
                  raise SystemExit("member validation marker not found")
              text = text.replace(member_marker, member_marker + validation, 1)

          helper = textwrap.dedent('''
              fn validate_nested_source_records(
                  records: &[Value],
                  parsed_paths: &BTreeSet<&str>,
                  revision: &str,
                  label: &str,
              ) -> GeneratedApiImportResult<()> {
                  for record in records {
                      let object = record.as_object().ok_or_else(|| {
                          GeneratedApiImportError::new(
                              GeneratedApiImportErrorCode::InvalidFact,
                              format!("generated API {label} record is not an object"),
                          )
                      })?;
                      let source_value = object.get("source").ok_or_else(|| {
                          GeneratedApiImportError::new(
                              GeneratedApiImportErrorCode::InvalidSource,
                              format!("generated API {label} record has no source"),
                          )
                      })?;
                      let source = serde_json::from_value::<DraftSourceSpan>(source_value.clone())
                          .map_err(|error| {
                              GeneratedApiImportError::new(
                                  GeneratedApiImportErrorCode::InvalidSource,
                                  format!("generated API {label} source is invalid: {error}"),
                              )
                          })?;
                      validate_source_span(&source, parsed_paths, revision)?;
                  }
                  Ok(())
              }

          ''')
          if "fn validate_nested_source_records(" not in text:
              marker = "fn validate_source_span(\n"
              if marker not in text:
                  raise SystemExit("source validation marker not found")
              text = text.replace(marker, helper + marker, 1)

          text = text.replace(
              '        validate_sha256(digest, "manifest_declared_digest")?;',
              '        validate_declared_sha256(digest, "manifest_declared_digest")?;',
          )
          declared_helper = textwrap.dedent('''
              fn validate_declared_sha256(value: &str, label: &str) -> GeneratedApiImportResult<()> {
                  let digest = value.strip_prefix("sha256:").unwrap_or(value);
                  if digest.len() != 64
                      || !digest
                          .bytes()
                          .all(|byte| byte.is_ascii_hexdigit() && !byte.is_ascii_uppercase())
                  {
                      return Err(GeneratedApiImportError::new(
                          GeneratedApiImportErrorCode::InvalidDigest,
                          format!("{label} is not a SHA-256 digest"),
                      ));
                  }
                  Ok(())
              }

          ''')
          if "fn validate_declared_sha256(" not in text:
              marker = "fn validate_sha256(value: &str, label: &str)"
              if marker not in text:
                  raise SystemExit("digest validation marker not found")
              text = text.replace(marker, declared_helper + marker, 1)
          module.write_text(text, encoding="utf-8")

          binary = root / "crates/wow-reference/src/bin/wow-reference-api.rs"
          binary_text = binary.read_text(encoding="utf-8")
          binary_text = binary_text.replace("use serde_json::{Value, json};", "use serde_json::json;")
          marker = "fn write_json_atomic<T: Serialize>(path: &Path, value: &T) -> Result<(), String> {\n"
          if "refusing to replace existing output" not in binary_text:
              replacement = marker + textwrap.dedent('''
                  if path.exists() {
                      return Err(format!(
                          "refusing to replace existing output {}",
                          path.display()
                      ));
                  }
              ''')
              if marker not in binary_text:
                  raise SystemExit("CLI atomic-write marker not found")
              binary_text = binary_text.replace(marker, replacement, 1)
          binary.write_text(binary_text, encoding="utf-8")

          skill = textwrap.dedent('''\
              ---
              name: wow-dev
              description: Current-source workflow for World of Warcraft addon research, implementation, review, migration, and debugging.
              ---

              # WoW development skill

              Use this skill for every WoW addon or framework task.

              1. Read the actual target repository, local instructions, TOCs, load order, flavor/selector, subsystem, and risk areas first.
              2. Prefer the configured local Blizzard UI checkout. Use GitHub only when suitable local source is unavailable.
              3. Resolve the moving selector once at operation start. Record exact Git object ID and `version.txt`; read generated docs, Lua, XML, TOC, XSD, and implementation from that revision only. Re-resolve next operation.
              4. Create and verify a source manifest. For generated API work build and verify `.wow-dev/api-reference.json`, then run `wow-reference-api verify` before consuming facts.
              5. Check optional context only through the generic interface. If disabled, unavailable, unconfigured, or unauthorized, continue silently. When enabled, request one sanitized route, never expose provider identity or provenance, classify it `advisory`, and revalidate every patch-sensitive claim.
              6. Use generated docs for signatures/events/enums/predicates/restrictions, then inspect implementation/XML/TOC for lifecycle. An empty search is ambiguous, not proof of absence.
              7. Classify claims as `current-source-confirmed`, `project-confirmed`, `runtime-confirmed`, `implementation-derived`, `advisory`, `historical`, or `unverified`.
              8. Keep version/flavor behavior behind narrow adapters. Do not execute repository code while indexing, mutate protected state in combat, or assume conversion/copying/serialization/`pcall` removes Secret Value restrictions.
              9. Run every available deterministic check. Missing tools or client access are skipped/NotEvaluated. Runtime claims require exact build, Interface, addon ref, scenario, restriction state, steps, and observations.
              10. Report target ref/flavor, exact Blizzard revision/version, source pointers, classifications, files changed, checks, remaining client work, and the next exact blocker. Never include optional provider identity or private provenance.
          ''')
          canonical_skill = root / ".agents/skills/wow-dev/SKILL.md"
          canonical_skill.parent.mkdir(parents=True, exist_ok=True)
          canonical_skill.write_text(skill, encoding="utf-8")

          permanent_workflow = textwrap.dedent('''\
              name: Blizzard API reference

              on:
                push:
                  branches: [main]
                  paths:
                    - "scripts/wow_api_reference.py"
                    - "scripts/build-blizzard-api-reference.py"
                    - "scripts/verify-blizzard-api-reference.py"
                    - "scripts/build-blizzard-source-manifest.py"
                    - "scripts/verify-blizzard-source-manifest.py"
                    - "tests/test_blizzard_api_reference.py"
                    - "crates/wow-reference/src/generated_api.rs"
                    - "crates/wow-reference/src/bin/wow-reference-api.rs"
                    - ".agents/skills/wow-dev/SKILL.md"
                    - ".claude/skills/wow-dev/SKILL.md"
                    - ".opencode/skills/wow-dev/SKILL.md"
                    - ".agent/skills/wow-dev/SKILL.md"
                    - "docs/BLIZZARD_API_REFERENCE.md"
                    - ".github/workflows/blizzard-api-reference.yml"
                pull_request:
                  paths:
                    - "scripts/wow_api_reference.py"
                    - "scripts/build-blizzard-api-reference.py"
                    - "scripts/verify-blizzard-api-reference.py"
                    - "tests/test_blizzard_api_reference.py"
                    - "crates/wow-reference/src/generated_api.rs"
                    - "crates/wow-reference/src/bin/wow-reference-api.rs"
                    - ".github/workflows/blizzard-api-reference.yml"
                schedule:
                  - cron: "23 9 * * *"
                workflow_dispatch:

              permissions:
                contents: read

              concurrency:
                group: blizzard-api-reference-${{ github.ref }}
                cancel-in-progress: true

              jobs:
                unit:
                  name: unit (${{ matrix.os }})
                  strategy:
                    fail-fast: false
                    matrix:
                      os: [ubuntu-latest, windows-latest, macos-latest]
                  runs-on: ${{ matrix.os }}
                  timeout-minutes: 20
                  steps:
                    - uses: actions/checkout@v7
                      with:
                        persist-credentials: false
                    - uses: actions/setup-python@v7
                      with:
                        python-version: "3.x"
                    - name: Python producer checks
                      run: >-
                        python -m py_compile
                        scripts/wow_api_reference.py
                        scripts/build-blizzard-api-reference.py
                        scripts/verify-blizzard-api-reference.py
                        tests/test_blizzard_api_reference.py
                    - run: python -m unittest -v tests/test_blizzard_api_reference.py
                    - run: python scripts/sync-wow-dev-skill.py --check
                    - name: Rust import checks
                      run: >-
                        cargo test --locked -p wow-reference --all-targets --all-features

                current-source:
                  name: current source smoke
                  runs-on: ubuntu-latest
                  timeout-minutes: 40
                  steps:
                    - uses: actions/checkout@v7
                      with:
                        persist-credentials: false
                    - uses: actions/setup-python@v7
                      with:
                        python-version: "3.x"
                    - name: Clone current source locally
                      shell: bash
                      run: |
                        set -euo pipefail
                        git clone --filter=blob:none --no-tags --single-branch --branch live \
                          https://github.com/Gethe/wow-ui-source.git "$RUNNER_TEMP/wow-ui-source"
                        git -C "$RUNNER_TEMP/wow-ui-source" rev-parse HEAD > "$RUNNER_TEMP/source-revision"
                    - name: Build and verify exact source products
                      shell: bash
                      run: |
                        set -euo pipefail
                        revision="$(cat "$RUNNER_TEMP/source-revision")"
                        python scripts/build-blizzard-source-manifest.py \
                          --source "$RUNNER_TEMP/wow-ui-source" \
                          --revision "$revision" \
                          --selector live \
                          --output "$RUNNER_TEMP/source-manifest.json"
                        python scripts/build-blizzard-api-reference.py \
                          --source "$RUNNER_TEMP/wow-ui-source" \
                          --manifest "$RUNNER_TEMP/source-manifest.json" \
                          --output "$RUNNER_TEMP/api-reference.json" \
                          --json
                        python scripts/verify-blizzard-api-reference.py \
                          "$RUNNER_TEMP/api-reference.json" \
                          --source "$RUNNER_TEMP/wow-ui-source" \
                          --manifest "$RUNNER_TEMP/source-manifest.json" \
                          --current-ref origin/live \
                          --require-complete \
                          --json
                        cargo run --locked -p wow-reference --bin wow-reference-api -- \
                          verify "$RUNNER_TEMP/api-reference.json"
                        cargo run --locked -p wow-reference --bin wow-reference-api -- \
                          materialize "$RUNNER_TEMP/api-reference.json" "$RUNNER_TEMP/api-index.json"
                        test -s "$RUNNER_TEMP/api-index.json"
          ''')
          workflow = root / ".github/workflows/blizzard-api-reference.yml"
          workflow.parent.mkdir(parents=True, exist_ok=True)
          workflow.write_text(permanent_workflow, encoding="utf-8")

          status = root / "docs/CURRENT_IMPLEMENTATION.md"
          status_text = status.read_text(encoding="utf-8")
          needle = "- safe normalization of generated Blizzard API documentation into a self-digested reference draft;\n"
          addition = needle + "- independent Rust import of that draft into content-addressed facts with exact lookup, conflicts, provenance, and coverage-aware negative authority;\n"
          if "independent Rust import of that draft" not in status_text:
              if needle not in status_text:
                  raise SystemExit("current implementation marker not found")
              status.write_text(status_text.replace(needle, addition, 1), encoding="utf-8")

          reference_doc = root / "docs/BLIZZARD_API_REFERENCE.md"
          reference_text = reference_doc.read_text(encoding="utf-8")
          if "wow-reference-api verify" not in reference_text:
              reference_text += textwrap.dedent('''

                  ## Rust import boundary

                  Before facts enter `wow-reference`, import repeats the draft self-digest, schema, producer, exact revision, source path/object/digest, source-span, canonical ordering, coverage, count, and conflict checks.

                  ```bash
                  cargo run -p wow-reference --bin wow-reference-api -- \\
                    verify .wow-dev/api-reference.json
                  cargo run -p wow-reference --bin wow-reference-api -- \\
                    materialize .wow-dev/api-reference.json .wow-dev/api-index.json
                  cargo run -p wow-reference --bin wow-reference-api -- \\
                    lookup .wow-dev/api-reference.json function C_AddOns.GetAddOnInfo
                  ```

                  Exact lookup is case-sensitive. Missing facts are authoritative only for a complete, non-conflicted generated-document scope. Runtime and implementation claims still require their own evidence lanes.
              ''')
              reference_doc.write_text(reference_text, encoding="utf-8")

          replacements = {
              "https://github.com/UnknownAlienHuman/wow-addon-engineering-kb": "operator-configured advisory context provider",
              "UnknownAlienHuman/wow-addon-engineering-kb": "operator-configured advisory context provider",
              "wow-addon-engineering-kb": "operator-configured advisory context provider",
              "WoW Addon Engineering KB": "operator-configured advisory context provider",
          }
          listed = subprocess.run(["git", "ls-files", "-z"], check=True, stdout=subprocess.PIPE).stdout.split(b"\0")
          for raw_path in listed:
              if not raw_path:
                  continue
              path = root / raw_path.decode("utf-8")
              try:
                  current = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = current
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != current:
                  path.write_text(updated, encoding="utf-8")

          workflows = root / ".github/workflows"
          permanent = {
              "branch-hygiene.yml",
              "i0-foundation.yml",
              "i0-reference.yml",
              "blizzard-api-reference.yml",
              "source-health.yml",
              "rolling-dependencies.yml",
              "skill-matrix.yml",
              "validate-addon-action.yml",
          }
          transient = re.compile(r"^(?:finalize-|implement-|export-|publish-|repair-|bootstrap-|i0-a-export-)")
          for candidate in workflows.glob("*.yml"):
              if candidate.name not in permanent and transient.match(candidate.name):
                  candidate.unlink()
          PY
          python scripts/sync-wow-dev-skill.py --write
          python scripts/sync-wow-dev-skill.py --check
      - name: Apply mechanical compiler fixes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fix --locked --workspace --all-targets --allow-dirty --allow-staged || true
          cargo clippy --fix --locked --workspace --all-targets --all-features --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
      - name: Validate complete package
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/wow_api_reference.py scripts/build-blizzard-api-reference.py scripts/verify-blizzard-api-reference.py tests/test_blizzard_api_reference.py
          python -m unittest -v tests/test_blizzard_api_reference.py
          python scripts/sync-wow-dev-skill.py --check
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps
      - name: Resolve and test the current Blizzard corpus
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags --single-branch --branch live \
            https://github.com/Gethe/wow-ui-source.git "$RUNNER_TEMP/wow-ui-source"
          revision="$(git -C "$RUNNER_TEMP/wow-ui-source" rev-parse HEAD)"
          python scripts/build-blizzard-source-manifest.py \
            --source "$RUNNER_TEMP/wow-ui-source" \
            --revision "$revision" \
            --selector live \
            --output "$RUNNER_TEMP/source-manifest.json"
          python scripts/build-blizzard-api-reference.py \
            --source "$RUNNER_TEMP/wow-ui-source" \
            --manifest "$RUNNER_TEMP/source-manifest.json" \
            --output "$RUNNER_TEMP/api-reference.json" \
            --json
          python scripts/verify-blizzard-api-reference.py \
            "$RUNNER_TEMP/api-reference.json" \
            --source "$RUNNER_TEMP/wow-ui-source" \
            --manifest "$RUNNER_TEMP/source-manifest.json" \
            --current-ref origin/live \
            --require-complete \
            --json
          cargo run --locked -p wow-reference --bin wow-reference-api -- \
            verify "$RUNNER_TEMP/api-reference.json"
          cargo run --locked -p wow-reference --bin wow-reference-api -- \
            materialize "$RUNNER_TEMP/api-reference.json" "$RUNNER_TEMP/api-index.json"
          test -s "$RUNNER_TEMP/api-index.json"
      - name: Enforce public privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIlE 'wow-addon-engineering-kb|UnknownAlienHuman/wow-addon-engineering-kb|WoW Addon Engineering KB' --exclude-dir=.git --exclude-dir=target .; then
            echo 'operator-only provider identity leaked into public tree' >&2
            exit 1
          fi
      - name: Publish validated package
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-generated-api-e2e-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(wow-reference): publish current-source API bridge"
          git pull --rebase origin main
          git push origin HEAD:main
