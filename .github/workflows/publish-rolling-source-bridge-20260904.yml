name: Publish verified rolling source bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-rolling-source-bridge-20260904.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-rolling-source-bridge-20260904
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_COMMIT: 59c217b077e161eaf7394363acaee1de40d38025
      ARTIFACT_ID: '9935618282'
      COMPRESSED_SHA256: fcb6170612282b4ae586cdfa34e751ce3b4763ed00344848efb18a33fb7cdf2a
      PATCH_SHA256: 637f0f28cb142b18c4133c64033c5cf2d30881d1ad5ffecb547b228edc4bdefe
      EXPECTED_TREE: 697e94e30d84f3a719bdf5aa00353c0562742589
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download and verify prepared patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/delivery
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/delivery.zip
          unzip -q /tmp/delivery.zip -d /tmp/delivery
          payload="$(find /tmp/delivery -type f -name payload.bin -print -quit)"
          test -n "$payload"
          printf '%s  %s\n' "$COMPRESSED_SHA256" "$payload" | sha256sum --check --strict
          command -v zstd >/dev/null
          zstd --quiet --decompress --force "$payload" -o /tmp/delivery.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/delivery.patch | sha256sum --check --strict

      - name: Materialize exact reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_COMMIT}^{commit}"
          rm -rf /tmp/prepared-tree
          git worktree add --detach /tmp/prepared-tree "$BASE_COMMIT"
          cd /tmp/prepared-tree
          git apply --binary --index --whitespace=error-all /tmp/delivery.patch
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$EXPECTED_TREE"

          test ! -e rust-toolchain.toml
          test ! -e .github/workflows/publish-rolling-source-bridge-20260904.yml
          test -f tools/wow-source/Cargo.toml
          test -f .agents/skills/wow-dev/SKILL.md
          test -f docs/SOURCE_ACQUISITION.md
          test -f docs/OPTIONAL_CONTEXT.md
          test -f scripts/check-wow-versions.sh
          test -f scripts/check-wow-versions.ps1

          if git grep -n -i -E 'wow-addon-engineering-kb|UnknownAlienHuman/wow-addon-engineering-kb' -- . ':!Cargo.lock'; then
            echo 'private provider identity leaked into public tree' >&2
            exit 1
          fi

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/prepared-tree
          git diff --cached --check
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
          cargo test --release --locked --workspace --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps

          if test -d tools/wow-source/tests; then
            python3 -m unittest discover -s tools/wow-source/tests -p 'test_*.py'
          fi

          bash -n scripts/check-wow-source.sh scripts/check-wow-versions.sh

          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts and 'target' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Publish direct fast-forward commit to main
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/prepared-tree
          git fetch origin main
          current_head="$(git rev-parse origin/main)"

          changed_since_base="$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_COMMIT" "$current_head" -- \
            ':(exclude).github/workflows/export-current-main.yml' \
            ':(exclude).github/workflows/publish-rolling-source-bridge-20260904.yml' || true)"
          if test -n "$changed_since_base"; then
            echo 'main contains non-transient changes after the reviewed base:' >&2
            printf '%s\n' "$changed_since_base" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          new_commit="$(printf '%s\n\n%s\n' \
            'feat(source): add rolling Blizzard source and private context bridge' \
            'Use local-first current source acquisition, safe update policies, per-operation provenance, optional sanitized advisory context, cross-agent WoW development skills, and current documentation.' \
            | git commit-tree "$EXPECTED_TREE" -p "$current_head")"
          git push origin "$new_commit:refs/heads/main"
          echo "published_commit=$new_commit" >> "$GITHUB_STEP_SUMMARY"
          echo "published_tree=$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
