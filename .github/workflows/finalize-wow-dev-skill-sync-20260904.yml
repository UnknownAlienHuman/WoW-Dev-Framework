name: Finalize mandatory cross-agent skill routing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-wow-dev-skill-sync-20260904.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-wow-dev-skill-sync-20260904
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Synchronize adapters and enforce entrypoint routing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync-wow-dev-skill.py --write
          python3 - <<'PY'
          from pathlib import Path

          marker = '## Mandatory WoW development skill'
          block = f'''\n\n{marker}\n\nFor every World of Warcraft addon research, implementation, review, migration, debugging, or release task, load `.agents/skills/wow-dev/SKILL.md` before making technical claims or editing code. Platform-specific discovery copies are generated from that canonical file and must not be edited independently. Run `python scripts/sync-wow-dev-skill.py --check` before completion; use `--write` only to synchronize deliberate canonical changes.\n'''
          for name in ('AGENTS.md', 'CLAUDE.md', 'GEMINI.md'):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f'missing required agent entrypoint: {name}')
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  path.write_text(text.rstrip() + block, encoding='utf-8', newline='\n')

          docs_path = Path('docs/AGENT_SKILL.md')
          if not docs_path.is_file():
              raise SystemExit('missing docs/AGENT_SKILL.md')
          docs = docs_path.read_text(encoding='utf-8')
          docs_marker = '## Canonical synchronization'
          if docs_marker not in docs:
              docs += f'''\n\n{docs_marker}\n\n`.agents/skills/wow-dev/SKILL.md` is the only editable skill body. Claude, OpenCode, and Antigravity discovery copies are byte-exact generated copies.\n\n```bash\npython scripts/sync-wow-dev-skill.py --check\npython scripts/sync-wow-dev-skill.py --write\n```\n\n`--check` is read-only and exits with code `3` when a copy is missing or stale. `--write` updates copies atomically. Agent entrypoint files require loading the canonical skill for every WoW engineering task; they do not contain or disclose local optional-context configuration.\n'''
              docs_path.write_text(docs, encoding='utf-8', newline='\n')

          workflow = '''name: WoW development skill sync

          on:
            push:
              branches: [main]
              paths:
                - .agents/skills/wow-dev/SKILL.md
                - .claude/skills/wow-dev/SKILL.md
                - .opencode/skills/wow-dev/SKILL.md
                - .agent/skills/wow-dev/SKILL.md
                - scripts/sync-wow-dev-skill.py
                - tests/test_sync_wow_dev_skill.py
                - AGENTS.md
                - CLAUDE.md
                - GEMINI.md
                - .github/workflows/skill-sync.yml
            pull_request:
              paths:
                - .agents/skills/wow-dev/SKILL.md
                - .claude/skills/wow-dev/SKILL.md
                - .opencode/skills/wow-dev/SKILL.md
                - .agent/skills/wow-dev/SKILL.md
                - scripts/sync-wow-dev-skill.py
                - tests/test_sync_wow_dev_skill.py
                - AGENTS.md
                - CLAUDE.md
                - GEMINI.md
                - .github/workflows/skill-sync.yml
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: skill-sync-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-latest, windows-latest, macos-latest]
              runs-on: ${{ matrix.os }}
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v7
                  with:
                    python-version: '3.x'
                - name: Run synchronization tests
                  run: python -m unittest tests.test_sync_wow_dev_skill
                - name: Verify generated discovery copies
                  run: python scripts/sync-wow-dev-skill.py --check --json
                - name: Verify mandatory entrypoints
                  shell: python
                  run: |
                    from pathlib import Path
                    marker = '## Mandatory WoW development skill'
                    for name in ('AGENTS.md', 'CLAUDE.md', 'GEMINI.md'):
                        text = Path(name).read_text(encoding='utf-8')
                        if marker not in text or '.agents/skills/wow-dev/SKILL.md' not in text:
                            raise SystemExit(f'missing mandatory skill route in {name}')
          '''
          workflow = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow.splitlines()
          ).lstrip()
          Path('.github/workflows/skill-sync.yml').write_text(
              workflow, encoding='utf-8', newline='\n'
          )

          Path('.github/workflows/finalize-wow-dev-skill-sync-20260904.yml').unlink()
          PY

      - name: Validate skill routing and repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest tests.test_sync_wow_dev_skill
          python3 scripts/sync-wow-dev-skill.py --check --json
          cargo fmt --all --check
          cargo test --locked --workspace --all-targets --all-features

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(skill): enforce one canonical WoW development workflow'
          git push origin HEAD:main
