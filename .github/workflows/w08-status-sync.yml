name: W08 status ledger synchronization v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w08-status-sync.yml
permissions:
  contents: write
concurrency:
  group: w08-status-sync
  cancel-in-progress: false
jobs:
  check-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_COMMIT: b6ea5981b2372468e332b30c0bdd697ce3b52301
      BASE_TREE: 312caed69e65a5b907dfa219e2fb3aa739837ece
      STAGING_PARENT: 4c0766477cf8d5b81f1fa4499702a925dcc376d8
      PATCH_SHA256: 02b8b01435848645c9dcfb398d20ec7c39a437266c4e3abfcfbf7ba4c9f8ec2d
      PRODUCT_TREE: 9d67403801a92992105ba5f92e8b9580bcab973c
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Admit exact ledger patch and remove checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          cat .ci/w08-status-sync.patch.xz.b64.* > "$RUNNER_TEMP/status.patch.xz.b64"
          base64 -d "$RUNNER_TEMP/status.patch.xz.b64" > "$RUNNER_TEMP/status.patch.xz"
          xz -dc "$RUNNER_TEMP/status.patch.xz" > "$RUNNER_TEMP/status.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/status.patch" | sha256sum -c -
          git rm -- .ci/w08-status-sync.patch.xz.b64.* .github/workflows/w08-status-sync.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/status.patch"
      - name: Install minimal Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Repository policy and exact tree
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          expected="$(cat <<'FILES'
          AGENTS.md
          crates/MANIFEST.json
          docs/IMPLEMENTATION_STATUS.md
          docs/PROJECT_COMPLETION_MATRIX.md
          docs/SOURCE_CHECKOUT_UPDATES.md
          FILES
          )"
          test "$actual" = "$expected"
          test "$(git write-tree)" = "$PRODUCT_TREE"
          grep -Fq 'materialize-source-api' AGENTS.md
          grep -Fq 'exact-github-api-source-materialization' crates/MANIFEST.json
      - name: Retain exact checked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$PRODUCT_TREE"
          printf '%s\n' "$PRODUCT_TREE" > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/checked.patch"
          cp "$RUNNER_TEMP/policy.log" "$RUNNER_TEMP/checkpoint/policy.log"
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar checked.patch > SHA256SUMS)
      - name: Upload ledger evidence
        uses: actions/upload-artifact@v7
        with:
          name: w08-status-sync-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
      - name: Fast-forward checked ledger tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(w08): synchronize exact API snapshot status [skip ci]' \
            -m 'Record the checkout-free exact GitHub API/blob source lane in contributor routing, implementation status, the completion matrix and the machine inventory. Repository policy passed; this documentation checkpoint runs no tests.'
          git push origin HEAD:main
