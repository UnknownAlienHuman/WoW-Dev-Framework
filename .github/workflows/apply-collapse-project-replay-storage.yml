name: Apply single Project replay storage schema

on:
  push:
    branches:
      - refactor/collapse-numbered-project-replays-2026-10-20

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Collapse Project replay storage schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/collapse-project-replay-storage.py')
          text = path.read_text()
          old = r': &str =\\n\\s+\"wow-project'
          new = r': &str =\\s*\"wow-project'
          if text.count(old) != 1:
              raise SystemExit('storage-constant regex patch input mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          python .github/collapse-project-replay-storage.py
          git rm .github/collapse-project-replay-storage.py
          git rm .github/workflows/apply-collapse-project-replay-storage.yml
          git add -u
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable check --locked -p wow-project -p wow-service --all-targets --all-features
          cargo +stable clippy --locked -p wow-project -p wow-service --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: use one Project replay storage schema"
          git push origin "HEAD:${GITHUB_REF_NAME}"
