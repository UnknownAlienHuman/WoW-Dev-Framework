name: W06 publish checked annotation sidecars
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: w06-annotation-sidecars-publisher
  cancel-in-progress: false
env:
  BASE_COMMIT: 8070771d504cec89e118c956037404a3687357c7
  BASE_TREE: 6c79abc3ae15471fe6f5056dfb6506d59b5bd0ac
  ARTIFACT_ID: '11115701248'
  ARTIFACT_ZIP_SHA256: e0630c3f5cbd53bc69af2bc059df730b5a72ef9c5f1a7866ee3866177f26924e
  SOURCE_TAR_SHA256: 2b4b5cc7b53170ed710da9372374abcb4a8e8041d57f9b27b4bf14a2f539979b
  FORMATTED_PATCH_SHA256: 88c23dc2dbe4f951186c0a458d63c31b034560f22677e355d1ad3b9fea463998
  CHECKED_TREE: aaae43e5aeb833081cabceb89878d9828b7aa6e7
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Recover and verify the exact checked source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/w06-sidecars"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/w06-sidecars.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/w06-sidecars.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/w06-sidecars.zip" -d "$RUNNER_TEMP/w06-sidecars"
          test "$(cat "$RUNNER_TEMP/w06-sidecars/CHECKED_TREE")" = "$CHECKED_TREE"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$RUNNER_TEMP/w06-sidecars/checked-source.tar" | sha256sum -c -
          printf '%s  %s\n' "$FORMATTED_PATCH_SHA256" "$RUNNER_TEMP/w06-sidecars/formatted.patch" | sha256sum -c -
          git reset --hard "$BASE_COMMIT"
          git clean -fdx
          tar -xf "$RUNNER_TEMP/w06-sidecars/checked-source.tar" -C .
          git add --all
          test "$(git write-tree)" = "$CHECKED_TREE"
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          expected="$(cat <<'FILES'
          crates/wow-annotations/src/lib.rs
          crates/wow-annotations/src/sidecars.rs
          crates/wow-service/src/local/native_input.rs
          crates/wow-service/src/reference_pack.rs
          FILES
          )"
          test "$actual" = "$expected"
      - name: Publish the exact checked tree to main
        id: publish
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (current.data.object.sha !== process.env.GITHUB_SHA) {
              core.setFailed(`main moved from ${process.env.GITHUB_SHA} to ${current.data.object.sha}`);
              return;
            }
            const paths = [
              'crates/wow-annotations/src/lib.rs',
              'crates/wow-annotations/src/sidecars.rs',
              'crates/wow-service/src/local/native_input.rs',
              'crates/wow-service/src/reference_pack.rs',
            ];
            const tree = [];
            const blobs = {};
            for (const filePath of paths) {
              const content = fs.readFileSync(filePath).toString('base64');
              const blob = await github.rest.git.createBlob({ owner, repo, content, encoding: 'base64' });
              blobs[filePath] = blob.data.sha;
              tree.push({ path: filePath, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            const createdTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: process.env.BASE_TREE,
              tree,
            });
            if (createdTree.data.sha !== process.env.CHECKED_TREE) {
              core.setFailed(`created tree ${createdTree.data.sha} differs from checked tree ${process.env.CHECKED_TREE}`);
              return;
            }
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'feat(annotations): materialize native source-map and loss sidecars [skip ci]\n\nW06 annotation-evidence slice. The native annotation owner now emits canonical standalone source-map and projection-loss artifacts bound to the exact AnnotationArtifact; Reference Pack v3 materializes and independently validates them without promoting the current partial map profile or declared losses to validated-local authority. Selected all-target/all-feature Clippy and repository policy passed on Linux with Rust 1.98.1; no tests executed.',
              tree: createdTree.data.sha,
              parents: [process.env.GITHUB_SHA],
            });
            await github.rest.git.updateRef({ owner, repo, ref: 'heads/main', sha: commit.data.sha, force: false });
            const receiptDir = path.join(process.env.RUNNER_TEMP, 'publication');
            fs.mkdirSync(receiptDir, { recursive: true });
            fs.writeFileSync(path.join(receiptDir, 'FINAL_COMMIT'), `${commit.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'FINAL_TREE'), `${createdTree.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'BLOBS.json'), `${JSON.stringify(blobs, null, 2)}\n`);
            core.setOutput('commit', commit.data.sha);
            core.setOutput('tree', createdTree.data.sha);
      - name: Retain publication receipt
        uses: actions/upload-artifact@v7
        with:
          name: w06-sidecars-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/publication
          retention-days: 3
          if-no-files-found: error
