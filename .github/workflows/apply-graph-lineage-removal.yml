name: Apply graph lineage removal

on:
  push:
    branches:
      - refactor/remove-graph-lineage-2026-10-18

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Remove closed lineage implementation loop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def remove_once(path: str, text: str) -> None:
              file = Path(path)
              content = file.read_text()
              count = content.count(text)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence of {text!r}, found {count}")
              file.write_text(content.replace(text, ""))

          remove_once("crates/wow-graph/src/lib.rs", "pub mod lineage;\n")
          remove_once("crates/wow-project/src/graph.rs", "pub mod lineage_input;\n")
          remove_once("crates/wow-service/src/live_project/tests.rs", "mod lineage_input;\n")
          remove_once(
              "crates/wow-project/src/replay/publication.rs",
              "    pub(crate) fn read_identity(&self) -> (&EpochId, &StoreGenerationId) {\n"
              "        (&self.read_epoch_id, &self.read_generation_id)\n"
              "    }\n",
          )
          remove_once(
              "crates/wow-graph/src/error.rs",
              "    LineageProfileInvalid,\n"
              "    LineageInputInvalid,\n"
              "    LineageSnapshotInvalid,\n"
              "    LineageQueryInvalid,\n"
              "    LineageReadCloseFailed,\n",
          )
          PY

          git rm -r \
            crates/wow-graph/src/lineage.rs \
            crates/wow-graph/src/lineage \
            crates/wow-project/src/graph/lineage_input.rs \
            crates/wow-project/src/graph/lineage_input \
            crates/wow-service/src/live_project/tests/lineage_input.rs \
            .github/workflows/apply-graph-lineage-removal.yml

          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings

          if rg -n "wow_graph::lineage|wow-graph::lineage|graph::lineage_input|mod lineage_input|pub mod lineage|Lineage(Profile|Input|Snapshot|Query|ReadClose)" --glob '!target/**' .; then
            echo "stale graph lineage reference remains" >&2
            exit 1
          fi
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove closed graph lineage implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
