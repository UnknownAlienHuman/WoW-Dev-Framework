name: W08 documentation field checkpoint
run-name: W08 documentation field checkpoint ${{ github.sha }}
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: w08-documentation-field-fix
  cancel-in-progress: false
env:
  BASE_COMMIT: 2a3d99ce9846dca4f7d2cfa784ba8b7ece3fcacc
  BASE_TREE: db1773a96931bad20d286e5dbf68624970d88565
  PATCH_SHA256: 54e9a38f3ca7aab7daf97023814506ebbfc29f9366d097e014c1036c82e53129
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact documentation correction and remove checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$BASE_COMMIT"
          base64 -d .ci/w08-doc-field.patch.xz.b64 > "$RUNNER_TEMP/w08-doc-field.patch.xz"
          xz -dc "$RUNNER_TEMP/w08-doc-field.patch.xz" > "$RUNNER_TEMP/w08-doc-field.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w08-doc-field.patch" | sha256sum -c -
          git rm -- .ci/w08-doc-field.patch.xz.b64 .github/workflows/w08-doc-field-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w08-doc-field.patch"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          test "$(git diff --cached --name-only "$BASE_COMMIT")" = 'docs/SOURCE_MATERIALIZATION.md'
          grep -Fq '`before_revision` and `selected_revision`' docs/SOURCE_MATERIALIZATION.md
          ! grep -Fq '`before_revision` and `selected_remote_revision`' docs/SOURCE_MATERIALIZATION.md
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          if test -f "$RUNNER_TEMP/policy.log"; then cp "$RUNNER_TEMP/policy.log" "$RUNNER_TEMP/checkpoint/policy.log"; fi
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w08-doc-field-correction-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
