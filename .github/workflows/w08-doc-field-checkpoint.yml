name: W08 publish checked documentation correction
run-name: W08 publish documentation correction ${{ github.sha }}
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: w08-documentation-field-fix
  cancel-in-progress: false
env:
  BASE_COMMIT: 2a3d99ce9846dca4f7d2cfa784ba8b7ece3fcacc
  STAGING_PARENT: c05bf32c2c75007541613a720a1fac4e13ca12b1
  ARTIFACT_ID: '11143968580'
  ARTIFACT_ZIP_SHA256: ef8de86fc98ec012ed6a7fe54400c9d6e834d85ad98dad1e0fcbc5bd470bfcfc
  SOURCE_TAR_SHA256: b37e18c939f2c1227e6a698c94771572b531366403bb48ff1d45558c2695e071
  CHECKED_TREE: cd90e1e5c028a94073e34beb447c53af8d3dd28f
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Recover exact checked documentation and fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          mkdir -p "$RUNNER_TEMP/checked"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/checked.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/checked.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/checked.zip" -d "$RUNNER_TEMP/checked"
          test "$(cat "$RUNNER_TEMP/checked/CHECKED_TREE")" = "$CHECKED_TREE"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$RUNNER_TEMP/checked/checked-source.tar" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/checked/checked-source.tar" -C .
          git rm -- .ci/w08-doc-field.patch.xz.b64 .github/workflows/w08-doc-field-checkpoint.yml
          git add --all
          git diff --cached --check
          test "$(git write-tree)" = "$CHECKED_TREE"
          test "$(git diff --cached --name-only "$BASE_COMMIT")" = 'docs/SOURCE_MATERIALIZATION.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(xtask): correct prompt authorization field [skip ci]' \
            -m 'Use the actual selected_revision request field in the managed source materialization contract. Repository policy passed; no tests executed.'
          git push origin HEAD:main
