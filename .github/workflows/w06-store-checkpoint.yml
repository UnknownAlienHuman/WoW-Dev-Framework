name: W06 sealed ReferenceStore checkpoint
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: w06-sealed-reference-store-checkpoint
  cancel-in-progress: false
env:
  BASE_COMMIT: 4c87525d4eba81c709e4a531030f4feed6db734f
  BASE_TREE: ff6d2c6b89b6325b1e43edd388e5c71ef67eecab
  PATCH_SHA256: fd7afdba1ba1a063f5cf413afebd85c125209c62b7ac91483feef143a4ca54c2
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact product patch and remove checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$BASE_COMMIT"
          xz -dc .ci/w06-reference-store.patch.xz > "$RUNNER_TEMP/w06-reference-store.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w06-reference-store.patch" | sha256sum -c -
          git rm -- .ci/w06-reference-store.patch.xz .github/workflows/w06-store-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w06-reference-store.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Minimal owner and service Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked \
            -p wow-store -p wow-reference -p wow-service \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          expected="$(cat <<'EOF'
          crates/wow-reference/src/persistent.rs
          crates/wow-service/src/reference_pack.rs
          crates/wow-store/Cargo.toml
          crates/wow-store/src/lib.rs
          crates/wow-store/src/model.rs
          crates/wow-store/src/store.rs
          EOF
          )"
          test "$actual" = "$expected"
          ! grep -R "todo!()\|unimplemented!()" \
            crates/wow-store/src crates/wow-reference/src/persistent.rs \
            crates/wow-service/src/reference_pack.rs
          grep -Fq 'features = ["bundled", "serialize"]' crates/wow-store/Cargo.toml
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w06-sealed-reference-store-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
