name: W06 publish checked compatibility evidence
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: w06-compatibility-evidence-publisher
  cancel-in-progress: false
env:
  BASE_COMMIT: 74f99e10790c216bcf962d6b44509216b1df50a1
  BASE_TREE: aaae43e5aeb833081cabceb89878d9828b7aa6e7
  STAGING_PARENT: 80a6b356ead29e40a5a55b835bdeb19cd66599de
  ARTIFACT_ID: '11117480934'
  ARTIFACT_ZIP_SHA256: 7812e979378d338412d6fe5eeda0045417481e111daa4ed5bad426d2c2e8d156
  SOURCE_TAR_SHA256: 1e565599a00a8d427bd26a62f4d68751df5089dbbbae006065d7212548feb982
  FORMATTED_PATCH_SHA256: 82a3537b4b7c771039c265912178645b0fa432bd521980e42cc15bf6c6d7f6ff
  CHECKED_TREE: 01e83143d5734514b4853e7bf1edf4cda8f88e7d
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Recover and verify the exact checked source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          mkdir -p "$RUNNER_TEMP/w06-artifact"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/w06-artifact.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/w06-artifact.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/w06-artifact.zip" -d "$RUNNER_TEMP/w06-artifact"
          test "$(cat "$RUNNER_TEMP/w06-artifact/CHECKED_TREE")" = "$CHECKED_TREE"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$RUNNER_TEMP/w06-artifact/checked-source.tar" | sha256sum -c -
          printf '%s  %s\n' "$FORMATTED_PATCH_SHA256" "$RUNNER_TEMP/w06-artifact/formatted.patch" | sha256sum -c -

          git reset --hard "$BASE_COMMIT"
          git clean -fdx
          tar -xf "$RUNNER_TEMP/w06-artifact/checked-source.tar" -C .
          git add --all
          test "$(git write-tree)" = "$CHECKED_TREE"
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          expected="$(cat <<'FILES'
          crates/wow-annotations/src/compatibility.rs
          crates/wow-annotations/src/lib.rs
          crates/wow-service/src/local/mod.rs
          crates/wow-service/src/local/native_compatibility.rs
          crates/wow-service/src/local/native_input.rs
          crates/wow-service/src/reference_pack.rs
          FILES
          )"
          test "$actual" = "$expected"
      - name: Publish the exact checked tree to main
        id: publish
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (current.data.object.sha !== process.env.GITHUB_SHA) {
              core.setFailed(`main moved from ${process.env.GITHUB_SHA} to ${current.data.object.sha}`);
              return;
            }
            const paths = [
              'crates/wow-annotations/src/compatibility.rs',
              'crates/wow-annotations/src/lib.rs',
              'crates/wow-service/src/local/mod.rs',
              'crates/wow-service/src/local/native_compatibility.rs',
              'crates/wow-service/src/local/native_input.rs',
              'crates/wow-service/src/reference_pack.rs',
            ];
            const tree = [];
            const blobs = {};
            for (const filePath of paths) {
              const content = fs.readFileSync(filePath).toString('base64');
              const blob = await github.rest.git.createBlob({
                owner,
                repo,
                content,
                encoding: 'base64',
              });
              blobs[filePath] = blob.data.sha;
              tree.push({ path: filePath, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            const createdTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: process.env.BASE_TREE,
              tree,
            });
            if (createdTree.data.sha !== process.env.CHECKED_TREE) {
              core.setFailed(`created tree ${createdTree.data.sha} differs from checked tree ${process.env.CHECKED_TREE}`);
              return;
            }
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'feat(annotations): admit exact parity and consumer evidence [skip ci]\n\nW06 compatibility-evidence slice. The annotation owner now validates canonical, identity-bound parity reports and EmmyLua/LuaLS consumer probe results supplied by an explicit external adapter; Reference Pack v4 materializes and independently revalidates these members. Missing, unresolved or incomplete reports remain NotEvaluated rather than becoming compatibility success. Selected all-target/all-feature Clippy and repository policy passed on Linux with Rust 1.98.1; no tests executed.',
              tree: createdTree.data.sha,
              parents: [process.env.GITHUB_SHA],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/main',
              sha: commit.data.sha,
              force: false,
            });
            const receiptDir = path.join(process.env.RUNNER_TEMP, 'publication');
            fs.mkdirSync(receiptDir, { recursive: true });
            fs.writeFileSync(path.join(receiptDir, 'FINAL_COMMIT'), `${commit.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'FINAL_TREE'), `${createdTree.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'BLOBS.json'), `${JSON.stringify(blobs, null, 2)}\n`);
            core.setOutput('commit', commit.data.sha);
            core.setOutput('tree', createdTree.data.sha);
            core.info(`published ${commit.data.sha} tree ${createdTree.data.sha}`);
      - name: Retain publication receipt
        uses: actions/upload-artifact@v7
        with:
          name: w06-compatibility-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/publication
          retention-days: 3
          if-no-files-found: error
