name: Verify and publish I0-B reference views

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-publish-i0-b-reference.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-publish-i0-b-reference
  cancel-in-progress: true

jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Complete integration and source normalization
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/dev/finalize_i0_b_reference.py ]]; then
            python3 .github/dev/finalize_i0_b_reference.py
          elif [[ -f .github/dev/apply_i0_b_reference.py ]]; then
            python3 .github/dev/apply_i0_b_reference.py
          fi
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("crates/wow-reference/src/deterministic_view.rs")
          if not source_path.is_file():
              raise SystemExit("deterministic reference implementation is missing")
          source = source_path.read_text(encoding="utf-8")
          source = source.replace(
              "bytes.next().is_some_and(u8::is_ascii_alphanumeric)",
              "bytes.next().is_some_and(|byte| byte.is_ascii_alphanumeric())",
          )
          source = source.replace(
              "pub fn lookup<'a>(&'a self, partition_id: &str, key: &str) -> LookupResult<'a>",
              "pub fn lookup(&self, partition_id: &str, key: &str) -> LookupResult<'_>",
          )
          source_path.write_text(source, encoding="utf-8")
          PY

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Format and lock workspace
        shell: bash
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 generate-lockfile

      - name: Apply compiler and lint suggestions
        run: cargo +1.98.0 clippy --fix --allow-dirty --allow-staged --allow-no-vcs --workspace --all-targets --all-features

      - name: Enforce strict lints
        run: cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run all debug and release tests
        shell: bash
        run: |
          cargo +1.98.0 test --locked --workspace --all-features
          cargo +1.98.0 test --locked --workspace --all-features --release

      - name: Build strict documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.98.0 doc --locked --workspace --all-features --no-deps

      - name: Preserve failed candidate
        if: failure()
        shell: bash
        run: tar --exclude=.git --exclude=target -czf /tmp/i0-b-reference-v3-failed.tar.gz .

      - name: Upload failed candidate
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: i0-b-reference-v3-failed
          path: /tmp/i0-b-reference-v3-failed.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Publish directly to main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/dev/apply_i0_b_reference.py
          rm -f .github/dev/finalize_i0_b_reference.py
          rm -f .github/workflows/apply-i0-b-reference.yml
          rm -f .github/workflows/finalize-i0-b-reference.yml
          rm -f .github/workflows/verify-publish-i0-b-reference.yml
          rmdir .github/dev 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(wow-reference): implement deterministic reference views"
          git push origin HEAD:main
