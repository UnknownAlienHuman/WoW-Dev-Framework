name: Materialize wow-store E1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-store-e1.yml

permissions:
  contents: write

concurrency:
  group: materialize-store-e1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Materialize staged package
        run: |
          set -euo pipefail
          test "$(find .ci/materialize/store-e1 -type f | wc -l)" -eq 10
          mkdir -p crates/wow-store/src crates/wow-store/tests
          cp .ci/materialize/store-e1/Cargo.toml crates/wow-store/Cargo.toml
          cp .ci/materialize/store-e1/README.md crates/wow-store/README.md
          cp .ci/materialize/store-e1/IMPLEMENTATION_STATUS.md crates/wow-store/IMPLEMENTATION_STATUS.md
          cp .ci/materialize/store-e1/AGENTS.md crates/wow-store/AGENTS.md
          cp .ci/materialize/store-e1/src/*.rs crates/wow-store/src/
          cp .ci/materialize/store-e1/tests/*.rs crates/wow-store/tests/
          python3 - <<'PY'
          from pathlib import Path
          import copy
          import json

          cargo = Path('Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          if '"crates/wow-store"' not in text:
              marker = '    "crates/wow-reference",\n'
              if marker not in text:
                  raise SystemExit('wow-reference workspace marker missing')
              text = text.replace(marker, marker + '    "crates/wow-store",\n')
              cargo.write_text(text, encoding='utf-8')

          manifest = Path('crates/MANIFEST.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          found = []

          def visit(node):
              if isinstance(node, list):
                  for index, item in enumerate(node):
                      if isinstance(item, dict) and any(
                          item.get(key) == 'wow-reference'
                          for key in ('name', 'id', 'crate', 'package')
                      ):
                          found.append((node, index, item))
                      visit(item)
              elif isinstance(node, dict):
                  for value in node.values():
                      visit(value)

          visit(data)
          if len(found) != 1:
              raise SystemExit(f'expected one wow-reference manifest record, got {len(found)}')
          container, index, record = found[0]
          already = any(
              isinstance(item, dict)
              and any(item.get(key) == 'wow-store' for key in ('name', 'id', 'crate', 'package'))
              for item in container
          )
          if not already:
              new = copy.deepcopy(record)

              def rewrite(value):
                  if isinstance(value, str):
                      return (
                          value.replace('wow-reference', 'wow-store')
                          .replace('Reference', 'Store')
                          .replace('reference', 'store')
                          .replace('E0-B', 'E1-A')
                      )
                  if isinstance(value, list):
                      return [rewrite(item) for item in value]
                  if isinstance(value, dict):
                      return {key: rewrite(item) for key, item in value.items()}
                  return value

              new = rewrite(new)
              for key in list(new):
                  if 'depend' in key.lower() and isinstance(new[key], list):
                      new[key] = ['wow-core']
              for key in ('description', 'summary', 'purpose'):
                  if key in new and isinstance(new[key], str):
                      new[key] = (
                          'Persistent content-addressed E1 storage with immutable '
                          'snapshots and compare-and-swap publication refs.'
                      )
              container.insert(index + 1, new)
          manifest.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Resolve lockfile and apply machine-safe formatting
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable clippy --fix --package wow-store --all-targets --all-features --allow-dirty --allow-staged -- -D warnings
          cargo +stable fmt --all
      - name: Run release-grade persistence gate
        run: |
          set -euo pipefail
          cargo +stable xtask check
          cargo +stable fmt --all --check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable test --locked --workspace --all-targets --all-features
          cargo +stable test --release --locked --package wow-store --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Commit verified package and remove staging machinery
        run: |
          set -euo pipefail
          rm -rf .ci/materialize/store-e1
          rm .github/workflows/materialize-store-e1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A Cargo.toml Cargo.lock crates/MANIFEST.json crates/wow-store .ci/materialize/store-e1 .github/workflows/materialize-store-e1.yml
          git diff --cached --check
          git commit -m 'feat(store): activate content-addressed E1 persistence'
          git push origin HEAD:main
