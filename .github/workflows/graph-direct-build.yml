name: Direct graph reads check
on:
  push:
    branches: [main]
    paths: ['.ci/graph-direct/**', '.github/workflows/graph-direct-build.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit exact reviewed direct-read implementation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/graph-direct"
          git rev-parse HEAD > "$RUNNER_TEMP/graph-direct/BASE_SHA"
          test "$(git hash-object .ci/graph-direct/00)" = 4d01256d8b252f08edd541d180e9c290d5e788ec
          test "$(git hash-object .ci/graph-direct/01)" = a99e210f9c9aa07c9802546665a906b2786551fb
          test "$(git hash-object .ci/graph-direct/02)" = 2ac4e7485428df377956bd30f10281c59ba3fbb2
          test "$(git hash-object .ci/graph-direct/03)" = 19f443d4da832d31b8350c067793761f38fe832b
          test "$(git hash-object .ci/graph-direct/fix.patch)" = fbad1a01cdb8c2d135782ffd61d714c1a922bf4a
          cp .ci/graph-direct/fix.patch "$RUNNER_TEMP/graph-direct/fix.patch"
          cat .ci/graph-direct/00 .ci/graph-direct/01 .ci/graph-direct/02 .ci/graph-direct/03 | base64 --decode | gzip -d > "$RUNNER_TEMP/graph-direct/input.patch"
          echo '612002c2cc83d43e4d48cbb7852d1f0bfaa0d6cdff2c9e73b257020f3c71521f  input.patch' > "$RUNNER_TEMP/graph-direct/INPUT_SHA256"
          (cd "$RUNNER_TEMP/graph-direct" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/graph-direct .github/workflows/graph-direct-build.yml
          test "$(git write-tree)" = a34a83b07c59bd829d25196f8be3b651b222dcc8
          git apply --index "$RUNNER_TEMP/graph-direct/input.patch"
          test "$(git write-tree)" = 9649e28968adc21d486e6e280e3f07e958227c15
          git apply --index "$RUNNER_TEMP/graph-direct/fix.patch"
          test "$(git write-tree)" = 8728179d9f06f190081608a51bb521d3106333ca
      - name: Format changed packages
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/graph-direct/RUST_VERSION"
          cargo +stable fmt -p wow-graph -p wow-service -p wow-cli
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/graph-direct/TREE_SHA"
      - name: Clippy changed graph service and CLI
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-graph -p wow-service -p wow-cli -- -D warnings 2>&1 | tee "$RUNNER_TEMP/graph-direct/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/graph-direct/policy.log"
      - name: Retain checked source
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/graph-direct/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/graph-direct/checked.patch"
          git archive "$(git write-tree)" > "$RUNNER_TEMP/graph-direct/checked-source.tar"
          (cd "$RUNNER_TEMP/graph-direct" && sha256sum checked.patch checked-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: graph-direct-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/graph-direct/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: graph-direct-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: graph-direct-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows
      - name: Publish identical checked code to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for platform in linux windows; do
            test "$(cat "$RUNNER_TEMP/$platform/BASE_SHA")" = "$GITHUB_SHA"
            (cd "$RUNNER_TEMP/$platform" && sha256sum -c SHA256SUMS)
          done
          cmp "$RUNNER_TEMP/linux/TREE_SHA" "$RUNNER_TEMP/windows/TREE_SHA"
          cmp "$RUNNER_TEMP/linux/checked.patch" "$RUNNER_TEMP/windows/checked.patch"
          git apply --index "$RUNNER_TEMP/linux/checked.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cli): expose exact entities and bounded direct graph neighbors' -m "Add exact-snapshot entity and direct-neighbor reads through existing graph/service/CLI owners. Preserve original evidence, explicit missing-entity non-authority, confidence selection, complete relation coverage, whole-item output bounds and exact omitted-edge counts. Reuse legacy one-hop selection without cloning all matching edges; preserve valid legacy outputs and existing graph command schemas. Selected graph/service/CLI Clippy and repository policy passed on identical Linux/Windows source trees in run $GITHUB_RUN_ID. No tests, dependencies or lockfile changed. Full evidence/conflict resolution, runtime validation and coherent ProjectStore remain separate. Temporary check inputs removed."
          git push origin HEAD:main
