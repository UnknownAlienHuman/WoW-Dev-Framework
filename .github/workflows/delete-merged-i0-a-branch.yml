name: Delete merged I0-A branch

on:
  push:
    branches:
      - impl/i0-a-wow-core

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete merged implementation branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          curl --fail-with-body \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/impl/i0-a-wow-core"
