name: Export I0-C development inputs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-i0-c-dev-inputs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-i0-c-dev-inputs
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out framework main
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned EmmyLua upstream
        uses: actions/checkout@v6.0.2
        with:
          repository: EmmyLuaLs/emmylua-analyzer-rust
          ref: aaaca68425d9362876228649b0b8d92f07654daa
          path: .i0c-upstream/emmylua-analyzer-rust
          persist-credentials: false

      - name: Package exact tracked inputs
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf /tmp/framework-main.tar.gz
          tar --exclude=.git -czf /tmp/emmylua-aaaca684.tar.gz -C .i0c-upstream/emmylua-analyzer-rust .
          sha256sum /tmp/framework-main.tar.gz /tmp/emmylua-aaaca684.tar.gz > /tmp/SHA256SUMS

      - name: Upload development inputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: i0-c-dev-inputs
          path: |
            /tmp/framework-main.tar.gz
            /tmp/emmylua-aaaca684.tar.gz
            /tmp/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
