name: Ship generated API bridge v5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ship-api-v5.yml"

permissions:
  actions: write
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel obsolete transient workflow runs
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > "$RUNNER_TEMP/runs.json"
          python - <<'PY' > "$RUNNER_TEMP/cancel-runs"
          import json
          import os
          from pathlib import PurePosixPath

          current = int(os.environ["GITHUB_RUN_ID"])
          prefixes = (
              "finalize-", "unblock-", "export-", "implement-", "publish-",
              "repair-", "bootstrap-", "ship-current-", "i0-a-export-",
          )
          with open(os.environ["RUNNER_TEMP"] + "/runs.json", encoding="utf-8") as handle:
              runs = json.load(handle)["workflow_runs"]
          for run in runs:
              name = PurePosixPath(run.get("path", "")).name
              if run.get("id") != current and run.get("status") != "completed" and name.startswith(prefixes):
                  print(run["id"])
          PY
          while read -r run_id; do
            [[ -z "$run_id" ]] && continue
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
          done < "$RUNNER_TEMP/cancel-runs"

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install narrow import boundary and synchronize skill
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          root = Path.cwd()
          clean = root / "crates/wow-reference/src/generated_api_clean.rs"
          target = root / "crates/wow-reference/src/generated_api.rs"
          if clean.exists():
              text = clean.read_text(encoding="utf-8")
          elif target.exists() and "Validated import boundary for normalized Blizzard generated API documents" in target.read_text(encoding="utf-8"):
              text = target.read_text(encoding="utf-8")
          else:
              raise SystemExit("clean generated API importer is unavailable")

          required_block = textwrap.dedent('''
                  let records = array(
                      required(member, collection, collection)?,
                      collection,
                  )?;
          ''')
          optional_line = '        let records = optional_array(member, collection)?;\n'
          if required_block in text:
              text = text.replace(required_block, optional_line, 1)
          elif "let records = optional_array(member, collection)?;" not in text:
              raise SystemExit("unknown nested collection seam")

          helper_marker = "fn array<'a>(value: &'a Value, label: &str) -> GeneratedApiImportResult<&'a [Value]> {\n"
          if "fn optional_array<'a>(" not in text:
              helper = textwrap.dedent('''
                  fn optional_array<'a>(
                      object: &'a Map<String, Value>,
                      key: &str,
                  ) -> GeneratedApiImportResult<&'a [Value]> {
                      match object.get(key) {
                          None => Ok(&[]),
                          Some(value) => array(value, key),
                      }
                  }

              ''')
              if helper_marker not in text:
                  raise SystemExit("array helper seam not found")
              text = text.replace(helper_marker, helper + helper_marker, 1)
          target.write_text(text, encoding="utf-8")
          clean.unlink(missing_ok=True)

          lib = root / "crates/wow-reference/src/lib.rs"
          lib_text = lib.read_text(encoding="utf-8")
          if "pub mod generated_api;" not in lib_text:
              lib.write_text(lib_text.rstrip() + "\n\npub mod generated_api;\n", encoding="utf-8")

          cli = root / "crates/wow-reference/src/bin/wow-reference-api.rs"
          cli_text = cli.read_text(encoding="utf-8")
          cli_text = cli_text.replace("use serde_json::{Value, json};", "use serde_json::json;")
          marker = "fn write_json_atomic<T: Serialize>(path: &Path, value: &T) -> Result<(), String> {\n"
          if "refusing to replace existing output" not in cli_text:
              guard = textwrap.dedent('''
                  if path.exists() {
                      return Err(format!("refusing to replace existing output {}", path.display()));
                  }
              ''')
              if marker not in cli_text:
                  raise SystemExit("CLI write seam not found")
              cli_text = cli_text.replace(marker, marker + guard, 1)
          cli.write_text(cli_text, encoding="utf-8")

          skill = textwrap.dedent('''\
              ---
              name: wow-dev
              description: Current-source workflow for World of Warcraft addon research, implementation, review, migration, and debugging.
              ---

              # WoW development skill

              Use this skill for every WoW addon or framework task.

              1. Read the actual target repository, local instructions, TOCs, load order, flavor and selector, subsystem, and risk areas first.
              2. Prefer the configured local Blizzard UI checkout. Use GitHub only when suitable local source is unavailable.
              3. Resolve the moving selector once at operation start. Record exact Git object ID and `version.txt`; read generated docs, Lua, XML, TOC, XSD, and implementation from that revision only. Re-resolve on the next operation.
              4. Create and verify a source manifest. For generated API work build and verify `.wow-dev/api-reference.json`, then run `wow-reference-api verify` before consuming facts.
              5. Check optional context only through the generic interface. If disabled, unavailable, unconfigured, or unauthorized, continue silently. When enabled, request one sanitized route, never expose provider identity or provenance, classify it `advisory`, and revalidate every patch-sensitive claim.
              6. Use generated docs for signatures, events, enums, predicates, and declared restrictions. Inspect implementation, XML, and TOC separately for lifecycle. An empty search is ambiguous, not proof of absence.
              7. Classify claims as `current-source-confirmed`, `project-confirmed`, `runtime-confirmed`, `implementation-derived`, `advisory`, `historical`, or `unverified`.
              8. Keep version and flavor behavior behind narrow adapters. Do not execute repository code while indexing, mutate protected state in combat, or assume conversion, copying, serialization, or `pcall` removes Secret Value restrictions.
              9. Run every available deterministic check. Missing tools or client access are skipped or `NotEvaluated`. Runtime claims require exact build, Interface, addon ref, scenario, restriction state, steps, and observations.
              10. Report target ref and flavor, exact Blizzard revision and version, source pointers, classifications, files changed, checks, remaining client work, and the next exact blocker. Never include optional provider identity or private provenance.
          ''')
          canonical = root / ".agents/skills/wow-dev/SKILL.md"
          canonical.parent.mkdir(parents=True, exist_ok=True)
          canonical.write_text(skill, encoding="utf-8")

          private_tokens = [
              "wow-addon-" + "engineering-kb",
              "UnknownAlienHuman/" + "wow-addon-" + "engineering-kb",
              "WoW Addon " + "Engineering KB",
          ]
          replacements = {
              "https://github.com/" + private_tokens[1]: "operator-configured advisory context provider",
              private_tokens[1]: "operator-configured advisory context provider",
              private_tokens[0]: "operator-configured advisory context provider",
              private_tokens[2]: "operator-configured advisory context provider",
          }
          tracked = subprocess.run(["git", "ls-files", "-z"], check=True, stdout=subprocess.PIPE).stdout.split(b"\0")
          for raw in tracked:
              if not raw:
                  continue
              path = root / raw.decode("utf-8")
              try:
                  current = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = current
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != current:
                  path.write_text(updated, encoding="utf-8")

          workflows = root / ".github/workflows"
          keep = {
              "branch-hygiene.yml", "i0-foundation.yml", "i0-reference.yml",
              "blizzard-api-reference.yml", "source-health.yml",
              "rolling-dependencies.yml", "skill-matrix.yml",
              "validate-addon-action.yml", "ship-api-v5.yml",
          }
          transient = re.compile(r"^(?:finalize-|unblock-|export-|implement-|publish-|repair-|bootstrap-|ship-current-|i0-a-export-)")
          for pattern in ("*.yml", "*.yaml"):
              for candidate in workflows.glob(pattern):
                  if candidate.name not in keep and transient.match(candidate.name):
                      candidate.unlink()
          PY
          python scripts/sync-wow-dev-skill.py --write
          python scripts/sync-wow-dev-skill.py --check

      - name: Run deterministic owner gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python -m py_compile scripts/wow_api_reference.py scripts/build-blizzard-api-reference.py scripts/verify-blizzard-api-reference.py tests/test_blizzard_api_reference.py
          python -m unittest -v tests/test_blizzard_api_reference.py
          python scripts/sync-wow-dev-skill.py --check
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps
          git diff --check

      - name: Run current-source end-to-end smoke
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 --no-tags --single-branch --branch live https://github.com/Gethe/wow-ui-source.git "$RUNNER_TEMP/wow-ui-source"
          revision="$(git -C "$RUNNER_TEMP/wow-ui-source" rev-parse HEAD)"
          python scripts/build-blizzard-source-manifest.py --source "$RUNNER_TEMP/wow-ui-source" --revision "$revision" --selector live --output "$RUNNER_TEMP/source-manifest.json"
          python scripts/build-blizzard-api-reference.py --source "$RUNNER_TEMP/wow-ui-source" --manifest "$RUNNER_TEMP/source-manifest.json" --output "$RUNNER_TEMP/api-reference.json" --json
          python scripts/verify-blizzard-api-reference.py "$RUNNER_TEMP/api-reference.json" --source "$RUNNER_TEMP/wow-ui-source" --manifest "$RUNNER_TEMP/source-manifest.json" --current-ref origin/live --require-complete --json
          cargo run --locked -p wow-reference --bin wow-reference-api -- verify "$RUNNER_TEMP/api-reference.json"
          cargo run --locked -p wow-reference --bin wow-reference-api -- materialize "$RUNNER_TEMP/api-reference.json" "$RUNNER_TEMP/api-index.json"
          test -s "$RUNNER_TEMP/api-index.json"

      - name: Publish validated bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ship-api-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(wow-reference): publish generated API bridge"
          git pull --rebase origin main
          git push origin HEAD:main
