name: Apply PR 249 safe evidence migration

on:
  push:
    branches:
      - feat/compiled-emmy-identity-2026-10-24

permissions:
  contents: write

concurrency:
  group: apply-pr249-safe-evidence-migration
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'UnknownAlienHuman/WoW-Dev-Framework'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/compiled-emmy-identity-2026-10-24
          fetch-depth: 1
          persist-credentials: true

      - name: Apply typed report-evidence migration
        env:
          EXPECTED_HEAD: 9b3d2496a5daec2af446eb8770a9886cc3bd6bc1
          TARGET_BRANCH: feat/compiled-emmy-identity-2026-10-24
        run: |
          set -euo pipefail

          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            printf 'refusing stale patch: expected %s, found %s\n' "$EXPECTED_HEAD" "$actual_head" >&2
            exit 1
          fi

          gzip -dc .ci/pr249-followup.patch.gz | git apply --check -
          gzip -dc .ci/pr249-followup.patch.gz | git apply -

          rm -- .ci/pr249-followup.patch.gz .github/workflows/apply-pr249-safe-evidence-migration.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: require typed Emmy report evidence'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
