name: Fix one-shot Search unit construction

on:
  push:
    branches:
      - refactor/remove-one-shot-search-registry-2026-10-18

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply Clippy corrections and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          search = Path("crates/wow-service/src/search.rs")
          text = search.read_text()
          old = "    pub fn new() -> Self {\n        Self::default()\n    }"
          new = "    pub fn new() -> Self {\n        Self\n    }"
          if text.count(old) != 1:
              raise SystemExit("unexpected SearchOperationService::new body")
          search.write_text(text.replace(old, new))

          test = Path("crates/wow-service/src/local/platform_input/tests/reference_context_handoff.rs")
          text = test.read_text()
          count = text.count("SearchOperationService::default()")
          if count != 8:
              raise SystemExit(f"expected 8 default constructions, found {count}")
          test.write_text(text.replace("SearchOperationService::default()", "SearchOperationService::new()"))
          PY
          git rm .github/workflows/fix-one-shot-search-unit-struct.yml
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-service/src/search.rs crates/wow-service/src/local/platform_input/tests/reference_context_handoff.rs
          git commit -m "fix: construct stateless Search service directly"
          git push origin "HEAD:${GITHUB_REF_NAME}"
