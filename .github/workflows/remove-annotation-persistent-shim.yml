name: Remove annotation persistence shim

on:
  push:
    branches:
      - refactor/remove-dead-service-admin-2026-10-19

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove compatibility-only annotation module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/wow-annotations/src/lib.rs')
          text = path.read_text()
          old = 'pub mod navigation;\npub mod persistent;\npub mod reference_links;'
          new = 'pub mod navigation;\npub mod reference_links;'
          if text.count(old) != 1:
              raise SystemExit('unexpected persistent export')
          path.write_text(text.replace(old, new))
          PY
          git rm crates/wow-annotations/src/persistent.rs
          git rm .github/workflows/remove-annotation-persistent-shim.yml
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked -p wow-annotations -p wow-service -p wow-reference-builder --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-annotations
          git commit -m "refactor: remove annotation persistence compatibility shim"
          git push origin "HEAD:${GITHUB_REF_NAME}"
