name: W09 package service checkpoint v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w09-package-service-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: w09-package-service-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_COMMIT: c045bf9b7d98dba4311b4632f8fa06a538540d1a
      BASE_TREE: 91013f630879213923eb344abfe7beb72d9feb42
      STAGING_PARENT: 717f7466aee98d54b379d69acc462cb1a291217f
      PATCH_SHA256: 4569d250b039090abab1c10c3e40a52c2d05a7c8226618831c228932ecd6dc98
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Admit W09 service patch and remove checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          cat .ci/w09-package-service.patch.xz.b64.* > "$RUNNER_TEMP/w09.patch.xz.b64"
          base64 -d "$RUNNER_TEMP/w09.patch.xz.b64" > "$RUNNER_TEMP/w09.patch.xz"
          xz -dc "$RUNNER_TEMP/w09.patch.xz" > "$RUNNER_TEMP/w09.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w09.patch" | sha256sum -c -
          git rm -- .ci/w09-package-service.patch.xz.b64.* .github/workflows/w09-package-service-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w09.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Minimal affected-crate Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked -p wow-project -p wow-service -p wow-cli --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          git diff --cached --name-only "$BASE_COMMIT" | sort > "$RUNNER_TEMP/changed-files"
          printf '%s\n' \
            apps/wow/src/output.rs \
            crates/wow-project/src/configuration.rs \
            crates/wow-project/src/generation.rs \
            crates/wow-project/src/inventory.rs \
            crates/wow-project/src/load/mod.rs \
            crates/wow-project/src/load/package_closure.rs \
            crates/wow-service/src/local/backend.rs \
            crates/wow-service/src/local/disk_input.rs \
            crates/wow-service/src/local/input.rs \
            crates/wow-service/src/local/mod.rs \
            crates/wow-service/src/local/projection.rs \
            > "$RUNNER_TEMP/expected-files"
          cat "$RUNNER_TEMP/changed-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w09-package-service-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
      - name: Fast-forward exact checked tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git commit -m 'feat(wow-service): bind package universe input [skip ci]'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
