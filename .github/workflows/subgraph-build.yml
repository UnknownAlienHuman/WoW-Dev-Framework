name: Subgraph build
on:
  push:
    branches: [main]
    paths:
      - '.ci/subgraph/**'
      - '.github/workflows/subgraph-build.yml'
permissions:
  contents: read
concurrency:
  group: subgraph-build-main
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit the reviewed implementation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/subgraph-input" "$RUNNER_TEMP/subgraph"
          git rev-parse HEAD > "$RUNNER_TEMP/subgraph/BASE_SHA"
          test "$(git hash-object .ci/subgraph/owner.rs)" = 9eac8772234de3078f660b44a613e892b7b7ccfb
          test "$(git hash-object .ci/subgraph/walk.rs)" = ca6ef17822baec46711a37bd314136c39b86c808
          test "$(git hash-object .ci/subgraph/usage.md)" = 81459848bb45b890c9ea218086749c328d8868e3
          test "$(git hash-object .ci/subgraph/integration.patch)" = 5222389bd8a322913b02a8ab9ac2bf0146255caf
          cp .ci/subgraph/* "$RUNNER_TEMP/subgraph-input/"
          git rm -r -- .ci/subgraph .github/workflows/subgraph-build.yml
          test "$(git write-tree)" = 93f3c8a804345e2bcc0cb6292b5325e82d4dc24d
          git apply --index "$RUNNER_TEMP/subgraph-input/integration.patch"
          mkdir -p crates/wow-graph/src/subgraph
          cp "$RUNNER_TEMP/subgraph-input/owner.rs" crates/wow-graph/src/subgraph.rs
          cp "$RUNNER_TEMP/subgraph-input/walk.rs" crates/wow-graph/src/subgraph/walk.rs
          cp "$RUNNER_TEMP/subgraph-input/usage.md" crates/wow-graph/SUBGRAPH_USAGE.md
          git add crates/wow-graph
          test "$(git write-tree)" = bff344c9625d3a361b198d376d5d4423b79bdbfa
      - name: Format reviewed code
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/subgraph/RUST_VERSION"
          cargo +stable fmt --all
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/subgraph/TREE_SHA"
      - name: Build graph library
        run: |
          set -euo pipefail
          cargo +stable build --locked -p wow-graph --lib 2>&1 | tee "$RUNNER_TEMP/subgraph/build.log"
      - name: Check changed owner
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-graph --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/subgraph/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/subgraph/policy.log"
          cargo +stable fmt --all --check
          git diff --exit-code
      - name: Retain compiled source
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/subgraph/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/subgraph/compiled.patch"
          git archive --format=tar "$(cat "$RUNNER_TEMP/subgraph/TREE_SHA")" > "$RUNNER_TEMP/subgraph/compiled-source.tar"
          (cd "$RUNNER_TEMP/subgraph" && sha256sum compiled.patch compiled-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: subgraph-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/subgraph/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: subgraph-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-subgraph
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: subgraph-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-subgraph
      - name: Publish identical compiled source to unchanged main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = main
          for platform in linux windows; do
            (cd "$RUNNER_TEMP/$platform-subgraph" && sha256sum -c SHA256SUMS)
            test "$(cat "$RUNNER_TEMP/$platform-subgraph/BASE_SHA")" = "$GITHUB_SHA"
          done
          cmp "$RUNNER_TEMP/linux-subgraph/TREE_SHA" "$RUNNER_TEMP/windows-subgraph/TREE_SHA"
          cmp "$RUNNER_TEMP/linux-subgraph/compiled.patch" "$RUNNER_TEMP/windows-subgraph/compiled.patch"
          git apply --index "$RUNNER_TEMP/linux-subgraph/compiled.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux-subgraph/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(graph): project bounded snapshot neighborhoods' -m "Add deterministic multi-root breadth-first subgraphs with direction/relation/confidence selection, original evidence, discovery witnesses, explicit coverage and depth/node/edge/scan/expansion/byte bounds. Preserve incomplete results without negative authority and reject stale snapshots or incomplete adjacency indexing. Linux/Windows graph builds, changed-owner Clippy, formatting and repository policy passed on this exact tree in run $GITHUB_RUN_ID. No tests, fixtures, dependencies or lockfiles changed. Full assertions/explanations, axes, graph CLI routing and E2 acceptance remain separate. Temporary build inputs removed."
          git push origin HEAD:main
