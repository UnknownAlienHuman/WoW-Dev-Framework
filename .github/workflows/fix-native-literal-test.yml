name: Fix native literal test call

on:
  push:
    branches:
      - refactor/remove-wasm-literal-plugin-2026-10-18

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove obsolete bridge argument
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/wow-annotations/examples/support/tests.rs')
          text = path.read_text()
          old = '    super::run(args, None)\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old helper call, found {text.count(old)}')
          path.write_text(text.replace(old, '    super::run(args)\n'))
          PY
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-annotations/examples/support/tests.rs
          git commit -m "fix: use native annotation driver signature"
          git push origin "HEAD:${GITHUB_REF_NAME}"
