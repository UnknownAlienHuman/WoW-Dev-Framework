name: Materialize verified Emmy local-flow facts

on:
  push:
    branches:
      - work/emmy-local-flow
    paths:
      - .ci/materialize/emmy-local-flow/**
      - .github/workflows/materialize-emmy-local-flow.yml

permissions:
  contents: write

concurrency:
  group: materialize-emmy-local-flow
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Materialize exact reviewed payload
        run: |
          set -euo pipefail
          test "$(find .ci/materialize/emmy-local-flow -maxdepth 1 -type f | wc -l)" -eq 8
          cat .ci/materialize/emmy-local-flow/* > "$RUNNER_TEMP/emmy-local-flow.b64"
          echo '9bb3085b9595f60f1eb9d4764f95723db7b24632385f8ac9557dc5024f185d0a  '"$RUNNER_TEMP/emmy-local-flow.b64" | sha256sum --check --status
          base64 --decode "$RUNNER_TEMP/emmy-local-flow.b64" > "$RUNNER_TEMP/emmy-local-flow.tar.gz"
          echo '745a6289371abd1d6818a55c8904642827d68321ffb90b7b328af35db61baf12  '"$RUNNER_TEMP/emmy-local-flow.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/emmy-local-flow.tar.gz" -C .
          rm -rf .ci/materialize/emmy-local-flow
          rm .github/workflows/materialize-emmy-local-flow.yml
          git add -A
      - name: Format and verify exact implementation
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable test --locked --package wow-emmy --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Commit verified implementation tree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(emmy): extract exact local flow and dominance facts'
          git push origin HEAD:work/emmy-local-flow
