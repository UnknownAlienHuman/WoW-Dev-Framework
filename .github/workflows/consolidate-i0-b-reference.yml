name: Consolidate I0-B reference crate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/consolidate-i0-b-reference.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consolidate-i0-b-reference
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize deterministic crate boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f crates/wow-reference/src/deterministic_view.rs
          test -f crates/wow-reference/tests/deterministic_view.rs
          cat > crates/wow-reference/Cargo.toml <<'EOF'
          [package]
          name = "wow-reference"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.98"
          license = "MIT OR Apache-2.0"
          publish = false

          [dependencies]
          serde = { version = "=1.0.228", features = ["derive"] }
          serde_json = "=1.0.150"
          sha2 = "=0.11.0"
          wow-core = { path = "../wow-core" }
          EOF
          cat > crates/wow-reference/src/lib.rs <<'EOF'
          //! Deterministic reference-data boundary for the WoW development framework.

          mod deterministic_view;

          pub use deterministic_view::{
              CoverageStatus, LookupResult, LookupUnknownReason, REFERENCE_VIEW_SCHEMA,
              ReferenceConflict, ReferencePartition, ReferenceRecord, ReferenceRecordKind,
              ReferenceView, ReferenceViewError, ReferenceViewResult, RestrictionFacet,
              RestrictionState,
          };
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rewrite_array(source: str, key: str, add: bool) -> tuple[str, bool]:
              match = re.search(rf"(?m)^\s*{re.escape(key)}\s*=\s*\[", source)
              if match is None:
                  return source, False
              opening = source.find("[", match.start())
              depth = 0
              in_string = False
              escaped = False
              closing = None
              for index in range(opening, len(source)):
                  character = source[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif character == "\\":
                          escaped = True
                      elif character == '"':
                          in_string = False
                      continue
                  if character == '"':
                      in_string = True
                  elif character == "[":
                      depth += 1
                  elif character == "]":
                      depth -= 1
                      if depth == 0:
                          closing = index
                          break
              if closing is None:
                  raise SystemExit(f"unterminated {key} array")
              values = re.findall(r'"([^"\\]*(?:\\.[^"\\]*)*)"', source[opening + 1:closing])
              values = [value for value in values if value != "crates/wow-reference"]
              if add and "crates/*" not in values:
                  values.append("crates/wow-reference")
              values = sorted(dict.fromkeys(values))
              replacement = "[\n" + "".join(f'    "{value}",\n' for value in values) + "]"
              return source[:opening] + replacement + source[closing + 1:], True

          manifest_path = Path("Cargo.toml")
          manifest = manifest_path.read_text(encoding="utf-8")
          manifest, _ = rewrite_array(manifest, "exclude", False)
          manifest, found = rewrite_array(manifest, "members", True)
          if not found:
              raise SystemExit("workspace members array was not found")
          manifest, _ = rewrite_array(manifest, "default-members", True)
          manifest_path.write_text(manifest, encoding="utf-8")

          policy_path = Path("crates/wow-core/tests/repository_policy.rs")
          if policy_path.exists():
              source = policy_path.read_text(encoding="utf-8")
              marker = "fn workspace_activates_only_wow_core()"
              marker_index = source.find(marker)
              if marker_index >= 0:
                  test_index = source.rfind("#[test]", 0, marker_index)
                  brace_index = source.find("{", marker_index)
                  if test_index < 0 or brace_index < 0:
                      raise SystemExit("malformed workspace policy test")
                  depth = 0
                  end_index = None
                  for index in range(brace_index, len(source)):
                      if source[index] == "{":
                          depth += 1
                      elif source[index] == "}":
                          depth -= 1
                          if depth == 0:
                              end_index = index + 1
                              break
                  if end_index is None:
                      raise SystemExit("unterminated workspace policy test")
                  replacement = '''#[test]
          fn workspace_activates_foundation_crates() {
              assert!(ROOT_MANIFEST.contains("\\\"crates/wow-core\\\""));
              assert!(ROOT_MANIFEST.contains("\\\"crates/wow-reference\\\""));
          }'''
                  source = source[:test_index] + replacement + source[end_index:]
                  policy_path.write_text(source, encoding="utf-8")

          implementation = Path("crates/wow-reference/src/deterministic_view.rs")
          source = implementation.read_text(encoding="utf-8")
          source = source.replace(
              "bytes.next().is_some_and(u8::is_ascii_alphanumeric)",
              "bytes.next().is_some_and(|byte| byte.is_ascii_alphanumeric())",
          )
          source = source.replace(
              "pub fn lookup<'a>(&'a self, partition_id: &str, key: &str) -> LookupResult<'a>",
              "pub fn lookup(&self, partition_id: &str, key: &str) -> LookupResult<'_>",
          )
          implementation.write_text(source, encoding="utf-8")
          PY

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Format and lock
        shell: bash
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 generate-lockfile

      - name: Apply lint suggestions
        run: cargo +1.98.0 clippy --fix --allow-dirty --allow-staged --allow-no-vcs --workspace --all-targets --all-features

      - name: Enforce full validation matrix
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +1.98.0 test --locked --workspace --all-features
          cargo +1.98.0 test --locked --workspace --all-features --release
          cargo +1.98.0 doc --locked --workspace --all-features --no-deps

      - name: Preserve failed candidate
        if: failure()
        shell: bash
        run: tar --exclude=.git --exclude=target -czf /tmp/i0-b-reference-v4-failed.tar.gz .

      - name: Upload failed candidate
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: i0-b-reference-v4-failed
          path: /tmp/i0-b-reference-v4-failed.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Publish directly to main and clean staging
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/dev/apply_i0_b_reference.py
          rm -f .github/dev/finalize_i0_b_reference.py
          rm -f .github/workflows/apply-i0-b-reference.yml
          rm -f .github/workflows/finalize-i0-b-reference.yml
          rm -f .github/workflows/verify-publish-i0-b-reference.yml
          rm -f .github/workflows/consolidate-i0-b-reference.yml
          rmdir .github/dev 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(wow-reference): implement deterministic reference views"
          git push origin HEAD:main
