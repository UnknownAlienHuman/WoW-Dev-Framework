name: I0-A compose findings slice

on:
  pull_request:
    paths:
      - .github/workflows/i0-a-compose-findings.yml
      - crates/wow-core/src/budget.rs
      - crates/wow-core/src/finding.rs

permissions:
  contents: write

jobs:
  compose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install frozen toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Expose validated modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/wow-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          for module in ('budget', 'finding'):
              declaration = f'pub mod {module};\n'
              if declaration not in text:
                  marker = 'pub mod canonical;\n'
                  if marker not in text:
                      raise SystemExit('canonical module marker missing')
                  text = text.replace(marker, marker + declaration, 1)
          exports = '''

pub use budget::{
    Budget, BudgetLimits, BudgetUsage, TruncationEntry, TruncationState, classify_truncation,
};
pub use finding::{
    Finding, FindingDraft, MessageArgument, MessageArgumentKind, Remediation, RemediationClass,
    RolloutPolicy, Severity, WarningRecord, canonical_finding_order, deduplicate_findings,
    derive_root_cause_key, validate_message_arguments,
};
'''
          if 'pub use budget::' not in text:
              text += exports
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact dependency lock
        run: |
          cargo +1.98.0 generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Format
        run: cargo +1.98.0 fmt --all

      - name: Lint
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.98.0 test --workspace --all-features

      - name: Commit validated slice and remove composer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/i0-a-compose-findings.yml
          git add crates/wow-core/src/lib.rs crates/wow-core/src/budget.rs crates/wow-core/src/finding.rs
          git commit -m 'feat(wow-core): expose findings warnings and budgets'
          git push origin HEAD:${GITHUB_HEAD_REF}
