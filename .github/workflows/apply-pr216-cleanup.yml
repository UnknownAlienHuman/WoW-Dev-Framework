name: Apply PR216 cleanup

on:
  push:
    branches:
      - 'refactor/remove-service-store-admin-surface-2026-10-19'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'refactor/remove-service-store-admin-surface-2026-10-19'
          fetch-depth: 0
      - name: Delete dead helper and bootstrap workflows
        run: |
          python3 -c 'from pathlib import Path; p=Path("crates/wow-service/src/live_project.rs"); s=p.read_text(); a=s.index("// Ordinary migration/restore/export paths need the same selected qualification"); b=s.index("fn catalog()", a); p.write_text(s[:a]+s[b:])'
          git rm .github/workflows/apply-pr216-cleanup.yml .github/workflows/fix-pr216-dead-read-helper.yml
          git diff --check
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git add crates/wow-service/src/live_project.rs
          git commit -m 'refactor: remove dead ordinary-read validator'
          git push origin HEAD:refactor/remove-service-store-admin-surface-2026-10-19
