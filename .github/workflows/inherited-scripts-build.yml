name: Inherited XML handlers build
on:
  push:
    branches: [main]
    paths:
      - '.ci/inherited-scripts/**'
      - '.github/workflows/inherited-scripts-build.yml'
permissions:
  contents: read
concurrency:
  group: inherited-scripts-main
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit the exact functional patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/inherited-scripts"
          git rev-parse HEAD > "$RUNNER_TEMP/inherited-scripts/BASE_SHA"
          cat .ci/inherited-scripts/[0-9][0-9] > "$RUNNER_TEMP/inherited-scripts/input.patch"
          echo '15559f4a7be74d44368d77445924b21ecd5e973f2fbbf2b737edd9afc1a62b2d  input.patch' > "$RUNNER_TEMP/inherited-scripts/INPUT_SHA256"
          (cd "$RUNNER_TEMP/inherited-scripts" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/inherited-scripts .github/workflows/inherited-scripts-build.yml
          test "$(git write-tree)" = 27b38988953033aabc73d932715518d3f8c8ae1b
          git apply --index "$RUNNER_TEMP/inherited-scripts/input.patch"
          test "$(git write-tree)" = 169f4576ce5b1f95bef62a1b45189e840cdbca28
      - name: Format the implementation
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/inherited-scripts/RUST_VERSION"
          cargo +stable fmt --all
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/inherited-scripts/TREE_SHA"
      - name: Build the real CLI
        run: |
          set -euo pipefail
          cargo +stable build --locked -p wow-cli 2>&1 | tee "$RUNNER_TEMP/inherited-scripts/build.log"
      - name: Clippy for changed components
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-project -p wow-service -p wow-cli --lib --bins -- -D warnings 2>&1 | tee "$RUNNER_TEMP/inherited-scripts/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/inherited-scripts/policy.log"
          cargo +stable fmt --all --check
      - name: Retain the compiled source
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/inherited-scripts/TREE_SHA")"
          git diff --cached --binary HEAD > "$RUNNER_TEMP/inherited-scripts/compiled.patch"
          git archive --format=tar --output="$RUNNER_TEMP/inherited-scripts/compiled-source.tar" "$(git write-tree)"
          (cd "$RUNNER_TEMP/inherited-scripts" && sha256sum compiled.patch compiled-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inherited-scripts-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/inherited-scripts/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: inherited-scripts-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/built-linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: inherited-scripts-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/built-windows
      - name: Publish identical compiled sources to unchanged main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/built-linux/BASE_SHA")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/built-windows/BASE_SHA")" = "$GITHUB_SHA"
          (cd "$RUNNER_TEMP/built-linux" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/built-windows" && sha256sum -c SHA256SUMS)
          cmp "$RUNNER_TEMP/built-linux/TREE_SHA" "$RUNNER_TEMP/built-windows/TREE_SHA"
          cmp "$RUNNER_TEMP/built-linux/compiled.patch" "$RUNNER_TEMP/built-windows/compiled.patch"
          git apply --index "$RUNNER_TEMP/built-linux/compiled.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/built-linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(project): analyze inherited XML handlers in consuming contexts' -m "Enumerate inherited handler source occurrences through the retained inheritance graph. Query method candidates against each consuming declaration's mixins; share global function queries and preserve original XML anchors, unresolved ancestry and dispatch nonclaims. Include consumer-scoped findings, inherited source capabilities, CLI summaries and versioned project identity. Linux and Windows CLI builds, selected-component Clippy, formatting and repository policy passed on this exact tree in run $GITHUB_RUN_ID. No new tests, fixture changes, dependency updates or worktrees. Effective callback dispatch, parameter typing and real-addon/client behavior remain unverified. Temporary build inputs removed."
          git push origin HEAD:main
