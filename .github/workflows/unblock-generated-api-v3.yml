name: Unblock corrected generated API gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unblock-generated-api-v3.yml"

permissions:
  actions: write
  contents: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel obsolete transient finalizers
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status != "completed") | select(.path | contains("finalize-generated-api")) | .id' \
            | while read -r run_id; do
                if [[ -n "$run_id" && "$run_id" != "$GITHUB_RUN_ID" ]]; then
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
                fi
              done
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Retrigger corrected finalizer and remove unblocker
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          printf '\n# retriggered by run %s\n' "$GITHUB_RUN_ID" >> .github/workflows/finalize-generated-api-e2e-v3.yml
          rm -f .github/workflows/unblock-generated-api-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(reference): retrigger corrected API bridge gate"
          git push origin HEAD:main
