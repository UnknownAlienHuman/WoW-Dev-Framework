name: Verified source excerpts check
on:
  push:
    branches: [main]
    paths: ['.ci/source-read/**', '.github/workflows/source-read-build.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact reviewed source reader
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/source-read"
          git rev-parse HEAD > "$RUNNER_TEMP/source-read/BASE_SHA"
          test "$(git hash-object .ci/source-read/00)" = b5d2669d9691722155a5c03310cb7bccfc59f264
          test "$(git hash-object .ci/source-read/01)" = 4a7212178b6468254a530bdfa311c3080f847e90
          test "$(git hash-object .ci/source-read/02)" = 7e62f49131e748cd39a411b5a6aca56393e4c41e
          cat .ci/source-read/00 .ci/source-read/01 .ci/source-read/02 | base64 --decode | gzip -d > "$RUNNER_TEMP/source-read/input.patch"
          echo 'c6c13b497773ac703bc9fa89f6f2c671c47bd5bf57b4ceb9667787ab41423383  input.patch' > "$RUNNER_TEMP/source-read/INPUT_SHA256"
          (cd "$RUNNER_TEMP/source-read" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/source-read .github/workflows/source-read-build.yml
          git show a5a19fcb449a1e7e47f7781bef113d3264ca4453:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          test "$(git write-tree)" = de6afd4cc0b1211e7bfca10296b9c80bec267cd3
          git apply --index "$RUNNER_TEMP/source-read/input.patch"
          test "$(git write-tree)" = 4f89d641181b12d6898fe132a5dcc5d89f669134
      - name: Format implemented source
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/source-read/RUST_VERSION"
          cargo +stable fmt -p wow-project -p wow-service -p wow-cli
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/source-read/TREE_SHA"
      - name: Clippy source reader service and CLI
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-project -p wow-service -p wow-cli -- -D warnings 2>&1 | tee "$RUNNER_TEMP/source-read/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/source-read/policy.log"
      - name: Retain exact checked source
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/source-read/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/source-read/checked.patch"
          git archive "$(git write-tree)" > "$RUNNER_TEMP/source-read/checked-source.tar"
          (cd "$RUNNER_TEMP/source-read" && sha256sum checked.patch checked-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-read-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/source-read/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: source-read-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: source-read-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows
      - name: Publish identical checked code to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for platform in linux windows; do
            test "$(cat "$RUNNER_TEMP/$platform/BASE_SHA")" = "$GITHUB_SHA"
            (cd "$RUNNER_TEMP/$platform" && sha256sum -c SHA256SUMS)
          done
          cmp "$RUNNER_TEMP/linux/TREE_SHA" "$RUNNER_TEMP/windows/TREE_SHA"
          cmp "$RUNNER_TEMP/linux/checked.patch" "$RUNNER_TEMP/windows/checked.patch"
          git apply --index "$RUNNER_TEMP/linux/checked.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(graph): verify explicit local sources and return bounded evidence excerpts' -m "Connect admitted bundle manifests and evidence catalogs to the existing confined project reader, then expose exact verified source excerpts through explain --bundle --source-root. Verify full-file digest and size before disclosing UTF-8 ranges. Keep drift, unavailable/unsafe paths and per-file/per-excerpt omissions explicit with bounded I/O and total payload. Preserve old bundle/snapshot encodings, graph identities, historical evidence authority and closed-owner architecture. Selected project/service/CLI Clippy, formatting and repository policy passed on identical Linux/Windows source trees in run $GITHUB_RUN_ID. No tests executed, changed or added; no dependencies or lockfile changed. Temporary inputs removed and original CI workflow restored exactly. Source authenticity, atomic filesystem snapshots and full client acceptance remain separate."
          git push origin HEAD:main
