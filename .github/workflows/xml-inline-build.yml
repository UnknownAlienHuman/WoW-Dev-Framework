name: XML inline Lua build
on:
  push:
    branches: [main]
    paths: ['.ci/xml-inline/**', '.github/workflows/xml-inline-build.yml']
permissions:
  contents: read
concurrency:
  group: xml-inline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit exact functional source on its reviewed base
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xml-inline"
          git rev-parse HEAD > "$RUNNER_TEMP/xml-inline/BASE_SHA"
          git config core.autocrlf false
          cat .ci/xml-inline/[0-9][0-9] | base64 --decode | gzip -d > "$RUNNER_TEMP/xml-inline/input.patch"
          echo 'df9a6dd457768b9fd3a73b81dae373845c81886de4ef801be913267fab85e5b4  input.patch' > "$RUNNER_TEMP/xml-inline/INPUT_SHA256"
          (cd "$RUNNER_TEMP/xml-inline" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/xml-inline .github/workflows/xml-inline-build.yml
          test "$(git write-tree)" = b84a34f5892094e4742d122d4056c6f3551c8f17
          git apply --index "$RUNNER_TEMP/xml-inline/input.patch"
          test "$(git write-tree)" = c65b9c830489f1e7513b0bb3f012ddc0f8492ec1
      - name: Format the reviewed implementation
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/xml-inline/RUST_VERSION"
          cargo +stable fmt --all
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/xml-inline/TREE_SHA"
      - name: Build the application with the unchanged lockfile
        run: |
          set -euo pipefail
          cargo +stable build --locked -p wow-cli --bin wow 2>&1 | tee "$RUNNER_TEMP/xml-inline/build.log"
      - name: Check the implemented owners
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-emmy -p wow-project -p wow-service -p wow-cli --lib --bins -- -D warnings 2>&1 | tee "$RUNNER_TEMP/xml-inline/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/xml-inline/policy.log"
          cargo +stable fmt --all --check
      - name: Retain the exact compiled tree
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/xml-inline/TREE_SHA")"
          git diff --cached --binary --full-index HEAD > "$RUNNER_TEMP/xml-inline/compiled.patch"
          git diff --cached --stat HEAD > "$RUNNER_TEMP/xml-inline/changes.txt"
          (cd "$RUNNER_TEMP/xml-inline" && sha256sum compiled.patch > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xml-inline-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/xml-inline/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: xml-inline-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/xml-linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: xml-inline-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/xml-windows
      - name: Publish identical compiled sources to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/xml-linux/BASE_SHA")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/xml-windows/BASE_SHA")" = "$GITHUB_SHA"
          cmp "$RUNNER_TEMP/xml-linux/TREE_SHA" "$RUNNER_TEMP/xml-windows/TREE_SHA"
          cmp "$RUNNER_TEMP/xml-linux/compiled.patch" "$RUNNER_TEMP/xml-windows/compiled.patch"
          (cd "$RUNNER_TEMP/xml-linux" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/xml-windows" && sha256sum -c SHA256SUMS)
          git apply --index "$RUNNER_TEMP/xml-linux/compiled.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/xml-linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(project): analyze XML inline Lua and expose mapped diagnostics' -m "Parse distinct generation-bound virtual units with the existing pinned Emmy Lua51 parser, without physical-file spoofing or callback wrappers. Retain exact XML source pieces and caret boundaries; expose mapped diagnostics through ordinary findings and XML file scope. Bind reports into project/analyzer identities and propagate cooperative cancellation. Linux/Windows application builds, selected-owner Clippy, formatting and repository policy passed on this exact tree in run $GITHUB_RUN_ID. No dependencies, lockfile, tests or fixtures changed. Syntax-only: semantic callbacks, XML inheritance and runtime acceptance remain separate. Temporary build inputs removed."
          git push origin HEAD:main
