name: I0-A close record and envelope integrity

on:
  pull_request:
    paths:
      - .github/workflows/i0-a-close-integrity.yml

permissions:
  contents: write

jobs:
  close-integrity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Absorb prior branch commits
        shell: bash
        run: |
          sleep 30
          git fetch origin "${GITHUB_HEAD_REF}"
          git reset --hard "origin/${GITHUB_HEAD_REF}"

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Apply validated integrity closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Source-handle and record identity integrity.
          p = Path('crates/wow-core/src/integrity.rs')
          s = p.read_text(encoding='utf-8')
          old = '''pub(crate) fn validate_source_handle(record: &crate::SourceHandle) -> CoreResult<()> {
              validate_domain_id(
                  record,
                  "handle_id",
                  "wow-core/source-handle/e0-1",
                  "handle:sha256:",
                  "validate_source_handle",
              )
          }
          '''
          new = '''pub(crate) fn validate_source_handle(record: &crate::SourceHandle) -> CoreResult<()> {
              validate_domain_id(
                  record,
                  "handle_id",
                  "wow-core/source-handle/e0-1",
                  "handle:sha256:",
                  "validate_source_handle",
              )?;
              let value = object_value(record, "validate_source_handle")?;
              let origin_kind = required_string(&value, "origin_kind", "validate_source_handle")?;
              let origin_id = required_string(&value, "origin_id", "validate_source_handle")?;
              let revision = required_string(&value, "revision", "validate_source_handle")?;
              let path = required_string(&value, "path", "validate_source_handle")?;
              validate_opaque_identity(origin_id, "origin_id")?;
              validate_opaque_identity(revision, "revision")?;
              validate_canonical_source_path(path)?;

              let has_reference = value.get("reference_generation").is_some();
              let has_project = value.get("project_generation").is_some();
              let valid_origin = match origin_kind {
                  "repository" => !has_reference && !has_project,
                  "reference_pack" => has_reference && !has_project,
                  "generated_artifact" => has_reference || has_project,
                  "fixture" => true,
                  _ => false,
              };
              if !valid_origin {
                  return Err(validation_error(
                      "validate_source_handle",
                      CoreErrorCode::InvalidSourceHandle,
                      "origin_kind",
                  ));
              }

              let span = value
                  .get("span")
                  .and_then(Value::as_object)
                  .ok_or_else(|| contract_error("validate_source_handle", "span"))?;
              let span_kind = span
                  .get("kind")
                  .and_then(Value::as_str)
                  .ok_or_else(|| contract_error("validate_source_handle", "span.kind"))?;
              let start = span.get("byte_start").and_then(Value::as_u64);
              let end = span.get("byte_end").and_then(Value::as_u64);
              let valid_span = match span_kind {
                  "unknown" | "whole_file" => start.is_none() && end.is_none(),
                  "byte_range" => start.zip(end).is_some_and(|(start, end)| end >= start),
                  _ => false,
              };
              if !valid_span {
                  return Err(validation_error(
                      "validate_source_handle",
                      CoreErrorCode::InvalidSourceSpan,
                      "span",
                  ));
              }
              Ok(())
          }
          '''
          if old in s:
              s = s.replace(old, new, 1)
          helper_marker = 'fn validate_domain_id<T: Serialize>('
          if 'fn validate_opaque_identity(' not in s:
              helpers = '''fn validate_opaque_identity(value: &str, field: &'static str) -> CoreResult<()> {
              const MAX_BYTES: usize = 4096;
              const FLOATING: &[&str] = &[
                  "current", "latest", "live", "head", "default", "auto", "implicit",
              ];
              if value.is_empty()
                  || value.len() > MAX_BYTES
                  || value.trim() != value
                  || value.chars().any(char::is_control)
                  || FLOATING.contains(&value)
              {
                  return Err(validation_error(
                      "validate_source_handle",
                      CoreErrorCode::InvalidSourceHandle,
                      field,
                  ));
              }
              Ok(())
          }

          fn validate_canonical_source_path(path: &str) -> CoreResult<()> {
              const MAX_BYTES: usize = 16_384;
              if path.is_empty()
                  || path.len() > MAX_BYTES
                  || path.starts_with('/')
                  || path.starts_with("\\\\")
                  || path.contains('\\')
                  || path.contains("//")
                  || path.ends_with('/')
                  || path.chars().any(char::is_control)
                  || path.contains("://")
                  || path.as_bytes().get(1) == Some(&b':')
              {
                  return Err(validation_error(
                      "validate_source_handle",
                      CoreErrorCode::InvalidSourcePath,
                      "path",
                  ));
              }
              for component in path.split('/') {
                  if component.is_empty() || component == "." {
                      return Err(validation_error(
                          "validate_source_handle",
                          CoreErrorCode::InvalidSourcePath,
                          "path",
                      ));
                  }
                  if component == ".." {
                      return Err(validation_error(
                          "validate_source_handle",
                          CoreErrorCode::PathEscape,
                          "path",
                      ));
                  }
              }
              Ok(())
          }

          '''
              if helper_marker not in s:
                  raise SystemExit('integrity helper marker missing')
              s = s.replace(helper_marker, helpers + helper_marker, 1)
          p.write_text(s, encoding='utf-8')

          # Complete finding validation after deserialization.
          p = Path('crates/wow-core/src/finding.rs')
          s = p.read_text(encoding='utf-8')
          marker = '''    /// Stable context-bound finding ID.
              #[must_use]
              pub const fn finding_id(&self) -> FindingId {
          '''
          if 'pub(crate) fn validate_shape(' not in s:
              method = '''    pub(crate) fn validate_shape(
                  &self,
                  context_id: GenerationContextId,
                  source_handles: &[crate::SourceHandle],
                  evidence_records: &[crate::EvidenceRecord],
              ) -> CoreResult<()> {
                  if self.context_id != context_id {
                      return Err(validation_error(
                          "bind_finding_to_context",
                          CoreErrorCode::FindingContextMismatch,
                          "context_id",
                      ));
                  }
                  validate_message_arguments(&self.message_arguments)?;
                  ensure_strictly_sorted(
                      &self.related_source_handle_ids,
                      "related_source_handle_ids",
                  )?;
                  ensure_strictly_sorted(&self.evidence_ids, "evidence_ids")?;
                  ensure_strictly_sorted(
                      &self.required_capability_ids,
                      "required_capability_ids",
                  )?;

                  let source_ids = source_handles
                      .iter()
                      .map(crate::SourceHandle::handle_id)
                      .collect::<BTreeSet<_>>();
                  if !source_ids.contains(&self.primary_source_handle_id)
                      || self
                          .related_source_handle_ids
                          .iter()
                          .any(|id| !source_ids.contains(id))
                  {
                      return Err(validation_error(
                          "bind_finding_to_context",
                          CoreErrorCode::MissingSourceHandle,
                          "source_handle_ids",
                      ));
                  }
                  let evidence = evidence_index(evidence_records)?;
                  if self.evidence_ids.iter().any(|id| !evidence.contains_key(id)) {
                      return Err(validation_error(
                          "bind_finding_to_context",
                          CoreErrorCode::MissingEvidenceReference,
                          "evidence_ids",
                      ));
                  }
                  if self
                      .remediation
                      .as_ref()
                      .is_some_and(|remediation| remediation.class() == RemediationClass::ExactEdit)
                      && self.evidence_ids.iter().any(|id| {
                          evidence
                              .get(id)
                              .is_some_and(|confidence| confidence == "candidate")
                      })
                  {
                      return Err(validation_error(
                          "bind_finding_to_context",
                          CoreErrorCode::RemediationAuthorityViolation,
                          "remediation.class",
                      ));
                  }
                  Ok(())
              }

              /// Stable context-bound finding ID.
              #[must_use]
              pub const fn finding_id(&self) -> FindingId {
          '''
              if marker not in s:
                  raise SystemExit('finding method marker missing')
              s = s.replace(marker, method, 1)
          helper_marker = 'fn evidence_index('
          if 'fn ensure_strictly_sorted<' not in s:
              helper = '''fn ensure_strictly_sorted<T: Ord>(
              values: &[T],
              field: &'static str,
          ) -> CoreResult<()> {
              for pair in values.windows(2) {
                  if pair[0] >= pair[1] {
                      return Err(validation_error(
                          "bind_finding_to_context",
                          CoreErrorCode::ResultDuplicateId,
                          field,
                      ));
                  }
              }
              Ok(())
          }

          '''
              if helper_marker not in s:
                  raise SystemExit('finding helper marker missing')
              s = s.replace(helper_marker, helper + helper_marker, 1)
          p.write_text(s, encoding='utf-8')

          # Envelope closure, fallible ordering, record scopes, and error binding.
          p = Path('crates/wow-core/src/envelope.rs')
          s = p.read_text(encoding='utf-8')
          context_marker = '        let context_id = self.context.context_id();\n'
          if 'record.validate_shape(context_id' not in s:
              block = '''        let context_id = self.context.context_id();
              for record in &self.findings {
                  record.validate_shape(context_id, &self.source_handles, &self.evidence_records)?;
              }
              for record in &self.warnings {
                  record.validate(context_id, &self.source_handles, &self.evidence_records)?;
              }
          '''
              if context_marker not in s:
                  raise SystemExit('envelope context marker missing')
              s = s.replace(context_marker, block, 1)

          fallback = '''        self.coverage_records
              .sort_by_cached_key(|record| record_id(record, "coverage_id").unwrap_or_default());
          self.capability_summaries
              .sort_by_cached_key(summary_sort_key_lossless);
          self.source_handles
              .sort_by_key(crate::SourceHandle::handle_id);
          self.evidence_records
              .sort_by_cached_key(|record| record_id(record, "evidence_id").unwrap_or_default());
          self.conflicts
              .sort_by_cached_key(|record| record_id(record, "conflict_id").unwrap_or_default());
          canonical_finding_order(&mut self.findings, &self.source_handles)?;
          self.findings = deduplicate_findings(self.findings)?;
          self.not_evaluated.sort_by_cached_key(|record| {
              record_id(record, "not_evaluated_id").unwrap_or_default()
          });
          self.warnings
              .sort_by_cached_key(|record| record_id(record, "warning_id").unwrap_or_default());
          '''
          exact = '''        sort_by_record_id(&mut self.coverage_records, "coverage_id")?;
          sort_capability_summaries(&mut self.capability_summaries)?;
          self.source_handles
              .sort_by_key(crate::SourceHandle::handle_id);
          sort_by_record_id(&mut self.evidence_records, "evidence_id")?;
          sort_by_record_id(&mut self.conflicts, "conflict_id")?;
          canonical_finding_order(&mut self.findings, &self.source_handles)?;
          self.findings = deduplicate_findings(self.findings)?;
          sort_by_record_id(&mut self.not_evaluated, "not_evaluated_id")?;
          sort_by_record_id(&mut self.warnings, "warning_id")?;
          '''
          if fallback in s:
              s = s.replace(fallback, exact, 1)
          old_helper = '''fn summary_sort_key_lossless(record: &crate::CapabilitySummary) -> Vec<u8> {
              canonical_json_bytes(record).unwrap_or_default()
          }

          '''
          if old_helper in s:
              helpers = '''fn sort_by_record_id<T: Serialize>(
              records: &mut Vec<T>,
              id_field: &'static str,
          ) -> CoreResult<()> {
              let mut keyed = Vec::with_capacity(records.len());
              for record in records.drain(..) {
                  keyed.push((record_id(&record, id_field)?, record));
              }
              keyed.sort_by(|left, right| left.0.cmp(&right.0));
              records.extend(keyed.into_iter().map(|(_, record)| record));
              Ok(())
          }

          fn sort_capability_summaries(
              records: &mut Vec<crate::CapabilitySummary>,
          ) -> CoreResult<()> {
              let mut keyed = Vec::with_capacity(records.len());
              for record in records.drain(..) {
                  let value = record_value(&record, "capability_summaries")?;
                  let key = (
                      required_string(&value, "capability_id", "capability_summaries")?,
                      required_string(&value, "producer_id", "capability_summaries")?,
                      required_string(&value, "producer_version", "capability_summaries")?,
                  );
                  keyed.push((key, record));
              }
              keyed.sort_by(|left, right| left.0.cmp(&right.0));
              records.extend(keyed.into_iter().map(|(_, record)| record));
              Ok(())
          }

          '''
              s = s.replace(old_helper, helpers, 1)

          unique_marker = '''        validate_unique_summary_keys(&self.capability_summaries)?;
              validate_reference_closure(self)?;
          '''
          unique_block = '''        validate_unique_summary_keys(&self.capability_summaries)?;
              validate_unique_coverage_keys(&self.coverage_records)?;
              validate_reference_closure(self)?;
              validate_coverage_conflict_scopes(&self.coverage_records, &self.conflicts)?;
          '''
          if unique_marker in s:
              s = s.replace(unique_marker, unique_block, 1)

          reference_marker = 'fn validate_reference_closure(envelope: &E0CheckResultEnvelope) -> CoreResult<()> {'
          if 'fn validate_unique_coverage_keys(' not in s:
              closure_helpers = '''fn validate_unique_coverage_keys(
              records: &[crate::CoverageRecord],
          ) -> CoreResult<()> {
              let mut keys = BTreeSet::new();
              for record in records {
                  let value = record_value(record, "coverage_records")?;
                  let key = (
                      required_string(&value, "context_id", "coverage_records")?,
                      required_string(&value, "capability_id", "coverage_records")?,
                      required_string(&value, "partition_id", "coverage_records")?,
                      required_string(&value, "producer_id", "coverage_records")?,
                  );
                  if !keys.insert(key) {
                      return Err(validation_error(
                          "validate_result_envelope",
                          CoreErrorCode::DuplicateCoverageRecord,
                          "coverage_records",
                      ));
                  }
              }
              Ok(())
          }

          fn validate_coverage_conflict_scopes(
              coverage_records: &[crate::CoverageRecord],
              conflicts: &[crate::ConflictRecord],
          ) -> CoreResult<()> {
              let mut conflict_scopes = std::collections::BTreeMap::<
                  String,
                  Vec<(String, Option<String>)>,
              >::new();
              for conflict in conflicts {
                  let value = record_value(conflict, "conflicts")?;
                  let id = required_string(&value, "conflict_id", "conflicts")?;
                  let affected = value
                      .get("affected_refs")
                      .and_then(Value::as_array)
                      .ok_or_else(|| reference_error("conflicts.affected_refs"))?;
                  let mut scopes = Vec::with_capacity(affected.len());
                  for item in affected {
                      let capability = item
                          .get("capability_id")
                          .and_then(Value::as_str)
                          .ok_or_else(|| {
                              reference_error("conflicts.affected_refs.capability_id")
                          })?
                          .to_owned();
                      let partition = item
                          .get("partition_id")
                          .and_then(Value::as_str)
                          .map(str::to_owned);
                      scopes.push((capability, partition));
                  }
                  conflict_scopes.insert(id, scopes);
              }

              for record in coverage_records {
                  let value = record_value(record, "coverage_records")?;
                  let capability = required_string(&value, "capability_id", "coverage_records")?;
                  let partition = required_string(&value, "partition_id", "coverage_records")?;
                  let conflict_ids = value
                      .get("conflict_ids")
                      .and_then(Value::as_array)
                      .ok_or_else(|| reference_error("coverage_records.conflict_ids"))?;
                  for id in conflict_ids {
                      let id = id
                          .as_str()
                          .ok_or_else(|| reference_error("coverage_records.conflict_ids"))?;
                      let scopes = conflict_scopes
                          .get(id)
                          .ok_or_else(|| reference_error("coverage_records.conflict_ids"))?;
                      let affects = scopes.iter().any(
                          |(affected_capability, affected_partition)| {
                              affected_capability == &capability
                                  && affected_partition
                                      .as_deref()
                                      .is_none_or(|affected| affected == partition)
                          },
                      );
                      if !affects {
                          return Err(validation_error(
                              "validate_coverage_record",
                              CoreErrorCode::CoverageConflict,
                              "conflict_ids",
                          ));
                      }
                  }
              }
              Ok(())
          }

          '''
              if reference_marker not in s:
                  raise SystemExit('reference closure marker missing')
              s = s.replace(reference_marker, closure_helpers + reference_marker, 1)

          evidence_loop = '''    for record in &envelope.evidence_records {
              validate_string_array_refs(
                  record,
                  "source_handle_ids",
                  &handles,
                  "evidence_records",
              )?;
              validate_string_array_refs(
                  record,
                  "derivation_input_ids",
                  &evidence,
                  "evidence_records",
              )?;
          }
          '''
          if evidence_loop in s:
              replacement = '''    let coverage_semantic_index = coverage_semantic_index(&envelope.coverage_records)?;
              for record in &envelope.evidence_records {
                  validate_string_array_refs(
                      record,
                      "source_handle_ids",
                      &handles,
                      "evidence_records",
                  )?;
                  validate_string_array_refs(
                      record,
                      "derivation_input_ids",
                      &evidence,
                      "evidence_records",
                  )?;
                  let value = record_value(record, "evidence_records")?;
                  let refs = value
                      .get("coverage_refs")
                      .and_then(Value::as_array)
                      .ok_or_else(|| reference_error("evidence_records.coverage_refs"))?;
                  for item in refs {
                      let key = (
                          item.get("capability_id")
                              .and_then(Value::as_str)
                              .ok_or_else(|| reference_error("evidence_records.coverage_refs"))?
                              .to_owned(),
                          item.get("partition_id")
                              .and_then(Value::as_str)
                              .ok_or_else(|| reference_error("evidence_records.coverage_refs"))?
                              .to_owned(),
                          item.get("producer_id")
                              .and_then(Value::as_str)
                              .ok_or_else(|| reference_error("evidence_records.coverage_refs"))?
                              .to_owned(),
                      );
                      match coverage_semantic_index.get(&key).copied().unwrap_or(0) {
                          1 => {}
                          0 => {
                              return Err(validation_error(
                                  "validate_evidence_record",
                                  CoreErrorCode::CoverageRecordMissing,
                                  "coverage_refs",
                              ));
                          }
                          _ => {
                              return Err(validation_error(
                                  "validate_evidence_record",
                                  CoreErrorCode::CoverageConflict,
                                  "coverage_refs",
                              ));
                          }
                      }
                  }
              }
          '''
              s = s.replace(evidence_loop, replacement, 1)

          acyclic_marker = 'fn validate_evidence_acyclic(records: &[crate::EvidenceRecord]) -> CoreResult<()> {'
          if 'fn coverage_semantic_index(' not in s:
              helper = '''fn coverage_semantic_index(
              records: &[crate::CoverageRecord],
          ) -> CoreResult<std::collections::BTreeMap<(String, String, String), usize>> {
              let mut index = std::collections::BTreeMap::new();
              for record in records {
                  let value = record_value(record, "coverage_records")?;
                  let key = (
                      required_string(&value, "capability_id", "coverage_records")?,
                      required_string(&value, "partition_id", "coverage_records")?,
                      required_string(&value, "producer_id", "coverage_records")?,
                  );
                  *index.entry(key).or_insert(0) += 1;
              }
              Ok(index)
          }

          '''
              if acyclic_marker not in s:
                  raise SystemExit('acyclic marker missing')
              s = s.replace(acyclic_marker, helper + acyclic_marker, 1)

          # Operation-error closure and safe bounded structured values.
          s = s.replace(
              '''        envelope.canonical_digest = error_envelope_digest(&envelope)?;
              Ok(envelope)
          ''',
              '''        envelope.canonical_digest = error_envelope_digest(&envelope)?;
              envelope.validate()?;
              Ok(envelope)
          ''',
              1,
          )
          error_tail = s.find('impl E0OperationErrorEnvelope')
          if error_tail < 0:
              raise SystemExit('operation-error implementation missing')
          tail = s[error_tail:]
          digest_check = '''        if error_envelope_digest(self)? != self.canonical_digest {
          '''
          if 'validate_operation_error_record(&self.error' not in tail:
              tail = tail.replace(
                  digest_check,
                  '        validate_operation_error_record(&self.error, &self.operation_id)?;\n' + digest_check,
                  1,
              )
              s = s[:error_tail] + tail
          error_digest_marker = '''fn error_envelope_digest(
              envelope: &E0OperationErrorEnvelope,
          ) -> CoreResult<ContentDigest<CanonicalResult>> {
          '''
          if 'fn validate_operation_error_record(' not in s:
              helper = '''fn validate_operation_error_record(
              error: &CoreError,
              operation_id: &OperationId,
          ) -> CoreResult<()> {
              let value = record_value(error, "error")?;
              let nested_operation = value
                  .get("operation_id")
                  .and_then(Value::as_str)
                  .ok_or_else(|| {
                      validation_error(
                          "validate_result_envelope",
                          CoreErrorCode::ContractViolation,
                          "error.operation_id",
                      )
                  })?;
              if nested_operation != operation_id.as_str() {
                  return Err(validation_error(
                      "validate_result_envelope",
                      CoreErrorCode::ResultContextViolation,
                      "error.operation_id",
                  ));
              }
              let bytes = canonical_json_bytes(error)?;
              if bytes.len() > 65_536 {
                  return Err(validation_error(
                      "validate_result_envelope",
                      CoreErrorCode::BudgetExceeded,
                      "error",
                  ));
              }
              validate_safe_error_value(&value, "error")?;
              if let Some(causes) = value.get("cause_codes").and_then(Value::as_array) {
                  let mut previous: Option<&str> = None;
                  for cause in causes {
                      let cause = cause.as_str().ok_or_else(|| {
                          validation_error(
                              "validate_result_envelope",
                              CoreErrorCode::ContractViolation,
                              "error.cause_codes",
                          )
                      })?;
                      if previous.is_some_and(|value| value >= cause) {
                          return Err(validation_error(
                              "validate_result_envelope",
                              CoreErrorCode::ResultDuplicateId,
                              "error.cause_codes",
                          ));
                      }
                      previous = Some(cause);
                  }
              }
              Ok(())
          }

          fn validate_safe_error_value(value: &Value, field: &'static str) -> CoreResult<()> {
              match value {
                  Value::String(text) => {
                      if text.len() > 8_192
                          || text.chars().any(char::is_control)
                          || text.contains("-----BEGIN PRIVATE KEY-----")
                          || text.contains("-----BEGIN OPENSSH PRIVATE KEY-----")
                          || text.contains("Authorization: Bearer ")
                          || text.starts_with('/')
                          || text.starts_with("\\\\")
                          || text.as_bytes().get(1) == Some(&b':')
                      {
                          return Err(validation_error(
                              "validate_result_envelope",
                              CoreErrorCode::ContractViolation,
                              field,
                          ));
                      }
                  }
                  Value::Array(items) => {
                      if items.len() > 256 {
                          return Err(validation_error(
                              "validate_result_envelope",
                              CoreErrorCode::BudgetExceeded,
                              field,
                          ));
                      }
                      for item in items {
                          validate_safe_error_value(item, field)?;
                      }
                  }
                  Value::Object(object) => {
                      if object.len() > 64 {
                          return Err(validation_error(
                              "validate_result_envelope",
                              CoreErrorCode::BudgetExceeded,
                              field,
                          ));
                      }
                      for item in object.values() {
                          validate_safe_error_value(item, field)?;
                      }
                  }
