name: Fix core profile canonical import

on:
  push:
    branches:
      - refactor/remove-core-e0-envelopes-2026-10-18

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Restore direct canonical helper import
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("crates/wow-core/tests/e0_profile_conformance.rs"); t=p.read_text(); old="    ProfileIdentity, ProfileIdentityBuilder, compare_profile_identity,\n"; new="    ProfileIdentity, ProfileIdentityBuilder, canonical_json_bytes, compare_profile_identity,\n"; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          git rm .github/workflows/fix-core-profile-import.yml
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-core/tests/e0_profile_conformance.rs
          git commit -m "fix: retain direct profile canonical checks"
          git push origin "HEAD:${GITHUB_REF_NAME}"
