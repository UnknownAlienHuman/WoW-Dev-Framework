name: TOC package build
on:
  push:
    branches: [main]
    paths:
      - '.ci/toc-package/**'
      - '.github/workflows/toc-package-build.yml'
permissions:
  contents: read
concurrency:
  group: toc-package-build-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Admit exact functional source on its reviewed base
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package-input" "$RUNNER_TEMP/package-results"
          echo 'b2ebb557c811fa6190ad8d483c01259c1afb1b58bdfc578b6eaef30cf7b7d477  .ci/toc-package/main-transfer.patch' | sha256sum -c -
          echo '3f563f6b53b9114576a8f4869076ed4cd2595f5bf8077708af8c4bcd89567db4  .ci/toc-package/toc.patch' | sha256sum -c -
          test "$(git hash-object .ci/toc-package/package.rs)" = 1c6c081339e2835db5d66f6879022574afe012c6
          # Repair only the transferred diff header; both repaired bytes and the
          # complete resulting source tree must equal the reviewed inputs.
          sed 's#^diff --git a/crates/wow-project/src/load/toc.rs b/crates/wow-service/ERROR_MODEL.md$#diff --git a/crates/wow-service/ERROR_MODEL.md b/crates/wow-service/ERROR_MODEL.md#' .ci/toc-package/main-transfer.patch > "$RUNNER_TEMP/package-input/main.patch"
          echo "1fab30f0063bf19cca7cdcb607eded182093e5a8cb9a23ed1f5f5fa6ff0f7199  $RUNNER_TEMP/package-input/main.patch" | sha256sum -c -
          cp .ci/toc-package/toc.patch .ci/toc-package/package.rs "$RUNNER_TEMP/package-input/"
          git rm -r .ci/toc-package .github/workflows/toc-package-build.yml
          test "$(git write-tree)" = 2aa2cfb12e72c328766e3cbc860ebe6c53ccd650
          git apply --index "$RUNNER_TEMP/package-input/main.patch" "$RUNNER_TEMP/package-input/toc.patch"
          cp "$RUNNER_TEMP/package-input/package.rs" crates/wow-project/src/load/package.rs
          git add crates/wow-project/src/load/package.rs
          test "$(git write-tree)" = 8ea7368a3055807390b507b8088d5e4c30eada90
          git rev-parse HEAD > "$RUNNER_TEMP/package-results/BASE_SHA"
      - name: Format the reviewed implementation
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/package-results/RUST_VERSION"
          cargo +stable fmt --all
          git diff --exit-code -- . ':(exclude)apps/wow/src/main.rs' ':(exclude)apps/wow/src/output.rs' ':(exclude)crates/wow-project/src/error.rs' ':(exclude)crates/wow-project/src/load/conditions.rs' ':(exclude)crates/wow-project/src/load/mod.rs' ':(exclude)crates/wow-project/src/load/toc.rs' ':(exclude)crates/wow-project/src/load/package.rs' ':(exclude)crates/wow-service/src/error.rs' ':(exclude)crates/wow-service/src/local/disk_input.rs' ':(exclude)crates/wow-service/src/local/projection.rs' ':(exclude)crates/wow-service/src/local/response.rs'
          git add apps/wow/src crates/wow-project/src crates/wow-service/src
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/package-results/TREE_SHA"
      - name: Build the application with the unchanged lockfile
        run: cargo +stable build --locked -p wow-cli --bin wow 2>&1 | tee "$RUNNER_TEMP/package-results/build.txt"
      - name: Check the implemented owners
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-project -p wow-service -p wow-cli --lib --bins -- -D warnings 2>&1 | tee "$RUNNER_TEMP/package-results/clippy.txt"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/package-results/policy.txt"
          cargo +stable fmt --all --check
          git diff --exit-code
      - name: Retain the exact compiled tree
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/package-results/TREE_SHA")"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/package-results/compiled.patch"
          (cd "$RUNNER_TEMP/package-results" && sha256sum compiled.patch > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: toc-package-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/package-results/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: toc-package-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/package-linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: toc-package-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/package-windows
      - name: Publish identical compiled sources to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/package-linux/BASE_SHA")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/package-windows/BASE_SHA")" = "$GITHUB_SHA"
          cmp "$RUNNER_TEMP/package-linux/TREE_SHA" "$RUNNER_TEMP/package-windows/TREE_SHA"
          (cd "$RUNNER_TEMP/package-linux" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/package-windows" && sha256sum -c SHA256SUMS)
          cmp "$RUNNER_TEMP/package-linux/compiled.patch" "$RUNNER_TEMP/package-windows/compiled.patch"
          git apply --index "$RUNNER_TEMP/package-linux/compiled.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/package-linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(project): apply package-wide TOC filters before source acquisition' -m "Preflight selected package metadata before resolving Lua/XML descendants. Reuse bounded line predicates; retain admitted package gates in v3 load receipts. Excluded and unresolved targets have distinct typed CLI outcomes without fabricated analyzer snapshots. Linux/Windows application builds, selected-owner Clippy, formatting and repository policy passed on this exact source tree in run $GITHUB_RUN_ID. No dependencies, lockfile, tests or fixture baselines changed. Full runtime and E2/R0 acceptance remain separate. Temporary transfer/build inputs removed."
          git push origin HEAD:main
