name: Verify wow-project E0-D

on:
  push:
    branches:
      - work/project-e0
    paths:
      - .github/workflows/verify-project-e0.yml

permissions:
  contents: write

concurrency:
  group: verify-project-e0
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Apply reviewed structural corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          update = Path("crates/wow-project/src/update.rs")
          text = update.read_text()
          anchor = """use crate::{
              ProjectConfiguration, ProjectError, ProjectErrorCode, ProjectFileId, ProjectInputFile,
              ProjectPhase, ProjectResult, ProjectSnapshot,
          };

          """
          alias = """type ProjectUpdateParts = (
              Option<ProjectGenerationId>,
              Option<ContentDigest<CanonicalResult>>,
              ProjectConfiguration,
              Vec<ProjectFileOperation>,
              Vec<LuaWorkspaceSnapshot>,
          );

          """
          if text.count(anchor) != 1:
              raise SystemExit("unexpected update import anchor")
          text = text.replace(anchor, anchor + alias, 1)
          old_signature = """    pub(crate) fn into_parts(
                  self,
              ) -> (
                  Option<ProjectGenerationId>,
                  Option<ContentDigest<CanonicalResult>>,
                  ProjectConfiguration,
                  Vec<ProjectFileOperation>,
                  Vec<LuaWorkspaceSnapshot>,
              ) {
          """
          new_signature = """    pub(crate) fn into_parts(self) -> ProjectUpdateParts {
          """
          if text.count(old_signature) != 1:
              raise SystemExit("unexpected update parts signature")
          update.write_text(text.replace(old_signature, new_signature, 1))

          snapshot = Path("crates/wow-project/src/snapshot.rs")
          text = snapshot.read_text()
          old_records = """    let mut records = Vec::new();
              records.push(complete_coverage(
                  context,
                  "project.fixture.configuration.valid",
                  CoveragePartitionId::new("project.configuration", None).map_err(core_snapshot_error)?,
                  producer_id,
                  producer_version,
              )?);
              records.push(complete_coverage(
                  context,
                  "project.fixture.files.complete",
                  CoveragePartitionId::new(
                      "project.workspace",
                      Some(configuration.workspace_id().as_str()),
                  )
                  .map_err(core_snapshot_error)?,
                  producer_id,
                  producer_version,
              )?);
              records.push(complete_coverage(
                  context,
                  "project.source.registry.complete",
                  CoveragePartitionId::new(
                      "project.source_origin",
                      Some(configuration.source_origin_id().as_str()),
                  )
                  .map_err(core_snapshot_error)?,
                  producer_id,
                  producer_version,
              )?);
              records.push(complete_coverage(
                  context,
                  "project.source.handle.resolve",
                  CoveragePartitionId::new("project.source_registry", Some(registry.registry_id()))
                      .map_err(core_snapshot_error)?,
                  producer_id,
                  producer_version,
              )?);
          """
          new_records = """    let mut records = vec![
                  complete_coverage(
                      context,
                      "project.fixture.configuration.valid",
                      CoveragePartitionId::new("project.configuration", None)
                          .map_err(core_snapshot_error)?,
                      producer_id,
                      producer_version,
                  )?,
                  complete_coverage(
                      context,
                      "project.fixture.files.complete",
                      CoveragePartitionId::new(
                          "project.workspace",
                          Some(configuration.workspace_id().as_str()),
                      )
                      .map_err(core_snapshot_error)?,
                      producer_id,
                      producer_version,
                  )?,
                  complete_coverage(
                      context,
                      "project.source.registry.complete",
                      CoveragePartitionId::new(
                          "project.source_origin",
                          Some(configuration.source_origin_id().as_str()),
                      )
                      .map_err(core_snapshot_error)?,
                      producer_id,
                      producer_version,
                  )?,
                  complete_coverage(
                      context,
                      "project.source.handle.resolve",
                      CoveragePartitionId::new("project.source_registry", Some(registry.registry_id()))
                          .map_err(core_snapshot_error)?,
                      producer_id,
                      producer_version,
                  )?,
              ];
          """
          if text.count(old_records) != 1:
              raise SystemExit("unexpected coverage initialization block")
          snapshot.write_text(text.replace(old_records, new_records, 1))
          PY
          rm .ci/project-e0-clippy.patch
          rm .github/workflows/verify-project-e0.yml
      - name: Run complete E0-D gate
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable test --locked --package wow-project --all-targets --all-features -- --nocapture
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Commit verified E0-D
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(project): bound errors and satisfy strict workspace lint'
          git push origin HEAD:work/project-e0
