name: Finalize wow-graph E2-A

on:
  push:
    branches:
      - work/graph-e2-a
    paths:
      - .github/workflows/finalize-graph-e2-a.yml

permissions:
  contents: write

concurrency:
  group: finalize-graph-e2-a
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Normalize exact E2-A activation
        run: |
          set -euo pipefail
          sed -i 's/GraphCoverageRecord, GraphCoverageState, GraphDirection, GraphEdge/GraphCoverageRecord, GraphCoverageState, GraphEdge/' crates/wow-graph/src/query.rs
          if ! grep -Fq '"crates/wow-graph"' Cargo.toml; then
            sed -i '/"crates\/wow-store",/a\    "crates/wow-graph",' Cargo.toml
          fi
          cargo +stable generate-lockfile
          rm -f .github/workflows/materialize-graph-e2-a.yml
          rm .github/workflows/finalize-graph-e2-a.yml
          git add -A
      - name: Compiler-assisted mechanical cleanup
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable fix --package wow-graph --all-targets --all-features --allow-dirty --allow-staged
          cargo +stable clippy --fix --package wow-graph --all-targets --all-features --allow-dirty --allow-staged -- -D warnings
          cargo +stable fmt --all
      - name: Strict E2-A and repository gate
        run: |
          set -euo pipefail
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable test --package wow-graph --all-targets --all-features -- --nocapture
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +stable test --locked --workspace --all-targets --all-features
          cargo +stable test --release --locked --workspace --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Commit verified production tree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'E2-A production tree was already verified and materialized'
          else
            git commit -m 'feat(graph): implement E2-A immutable graph snapshots'
            git push origin HEAD:work/graph-e2-a
          fi
