name: Graph path CLI check
on:
  push:
    branches: [main]
    paths: ['.ci/graph-path/**', '.github/workflows/graph-path-build.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit reviewed path routing
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/graph-path"
          git rev-parse HEAD > "$RUNNER_TEMP/graph-path/BASE_SHA"
          test "$(git hash-object .ci/graph-path/00)" = f7a0de699cc53cffdb416cc1a4cf18c1bbb332b3
          test "$(git hash-object .ci/graph-path/01)" = f0f64d8dd08c8793054b37fd2e16e8de0c8e3bc5
          test "$(git hash-object .ci/graph-path/02)" = a287811b6feade493e4df6644dcbb5ea36df2f7b
          test "$(git hash-object .ci/graph-path/03)" = 798cc375a17d648a99fc584f6212bddde9e0ccb2
          cat .ci/graph-path/00 .ci/graph-path/01 .ci/graph-path/02 .ci/graph-path/03 | base64 --decode | gzip -d > "$RUNNER_TEMP/graph-path/input.patch"
          echo '308d47a178902f7038547ebb99e1ad6aec9d7621d903d1ef9c86cd1dc9a1fa06  input.patch' > "$RUNNER_TEMP/graph-path/INPUT_SHA256"
          (cd "$RUNNER_TEMP/graph-path" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/graph-path .github/workflows/graph-path-build.yml
          test "$(git write-tree)" = ec1e32800388fd2bc6ece2bc7d087c0fba426349
          git apply --index "$RUNNER_TEMP/graph-path/input.patch"
          test "$(git write-tree)" = 9a57edaa6884e146dc3a52d42f1160d90e3fcf44
      - name: Format changed packages
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/graph-path/RUST_VERSION"
          cargo +stable fmt -p wow-graph -p wow-service -p wow-cli
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/graph-path/TREE_SHA"
      - name: Clippy changed graph service and CLI
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-graph -p wow-service -p wow-cli -- -D warnings 2>&1 | tee "$RUNNER_TEMP/graph-path/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/graph-path/policy.log"
      - name: Retain checked source
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/graph-path/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/graph-path/checked.patch"
          git archive "$(git write-tree)" > "$RUNNER_TEMP/graph-path/checked-source.tar"
          (cd "$RUNNER_TEMP/graph-path" && sha256sum checked.patch checked-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: graph-path-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/graph-path/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: graph-path-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: graph-path-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows
      - name: Publish identical checked sources to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for platform in linux windows; do
            test "$(cat "$RUNNER_TEMP/$platform/BASE_SHA")" = "$GITHUB_SHA"
            (cd "$RUNNER_TEMP/$platform" && sha256sum -c SHA256SUMS)
          done
          cmp "$RUNNER_TEMP/linux/TREE_SHA" "$RUNNER_TEMP/windows/TREE_SHA"
          cmp "$RUNNER_TEMP/linux/checked.patch" "$RUNNER_TEMP/windows/checked.patch"
          git apply --index "$RUNNER_TEMP/linux/checked.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cli): expose bounded graph paths and explicit continuation' -m "Route wow graph path through the existing read service and GraphPathQuery. Validate the complete retained partition owner, retain exact path evidence and coverage, and pass explicit owner cursors without changing query budgets or following pages automatically. Preserve existing graph-read formats and stored identities. Clippy for graph/service/CLI and repository policy passed on identical Linux/Windows source trees in run $GITHUB_RUN_ID. No tests, dependencies or lockfile changed. Runtime/client validation and durable ProjectStore remain separate. Temporary check inputs removed."
          git push origin HEAD:main
