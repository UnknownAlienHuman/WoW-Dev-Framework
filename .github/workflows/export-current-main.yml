name: Export current main snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-current-main.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-current-main
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download unattached verified delivery payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/9e0d9654c44531665651db653cd5b85fdf8ed4b1" \
            --output /tmp/prepared-payload.bin
          test "$(wc -c < /tmp/prepared-payload.bin)" -eq 30018
          printf '%s  %s\n' '9e0d9654c44531665651db653cd5b85fdf8ed4b1' 'Git-blob-object-id-only' > /tmp/README.txt

      - name: Upload delivery payload
        uses: actions/upload-artifact@v7
        with:
          name: wow-dev-framework-prepared-payload
          path: |
            /tmp/prepared-payload.bin
            /tmp/README.txt
          retention-days: 1
          if-no-files-found: error
