name: Export current main snapshot

on:
  push:
    branches: [main]
    paths: [.github/workflows/export-current-main.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=/tmp/main.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: current-main
          path: /tmp/main.tar.gz
          retention-days: 1
