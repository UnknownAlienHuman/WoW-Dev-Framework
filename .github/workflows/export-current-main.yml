name: Export current main snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-current-main.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-current-main
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Package tracked repository
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf /tmp/wow-dev-framework-main.tar.gz
          sha256sum /tmp/wow-dev-framework-main.tar.gz > /tmp/SHA256SUMS
          git rev-parse HEAD > /tmp/COMMIT_SHA

      - name: Upload exact snapshot
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wow-dev-framework-current-main
          path: |
            /tmp/wow-dev-framework-main.tar.gz
            /tmp/SHA256SUMS
            /tmp/COMMIT_SHA
          retention-days: 1
          if-no-files-found: error
