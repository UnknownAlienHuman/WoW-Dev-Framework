name: Export current main snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git archive --format=tar.gz --output=/tmp/main.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: current-main
          path: /tmp/main.tar.gz
          retention-days: 1
