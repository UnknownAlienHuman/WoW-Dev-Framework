name: Source graph build
on:
  push:
    branches: [main]
    paths: ['.ci/source-graph/**', '.github/workflows/source-graph-build.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit exact functional patch on reviewed main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/source-graph"
          git rev-parse HEAD > "$RUNNER_TEMP/source-graph/BASE_SHA"
          test "$(git hash-object .ci/source-graph/00)" = df6c55c0392738768f312497e0f2d48681183c5b
          test "$(git hash-object .ci/source-graph/01)" = 987dfb4176bea0dacf87fec75c15a7bdc69d2e29
          test "$(git hash-object .ci/source-graph/02)" = 0ef2d488df206fc6d7f49d43fc471db353b700a9
          test "$(git hash-object .ci/source-graph/03)" = 86141bd3679b2baf89c4d3a3d0389b0d1f069c4b
          test "$(git hash-object .ci/source-graph/04)" = 5820fd1e968403aff3ccc6726ba4f74f86da30d1
          cat .ci/source-graph/0* | base64 --decode | gzip -d > "$RUNNER_TEMP/source-graph/input.patch"
          echo 'c79bf54c2b372024222bf70aceab823b5000fd809e55d77171f2196adac956a7  input.patch' > "$RUNNER_TEMP/source-graph/INPUT_SHA256"
          (cd "$RUNNER_TEMP/source-graph" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/source-graph .github/workflows/source-graph-build.yml
          test "$(git write-tree)" = 4e2115c96c108bdb5d6c92a89a812058417680bb
          git apply --index "$RUNNER_TEMP/source-graph/input.patch"
          test "$(git write-tree)" = 3dddce2c21ee3117616a653cd62994d4365373d5
      - name: Format implemented Rust code
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/source-graph/RUST_VERSION"
          cargo +stable fmt --all
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/source-graph/TREE_SHA"
      - name: Build real CLI with unchanged external dependencies
        run: |
          set -euo pipefail
          cargo +stable build --locked -p wow-cli --bin wow 2>&1 | tee "$RUNNER_TEMP/source-graph/build.log"
      - name: Clippy changed owners and application
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-project -p wow-service -p wow-cli -- -D warnings 2>&1 | tee "$RUNNER_TEMP/source-graph/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/source-graph/policy.log"
      - name: Retain exact compiled source
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/source-graph/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/source-graph/compiled.patch"
          git archive "$(git write-tree)" > "$RUNNER_TEMP/source-graph/compiled-source.tar"
          (cd "$RUNNER_TEMP/source-graph" && sha256sum compiled.patch compiled-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-graph-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/source-graph/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: source-graph-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: source-graph-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows
      - name: Publish identical compiled code to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for platform in linux windows; do
            test "$(cat "$RUNNER_TEMP/$platform/BASE_SHA")" = "$GITHUB_SHA"
            (cd "$RUNNER_TEMP/$platform" && sha256sum -c SHA256SUMS)
          done
          cmp "$RUNNER_TEMP/linux/TREE_SHA" "$RUNNER_TEMP/windows/TREE_SHA"
          cmp "$RUNNER_TEMP/linux/compiled.patch" "$RUNNER_TEMP/windows/compiled.patch"
          git apply --index "$RUNNER_TEMP/linux/compiled.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cli): construct and export source load graphs from project inputs' -m "Add wow graph build over the shared local project materialization path, with project-owned file/direct-load proposals and graph-owner partition validation/materialization. Retain actual source handles, evidence, project/analyzer identities, source receipts and materialized node mapping in the JSON bundle; bare snapshot output passes existing graph-read admission. Preserve partial/unevaluated coverage and no negative authority. Build and selected-owner/application Clippy passed on Linux and Windows on this exact source tree in run $GITHUB_RUN_ID. No new tests or external dependencies; activate only the already allowed project-to-graph dependency. Semantic recognizers, runtime behavior and coherent ProjectStore remain separate. Temporary build inputs removed."
          git push origin HEAD:main
