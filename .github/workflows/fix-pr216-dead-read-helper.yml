name: Fix PR216 dead read helper

on:
  push:
    branches:
      - refactor/remove-service-store-admin-surface-2026-10-19

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove dead helper and bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/wow-service/src/live_project.rs")
          text = path.read_text()
          block = '''// Ordinary migration/restore/export paths need the same selected qualification
// before issuing native owner checks. Consume and close the exact held read once.
fn validate_ordinary_read(
    read: ReadSnapshot,
    stop: &AtomicBool,
) -> ServiceResult<wow_store::project::ValidatedRead> {
    let validation = (|| {
        let pair = AcquiredProjectPair::read(&read, stop).map_err(project_error)?;
        let native_api = crate::graph::validate_native_api_reopen(&pair, stop)?;
        let validated = read
            .owner_validation(&candidate::completed_checks(false))
            .map_err(store_error);
        drop(native_api);
        drop(pair);
        validated
    })();
    read.close().map_err(store_error)?;
    validation
}
'''
          if text.count(block) != 1:
              raise SystemExit("unexpected validate_ordinary_read body")
          path.write_text(text.replace(block, ""))
          PY
          git rm .github/workflows/fix-pr216-dead-read-helper.yml
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-service/src/live_project.rs
          git commit -m "refactor: remove dead ordinary-read validator"
          git push origin "HEAD:${GITHUB_REF_NAME}"
