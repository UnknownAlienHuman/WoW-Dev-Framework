name: Finalize I0-B reference package v3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-i0-b-v3-20260904.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-i0-b-reference-v3
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Recover unpublished deterministic view
        if: ${{ hashFiles('crates/wow-reference/src/deterministic.rs') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/implement-i0-b-reference-20260904.yml')
          source = workflow.read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          start = source.find(marker) + len(marker)
          if start < len(marker):
              raise SystemExit('deterministic materialization marker was not found')
          end = source.find('\n          PY', start)
          if end < 0:
              raise SystemExit('deterministic materialization terminator was not found')
          exec(compile(textwrap.dedent(source[start:end]), str(workflow), 'exec'), {'__name__': '__main__'})
          PY

      - name: Recover unpublished immutable store
        if: ${{ hashFiles('crates/wow-reference/src/store.rs') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          deterministic = Path('crates/wow-reference/src/deterministic.rs')
          source = deterministic.read_text(encoding='utf-8')
          canonical = "#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ReferenceDraft {"
          compatibility = "#[derive(Debug, Clone, PartialEq, Eq)]\n          pub struct ReferenceDraft {"
          if canonical in source:
              deterministic.write_text(source.replace(canonical, compatibility, 1), encoding='utf-8')

          workflow = Path('.github/workflows/implement-i0-b-pack-store-20260904.yml')
          workflow_source = workflow.read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          start = workflow_source.find(marker) + len(marker)
          if start < len(marker):
              raise SystemExit('store materialization marker was not found')
          end = workflow_source.find('\n          PY', start)
          if end < 0:
              raise SystemExit('store materialization terminator was not found')
          exec(compile(textwrap.dedent(workflow_source[start:end]), str(workflow), 'exec'), {'__name__': '__main__'})
          PY

      - name: Harden manifest and generated Rust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('crates/wow-reference/Cargo.toml')
          source = manifest.read_text(encoding='utf-8')

          def ensure_in_section(text: str, section: str, key: str, line: str) -> str:
              section_match = re.search(rf'(?m)^\[{re.escape(section)}\]\s*$', text)
              if section_match is None:
                  return text.rstrip() + f'\n\n[{section}]\n{line}\n'
              next_section = re.search(r'(?m)^\[', text[section_match.end():])
              end = len(text) if next_section is None else section_match.end() + next_section.start()
              body = text[section_match.end():end]
              if re.search(rf'(?m)^\s*{re.escape(key)}\s*=', body):
                  return text
              return text[:section_match.end()] + '\n' + line + text[section_match.end():]

          source = ensure_in_section(source, 'dependencies', 'serde', 'serde = { workspace = true }')
          source = ensure_in_section(source, 'dependencies', 'serde_json', 'serde_json = { workspace = true }')
          source = ensure_in_section(source, 'dependencies', 'sha2', 'sha2 = { workspace = true }')
          manifest.write_text(source.rstrip() + '\n', encoding='utf-8')

          deterministic = Path('crates/wow-reference/src/deterministic.rs')
          source = deterministic.read_text(encoding='utf-8')
          source = source.replace(
              '''                  if let Ok(index) = self
                      .symbols
                      .binary_search_by(|symbol| symbol.key.cmp(key))
                  {
                      return ExactLookup::Present {
                          symbol: &self.symbols[index],
                          conflict_ids,
                      };
                  }
          ''',
              '''                  if let Ok(index) = self
                      .symbols
                      .binary_search_by(|symbol| symbol.key.cmp(key))
                  {
                      if let Some(symbol) = self.symbols.get(index) {
                          return ExactLookup::Present {
                              symbol,
                              conflict_ids,
                          };
                      }
                  }
          ''',
              1,
          )
          source = source.replace(
              '''              if !draft
                      .sources
                      .windows(2)
                      .all(|pair| pair[0].source_id < pair[1].source_id)
                  {
          ''',
              '''              if !draft.sources.windows(2).all(|pair| match pair {
                      [left, right] => left.source_id < right.source_id,
                      _ => true,
                  }) {
          ''',
              1,
          )
          source = source.replace(
              '''              if !draft
                      .symbols
                      .windows(2)
                      .all(|pair| pair[0].key < pair[1].key)
                  {
          ''',
              '''              if !draft.symbols.windows(2).all(|pair| match pair {
                      [left, right] => left.key < right.key,
                      _ => true,
                  }) {
          ''',
              1,
          )
          source = source.replace(
              '''              if !draft.coverage.windows(2).all(|pair| {
                      (&pair[0].scope, &pair[0].coverage_id)
                          < (&pair[1].scope, &pair[1].coverage_id)
                  }) {
          ''',
              '''              if !draft.coverage.windows(2).all(|pair| match pair {
                      [left, right] => {
                          (&left.scope, &left.coverage_id)
                              < (&right.scope, &right.coverage_id)
                      }
                      _ => true,
                  }) {
          ''',
              1,
          )
          source = source.replace(
              '''              if !draft.conflicts.windows(2).all(|pair| {
                      (&pair[0].key, &pair[0].field_path, &pair[0].conflict_id)
                          < (&pair[1].key, &pair[1].field_path, &pair[1].conflict_id)
                  }) {
          ''',
              '''              if !draft.conflicts.windows(2).all(|pair| match pair {
                      [left, right] => {
                          (&left.key, &left.field_path, &left.conflict_id)
                              < (&right.key, &right.field_path, &right.conflict_id)
                      }
                      _ => true,
                  }) {
          ''',
              1,
          )
          source = source.replace(
              '''              if values.windows(2).any(|pair| pair[0] >= pair[1]) {
          ''',
              '''              if values.windows(2).any(|pair| match pair {
                      [left, right] => left >= right,
                      _ => false,
                  }) {
          ''',
              1,
          )
          source = source.replace(
              '''          fn lowercase_hex(bytes: &[u8]) -> String {
                  const HEX: &[u8; 16] = b"0123456789abcdef";
                  let mut output = String::with_capacity(bytes.len() * 2);
                  for byte in bytes {
                      output.push(char::from(HEX[usize::from(byte >> 4)]));
                      output.push(char::from(HEX[usize::from(byte & 0x0f)]));
                  }
                  output
              }
          ''',
              '''          fn lowercase_hex(bytes: &[u8]) -> String {
                  const HEX: &[u8; 16] = b"0123456789abcdef";
                  let mut output = String::with_capacity(bytes.len().saturating_mul(2));
                  for byte in bytes {
                      output.push(hex_digit(HEX, byte >> 4));
                      output.push(hex_digit(HEX, byte & 0x0f));
                  }
                  output
              }

              fn hex_digit(table: &[u8; 16], value: u8) -> char {
                  table
                      .get(usize::from(value))
                      .copied()
                      .map(char::from)
                      .unwrap_or('0')
              }
          ''',
              1,
          )
          deterministic.write_text(source, encoding='utf-8')

          store = Path('crates/wow-reference/src/store.rs')
          source = store.read_text(encoding='utf-8')
          source = source.replace(
              'if fs::remove_dir_all(path).is_err() {}',
              'let _cleanup_result = fs::remove_dir_all(path);',
          )
          store.write_text(source, encoding='utf-8')

          test = Path('crates/wow-reference/tests/immutable_pack_store.rs')
          source = test.read_text(encoding='utf-8')
          source = source.replace(
              'if fs::remove_dir_all(&self.path).is_err() {}',
              'let _cleanup_result = fs::remove_dir_all(&self.path);',
          )
          test.write_text(source, encoding='utf-8')

          binary = Path('crates/wow-reference/src/bin/wow-reference-pack.rs')
          source = binary.read_text(encoding='utf-8')
          if not source.startswith('//!'):
              source = '//! Command-line compiler, verifier, and immutable publisher for reference packs.\n\n' + source
          binary.write_text(source, encoding='utf-8')

          example = Path('crates/wow-reference/examples/generate_fixture.rs')
          source = example.read_text(encoding='utf-8')
          if not source.startswith('//!'):
              source = '//! Regenerates the committed deterministic I0-B fixture vectors.\n\n' + source
          example.write_text(source, encoding='utf-8')
          PY

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Normalize lock, source, and fixtures
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 fmt --all
          cargo +1.98.0 run --locked -p wow-reference --example generate_fixture
          cargo +1.98.0 fmt --all

      - name: Apply machine-safe lint repairs
        run: cargo +1.98.0 clippy --fix --locked --workspace --all-targets --all-features --allow-dirty --allow-staged

      - name: Re-normalize after lint repairs
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 run --locked -p wow-reference --example generate_fixture
          cargo +1.98.0 run --locked -p wow-reference --example generate_fixture -- --check

      - name: Check strict workspace lints
        run: cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace debug tests
        run: cargo +1.98.0 test --locked --workspace --all-features

      - name: Run workspace release tests
        run: cargo +1.98.0 test --locked --workspace --all-features --release

      - name: Build workspace documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.98.0 doc --locked --workspace --all-features --no-deps

      - name: Commit validated I0-B directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/implement-i0-b-reference-20260904.yml
          rm -f .github/workflows/stabilize-i0-b-reference-20260904.yml
          rm -f .github/workflows/implement-i0-b-pack-store-20260904.yml
          rm -f .github/workflows/finalize-i0-b-20260904.yml
          rm -f .github/workflows/finalize-i0-b-v2-20260904.yml
          rm -f .github/workflows/finalize-i0-b-v3-20260904.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(wow-reference): complete deterministic I0-B foundation"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Package failed candidate
        if: failure()
        shell: bash
        run: tar --exclude=.git --exclude=target -czf /tmp/i0-b-finalize-v3-failed.tar.gz .

      - name: Upload failed candidate
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: i0-b-finalize-v3-failed
          path: /tmp/i0-b-finalize-v3-failed.tar.gz
          retention-days: 1
          if-no-files-found: error
