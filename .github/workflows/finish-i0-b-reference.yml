name: Finish I0-B deterministic reference publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finish-i0-b-reference.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-i0-b-reference
  cancel-in-progress: true

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and integrate I0-B
        shell: bash
        run: |
          set -euo pipefail
          test -f crates/wow-reference/src/deterministic_view.rs
          test -f crates/wow-reference/tests/deterministic_view.rs
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path.cwd()
          crate = root / "crates" / "wow-reference"

          def section_bounds(source: str, header: str) -> tuple[int, int] | None:
              match = re.search(rf"(?m)^\[{re.escape(header)}\]\s*$", source)
              if match is None:
                  return None
              next_header = re.search(r"(?m)^\[[^]]+\]\s*$", source[match.end():])
              end = len(source) if next_header is None else match.end() + next_header.start()
              return match.end(), end

          def ensure_dependency(source: str, name: str, specification: str) -> str:
              bounds = section_bounds(source, "dependencies")
              if bounds is None:
                  return source.rstrip() + f"\n\n[dependencies]\n{name} = {specification}\n"
              start, end = bounds
              section = source[start:end]
              if re.search(rf"(?m)^\s*{re.escape(name)}\s*=", section):
                  return source
              return source[:end].rstrip() + f"\n{name} = {specification}\n\n" + source[end:].lstrip("\n")

          def array_bounds(source: str, key: str) -> tuple[int, int, str] | None:
              match = re.search(rf"(?m)^(?P<indent>\s*){re.escape(key)}\s*=\s*\[", source)
              if match is None:
                  return None
              opening = source.find("[", match.start())
              depth = 0
              in_string = False
              escaped = False
              for index in range(opening, len(source)):
                  character = source[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif character == "\\":
                          escaped = True
                      elif character == '"':
                          in_string = False
                      continue
                  if character == '"':
                      in_string = True
                  elif character == "[":
                      depth += 1
                  elif character == "]":
                      depth -= 1
                      if depth == 0:
                          return opening, index, match.group("indent")
              raise SystemExit(f"unterminated {key} array")

          def rewrite_array(source: str, key: str, transform) -> tuple[str, bool]:
              bounds = array_bounds(source, key)
              if bounds is None:
                  return source, False
              opening, closing, indent = bounds
              values = re.findall(r'"([^"\\]*(?:\\.[^"\\]*)*)"', source[opening + 1:closing])
              values = transform(values)
              replacement = "[\n" + "".join(
                  f'{indent}    "{value}",\n' for value in values
              ) + f"{indent}]"
              return source[:opening] + replacement + source[closing + 1:], True

          def replace_test(source: str, old_name: str, replacement: str) -> str:
              marker = f"fn {old_name}()"
              marker_index = source.find(marker)
              if marker_index < 0:
                  return source
              test_index = source.rfind("#[test]", 0, marker_index)
              brace_index = source.find("{", marker_index)
              if test_index < 0 or brace_index < 0:
                  raise SystemExit(f"malformed test {old_name}")
              depth = 0
              for index in range(brace_index, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[:test_index] + replacement.rstrip() + source[index + 1:]
              raise SystemExit(f"unterminated test {old_name}")

          manifest_path = crate / "Cargo.toml"
          if manifest_path.exists():
              manifest = manifest_path.read_text(encoding="utf-8")
          else:
              manifest = '''[package]
          name = "wow-reference"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.98"
          license = "MIT OR Apache-2.0"
          publish = false
          '''
          for name, specification in (
              ("serde", '{ version = "=1.0.228", features = ["derive"] }'),
              ("serde_json", '"=1.0.150"'),
              ("sha2", '"=0.11.0"'),
              ("wow-core", '{ path = "../wow-core" }'),
          ):
              manifest = ensure_dependency(manifest, name, specification)
          manifest_path.write_text(manifest.rstrip() + "\n", encoding="utf-8")

          lib_path = crate / "src" / "lib.rs"
          exports = '''// I0-B deterministic reference-view boundary.
          mod deterministic_view;

          pub use deterministic_view::{
              CoverageStatus, LookupResult, LookupUnknownReason, REFERENCE_VIEW_SCHEMA,
              ReferenceConflict, ReferencePartition, ReferenceRecord, ReferenceRecordKind,
              ReferenceView, ReferenceViewError, ReferenceViewResult, RestrictionFacet,
              RestrictionState,
          };
          '''
          if lib_path.exists():
              lib = lib_path.read_text(encoding="utf-8")
              if "mod deterministic_view;" not in lib:
                  lib = lib.rstrip() + "\n\n" + exports
              elif "ReferenceViewResult" not in lib:
                  raise SystemExit("deterministic module exists without its public export boundary")
          else:
              lib = "//! Deterministic reference-data boundary for the WoW development framework.\n\n" + exports
          lib_path.write_text(lib.rstrip() + "\n", encoding="utf-8")

          implementation_path = crate / "src" / "deterministic_view.rs"
          implementation = implementation_path.read_text(encoding="utf-8")
          implementation = implementation.replace(
              "bytes.next().is_some_and(u8::is_ascii_alphanumeric)",
              "bytes.next().is_some_and(|byte| byte.is_ascii_alphanumeric())",
          )
          implementation = implementation.replace(
              "pub fn lookup<'a>(&'a self, partition_id: &str, key: &str) -> LookupResult<'a>",
              "pub fn lookup(&self, partition_id: &str, key: &str) -> LookupResult<'_>",
          )
          implementation_path.write_text(implementation, encoding="utf-8")

          root_manifest_path = root / "Cargo.toml"
          root_manifest = root_manifest_path.read_text(encoding="utf-8")
          root_manifest, _ = rewrite_array(
              root_manifest,
              "exclude",
              lambda values: [value for value in values if value != "crates/wow-reference"],
          )

          def add_reference(values: list[str]) -> list[str]:
              if "crates/wow-reference" not in values:
                  values.append("crates/wow-reference")
              return sorted(dict.fromkeys(values))

          root_manifest, members_found = rewrite_array(root_manifest, "members", add_reference)
          if not members_found:
              raise SystemExit("workspace members array was not found")
          root_manifest, _ = rewrite_array(root_manifest, "default-members", add_reference)
          root_manifest_path.write_text(root_manifest, encoding="utf-8")

          policy_path = root / "crates" / "wow-core" / "tests" / "repository_policy.rs"
          if policy_path.exists():
              policy = policy_path.read_text(encoding="utf-8")
              replacement = '''#[test]
          fn workspace_activates_foundation_crates() {
              assert!(ROOT_MANIFEST.contains("\\\"crates/wow-core\\\"") || ROOT_MANIFEST.contains("\\\"crates/*\\\""));
              assert!(ROOT_MANIFEST.contains("\\\"crates/wow-reference\\\"") || ROOT_MANIFEST.contains("\\\"crates/*\\\""));
          }'''
              policy = replace_test(policy, "workspace_activates_only_wow_core", replacement)
              policy = replace_test(policy, "workspace_activates_foundation_crates", replacement)
              policy_path.write_text(policy, encoding="utf-8")
          PY

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Normalize and lock workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 clippy --fix --allow-dirty --allow-staged --allow-no-vcs --workspace --all-targets --all-features

      - name: Enforce I0-B validation matrix
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +1.98.0 test --locked --workspace --all-features
          cargo +1.98.0 test --locked --workspace --all-features --release
          cargo +1.98.0 doc --locked --workspace --all-features --no-deps

      - name: Preserve failed candidate
        if: failure()
        shell: bash
        run: tar --exclude=.git --exclude=target -czf /tmp/i0-b-failed.tar.gz .

      - name: Upload failed candidate
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: i0-b-failed
          path: /tmp/i0-b-failed.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Publish directly to main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/dev/apply_i0_b_reference.py
          rm -f .github/dev/finalize_i0_b_reference.py
          rm -f .github/dev/release-schema-probe.txt
          rm -f .github/dev/tool-probe.txt
          rm -f .github/dev/tool-probe-2.txt
          rm -f .github/workflows/apply-i0-b-reference.yml
          rm -f .github/workflows/finalize-i0-b-reference.yml
          rm -f .github/workflows/verify-publish-i0-b-reference.yml
          rm -f .github/workflows/consolidate-i0-b-reference.yml
          rm -f .github/workflows/finish-i0-b-reference.yml
          rmdir .github/dev 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No publication changes were produced" >&2
            exit 1
          fi
          git commit -m "feat(wow-reference): implement deterministic reference views"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
