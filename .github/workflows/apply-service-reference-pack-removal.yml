name: Apply Service reference-pack removal

on:
  push:
    branches:
      - refactor/remove-service-reference-pack-2026-10-19

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove obsolete pack path and validate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/remove-service-reference-pack.py "$RUNNER_TEMP/remove-service-reference-pack.py"
          git rm .github/remove-service-reference-pack.py
          python "$RUNNER_TEMP/remove-service-reference-pack.py"
          git rm crates/wow-service/src/reference_pack.rs
          git rm crates/wow-service/src/reference_pack_materialization.rs
          git rm crates/wow-service/src/reference_pack_license.rs
          git rm crates/wow-service/src/local/native_distribution.rs
          git rm crates/wow-service/src/local/platform_input/tests/builder_attempts.rs
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked -p wow-service -p wow-cli --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-service apps/wow docs
          git commit -m "refactor: remove obsolete Service reference-pack path"
          git push origin "HEAD:${GITHUB_REF_NAME}"
