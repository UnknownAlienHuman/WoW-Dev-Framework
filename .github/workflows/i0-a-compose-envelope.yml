name: I0-A compose envelope slice

on:
  pull_request:
    paths:
      - .github/workflows/i0-a-compose-envelope.yml
      - crates/wow-core/src/envelope.rs

permissions:
  contents: write

jobs:
  compose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install frozen toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Expose envelope module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/wow-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          declaration = 'pub mod envelope;\n'
          if declaration not in text:
              marker = 'pub mod error;\n'
              if marker not in text:
                  raise SystemExit('error module marker missing')
              text = text.replace(marker, marker + declaration, 1)
          exports = '''

pub use envelope::{
    E0CheckResultDraft, E0CheckResultEnvelope, E0OperationErrorEnvelope, ResultStatus,
    SchemaCompatibility, canonical_result_digest, validate_schema_version,
};
'''
          if 'pub use envelope::' not in text:
              text += exports
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact dependency lock
        run: |
          cargo +1.98.0 generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Format
        run: cargo +1.98.0 fmt --all

      - name: Lint
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.98.0 test --workspace --all-features

      - name: Commit validated envelope and remove composer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/i0-a-compose-envelope.yml
          git add crates/wow-core/src/lib.rs crates/wow-core/src/envelope.rs
          git commit -m 'feat(wow-core): expose canonical result envelopes'
          git push origin HEAD:${GITHUB_HEAD_REF}
