name: TOC selection build
on:
  push:
    branches: [main]
    paths:
      - '.ci/toc-selection/**'
      - '.github/workflows/toc-selection-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toc-selection-build
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit the reviewed source on its exact base
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toc-selection-results"
          git rev-parse HEAD > "$RUNNER_TEMP/toc-selection-results/BASE_SHA"
          cat .ci/toc-selection/{00,01,02,03,04} | base64 -d > "$RUNNER_TEMP/selection.patch.gz"
          echo "060042f25f9a255da6e7930bc1c10c46a534ace194bd1d37d626d31e416a229b  $RUNNER_TEMP/selection.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/selection.patch.gz" > "$RUNNER_TEMP/selection.patch"
          echo "4697dafb9a13aca9fd6f6afd767f79e46ab42403c181b3c3a628207306de9321  $RUNNER_TEMP/selection.patch" | sha256sum -c -
          git rm -r .ci/toc-selection .github/workflows/toc-selection-build.yml
          test "$(git write-tree)" = 754af9874391a05a1fd54b12ba47e6c01f87b365
          git apply --index --check "$RUNNER_TEMP/selection.patch"
          git apply --index "$RUNNER_TEMP/selection.patch"
          test "$(git write-tree)" = 38d967a9c0acc85b0d2cff567126ce2962119f59
      - name: Format the reviewed Rust implementation
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/toc-selection-results/RUST_VERSION"
          cargo +stable fmt --all
          git diff --exit-code -- . ':(exclude)apps/wow/src/output.rs' ':(exclude)crates/wow-project/src/load/conditions.rs' ':(exclude)crates/wow-project/src/load/mod.rs' ':(exclude)crates/wow-project/src/load/toc.rs' ':(exclude)crates/wow-service/src/local/disk_input.rs' ':(exclude)crates/wow-service/src/local/projection.rs'
          git add apps/wow/src/output.rs crates/wow-project/src/load/conditions.rs crates/wow-project/src/load/mod.rs crates/wow-project/src/load/toc.rs crates/wow-service/src/local/disk_input.rs crates/wow-service/src/local/projection.rs
          git diff --exit-code
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/toc-selection-results/TREE_SHA"
      - name: Build the application with the existing lockfile
        run: |
          set -euo pipefail
          cargo +stable build --locked -p wow-cli --bin wow 2>&1 | tee "$RUNNER_TEMP/toc-selection-results/build.txt"
      - name: Check the implemented owners
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-project -p wow-service -p wow-cli --lib --bins -- -D warnings 2>&1 | tee "$RUNNER_TEMP/toc-selection-results/clippy.txt"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/toc-selection-results/policy.txt"
          cargo +stable fmt --all --check
      - name: Retain the exact compiled tree
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --check
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/toc-selection-results/TREE_SHA")"
          git diff --cached --exit-code -- Cargo.lock Cargo.toml ':(glob)**/Cargo.toml' ':(glob)**/tests/**' ':(glob)**/examples/**'
          git diff --cached --binary HEAD > "$RUNNER_TEMP/toc-selection-results/compiled.patch"
          (cd "$RUNNER_TEMP/toc-selection-results" && sha256sum compiled.patch > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: toc-selection-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/toc-selection-results/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: toc-selection-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/selection-linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: toc-selection-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/selection-windows
      - name: Publish identical compiled sources to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/selection-linux/BASE_SHA")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/selection-windows/BASE_SHA")" = "$GITHUB_SHA"
          cmp "$RUNNER_TEMP/selection-linux/TREE_SHA" "$RUNNER_TEMP/selection-windows/TREE_SHA"
          cmp "$RUNNER_TEMP/selection-linux/compiled.patch" "$RUNNER_TEMP/selection-windows/compiled.patch"
          (cd "$RUNNER_TEMP/selection-linux" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/selection-windows" && sha256sum -c SHA256SUMS)
          git apply --index "$RUNNER_TEMP/selection-linux/compiled.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/selection-linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(project): resolve TOC conditions and path variables from explicit context' -m "Implement bounded file and metadata condition projection for game-type allow/exclude, text locale, load location and Lua environment. Expand Family/Game/TextLocale variables only for admitted included entries; excluded files are never resolved or opened. Retain conditions, declared paths and included/excluded/unresolved decisions. Bind full target profile and caller context in versioned load-plan identity; expose selection counts through the existing CLI. Unknown selectors and unsupported syntax remain explicit blockers. Linux/Windows application builds, selected-owner Clippy, formatting and repository policy passed on this exact tree in run $GITHUB_RUN_ID. No dependency, lockfile, test or fixture changes. Full package/XML/inline-Lua semantics, runtime validation and E2/R0 acceptance remain separate. Temporary build inputs removed."
          git push origin HEAD:main
