name: Finalize I0-B deterministic reference views

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-i0-b-reference.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-i0-b-reference
  cancel-in-progress: true

jobs:
  integrate-validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Finalize workspace integration
        run: python3 .github/dev/finalize_i0_b_reference.py

      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Format workspace
        run: cargo +1.98.0 fmt --all

      - name: Refresh dependency lock
        run: cargo +1.98.0 generate-lockfile

      - name: Apply machine-safe lint fixes
        run: cargo +1.98.0 clippy --fix --allow-dirty --allow-staged --allow-no-vcs --workspace --all-targets --all-features

      - name: Enforce strict lints
        run: cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run debug tests
        run: cargo +1.98.0 test --locked --workspace --all-features

      - name: Run release tests
        run: cargo +1.98.0 test --locked --workspace --all-features --release

      - name: Build strict documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.98.0 doc --locked --workspace --all-features --no-deps

      - name: Package failed candidate
        if: failure()
        shell: bash
        run: tar --exclude=.git --exclude=target -czf /tmp/i0-b-reference-v2-failed.tar.gz .

      - name: Upload failed candidate
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: i0-b-reference-v2-failed
          path: /tmp/i0-b-reference-v2-failed.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Publish directly to main and remove staging files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/dev/apply_i0_b_reference.py
          rm -f .github/dev/finalize_i0_b_reference.py
          rm -f .github/workflows/apply-i0-b-reference.yml
          rm -f .github/workflows/finalize-i0-b-reference.yml
          rmdir .github/dev 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No publication changes were produced" >&2
            exit 1
          fi
          git commit -m "feat(wow-reference): implement deterministic reference views"
          git push origin HEAD:main
