name: Finalize rolling reference pipeline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-rolling-reference-pipeline.yml"

permissions:
  contents: write

concurrency:
  group: final-direct-main-write
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply idempotent compatibility and cleanup pass
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          for directory in (
              '.github/i0a-payload', '.github/i0a-payload-xz',
              '.github/repair-payload', '.github/live-update-payload',
          ):
              shutil.rmtree(directory, ignore_errors=True)
          Path('rust-toolchain.toml').unlink(missing_ok=True)

          for path in Path('.github/workflows').glob('*'):
              if not path.is_file():
                  continue
              name = path.name
              if (
                  name.startswith(('export-', 'finalize-', 'implement-', 'publish-', 'stabilize-', 'cleanup-', 'integrate-', 'reconcile-'))
                  or '20260904' in name
                  or name.startswith('i0-a-export-')
              ):
                  path.unlink()

          builder = Path('scripts/build-blizzard-api-reference.py')
          source = builder.read_text(encoding='utf-8')
          source = source.replace(
              '    consumed = {"Name", "Type", "Arguments", "Returns", "Payload", "Documentation", "Event"}\n',
              '    consumed = {"Name", "Type", "Arguments", "Returns", "Payload", "Documentation", "Event", "LiteralName"}\n',
          )
          source = source.replace(
              '    if "Event" in record:\n        result["event"] = _string(record.get("Event"), f"{kind}.Event")\n',
              '    event_literal = _first(record, "Event", "LiteralName")\n    if event_literal is not None:\n        result["event"] = _string(event_literal, f"{kind}.Event")\n',
          )

          old_source_field = '''def _source_field(manifest: dict[str, Any], *keys: str) -> Any:
              source = manifest.get("source")
              if isinstance(source, dict):
                  value = _first(source, *keys)
                  if value is not None:
                      return value
              return _first(manifest, *keys)
          '''.replace('          ', '')
          new_source_field = '''def _source_field(manifest: dict[str, Any], *keys: str) -> Any:
              for container_key in ("source", "source_identity", "identity", "resolved_source"):
                  container = manifest.get(container_key)
                  if isinstance(container, dict):
                      value = _first(container, *keys)
                      if value is not None:
                          return value
              return _first(manifest, *keys)
          '''.replace('          ', '')
          if old_source_field in source:
              source = source.replace(old_source_field, new_source_field, 1)

          old_revision = '''def _manifest_revision(manifest: dict[str, Any]) -> str:
              value = _source_field(manifest, "resolved_commit", "resolved_revision", "revision", "source_revision", "commit")
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-fA-F]{40,64}", value):
                  raise DraftError("source manifest does not contain a full Git revision")
              return value.lower()
          '''.replace('          ', '')
          new_revision = '''def _manifest_revision(manifest: dict[str, Any]) -> str:
              direct = _source_field(
                  manifest,
                  "resolved_commit",
                  "resolved_revision",
                  "revision",
                  "source_revision",
                  "commit",
                  "object_id",
                  "git_object_id",
              )
              candidates: set[str] = set()
              if isinstance(direct, str) and re.fullmatch(r"[0-9a-fA-F]{40,64}", direct):
                  candidates.add(direct.lower())
              for container_key in ("git", "resolved", "snapshot"):
                  container = manifest.get(container_key)
                  if isinstance(container, dict):
                      value = _first(
                          container,
                          "resolved_commit",
                          "resolved_revision",
                          "revision",
                          "commit",
                          "object_id",
                      )
                      if isinstance(value, str) and re.fullmatch(r"[0-9a-fA-F]{40,64}", value):
                          candidates.add(value.lower())
              if len(candidates) != 1:
                  raise DraftError("source manifest must identify exactly one full Git revision")
              return next(iter(candidates))
          '''.replace('          ', '')
          if old_revision in source:
              source = source.replace(old_revision, new_revision, 1)

          old_files = '''def _manifest_files(manifest: dict[str, Any]) -> list[dict[str, Any]]:
              records = manifest.get("files")
              if not isinstance(records, list):
                  selection = manifest.get("selection")
                  if isinstance(selection, dict):
                      records = selection.get("files")
              if not isinstance(records, list):
                  raise DraftError("source manifest does not contain a files array")
              result: list[dict[str, Any]] = []
              for record in records:
                  if not isinstance(record, dict) or not isinstance(record.get("path"), str):
                      raise DraftError("source manifest contains an invalid file record")
                  result.append(record)
              return result
          '''.replace('          ', '')
          new_files = '''def _manifest_files(manifest: dict[str, Any]) -> list[dict[str, Any]]:
              candidates: list[list[Any]] = []
              for key in ("files", "entries", "records"):
                  value = manifest.get(key)
                  if isinstance(value, list):
                      candidates.append(value)
              for container_key in ("selection", "inventory", "source", "snapshot"):
                  container = manifest.get(container_key)
                  if not isinstance(container, dict):
                      continue
                  for key in ("files", "entries", "records"):
                      value = container.get(key)
                      if isinstance(value, list):
                          candidates.append(value)
              usable = [
                  records
                  for records in candidates
                  if records and all(isinstance(record, dict) and isinstance(record.get("path"), str) for record in records)
              ]
              if not usable:
                  raise DraftError("source manifest does not contain a valid file inventory")
              records = max(usable, key=len)
              return [dict(record) for record in records]
          '''.replace('          ', '')
          if old_files in source:
              source = source.replace(old_files, new_files, 1)

          old_sha = '''def _record_sha256(record: dict[str, Any]) -> str | None:
              value = _first(record, "sha256", "content_sha256", "content_digest", "digest")
              if not isinstance(value, str):
                  return None
              lowered = value.lower().removeprefix("sha256:")
              if not re.fullmatch(r"[0-9a-f]{64}", lowered):
                  raise DraftError(f"invalid SHA-256 for {record.get('path')}")
              return lowered
          '''.replace('          ', '')
          new_sha = '''def _record_sha256(record: dict[str, Any]) -> str | None:
              value = _first(record, "sha256", "content_sha256", "content_digest", "digest")
              if not isinstance(value, str):
                  for container_key in ("content", "identity", "hashes"):
                      container = record.get(container_key)
                      if isinstance(container, dict):
                          value = _first(container, "sha256", "content_sha256", "content_digest", "digest")
                          if isinstance(value, str):
                              break
              if not isinstance(value, str):
                  return None
              lowered = value.lower().removeprefix("sha256:")
              if not re.fullmatch(r"[0-9a-f]{64}", lowered):
                  raise DraftError(f"invalid SHA-256 for {record.get('path')}")
              return lowered
          '''.replace('          ', '')
          if old_sha in source:
              source = source.replace(old_sha, new_sha, 1)
          builder.write_text(source, encoding='utf-8', newline='\n')

          test = Path('tests/test_blizzard_api_reference.py')
          if test.exists():
              tests = test.read_text(encoding='utf-8')
              tests = tests.replace('            Event = "EXAMPLE_CHANGED",', '            LiteralName = "EXAMPLE_CHANGED",')
              marker = '            self.assertEqual(function["restrictions"]["HasRestrictions"], True)\n'
              addition = marker + '            self.assertEqual(first["systems"][0]["events"][0]["event"], "EXAMPLE_CHANGED")\n'
              if marker in tests and 'events"][0]["event"]' not in tests:
                  tests = tests.replace(marker, addition, 1)
              test.write_text(tests, encoding='utf-8', newline='\n')

          lib = Path('crates/wow-reference/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          if 'pub mod blizzard_api;' not in text:
              text = text.rstrip() + '\n\npub mod blizzard_api;\n'
          if 'pub use blizzard_api::' not in text:
              text += '''\npub use blizzard_api::{
              BLIZZARD_API_DRAFT_SCHEMA, BlizzardApiCallable, BlizzardApiCoverage,
              BlizzardApiCoverageStatus, BlizzardApiDraftError, BlizzardApiFileCoverage,
              BlizzardApiFileFailure, BlizzardApiFileStatus, BlizzardApiIndex, BlizzardApiLookup,
              BlizzardApiParameter, BlizzardApiProducer, BlizzardApiRecordCounts,
              BlizzardApiReferenceDraft, BlizzardApiSourceIdentity, BlizzardApiSourcePointer,
              BlizzardApiSystem, BlizzardApiTable,
          };\n'''
          lib.write_text(text, encoding='utf-8', newline='\n')

          module = Path('crates/wow-reference/src/blizzard_api.rs')
          rust = module.read_text(encoding='utf-8')
          rust = rust.replace(
              "byte.is_ascii_digit() || (b'a'..=b'f').contains(&byte)",
              "byte.is_ascii_hexdigit() && !byte.is_ascii_uppercase()",
          )
          rust = rust.replace(
              '    Ok(format!("sha256:{}", bytes_to_hex(&digest)))',
              '    let hexadecimal = bytes_to_hex(&digest);\n    Ok(format!("sha256:{hexadecimal}"))',
          )
          module.write_text(rust, encoding='utf-8', newline='\n')

          manifest = Path('crates/wow-reference/Cargo.toml')
          cargo = manifest.read_text(encoding='utf-8')
          additions = []
          for name, declaration in (
              ('sha2', 'sha2 = "0.11"'),
              ('serde', 'serde = { version = "1", features = ["derive"] }'),
              ('serde_json', 'serde_json = "1"'),
              ('wow-core', 'wow-core = { path = "../wow-core" }'),
          ):
              if re.search(rf'^{re.escape(name)}\s*=', cargo, flags=re.MULTILINE) is None:
                  additions.append(declaration)
          if additions:
              match = re.search(r'^\[dependencies\]\s*$', cargo, flags=re.MULTILINE)
              if match is None:
                  cargo = cargo.rstrip() + '\n\n[dependencies]\n' + '\n'.join(additions) + '\n'
              else:
                  cargo = cargo[:match.end()] + '\n' + '\n'.join(additions) + cargo[match.end():]
          manifest.write_text(cargo, encoding='utf-8', newline='\n')
          for cargo_path in root.rglob('Cargo.toml'):
              cargo_text = cargo_path.read_text(encoding='utf-8')
              cargo_path.write_text(
                  re.sub(r'^\s*rust-version\s*=.*\n', '', cargo_text, flags=re.MULTILINE),
                  encoding='utf-8', newline='\n',
              )

          docs = Path('docs/BLIZZARD_API_REFERENCE_DRAFT.md')
          if docs.exists():
              body = docs.read_text(encoding='utf-8')
              note = '\nEvent literal identity is normalized from the generated `LiteralName` field (and accepts legacy `Event` input when present).\n'
              if note.strip() not in body:
                  body = body.rstrip() + note
              docs.write_text(body, encoding='utf-8', newline='\n')

          url_pattern = re.compile(r'https://github\.com/UnknownAlienHuman/wow-addon-engineering-kb(?:/[^\s)\]>]*)?')
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'target' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              updated = url_pattern.sub('optional-advisory://configured-locally', text)
              updated = updated.replace('UnknownAlienHuman/wow-addon-engineering-kb', 'optional-advisory-provider')
              updated = updated.replace('wow-addon-engineering-kb', 'optional-advisory-provider')
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')
          PY
          git add -A
      - name: Validate all local contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build-blizzard-api-reference.py \
            scripts/verify-blizzard-api-reference.py \
            tests/test_blizzard_api_reference.py
          python -m unittest discover -s tests -p 'test_*.py'
          if test -f scripts/sync-wow-dev-skill.py; then
            python scripts/sync-wow-dev-skill.py --check
          fi
          cargo fmt --all
          cargo fix --workspace --all-targets --all-features --allow-dirty --allow-staged
          cargo clippy --fix --workspace --all-targets --all-features --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.baseline"
          cargo update
          cargo test --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cp "$RUNNER_TEMP/Cargo.lock.baseline" Cargo.lock
      - name: Current Gethe live end-to-end smoke
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch live \
            https://github.com/Gethe/wow-ui-source.git "$RUNNER_TEMP/wow-ui-source"
          revision="$(git -C "$RUNNER_TEMP/wow-ui-source" rev-parse HEAD)"
          python scripts/build-blizzard-source-manifest.py \
            --source "$RUNNER_TEMP/wow-ui-source" \
            --revision "$revision" \
            --selector live \
            --output "$RUNNER_TEMP/source-manifest.json"
          python scripts/verify-blizzard-source-manifest.py \
            "$RUNNER_TEMP/source-manifest.json" \
            --source "$RUNNER_TEMP/wow-ui-source"
          python scripts/build-blizzard-api-reference.py \
            --manifest "$RUNNER_TEMP/source-manifest.json" \
            --source "$RUNNER_TEMP/wow-ui-source" \
            --output "$RUNNER_TEMP/blizzard-api-reference.json" \
            --json
          python scripts/verify-blizzard-api-reference.py \
            "$RUNNER_TEMP/blizzard-api-reference.json" \
            --require-complete \
            --json
          printf 'revision=%s\n' "$revision" >> "$GITHUB_STEP_SUMMARY"
          printf 'version=%s\n' "$(tr -d '\r\n' < "$RUNNER_TEMP/wow-ui-source/version.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate clean public repository state
        shell: bash
        run: |
          set -euo pipefail
          test ! -e rust-toolchain.toml
          test ! -d .github/i0a-payload
          test ! -d .github/i0a-payload-xz
          test ! -d .github/repair-payload
          test ! -d .github/live-update-payload
          test ! -e .github/workflows/finalize-rolling-reference-pipeline.yml
          ! find .github/workflows -maxdepth 1 -type f \( \
            -name 'export-*' -o -name 'finalize-*' -o -name 'implement-*' -o \
            -name 'publish-*' -o -name 'stabilize-*' -o -name 'cleanup-*' -o \
            -name 'integrate-*' -o -name 'reconcile-*' -o -name '*20260904*' \) | grep -q .
          ! grep -RIl --exclude-dir=.git --exclude-dir=target -E \
            'wow-addon-engineering-kb|UnknownAlienHuman/wow-addon-engineering-kb' .
          git add -A
          git diff --check --cached
      - name: Publish directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reference): harden rolling Blizzard API pipeline"
          git push origin HEAD:main
