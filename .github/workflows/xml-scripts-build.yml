name: XML handler pipeline check
on:
  push:
    branches: [main]
    paths: ['.ci/xml-scripts/**', '.github/workflows/xml-scripts-build.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Admit exact reviewed pipeline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config core.autocrlf false
          mkdir -p "$RUNNER_TEMP/xml-scripts"
          git rev-parse HEAD > "$RUNNER_TEMP/xml-scripts/BASE_SHA"
          cat .ci/xml-scripts/[0-9][0-9] | base64 --decode | gzip -d > "$RUNNER_TEMP/xml-scripts/input.patch"
          echo '33a29d6a88ebf91a0bb6703583424ef174a6bc829f7cda9c5eaa870c2343692f  input.patch' > "$RUNNER_TEMP/xml-scripts/INPUT_SHA256"
          (cd "$RUNNER_TEMP/xml-scripts" && sha256sum -c INPUT_SHA256)
          git rm -r -- .ci/xml-scripts .github/workflows/xml-scripts-build.yml
          test "$(git write-tree)" = 5b2e168a211ca56329bf93d9745b3df303b32a8d
          git apply --index --unidiff-zero "$RUNNER_TEMP/xml-scripts/input.patch"
          test "$(git write-tree)" = 90784bddd7a4aa2d434df21af0748675d8629c2c
      - name: Format implemented source
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable -Vv > "$RUNNER_TEMP/xml-scripts/RUST_VERSION"
          cargo +stable fmt -p wow-emmy -p wow-project -p wow-recognizers -p wow-service -p wow-cli
          git add -u
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/xml-scripts/TREE_SHA"
      - name: Clippy changed pipeline
        run: |
          set -euo pipefail
          cargo +stable clippy --locked -p wow-emmy -p wow-project -p wow-recognizers -p wow-service -p wow-cli -- -D warnings 2>&1 | tee "$RUNNER_TEMP/xml-scripts/clippy.log"
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/xml-scripts/policy.log"
      - name: Retain exact checked source
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/xml-scripts/TREE_SHA")"
          git diff --cached --binary > "$RUNNER_TEMP/xml-scripts/checked.patch"
          git archive "$(git write-tree)" > "$RUNNER_TEMP/xml-scripts/checked-source.tar"
          (cd "$RUNNER_TEMP/xml-scripts" && sha256sum checked.patch checked-source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xml-scripts-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/xml-scripts/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: xml-scripts-ubuntu-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: xml-scripts-windows-latest-${{ github.run_id }}
          path: ${{ runner.temp }}/windows
      - name: Publish identical checked source to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for platform in linux windows; do
            test "$(cat "$RUNNER_TEMP/$platform/BASE_SHA")" = "$GITHUB_SHA"
            (cd "$RUNNER_TEMP/$platform" && sha256sum -c SHA256SUMS)
          done
          cmp "$RUNNER_TEMP/linux/TREE_SHA" "$RUNNER_TEMP/windows/TREE_SHA"
          cmp "$RUNNER_TEMP/linux/checked.patch" "$RUNNER_TEMP/windows/checked.patch"
          git apply --index "$RUNNER_TEMP/linux/checked.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/linux/TREE_SHA")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(graph): connect XML handlers to recognizers and callable graph exports' -m "Capture exact callable signatures during existing XML name lookups. Project existing inline syntax units and direct/inherited handler source sites, preserving ambiguous, Library and load-order outcomes. Route admitted source associations through the existing script-assignment recognizer into a separate partition. Keep methods and inherited associations Possible, not effective dispatch; rebind all exported node/edge maps after both recognizer partitions. Graph-build v5 exposes handler nodes, script edges and complete site/recognition receipts. Selected pipeline Clippy, formatting and repository policy passed on identical Linux/Windows source trees in run $GITHUB_RUN_ID. No tests, dependencies or lockfile changes. Runtime ordering, inline semantics, other recognizers and coherent ProjectStore remain separate. Temporary check inputs removed."
          git push origin HEAD:main
