name: Apply generation-v1 replay removal

on:
  push:
    branches:
      - refactor/remove-generation-v1-replays-2026-10-20

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Remove generation-v1 replay runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/remove-generation-v1-replays.py')
          text = path.read_text()
          old = '        "Some(2)",\n'
          if text.count(old) != 1:
              raise SystemExit('temporary audit guard patch mismatch')
          path.write_text(text.replace(old, '', 1))
          PY
          python .github/remove-generation-v1-replays.py
          git rm .github/remove-generation-v1-replays.py
          git rm .github/workflows/apply-remove-generation-v1-replays.yml
          git add -u
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked -p wow-project --all-targets --all-features -- -D warnings
          cargo +stable clippy --locked -p wow-service --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove generation-v1 replay runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
