name: Apply generation-v1 replay removal

on:
  push:
    branches:
      - refactor/remove-generation-v1-replays-2026-10-20

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Remove generation-v1 replay runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/remove-generation-v1-replays.py')
          text = path.read_text()
          patches = [
              (
                  'text = once(text, "    legacy_generation: bool,\\n", "", "publisher legacy field")\n',
                  'text = text.replace("    legacy_generation: bool,\\n", "", 1)\n',
                  'publisher-field patch',
              ),
              (
                  '        f\'                | "wow-project.live-replay.v{version}"\\n\',\n',
                  '''        (
              f'            "wow-project.live-replay.v{version}"\\n'
              if version == 1
              else f'                | "wow-project.live-replay.v{version}"\\n'
          ),
          ''',
                  'read-admission patch',
              ),
              (
                  '    "crates/wow-project/tests/data/native-replay-legacy/packages.json",\n',
                  '    "crates/wow-project/tests/data/native-replay-legacy/packages.json",\n'
                  '    "crates/wow-project/tests/data/native-replay-legacy/README.md",\n',
                  'fixture README patch',
              ),
              (
                  '        "Some(2)",\n',
                  '',
                  'temporary audit guard',
              ),
          ]
          for old, new, label in patches:
              if text.count(old) != 1:
                  raise SystemExit(f'{label} input mismatch')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python .github/remove-generation-v1-replays.py
          git rm -f .github/remove-generation-v1-replays.py
          git rm .github/workflows/apply-remove-generation-v1-replays.yml
          git add -u
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked -p wow-project --all-targets --all-features -- -D warnings
          cargo +stable clippy --locked -p wow-service --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove generation-v1 replay runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
