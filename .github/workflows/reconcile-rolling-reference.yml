name: Reconcile rolling Blizzard reference pipeline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reconcile-rolling-reference.yml"

permissions:
  contents: write

concurrency:
  group: direct-main-integration
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reconcile implementation and public routing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          for directory in (
              '.github/i0a-payload',
              '.github/i0a-payload-xz',
              '.github/repair-payload',
              '.github/live-update-payload',
          ):
              shutil.rmtree(directory, ignore_errors=True)
          Path('rust-toolchain.toml').unlink(missing_ok=True)

          workflows = Path('.github/workflows')
          for path in workflows.glob('*'):
              if not path.is_file():
                  continue
              name = path.name
              transient = (
                  name.startswith(('export-', 'finalize-', 'implement-', 'publish-', 'stabilize-', 'cleanup-', 'integrate-', 'reconcile-'))
                  or '20260904' in name
                  or name.startswith('i0-a-export-')
              )
              if transient:
                  path.unlink()

          lib = Path('crates/wow-reference/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          if 'pub mod blizzard_api;' not in text:
              text = text.rstrip() + '\n\npub mod blizzard_api;\n'
          if 'pub use blizzard_api::' not in text:
              text += '''\npub use blizzard_api::{
              BLIZZARD_API_DRAFT_SCHEMA, BlizzardApiCallable, BlizzardApiCoverage,
              BlizzardApiCoverageStatus, BlizzardApiDraftError, BlizzardApiFileCoverage,
              BlizzardApiFileFailure, BlizzardApiFileStatus, BlizzardApiIndex, BlizzardApiLookup,
              BlizzardApiParameter, BlizzardApiProducer, BlizzardApiRecordCounts,
              BlizzardApiReferenceDraft, BlizzardApiSourceIdentity, BlizzardApiSourcePointer,
              BlizzardApiSystem, BlizzardApiTable,
          };\n'''
          lib.write_text(text, encoding='utf-8', newline='\n')

          module = Path('crates/wow-reference/src/blizzard_api.rs')
          source = module.read_text(encoding='utf-8')
          source = source.replace(
              "byte.is_ascii_digit() || (b'a'..=b'f').contains(&byte)",
              "byte.is_ascii_hexdigit() && !byte.is_ascii_uppercase()",
          )
          source = source.replace(
              '    Ok(format!("sha256:{}", bytes_to_hex(&digest)))',
              '    let hexadecimal = bytes_to_hex(&digest);\n    Ok(format!("sha256:{hexadecimal}"))',
          )
          module.write_text(source, encoding='utf-8', newline='\n')

          manifest = Path('crates/wow-reference/Cargo.toml')
          cargo = manifest.read_text(encoding='utf-8')
          additions = []
          if re.search(r'^sha2\s*=', cargo, flags=re.MULTILINE) is None:
              additions.append('sha2 = "0.11"')
          if re.search(r'^serde\s*=', cargo, flags=re.MULTILINE) is None:
              additions.append('serde = { version = "1", features = ["derive"] }')
          if re.search(r'^serde_json\s*=', cargo, flags=re.MULTILINE) is None:
              additions.append('serde_json = "1"')
          if re.search(r'^wow-core\s*=', cargo, flags=re.MULTILINE) is None:
              additions.append('wow-core = { path = "../wow-core" }')
          if additions:
              match = re.search(r'^\[dependencies\]\s*$', cargo, flags=re.MULTILINE)
              if match is None:
                  cargo = cargo.rstrip() + '\n\n[dependencies]\n' + '\n'.join(additions) + '\n'
              else:
                  cargo = cargo[:match.end()] + '\n' + '\n'.join(additions) + cargo[match.end():]
          cargo = re.sub(r'^\s*rust-version\s*=.*\n', '', cargo, flags=re.MULTILINE)
          manifest.write_text(cargo, encoding='utf-8', newline='\n')
          for cargo_path in root.rglob('Cargo.toml'):
              cargo_text = cargo_path.read_text(encoding='utf-8')
              updated = re.sub(r'^\s*rust-version\s*=.*\n', '', cargo_text, flags=re.MULTILINE)
              if updated != cargo_text:
                  cargo_path.write_text(updated, encoding='utf-8', newline='\n')

          agents = '''# AGENTS.md — WoW Dev Framework

These rules apply to every contributor and agent.

## Current implementation

`wow-core`, deterministic `wow-reference`, rolling Blizzard source acquisition, source manifests, generated API normalization and verified Rust ingestion are executable. The next implementation package is the update-compatible `wow-emmy` adapter, followed by project/rules/service composition.

## Mandatory WoW workflow

Before every World of Warcraft task, load `.agents/skills/wow-dev/SKILL.md`, inspect the actual target project, and run the source/version check. Select a moving Blizzard UI branch such as `live`, `ptr`, `beta` or the intended Classic branch. Resolve it once at operation start and use that exact revision for every generated-doc, Lua, XML, TOC and version read in the operation. A later operation resolves again.

Prefer a local Git clone. A clean managed clone may be cloned or fast-forwarded under `auto`, `prompt` or `never`. Never reset, clean, switch or overwrite a dirty, ahead, diverged, wrong-origin or wrong-branch checkout. An exact-revision GitHub read is the fallback when the object is unavailable locally.

Exact revisions and dependency resolutions identify completed evidence; they are not permanent global pins. The project has no fixed WoW build, Interface, Gethe commit or Rust toolchain. Generated grammar changes fail visibly until the producer is updated. Partial coverage has no negative authority.

## Optional advisory context

A generic advisory provider may be used only when the owner configures and enables it outside the checkout. It is absent, unnamed and undiscoverable by default. Public builds, tests and documentation must work without it and must not expose its origin, path, remote, revision or credentials. Consume only sanitized narrow routes. Advisory text never overrides current Blizzard source, project code or runtime evidence.

## Authority

1. Accepted framework contracts and exact operation inputs.
2. Exact Blizzard UI revision selected for the operation.
3. Generated declarations and Blizzard implementation/XML/TOC at that revision.
4. Target project code and fixtures.
5. Exact runtime evidence.
6. Explicitly enabled sanitized advisory context.
7. Selected third-party implementation evidence.
8. Community, search or model candidates.

Preserve conflicts. Stale, partial, conflicted, truncated, unsupported or failed coverage never becomes a clean negative.

## Engineering rules

- Never execute arbitrary Lua, XML, repository hooks, installers, package managers, repository scripts or generated code during ingestion.
- Keep source, project, runtime, advisory, external and historical universes separate.
- No hidden cwd, Git, editor, installation, addon, profile, provider or current-state discovery.
- Owner crates do not depend on service, application or transport crates.
- Add abstractions only for demonstrated repeated owner responsibilities.
- Tests must exercise positive and failure paths; committed fixtures are never rewritten by tests.
- `Cargo.lock` records a tested resolution. CI also tests a current compatible dependency resolution.
- Report each check as pass, fail, skipped or `NotEvaluated`.
- Publish directly to `main`, or merge and delete the task branch immediately. Do not leave completed branches or worktrees.

## GitHub connector

Before claiming GitHub is read-only, load its complete tool catalog, call `get_repo`, verify `permissions.push == true`, and use GitHub API write actions. Local Git or network failure does not establish connector limitations.
'''
          Path('AGENTS.md').write_text(agents, encoding='utf-8', newline='\n')

          loader = '''# Agent entry point

Before World of Warcraft research, review, migration, debugging or implementation, load `.agents/skills/wow-dev/SKILL.md`. Read the target project first, resolve current Blizzard UI source for the operation, and do not use a hard-coded build or commit as permanent truth. Optional advisory context is used only when explicitly configured outside the repository and remains non-authoritative.
'''
          for filename in ('CLAUDE.md', 'GEMINI.md'):
              Path(filename).write_text(loader, encoding='utf-8', newline='\n')

          skill = '''---
name: wow-dev
description: Mandatory current-source workflow for World of Warcraft addon engineering.
---

# WoW development workflow

Load this skill before every WoW research, review, migration, debugging or implementation task.

1. Read the actual target project instructions, TOC, bootstrap, load order and relevant code.
2. Select the intended moving branch (`live`, `ptr`, `beta`, a Classic branch or explicit equivalent).
3. Run `scripts/check-wow-versions.sh auto` or `scripts/check-wow-versions.ps1 -Update auto`; use `prompt` or `never` when mutation is not allowed.
4. Resolve the moving selector once. Use one exact revision for generated docs, Lua, XML, TOC and version reads. Resolve again on the next operation.
5. Prefer the local Git object database. Use a configured exact-revision GitHub fallback only when the local object is unavailable. Never mix revisions.
6. Build and verify `.wow-dev/source-manifest.json` with `build-blizzard-source-manifest.py` and `verify-blizzard-source-manifest.py`.
7. For generated API work, build and verify the normalized draft with `build-blizzard-api-reference.py` and `verify-blizzard-api-reference.py --require-complete`.
8. Generated docs prove declarations; implementation/XML/TOC prove source behavior; state-, secret-, hotfix- and protection-dependent claims require runtime evidence.
9. A search miss is ambiguous unless the inspected universe has complete coverage. Unsupported generated syntax is an explicit failure; diagnostic partial output has no negative authority.
10. Query optional advisory context only when it is already configured and enabled outside the repository. Do not discover or name a provider. Consume a sanitized narrow route, expose no origin metadata, and revalidate every claim.
11. Label claims `current-source-confirmed`, `project-confirmed`, `runtime-confirmed`, `advisory`, `historical` or `unverified`.
12. Run actual project checks and report exact inputs and pass/fail/skipped/NotEvaluated status. Never fabricate client evidence.
'''
          destinations = (
              '.agents/skills/wow-dev/SKILL.md',
              '.claude/skills/wow-dev/SKILL.md',
              '.opencode/skills/wow-dev/SKILL.md',
              '.agent/skills/wow-dev/SKILL.md',
          )
          for destination in destinations:
              path = Path(destination)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(skill, encoding='utf-8', newline='\n')

          status = '''# Implementation status

## Implemented

- `wow-core`: deterministic shared identities, coverage, evidence, findings and result envelopes.
- `wow-reference`: deterministic reference views, immutable generation storage and mutable channel catalogues.
- Rolling Blizzard UI source acquisition: local clone first, exact-revision GitHub fallback, explicit update policy and stale detection.
- Exact source manifests over Lua, XML, TOC, XSD, generated API documentation and version metadata.
- Generated Blizzard API producer: non-executing normalization with per-file coverage and canonical draft identity.
- Rust generated-API ingestion: digest verification, source/coverage validation and exact function/event/table indexes.
- Mandatory cross-agent WoW development skill with optional sanitized advisory context.

## Current gate

A generated API draft is usable for authoritative exact absence only when every source-manifest candidate was parsed and the canonical digest, source revision, file hashes, ordering and record counts verify. Unsupported generated syntax produces explicit partial coverage and no negative authority.

## Next package

Implement the update-compatible `wow-emmy` adapter without a permanent upstream revision. Compatibility is established by automated current-upstream probes and a narrow adapter boundary. Each completed analyzer result records the exact analyzer revision/version actually used.
'''
          Path('docs/IMPLEMENTATION_STATUS.md').write_text(status, encoding='utf-8', newline='\n')

          readme = Path('README.md')
          body = readme.read_text(encoding='utf-8')
          start = '<!-- rolling-source-status:start -->'
          end = '<!-- rolling-source-status:end -->'
          block = '''<!-- rolling-source-status:start -->
## Current-source development

The framework resolves the selected Blizzard UI branch at the start of each operation. Local Git is preferred; exact-revision GitHub reads are the fallback. Completed results retain exact provenance, while future operations resolve current source again.

```bash
scripts/check-wow-versions.sh auto
python scripts/build-blizzard-source-manifest.py --source "$WOW_UI_SOURCE_DIR" --revision <resolved-revision> --selector live --output .wow-dev/source-manifest.json
python scripts/build-blizzard-api-reference.py --manifest .wow-dev/source-manifest.json --source "$WOW_UI_SOURCE_DIR" --output .wow-dev/blizzard-api-reference.json
python scripts/verify-blizzard-api-reference.py .wow-dev/blizzard-api-reference.json --require-complete
```

See [implementation status](docs/IMPLEMENTATION_STATUS.md), [source acquisition](docs/SOURCE_ACQUISITION.md), [generated API drafts](docs/BLIZZARD_API_REFERENCE_DRAFT.md), and the mandatory [WoW development skill](.agents/skills/wow-dev/SKILL.md).
<!-- rolling-source-status:end -->'''
          if start in body and end in body:
              before, remainder = body.split(start, 1)
              _, after = remainder.split(end, 1)
              body = before.rstrip() + '\n\n' + block + after
          else:
              body = body.rstrip() + '\n\n' + block + '\n'
          readme.write_text(body, encoding='utf-8', newline='\n')

          url_pattern = re.compile(r'https://github\.com/UnknownAlienHuman/wow-addon-engineering-kb(?:/[^\s)\]>]*)?')
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'target' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              updated = url_pattern.sub('optional-advisory://configured-locally', text)
              updated = updated.replace('UnknownAlienHuman/wow-addon-engineering-kb', 'optional-advisory-provider')
              updated = updated.replace('wow-addon-engineering-kb', 'optional-advisory-provider')
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')
          PY
          git add -A
      - name: Validate producer and Rust adapter
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build-blizzard-api-reference.py \
            scripts/verify-blizzard-api-reference.py \
            tests/test_blizzard_api_reference.py
          python -m unittest discover -s tests -p 'test_*.py'
          if test -f scripts/sync-wow-dev-skill.py; then
            python scripts/sync-wow-dev-skill.py --check
          fi
          cargo fmt --all
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.baseline"
          cargo update
          cargo test --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cp "$RUNNER_TEMP/Cargo.lock.baseline" Cargo.lock
      - name: Verify against current Blizzard UI source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch live \
            https://github.com/Gethe/wow-ui-source.git "$RUNNER_TEMP/wow-ui-source"
          revision="$(git -C "$RUNNER_TEMP/wow-ui-source" rev-parse HEAD)"
          python scripts/build-blizzard-source-manifest.py \
            --source "$RUNNER_TEMP/wow-ui-source" \
            --revision "$revision" \
            --selector live \
            --output "$RUNNER_TEMP/source-manifest.json"
          python scripts/verify-blizzard-source-manifest.py \
            "$RUNNER_TEMP/source-manifest.json" \
            --source "$RUNNER_TEMP/wow-ui-source"
          python scripts/build-blizzard-api-reference.py \
            --manifest "$RUNNER_TEMP/source-manifest.json" \
            --source "$RUNNER_TEMP/wow-ui-source" \
            --output "$RUNNER_TEMP/blizzard-api-reference.json" \
            --json
          python scripts/verify-blizzard-api-reference.py \
            "$RUNNER_TEMP/blizzard-api-reference.json" \
            --require-complete \
            --json
          printf 'revision=%s\n' "$revision" >> "$GITHUB_STEP_SUMMARY"
          printf 'version=%s\n' "$(tr -d '\r\n' < "$RUNNER_TEMP/wow-ui-source/version.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate final public tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e rust-toolchain.toml
          test ! -d .github/i0a-payload
          test ! -d .github/i0a-payload-xz
          test ! -d .github/repair-payload
          test ! -d .github/live-update-payload
          test ! -e .github/workflows/reconcile-rolling-reference.yml
          ! find .github/workflows -maxdepth 1 -type f \( \
            -name 'export-*' -o -name 'finalize-*' -o -name 'implement-*' -o \
            -name 'publish-*' -o -name 'stabilize-*' -o -name 'cleanup-*' -o \
            -name 'integrate-*' -o -name '*20260904*' \) | grep -q .
          ! grep -RIl --exclude-dir=.git --exclude-dir=target -E \
            'wow-addon-engineering-kb|UnknownAlienHuman/wow-addon-engineering-kb' .
          cmp .agents/skills/wow-dev/SKILL.md .claude/skills/wow-dev/SKILL.md
          cmp .agents/skills/wow-dev/SKILL.md .opencode/skills/wow-dev/SKILL.md
          cmp .agents/skills/wow-dev/SKILL.md .agent/skills/wow-dev/SKILL.md
          git diff --check --cached
      - name: Publish directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reference): complete rolling Blizzard API ingestion"
          git push origin HEAD:main
