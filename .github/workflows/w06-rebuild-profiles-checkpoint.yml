name: W06 concrete rebuild execution profiles checkpoint
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: w06-rebuild-execution-profiles-checkpoint
  cancel-in-progress: false
env:
  BASE_COMMIT: ac41d07d7aa4d9c33fd750360855ea53dfd0aa06
  BASE_TREE: 41c542cb5676d2a984f47fc3f6272e413df57a1f
  PATCH_SHA256: add5afe975514fcdbe0579026a5aba87d0358643979365c2b435b289de282204
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact corrective patch and remove checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$BASE_COMMIT"
          xz -dc .ci/w06-rebuild-profiles.patch.xz > "$RUNNER_TEMP/w06-rebuild-profiles.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w06-rebuild-profiles.patch" | sha256sum -c -
          git rm -- .ci/w06-rebuild-profiles.patch.xz .github/workflows/w06-rebuild-profiles-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w06-rebuild-profiles.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Minimal service Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked \
            -p wow-service \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          test "$actual" = 'crates/wow-service/src/reference_pack.rs'
          ! grep -n "todo!()\|unimplemented!()" crates/wow-service/src/reference_pack.rs
          grep -Fq 'wow-reference-pack/execution/canonical-input-order/1' crates/wow-service/src/reference_pack.rs
          grep -Fq 'wow-reference-pack/execution/reversed-independent-input-order/1' crates/wow-service/src/reference_pack.rs
          grep -Fq 'pack.multi_worker_rebuild' crates/wow-service/src/reference_pack.rs
          grep -Fq 'wow-service/reference-pack-rebuild-comparison/2' crates/wow-service/src/reference_pack.rs
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w06-rebuild-execution-profiles-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
