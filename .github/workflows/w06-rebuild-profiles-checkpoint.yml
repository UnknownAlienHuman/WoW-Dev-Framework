name: W06 publish checked rebuild execution profiles
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: w06-rebuild-execution-profiles-publisher
  cancel-in-progress: false
env:
  BASE_COMMIT: ac41d07d7aa4d9c33fd750360855ea53dfd0aa06
  BASE_TREE: 41c542cb5676d2a984f47fc3f6272e413df57a1f
  STAGING_PARENT: d63a216f3eaa04b3deb3459a316312cf9027f61c
  ARTIFACT_ID: '11124195809'
  ARTIFACT_ZIP_SHA256: 8ea712048fb76b2bcf6e99921b31383c7fb5f19b4685bfcaad86322e5b58f483
  SOURCE_TAR_SHA256: 7a4ea0b7603cdd55adfc33022669b2534439901b497e69e6d5f168da02a3f035
  FORMATTED_PATCH_SHA256: add5afe975514fcdbe0579026a5aba87d0358643979365c2b435b289de282204
  CHECKED_TREE: da9e402dd0d1b5002b07e682006a953d663c53fc
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Recover and verify the exact checked source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          mkdir -p "$RUNNER_TEMP/w06-artifact"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/w06-artifact.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/w06-artifact.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/w06-artifact.zip" -d "$RUNNER_TEMP/w06-artifact"
          test "$(cat "$RUNNER_TEMP/w06-artifact/CHECKED_TREE")" = "$CHECKED_TREE"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$RUNNER_TEMP/w06-artifact/checked-source.tar" | sha256sum -c -
          printf '%s  %s\n' "$FORMATTED_PATCH_SHA256" "$RUNNER_TEMP/w06-artifact/formatted.patch" | sha256sum -c -

          git reset --hard "$BASE_COMMIT"
          git clean -fdx
          tar -xf "$RUNNER_TEMP/w06-artifact/checked-source.tar" -C .
          git add --all
          test "$(git write-tree)" = "$CHECKED_TREE"
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          test "$actual" = 'crates/wow-service/src/reference_pack.rs'
      - name: Publish the exact checked tree to main
        id: publish
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (current.data.object.sha !== process.env.GITHUB_SHA) {
              core.setFailed(`main moved from ${process.env.GITHUB_SHA} to ${current.data.object.sha}`);
              return;
            }
            const filePath = 'crates/wow-service/src/reference_pack.rs';
            const blob = await github.rest.git.createBlob({
              owner,
              repo,
              content: fs.readFileSync(filePath).toString('base64'),
              encoding: 'base64',
            });
            const createdTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: process.env.BASE_TREE,
              tree: [{ path: filePath, mode: '100644', type: 'blob', sha: blob.data.sha }],
            });
            if (createdTree.data.sha !== process.env.CHECKED_TREE) {
              core.setFailed(`created tree ${createdTree.data.sha} differs from checked tree ${process.env.CHECKED_TREE}`);
              return;
            }
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'feat(service): use concrete rebuild execution profiles [skip ci]\n\nW06 determinism correction. Rebuild comparison now executes exact canonical and reversed independent-input orders instead of accepting label-only profile identities. The canonical comparison report remains bound into Reference Pack v7, while unimplemented multi-worker determinism is retained as an explicit NotEvaluated gate. Selected all-target/all-feature Clippy and repository policy passed on Linux with Rust 1.98.1; no tests executed.',
              tree: createdTree.data.sha,
              parents: [process.env.GITHUB_SHA],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/main',
              sha: commit.data.sha,
              force: false,
            });
            const receiptDir = path.join(process.env.RUNNER_TEMP, 'publication');
            fs.mkdirSync(receiptDir, { recursive: true });
            fs.writeFileSync(path.join(receiptDir, 'FINAL_COMMIT'), `${commit.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'FINAL_TREE'), `${createdTree.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'BLOBS.json'), `${JSON.stringify({ [filePath]: blob.data.sha }, null, 2)}\n`);
            core.setOutput('commit', commit.data.sha);
            core.setOutput('tree', createdTree.data.sha);
      - name: Retain publication receipt
        uses: actions/upload-artifact@v7
        with:
          name: w06-rebuild-execution-profiles-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/publication
          retention-days: 3
          if-no-files-found: error
