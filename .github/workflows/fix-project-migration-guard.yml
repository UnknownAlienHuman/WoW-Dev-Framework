name: Correct project migration removal guard

on:
  push:
    branches:
      - refactor/remove-project-migration-platform-2026-10-18

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Correct assertion and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-project-migration-removal.yml')
          text = path.read_text()
          old = '          if none_count < 3:\n              raise SystemExit(f"expected migration None initializers, found {none_count}")'
          new = '          if none_count != 2:\n              raise SystemExit(f"expected exactly two migration None initializers, found {none_count}")'
          if text.count(old) != 1:
              raise SystemExit('unexpected migration guard')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-project-migration-guard.yml
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add .github/workflows/apply-project-migration-removal.yml
          git commit -m "fix: correct migration removal guard"
          git push origin "HEAD:${GITHUB_REF_NAME}"
