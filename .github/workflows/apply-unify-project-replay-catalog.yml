name: Apply Project replay catalog unification

on:
  push:
    branches:
      - refactor/unify-project-replay-catalog-2026-10-21

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Unify current Project replay catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/unify-project-replay-catalog.py')
          text = path.read_text()
          old = '''path, text = read("docs/REFACTOR_QUEUE.md")
          text = sub_once(
              text,
              r"\\| 6 \\| \\[#112 — current formats\\].*?\\|\\n",
              "| 6 | [#112 — current formats](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/112) | Historical and feature-combination catalogs are removed; collapse remaining replay payload tags only from real readers. |\\n",
              "queue current formats row",
          )
          path.write_text(text)
          '''
          new = '''path, text = read("docs/REFACTOR_QUEUE.md")
          text = replace_once(
              text,
              "| With touched owner | [#112 — legacy formats/docs](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/112) | Historical exact Project catalogs are removed; collapse remaining replay recipe variants to one current rebuildable representation. |\\n",
              "| With touched owner | [#112 — legacy formats/docs](https://github.com/UnknownAlienHuman/WoW-Dev-Framework/issues/112) | Historical and feature-combination catalogs are removed; collapse remaining replay payload tags only from real readers. |\\n",
              "queue current formats row",
          )
          path.write_text(text)
          '''
          if text.count(old) != 1:
              raise SystemExit('queue patch input mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          python .github/unify-project-replay-catalog.py
          git rm .github/unify-project-replay-catalog.py
          git rm .github/workflows/apply-unify-project-replay-catalog.yml
          git add -u
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify current Project replay catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
