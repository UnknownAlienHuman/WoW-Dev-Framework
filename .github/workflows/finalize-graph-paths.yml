name: Finalize bounded graph paths
on:
  push:
    branches: [work/graph-bounded-paths]
permissions:
  contents: write
concurrency:
  group: finalize-graph-bounded-paths
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Prepare final source tree
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-graph-paths.yml
          cargo +stable fmt --all
          git add -A -- crates/wow-graph .github/workflows/finalize-graph-paths.yml
          git diff --cached --check
      - name: Check production paths and workspace
        run: |
          set -euo pipefail
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable test --locked -p wow-graph --all-targets --all-features
          cargo +stable test --release --locked -p wow-graph --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked -p wow-graph --no-deps
          git diff --exit-code
      - name: Publish checked source and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(graph): retain checked bounded path implementation'
          git push origin HEAD:work/graph-bounded-paths
