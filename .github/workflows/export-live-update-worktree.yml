name: Export live-update worktree

on:
  push:
    branches:
      - implementation/live-update-reference
    paths:
      - .github/workflows/export-live-update-worktree.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Package tracked files
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/wow-dev-framework-live-update.tar.gz HEAD
          git rev-parse HEAD > /tmp/COMMIT_SHA

      - name: Upload worktree
        uses: actions/upload-artifact@v7
        with:
          name: wow-dev-framework-live-update
          path: |
            /tmp/wow-dev-framework-live-update.tar.gz
            /tmp/COMMIT_SHA
          retention-days: 1
          if-no-files-found: error
