name: Unblock generated API rescue v4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unblock-generated-api-v4.yml"

permissions:
  actions: write
  contents: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel obsolete transient runs
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status != "completed") | select((.path | contains("finalize-generated-api")) or (.path | contains("unblock-generated-api"))) | .id' \
            | while read -r run_id; do
                if [[ -n "$run_id" && "$run_id" != "$GITHUB_RUN_ID" ]]; then
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
                fi
              done
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Correct and retrigger rescue workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/finalize-generated-api-rescue-v4.yml")
          if path.exists():
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  'select(.path | contains("finalize-generated-api") or contains("unblock-generated-api"))',
                  'select((.path | contains("finalize-generated-api")) or (.path | contains("unblock-generated-api")))',
              )
              text += "\n# corrected retrigger\n"
              path.write_text(text, encoding="utf-8")
          Path(".github/workflows/unblock-generated-api-v4.yml").unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(reference): retrigger definitive API bridge gate"
          git pull --rebase origin main
          git push origin HEAD:main
