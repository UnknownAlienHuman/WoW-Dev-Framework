name: Update PR 249 implementation register

on:
  push:
    branches:
      - feat/compiled-emmy-identity-2026-10-24

permissions:
  contents: write

concurrency:
  group: update-pr249-implementation-register
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'UnknownAlienHuman/WoW-Dev-Framework'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/compiled-emmy-identity-2026-10-24
          fetch-depth: 1
          persist-credentials: true

      - name: Record exact-head evidence
        env:
          TARGET_BRANCH: feat/compiled-emmy-identity-2026-10-24
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path('docs/IMPLEMENTATION_TRACE_REGISTER.md')
          text = path.read_text()
          replacements = {
              '| T07 | compiled Emmy pin -> runtime identity | feature branch; gate pending | unexecuted |':
                  '| T07 | compiled Emmy pin -> runtime identity | implemented in PR #249; exact-head run #437 passed | unexecuted |',
              '| T15 | compiled pin/report evidence -> workspace identity -> legacy admission | feature branch; gate pending | unexecuted |':
                  '| T15 | compiled pin/report evidence -> workspace identity -> legacy admission | implemented in PR #249; exact-head run #437 passed | unexecuted |',
              'The exact-head gate is pending for this branch; no user workflow has been\nobserved.':
                  'Exact-head run #437 passed repository policy, formatting, workspace compilation,\nstrict Clippy and the tracked-file rewrite check. No user workflow has been observed.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one register occurrence: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          rm -- .github/workflows/update-pr249-register.yml

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/update-pr249-register.yml
            docs/IMPLEMENTATION_TRACE_REGISTER.md
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected register-update paths:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record PR 249 exact-head evidence'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
