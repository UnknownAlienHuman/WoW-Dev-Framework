# Quick exact-head gate
# The checkout action remains pinned to a reviewed commit SHA.

name: Quick exact-head gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SHA: ${{ github.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Record checked revision
        run: |
          set -euo pipefail
          tested_commit_sha="$(git rev-parse HEAD)"
          tested_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$tested_commit_sha" != "$EVENT_SHA" ]]; then
            printf 'FAIL: checked commit %s does not match event SHA %s\n' "$tested_commit_sha" "$EVENT_SHA" >&2
            exit 1
          fi
          printf 'Checked commit: %s\nChecked tree: %s\n' "$tested_commit_sha" "$tested_tree_sha"
          rustc +stable -Vv

      - name: Detect documentation-only changes
        id: rust_changes
        run: |
          set -euo pipefail
          base_sha=""
          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA" ;;
            push) base_sha="$PUSH_BEFORE" ;;
            *) ;;
          esac

          run_rust_checks=true
          if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            run_rust_checks=false
            changed_paths="$(mktemp "$RUNNER_TEMP/changed-paths.XXXXXX")"
            git diff --no-renames --name-only -z "$base_sha" HEAD > "$changed_paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                AGENTS.md|README.md|CONTRIBUTING.md|SECURITY.md|GEMINI.md|CLAUDE.md|docs/*.md|*/README.md|*/AGENTS.md|*/THIRD_PARTY_NOTICES.md|.agent/skills/*/SKILL.md|.agents/skills/*/SKILL.md|.claude/skills/*/SKILL.md|.opencode/skills/*/SKILL.md|.github/*.md|.github/ISSUE_TEMPLATE/*.yml|.github/ISSUE_TEMPLATE/*.yaml)
                  ;;
                *)
                  run_rust_checks=true
                  break
                  ;;
              esac
            done < "$changed_paths"
          fi
          printf 'rust_checks=%s\n' "$run_rust_checks" >> "$GITHUB_OUTPUT"
          printf 'Rust/build checks required: %s\n' "$run_rust_checks"

      - name: Native repository policy
        run: cargo +stable xtask check

      - name: Formatting
        if: steps.rust_changes.outputs.rust_checks == 'true'
        run: cargo +stable fmt --all --check

      - name: Strict workspace Clippy
        if: steps.rust_changes.outputs.rust_checks == 'true'
        run: cargo +stable clippy --locked --workspace --lib --bins --all-features -- -D warnings

      - name: Verify checks did not rewrite tracked files
        run: |
          set -euo pipefail
          git diff --exit-code
          tested_commit_sha="$(git rev-parse HEAD)"
          if [[ "$tested_commit_sha" != "$EVENT_SHA" ]]; then
            printf 'FAIL: checked commit changed after checks: %s does not equal %s\n' "$tested_commit_sha" "$EVENT_SHA" >&2
            exit 1
          fi
