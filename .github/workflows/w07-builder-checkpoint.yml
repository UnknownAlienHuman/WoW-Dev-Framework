name: W07 publish checked Reference Pack builder
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: w07-reference-pack-builder-publisher
  cancel-in-progress: false
env:
  BASE_COMMIT: fe077fc76c38f8d5b19ff9da5fe1c8bfe92c4336
  BASE_TREE: 9e80b2ee28f340776d108224fa30bf0f35d6a996
  STAGING_PARENT: 221921928b7e5fafe8eeefa01fc243cf759ebd8a
  ARTIFACT_ID: '11127282622'
  ARTIFACT_ZIP_SHA256: 1312d7c7ce64f1252512504fa845878380b4e64da8258e785b55f4e1f08d8eb3
  SOURCE_TAR_SHA256: 3a4619a773c28d3979bb96de2a024244d95dd32007b3fc47521a43cc5779fa67
  FORMATTED_PATCH_SHA256: b46bd85b826f12ba15e915f0a0ceb6114b7da6431d7e707debd812570e3a5904
  CHECKED_TREE: 9d52ccc0ac8b42d46691d93f4096ab456f2c31b9
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Recover and verify the exact checked source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$STAGING_PARENT"
          mkdir -p "$RUNNER_TEMP/w07-artifact"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/w07-artifact.zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$RUNNER_TEMP/w07-artifact.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/w07-artifact.zip" -d "$RUNNER_TEMP/w07-artifact"
          test "$(cat "$RUNNER_TEMP/w07-artifact/CHECKED_TREE")" = "$CHECKED_TREE"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$RUNNER_TEMP/w07-artifact/checked-source.tar" | sha256sum -c -
          printf '%s  %s\n' "$FORMATTED_PATCH_SHA256" "$RUNNER_TEMP/w07-artifact/formatted.patch" | sha256sum -c -

          git reset --hard "$BASE_COMMIT"
          git clean -fdx
          tar -xf "$RUNNER_TEMP/w07-artifact/checked-source.tar" -C .
          git add --all
          test "$(git write-tree)" = "$CHECKED_TREE"
          actual="$(git diff --cached --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          expected="$(cat <<'FILES'
          .github/workflows/ci.yml
          Cargo.lock
          Cargo.toml
          apps/wow-reference-builder/CONTRACT.json
          apps/wow-reference-builder/Cargo.toml
          apps/wow-reference-builder/README.md
          apps/wow-reference-builder/examples/CHECKSUMS.json
          apps/wow-reference-builder/examples/cli-cases.json
          apps/wow-reference-builder/src/lib.rs
          apps/wow-reference-builder/src/main.rs
          apps/wow-reference-builder/tests/e1_cli.rs
          crates/MANIFEST.json
          crates/wow-service/src/reference_pack.rs
          FILES
          )"
          test "$actual" = "$expected"
      - name: Publish the exact checked tree to main
        id: publish
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (current.data.object.sha !== process.env.GITHUB_SHA) {
              core.setFailed(`main moved from ${process.env.GITHUB_SHA} to ${current.data.object.sha}`);
              return;
            }
            const paths = [
              '.github/workflows/ci.yml',
              'Cargo.lock',
              'Cargo.toml',
              'apps/wow-reference-builder/CONTRACT.json',
              'apps/wow-reference-builder/Cargo.toml',
              'apps/wow-reference-builder/README.md',
              'apps/wow-reference-builder/examples/CHECKSUMS.json',
              'apps/wow-reference-builder/examples/cli-cases.json',
              'apps/wow-reference-builder/src/lib.rs',
              'apps/wow-reference-builder/src/main.rs',
              'apps/wow-reference-builder/tests/e1_cli.rs',
              'crates/MANIFEST.json',
              'crates/wow-service/src/reference_pack.rs',
            ];
            const entries = [];
            const receipt = {};
            for (const filePath of paths) {
              const blob = await github.rest.git.createBlob({
                owner,
                repo,
                content: fs.readFileSync(filePath).toString('base64'),
                encoding: 'base64',
              });
              entries.push({ path: filePath, mode: '100644', type: 'blob', sha: blob.data.sha });
              receipt[filePath] = blob.data.sha;
            }
            const createdTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: process.env.BASE_TREE,
              tree: entries,
            });
            if (createdTree.data.sha !== process.env.CHECKED_TREE) {
              core.setFailed(`created tree ${createdTree.data.sha} differs from checked tree ${process.env.CHECKED_TREE}`);
              return;
            }
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'feat(app): activate safe Reference Pack builder [skip ci]\n\nW07 filesystem/frontend slice. The dedicated builder now routes build, validate and rebuild-compare through the W06 service, confines explicit roots, stages and verifies declared bytes, protects prior destinations with guarded same-parent replacement and rollback, performs post-finalization read-back, and is an active workspace member. Selected builder/service Clippy and repository policy passed on Linux with Rust 1.98.1; no tests executed.',
              tree: createdTree.data.sha,
              parents: [process.env.GITHUB_SHA],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/main',
              sha: commit.data.sha,
              force: false,
            });
            const receiptDir = path.join(process.env.RUNNER_TEMP, 'publication');
            fs.mkdirSync(receiptDir, { recursive: true });
            fs.writeFileSync(path.join(receiptDir, 'FINAL_COMMIT'), `${commit.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'FINAL_TREE'), `${createdTree.data.sha}\n`);
            fs.writeFileSync(path.join(receiptDir, 'BLOBS.json'), `${JSON.stringify(receipt, null, 2)}\n`);
            core.setOutput('commit', commit.data.sha);
            core.setOutput('tree', createdTree.data.sha);
      - name: Retain publication receipt
        uses: actions/upload-artifact@v7
        with:
          name: w07-reference-pack-builder-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/publication
          retention-days: 3
          if-no-files-found: error
