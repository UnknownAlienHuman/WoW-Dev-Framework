name: Apply one Project replay record

on:
  push:
    branches:
      - refactor/one-project-replay-record-2026-10-21

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Collapse Project replay tags
        shell: bash
        run: |
          set -euo pipefail
          python .github/one-project-replay-record.py
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              target.write_text(text.replace(old, new))

          replace(
              "crates/wow-project/src/platform_source/packages.rs",
              "\n    pub(crate) const fn has_retention_limits(&self) -> bool {\n        self.retention_limits.is_some()\n    }\n",
              "",
          )
          replace(
              "crates/wow-project/src/replay/platform.rs",
              "    pub(super) const fn has_retention_limits(&self) -> bool {\n        self.package_request.has_retention_limits()\n    }\n\n",
              "",
          )
          replace(
              "crates/wow-project/src/replay/configuration.rs",
              "    pub(super) fn from_configuration(config: &ProjectConfiguration) -> ProjectResult<Self> {\n",
              "    pub(super) const fn requires_function_calls(&self) -> bool {\n        self.budgets.hook_target_recipe.is_some()\n            || self.budgets.function_call_evidence_profile.is_some()\n            || self.physical_function_declarations.is_some()\n            || self.physical_function_signatures.is_some()\n            || self.state_projection.is_some()\n            || self.library_witnesses.is_some()\n            || self.signal_witnesses.is_some()\n    }\n    pub(super) fn from_configuration(config: &ProjectConfiguration) -> ProjectResult<Self> {\n",
          )
          replace(
              "crates/wow-project/src/replay/mod.rs",
              "    fn validate_budget(&self, stop: &AtomicBool) -> ProjectResult<()> {\n        self.configuration.has_xml_classification()?;\n",
              "    fn validate_budget(&self, stop: &AtomicBool) -> ProjectResult<()> {\n        self.configuration.has_xml_classification()?;\n        if self.configuration.requires_function_calls() && !self.function_calls {\n            return Err(invalid());\n        }\n",
          )
          replace(
              "crates/wow-service/src/live_project/tests/namespaces.rs",
              "    use wow_project::replay::ProjectReplay;\n",
              "",
              expected=3,
          )
          replace(
              "crates/wow-service/src/live_project/tests/namespaces.rs",
              "    let replay = ProjectReplay::capture(&selected, &stop)?;\n",
              "",
          )
          replace(
              "crates/wow-service/src/live_project/tests.rs",
              "    let project = publisher.open_current()?;\n    let replay = ProjectReplay::capture(&publisher, &stop)?;\n    let store_path = path.join(\"store\");\n",
              "    let project = publisher.open_current()?;\n    let store_path = path.join(\"store\");\n",
          )
          replace(
              "crates/wow-service/src/live_project/tests.rs",
              "    use wow_project::replay::ProjectReplay;\n\n    let stop = AtomicBool::new(false);\n    let path = root(\"platform-replay-v5\")?;\n",
              "    let stop = AtomicBool::new(false);\n    let path = root(\"platform-replay-v5\")?;\n",
          )
          replace(
              "crates/wow-service/src/live_project/tests/namespaces/direct_service.rs",
              "                    == if composed {\n                        \"wow-project.live-replay\"\n                    } else {\n                        \"wow-project.live-replay\"\n                    }\n",
              "                    == \"wow-project.live-replay\"\n",
          )
          replace(
              "crates/wow-service/src/local/platform_input/tests/event_registry_keys.rs",
              "    let replay_json = serde_json::to_value(&replay)?;\n",
              "",
          )
          replace(
              "crates/wow-service/src/local/platform_input/tests/w5_hook_targets.rs",
              "        let wire = serde_json::to_value(&replay)?;\n",
              "",
          )
          PY
          git rm .github/one-project-replay-record.py
          git rm .github/workflows/apply-one-project-replay-record.yml
          git add -u
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add -A
          git commit -m "refactor: use one Project replay record"
          git push origin "HEAD:${GITHUB_REF_NAME}"
