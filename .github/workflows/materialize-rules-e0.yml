name: Materialize wow-rules E0-E

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-rules-e0.yml

permissions:
  contents: write

concurrency:
  group: materialize-rules-e0
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Materialize staged package
        run: |
          set -euo pipefail
          test "$(find .ci/materialize/rules-e0 -type f | wc -l)" -eq 9
          mkdir -p crates/wow-rules/src crates/wow-rules/tests
          cp .ci/materialize/rules-e0/Cargo.toml crates/wow-rules/Cargo.toml
          cp .ci/materialize/rules-e0/README.md crates/wow-rules/README.md
          cp .ci/materialize/rules-e0/IMPLEMENTATION_STATUS.md crates/wow-rules/IMPLEMENTATION_STATUS.md
          cp .ci/materialize/rules-e0/src/*.rs crates/wow-rules/src/
          cp .ci/materialize/rules-e0/tests/*.rs crates/wow-rules/tests/
          python3 - <<'PY'
          from pathlib import Path
          import copy
          import json

          cargo = Path('Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          if '"crates/wow-rules"' not in text:
              marker = '    "crates/wow-project",\n'
              if marker not in text:
                  raise SystemExit('wow-project workspace marker missing')
              text = text.replace(marker, marker + '    "crates/wow-rules",\n')
              cargo.write_text(text, encoding='utf-8')

          manifest = Path('crates/MANIFEST.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          found = []

          def visit(node):
              if isinstance(node, list):
                  for index, item in enumerate(node):
                      if isinstance(item, dict) and any(
                          item.get(key) == 'wow-project'
                          for key in ('name', 'id', 'crate', 'package')
                      ):
                          found.append((node, index, item))
                      visit(item)
              elif isinstance(node, dict):
                  for value in node.values():
                      visit(value)

          visit(data)
          if len(found) != 1:
              raise SystemExit(f'expected one wow-project manifest record, got {len(found)}')
          container, index, record = found[0]
          already = any(
              isinstance(item, dict)
              and any(item.get(key) == 'wow-rules' for key in ('name', 'id', 'crate', 'package'))
              for item in container
          )
          if not already:
              new = copy.deepcopy(record)

              def rewrite(value):
                  if isinstance(value, str):
                      return (
                          value.replace('wow-project', 'wow-rules')
                          .replace('E0-D', 'E0-E')
                          .replace('Project', 'Rules')
                          .replace('project', 'rules')
                      )
                  if isinstance(value, list):
                      return [rewrite(item) for item in value]
                  if isinstance(value, dict):
                      return {key: rewrite(item) for key, item in value.items()}
                  return value

              new = rewrite(new)
              for key in list(new):
                  if 'depend' in key.lower() and isinstance(new[key], list):
                      new[key] = ['wow-core', 'wow-project', 'wow-reference']
              for key in ('description', 'summary', 'purpose'):
                  if key in new and isinstance(new[key], str):
                      new[key] = (
                          'Closed deterministic E0-E policy evaluation over exact '
                          'project facts and authoritative Reference coverage.'
                      )
              container.insert(index + 1, new)
          manifest.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Resolve lockfile and run release-grade gate
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable xtask check
          cargo +stable fmt --all --check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable test --locked --workspace --all-targets --all-features
          cargo +stable test --release --locked --package wow-rules --all-targets --all-features
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Commit verified package and remove staging machinery
        run: |
          set -euo pipefail
          rm -rf .ci/materialize/rules-e0
          rm .github/workflows/materialize-rules-e0.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A Cargo.toml Cargo.lock crates/MANIFEST.json crates/wow-rules .ci/materialize/rules-e0 .github/workflows/materialize-rules-e0.yml
          git diff --cached --check
          git commit -m 'feat(rules): activate closed E0-E policy evaluation'
          git push origin HEAD:main
