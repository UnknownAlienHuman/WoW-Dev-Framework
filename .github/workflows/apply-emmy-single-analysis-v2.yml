name: Apply single Emmy analysis refactor v2

on:
  push:
    branches:
      - fix/emmy-main-library-analysis-2026-10-19

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Replace split Emmy engines with one analysis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              file.write_text(text.replace(old, new, count))

          session = "crates/wow-emmy/src/session.rs"
          replace(
              session,
              "//! Retained physical Main analysis over exact, caller-supplied snapshots.\n//!\n//! Only changed texts enter the upstream parser. Semantic indexes are rebuilt\n//! conservatively from retained VFS trees; no dependency or fact reuse is inferred.\n",
              "//! Retained Main + Library analysis over exact, caller-supplied snapshots.\n//!\n//! One upstream analysis owns diagnostics, semantic facts and local flow. Changed\n//! Main texts enter its VFS once; indexes rebuild conservatively from retained trees.\n",
          )
          replace(
              session,
              ") -> Result<(crate::references::MemberCallSession, EmmyLocalFlowReport), AnalyzerSessionError> {\n",
              ") -> Result<\n    (EmmySyntaxReport, crate::references::MemberCallSession, EmmyLocalFlowReport),\n    AnalyzerSessionError,\n> {\n",
          )
          replace(
              session,
              "        let session = registered\n            .collect(\n",
              "        let syntax = crate::syntax::analyzer::collect_registered(\n            &registered.analysis,\n            main,\n            &registered.main_root,\n            stop,\n        )\n        .map_err(map_syntax_error)?;\n        checkpoint(stop)?;\n        let session = registered\n            .collect(\n",
          )
          replace(session, "        Ok((session, local_flow))\n", "        Ok((syntax, session, local_flow))\n")
          replace(
              session,
              "/// Observed Main parser work for the latest successful transition. Each changed\n/// text is parsed in the separate syntax and semantic engines.\n",
              "/// Observed Main parser work for the latest successful transition. Each changed\n/// text enters the single shared Main + Library engine once.\n",
          )
          replace(
              session,
              "    syntax_root: std::path::PathBuf,\n    syntax: EmmyLuaAnalysis,\n    semantic: RegisteredMemberAnalysis,\n",
              "    semantic: RegisteredMemberAnalysis,\n",
          )
          replace(
              session,
              "    /// Open the existing syntax policy and Main/Library semantic policy separately.\n",
              "    /// Open one Main + Library analysis for diagnostics and semantic reports.\n",
          )
          replace(
              session,
              "            let syntax_root = crate::syntax::analyzer::virtual_root(main.snapshot_id());\n            let syntax = crate::syntax::analyzer::build_registered(&main, &syntax_root)\n                .map_err(|_| error(AnalyzerSessionErrorCode::NativeFailure))?;\n            checkpoint(stop)?;\n            let semantic = RegisteredMemberAnalysis::new(\n",
              "            let semantic = RegisteredMemberAnalysis::new(\n",
          )
          replace(
              session,
              "                libraries: libraries.to_vec(),\n                syntax_root,\n                syntax,\n                semantic,\n",
              "                libraries: libraries.to_vec(),\n                semantic,\n",
          )
          replace(
              session,
              "    /// Validate CAS before touching either VFS. A post-mutation failure poisons\n",
              "    /// Validate CAS before touching the VFS. A post-mutation failure poisons\n",
          )
          replace(
              session,
              "            apply_delta(&mut self.syntax, &self.syntax_root, &batch, stop)?;\n            apply_delta(\n",
              "            apply_delta(\n",
          )
          replace(
              session,
              "        let syntax = crate::syntax::analyzer::collect_registered(\n            &self.syntax,\n            &self.main,\n            &self.syntax_root,\n            stop,\n        )\n",
              "        let syntax = crate::syntax::analyzer::collect_registered(\n            &self.semantic.analysis,\n            &self.main,\n            &self.semantic.main_root,\n            stop,\n        )\n",
          )

          replace(
              "crates/wow-emmy/src/references.rs",
              "        configuration.diagnostics.enable = virtual_units.is_some();\n",
              "        configuration.diagnostics.enable = true;\n",
          )
          replace(
              "crates/wow-emmy/src/syntax.rs",
              "    AssignmentTypeMismatch,\n",
              "    AssignmentTypeMismatch,\n    ParameterTypeMismatch,\n",
          )
          replace(
              "crates/wow-emmy/src/syntax/analyzer.rs",
              "        NumberOrString::String(value) if value == \"assign-type-mismatch\" => Some((\n            EmmySyntaxDiagnosticKind::AssignmentTypeMismatch,\n            \"assign-type-mismatch\",\n        )),\n",
              "        NumberOrString::String(value) if value == \"assign-type-mismatch\" => Some((\n            EmmySyntaxDiagnosticKind::AssignmentTypeMismatch,\n            \"assign-type-mismatch\",\n        )),\n        NumberOrString::String(value) if value == \"param-type-mismatch\" => Some((\n            EmmySyntaxDiagnosticKind::ParameterTypeMismatch,\n            \"param-type-mismatch\",\n        )),\n",
          )

          project = Path("crates/wow-project/src/analyzer.rs")
          text = project.read_text()
          old_import = "    EmmySyntaxReport, LuaWorkspaceLimits, LuaWorkspaceSnapshot, LuaWorkspaceUniverse,\n    analyze_local_flow, analyze_syntax,\n"
          if text.count(old_import) != 1:
              raise SystemExit("unexpected wow-project Emmy imports")
          text = text.replace(
              old_import,
              "    EmmySyntaxReport, LuaWorkspaceLimits, LuaWorkspaceSnapshot, LuaWorkspaceUniverse,\n",
          )
          start_marker = "        } else {\n            // Loader/virtual shape changes use the existing exact cold owner path.\n"
          end_marker = "\n            (syntax_report, session, local_flow_report)\n        };"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("cold analyzer branch start not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("cold analyzer branch end not found")
          end += len(end_marker)
          replacement = (
              "        } else {\n"
              "            // Loader/virtual shape changes use the same one-analysis cold path.\n"
              "            *cache = None;\n"
              "            let virtual_units = pending_xml_lua\n"
              "                .as_ref()\n"
              "                .and_then(crate::xml_lua::PreparedProjectXmlLuaAnalysis::virtual_workspace)\n"
              "                .map(|snapshot| (snapshot, generation.project_generation()));\n"
              "            wow_emmy::session::analyze_member_call_session_with_local_flow(\n"
              "                &main_workspace,\n"
              "                &library_refs,\n"
              "                virtual_units,\n"
              "                query_profile,\n"
              "                function_calls,\n"
              "                stop,\n"
              "            )\n"
              "            .map_err(|source| session_error(source, generation.project_generation()))?\n"
              "        };"
          )
          project.write_text(text[:start] + replacement + text[end:])

          tests = "crates/wow-emmy/src/session/tests.rs"
          replace(
              tests,
              "    let syntax_before = green(&session.syntax, &session.syntax_root, \"main/keep.lua\")?;\n    let semantic_before = green(\n        &session.semantic.analysis,\n        &session.semantic.main_root,\n        \"main/keep.lua\",\n    )?;\n",
              "    let tree_before = green(\n        &session.semantic.analysis,\n        &session.semantic.main_root,\n        \"main/keep.lua\",\n    )?;\n",
          )
          replace(
              tests,
              "    assert!(std::ptr::eq(\n        &*syntax_before,\n        &*green(&session.syntax, &session.syntax_root, \"main/keep.lua\")?\n    ));\n    assert!(std::ptr::eq(\n        &*semantic_before,\n",
              "    assert!(std::ptr::eq(\n        &*tree_before,\n",
          )
          replace(
              tests,
              "    for (analysis, root) in [\n        (&session.syntax, &session.syntax_root),\n        (&session.semantic.analysis, &session.semantic.main_root),\n    ] {\n        let uri = file_path_to_uri(&root.join(\"main/remove.lua\")).ok_or(\"invalid URI\")?;\n        assert!(analysis.get_file_id(&uri).is_none());\n    }\n",
              "    let uri = file_path_to_uri(&session.semantic.main_root.join(\"main/remove.lua\"))\n        .ok_or(\"invalid URI\")?;\n    assert!(session.semantic.analysis.get_file_id(&uri).is_none());\n",
          )

          member_tests = "crates/wow-emmy/tests/member_calls.rs"
          replace(
              member_tests,
              "    let (exact, flow) = analyze_member_call_session_with_local_flow(\n",
              "    let (syntax, exact, flow) = analyze_member_call_session_with_local_flow(\n",
          )
          replace(
              member_tests,
              "    assert_eq!(exact.member_calls.references().len(), pairs);\n",
              "    assert_eq!(syntax.workspace_snapshot_id(), large.snapshot_id());\n    assert_eq!(exact.member_calls.references().len(), pairs);\n",
          )
          PY

          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable clippy --locked -p wow-emmy -p wow-project --all-targets --all-features -- -D warnings
          git diff --check
          git rm .github/workflows/apply-emmy-single-analysis.yml
          git rm .github/workflows/apply-emmy-single-analysis-v2.yml
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git add crates/wow-emmy crates/wow-project
          git commit -m "fix: analyze Main and Library in one Emmy session"
          git push origin "HEAD:${GITHUB_REF_NAME}"
