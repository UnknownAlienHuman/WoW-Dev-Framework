name: W10 XML binding graph checkpoint v3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w10-bindings-graph-checkpoint.yml
permissions:
  contents: write
concurrency:
  group: w10-bindings-graph-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_COMMIT: f1fb0788f8a4bb3a3ee88e50b58298ed8dd52c1a
      BASE_TREE: bc265d85ce3c57227ce3c5404beafb21d28294e3
      TRIGGER_PARENT: a282e1248c1976e53ea5f06869d3ffa879653a44
      PATCH_SHA256: 8405303e09af3a9379dffa1d88cea4b160c7bf532a4446c1058df1b773923694
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Admit exact W10 binding graph patch and remove transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$TRIGGER_PARENT"
          cat .ci/w10-bindings-graph.patch.xz.b64.* > "$RUNNER_TEMP/w10.patch.xz.b64"
          python - "$RUNNER_TEMP/w10.patch.xz.b64" "$RUNNER_TEMP/w10.patch" "$PATCH_SHA256" <<'PY'
          import base64
          import hashlib
          import itertools
          import lzma
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_bytes()
          output = pathlib.Path(sys.argv[2])
          expected = sys.argv[3]
          whitespace = set(b" \t\r\n")
          alphabet = b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          allowed = set(alphabet + b"=")
          compact = bytes(byte for byte in source if byte not in whitespace)
          invalid = [(index, byte) for index, byte in enumerate(compact) if byte not in allowed]
          print(f"transport_bytes={len(source)} compact_bytes={len(compact)} residue={len(compact) % 4}")
          print(f"invalid_count={len(invalid)} invalid_preview={invalid[:32]}")

          def accept(candidate: bytes, label: str) -> bool:
              try:
                  compressed = base64.b64decode(candidate, validate=True)
                  patch = lzma.decompress(compressed, format=lzma.FORMAT_XZ)
              except Exception:
                  return False
              digest = hashlib.sha256(patch).hexdigest()
              if digest != expected:
                  return False
              output.write_bytes(patch)
              print(f"accepted_transport={label} compressed_bytes={len(compressed)} patch_bytes={len(patch)}")
              return True

          if not invalid and accept(compact, "exact_compact"):
              raise SystemExit(0)

          stripped = bytes(byte for byte in compact if byte in allowed)
          if stripped != compact and accept(stripped, "drop_invalid_bytes"):
              raise SystemExit(0)

          # Recover at most two visibly invalid characters without guessing any
          # semantic content: the exact XZ checksum and expected patch SHA-256
          # must both pass before the candidate is admitted.
          if 0 < len(invalid) <= 2:
              positions = [position for position, _ in invalid]
              template = bytearray(compact)
              for replacements in itertools.product(alphabet, repeat=len(positions)):
                  for position, replacement in zip(positions, replacements):
                      template[position] = replacement
                  if accept(bytes(template), f"replace_invalid_{positions}"):
                      raise SystemExit(0)

          # Recover one or two characters lost immediately before terminal
          # base64 padding. This is bounded to 4,160 candidates and still
          # requires both XZ integrity and the exact uncompressed SHA-256.
          body = stripped.rstrip(b"=")
          for missing in (1, 2):
              for suffix in itertools.product(alphabet, repeat=missing):
                  trial_body = body + bytes(suffix)
                  padding = b"=" * ((4 - len(trial_body) % 4) % 4)
                  if accept(trial_body + padding, f"append_before_padding_{missing}"):
                      raise SystemExit(0)

          raise SystemExit("unable to reconstruct transport under bounded exact-hash recovery")
          PY
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/w10.patch" | sha256sum -c -
          git rm -- .ci/w10-bindings-graph.patch.xz.b64.* .github/workflows/w10-bindings-graph-checkpoint.yml
          test "$(git write-tree)" = "$BASE_TREE"
          git apply --index "$RUNNER_TEMP/w10.patch"
      - name: Install minimal compiler tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo +stable fmt --all
      - name: Minimal affected-crate Clippy; no tests executed
        shell: bash
        run: |
          set -euo pipefail
          rustc +stable -Vv | tee "$RUNNER_TEMP/RUST_VERSION"
          cargo +stable clippy --locked \
            -p wow-project -p wow-service -p wow-cli \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Repository policy and exact file set
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable xtask check 2>&1 | tee "$RUNNER_TEMP/policy.log"
          git add --all
          git diff --cached --check
          git diff --cached --name-only "$BASE_COMMIT" | sort > "$RUNNER_TEMP/changed-files"
          cat > "$RUNNER_TEMP/expected-files" <<'EOF'
          crates/wow-project/src/analyzer.rs
          crates/wow-project/src/graph.rs
          crates/wow-project/src/graph/mixins.rs
          crates/wow-project/src/graph/packages.rs
          crates/wow-project/src/graph/scripts.rs
          crates/wow-project/src/graph/xml.rs
          crates/wow-project/src/load/mod.rs
          crates/wow-project/src/load/package_closure.rs
          crates/wow-project/src/xml_bindings.rs
          crates/wow-project/src/xml_bindings/receivers.rs
          crates/wow-project/src/xml_bindings/scripts.rs
          crates/wow-project/src/xml_lua.rs
          crates/wow-service/src/local/projection.rs
          crates/wow-service/src/local/xml_bindings.rs
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected-files"
          sort -o "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/expected-files"
          cat "$RUNNER_TEMP/changed-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"
      - name: Retain exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkpoint"
          git add --all
          git write-tree > "$RUNNER_TEMP/checkpoint/CHECKED_TREE"
          git archive --format=tar -o "$RUNNER_TEMP/checkpoint/checked-source.tar" "$(cat "$RUNNER_TEMP/checkpoint/CHECKED_TREE")"
          git diff --cached --binary "$BASE_COMMIT" > "$RUNNER_TEMP/checkpoint/formatted.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint/STAGING_SHA"
          for file in RUST_VERSION clippy.log policy.log changed-files expected-files; do
            if test -f "$RUNNER_TEMP/$file"; then cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/checkpoint/$file"; fi
          done
          (cd "$RUNNER_TEMP/checkpoint" && sha256sum checked-source.tar formatted.patch > SHA256SUMS)
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w10-bindings-graph-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint
          retention-days: 3
          if-no-files-found: error
      - name: Fast-forward exact checked tree to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(wow-project): project XML binding semantics into graph [skip ci]'
          git push origin HEAD:main
