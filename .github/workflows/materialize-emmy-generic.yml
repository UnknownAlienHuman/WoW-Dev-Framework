name: Materialize frozen Emmy generic diagnostic

on:
  push:
    branches:
      - work/emmy-generic-diagnostic
    paths:
      - .ci/materialize/emmy-generic/**
      - .github/workflows/materialize-emmy-generic.yml

permissions:
  contents: write

concurrency:
  group: materialize-emmy-generic
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Materialize exact reviewed payload
        run: |
          set -euo pipefail
          test "$(find .ci/materialize/emmy-generic -maxdepth 1 -name 'part-*' -type f | wc -l)" -eq 2
          cat .ci/materialize/emmy-generic/part-* > "$RUNNER_TEMP/emmy-generic.b64"
          echo '435a24f1e7fac25855d4e976a8697e9892ecd5472f3b285f7a4a517b83d782d6  '"$RUNNER_TEMP/emmy-generic.b64" | sha256sum --check --status
          base64 --decode "$RUNNER_TEMP/emmy-generic.b64" > "$RUNNER_TEMP/emmy-generic.tar.gz"
          echo 'cf854f8fba6387d77e9b73145cf98a1736b32a7bac72837c8d4a75c5a1a727ee  '"$RUNNER_TEMP/emmy-generic.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/emmy-generic.tar.gz" -C .
          rm -rf .ci/materialize/emmy-generic
          rm .github/workflows/materialize-emmy-generic.yml
          git add -A
      - name: Verify frozen analyzer diagnostic contract
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          cargo +stable xtask check
          cargo +stable check --locked --workspace --all-targets --all-features
          cargo +stable test --locked --package wow-emmy --package wow-project --all-targets --all-features -- --nocapture
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
          git diff --check
      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+UnknownAlienHuman@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(emmy): freeze selected generic analyzer diagnostic'
          git push origin HEAD:work/emmy-generic-diagnostic
