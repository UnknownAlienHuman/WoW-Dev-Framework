name: Work package
description: Describe a bounded piece of implementation work.
title: "[work] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended result
      description: What user problem or missing behavior should this work address?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which code or behavior is involved? Note known dependencies or blockers.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion
      description: What observable result would show this work is complete?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Useful context
      description: Link relevant code, documentation, or prior evidence if available.
