name: Feature request
description: Suggest a capability or improvement.
title: "proposal: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user task or correctness problem should be improved?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe the useful result. Add implementation ideas or examples if helpful.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Related code or documentation
      description: Link relevant context if available.
