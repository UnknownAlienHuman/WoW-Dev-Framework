name: Research question
description: Record an unresolved source fact or behavior question.
title: "research: "
body:
  - type: input
    id: subject
    attributes:
      label: Subject
      description: Name the API, file, behavior, or capability in question.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What is unknown or conflicting, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sources and evidence
      description: Link relevant source, documentation, or observations if available.
