name: Bug report
description: Report incorrect behavior or an unexpected diagnostic.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command or request, relevant input, and expected and actual results.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Framework revision
      description: Commit, branch, or release, if known.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or other evidence
      description: Include useful output or reproduction details. Remove credentials, tokens, and private user data.
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy
      options:
        - label: I have removed credentials, tokens, and private user data.
          required: true
