[package]
name = "wow-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "wow_app"
path = "src/lib.rs"

[[bin]]
name = "wow"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wow-core = { path = "../../crates/wow-core" }
wow-rules = { path = "../../crates/wow-rules" }
wow-service = { path = "../../crates/wow-service" }

[lints]
workspace = true
