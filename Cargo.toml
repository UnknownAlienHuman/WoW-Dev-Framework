[workspace]
resolver = "3"
members = [
    "crates/wow-core",
    "crates/wow-reference",
    "crates/wow-annotations",
    "tools/xtask",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/UnknownAlienHuman/WoW-Dev-Framework"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
