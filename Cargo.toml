[workspace]
resolver = "3"
members = [
    "crates/wow-core",
    "crates/wow-store",
    "crates/wow-reference",
    "crates/wow-annotations",
    "crates/wow-emmy",
    "crates/wow-project",
    "crates/wow-rules",
    "crates/wow-service",
    "crates/wow-graph",
    "tools/xtask",
    "crates/wow-render-contract",
    "crates/wow-ketho-literals",
    "modules/ketho-literals",
]

exclude = ["bridges/literal-host"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/UnknownAlienHuman/WoW-Dev-Framework"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.wasm-compact]
inherits = "release"
opt-level = "z"
lto = "thin"
strip = "debuginfo"

[profile.wasm-speed]
inherits = "release"
opt-level = 3
strip = "debuginfo"
